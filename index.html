{id:'a1-01',level:'A1',title:'¡Hola! – saludar y presentarse',cat:'conj',vocab:['a1-saludos','a1-paises'],
 topics:['Saludos y despedidas','llamarse, ser, ser de','tú y usted','Preguntas: ¿cómo?, ¿de dónde?'],
 source:'Libro Libre cap. 1 (Saludos, Presentaciones) · FSI Unit 1 (Useful phrases) · Cactus Language Kit',
 goals:['saludar y despedirse a cualquier hora del día','decir su nombre y su origen y preguntar por los de otra persona','elegir entre tú y usted'],
 grammar:`<h3>1. Greetings – the first words you need</h3>
<table><tr><th>Spanish</th><th>English</th><th>when</th></tr>
<tr><td><b>¡Hola!</b></td><td>hello / hi</td><td>always, with everyone</td></tr>
<tr><td><b>Buenos días</b></td><td>good morning</td><td>until lunch (≈ 2 pm)</td></tr>
<tr><td><b>Buenas tardes</b></td><td>good afternoon / evening</td><td>from lunch until dark</td></tr>
<tr><td><b>Buenas noches</b></td><td>good evening / good night</td><td>after dark – hello <i>and</i> goodbye</td></tr>
<tr><td><b>Adiós · Hasta luego · Hasta mañana</b></td><td>goodbye · see you · see you tomorrow</td><td>leaving</td></tr></table>
<p>In Spain people often combine them: <i>¡Hola, buenos días!</i> – and say <i>hasta luego</i> even if they will not see you again today.</p>
<h3>2. My name is… – llamarse and ser</h3>
<table><tr><th></th><th>llamarse (to be called)</th><th>ser (to be)</th></tr>
<tr><td>yo (I)</td><td><em>me llamo</em></td><td><em>soy</em></td></tr>
<tr><td>tú (you, informal)</td><td><em>te llamas</em></td><td><em>eres</em></td></tr>
<tr><td>usted (you, formal)</td><td><em>se llama</em></td><td><em>es</em></td></tr>
<tr><td>él / ella (he / she)</td><td><em>se llama</em></td><td><em>es</em></td></tr></table>
<div class="rule"><i>¿Cómo te llamas?</i> – <i>Me llamo Ana.</i> · <i>¿Cómo se llama usted?</i> – <i>Me llamo Pedro García.</i><br><i>Soy Tom. Soy inglés. Soy de Londres.</i> (ser de = to be from)</div>
<h3>3. tú or usted?</h3>
<p><b>tú</b> = informal “you” – friends, family, people your age, colleagues, most bars. <b>usted</b> = polite “you” – older people, officials, formal situations. Usted uses the <b>same verb form as él/ella</b>: <i>¿De dónde <b>eres</b> (tú)?</i> / <i>¿De dónde <b>es</b> usted?</i></p>
<h3>4. Questions</h3>
<p>Spanish questions are framed with <b>¿ … ?</b>, and question words carry an accent: <b>¿Cómo?</b> how · <b>¿De dónde?</b> where from · <b>¿Dónde?</b> where · <b>¿Qué?</b> what · <b>¿Quién?</b> who.</p>
<div class="rule">¿Cómo estás? – Bien, gracias, ¿y tú? · ¿Qué tal? – Muy bien. · Encantado (said by a man) / Encantada (by a woman) = nice to meet you. · Mucho gusto = pleased to meet you.</div>
<div class="ch">Subject pronouns (yo, tú…) are usually left out because the verb ending already shows the person: <i>Soy de Manchester</i> = I’m from Manchester. Use them only for emphasis or contrast: <i>Yo soy inglés, ¿y tú?</i></div>`,
 pitfalls:['<b>*Mi nombre es…</b> is correct but stiff – people say <b>Me llamo…</b>','<b>*Soy de la Inglaterra</b> → Soy de Inglaterra (no article with most countries).','<b>*¿Cómo te llamas tú usted?</b> → ¿Cómo se llama usted?','<b>*Encantado</b> said by a woman → Encantad<b>a</b>.'],
 spain:'Al presentarse entre amigos se dan <b>dos besos</b> (primero en la mejilla derecha), también entre hombre y mujer. En un contexto profesional se da la mano. «¿Qué tal?» es el saludo estrella: no espera una respuesta larga.',
 examples:[['¡Hola! Buenos días.','Hello! Good morning.'],['¿Cómo te llamas?','What’s your name? (informal)'],['Me llamo Emma. ¿Y tú?','My name is Emma. And you?'],['¿Cómo se llama usted?','What is your name? (formal)'],['Soy inglesa, de Mánchester.','I’m English, from Manchester.'],['¿De dónde eres?','Where are you from?'],['Soy de Escocia, pero vivo en Madrid.','I’m from Scotland, but I live in Madrid.'],['Encantado. – Encantada.','Nice to meet you. (man) – Nice to meet you. (woman)'],['¿Qué tal? – Muy bien, gracias.','How are things? – Very well, thanks.'],['¿Cómo está usted? – Bien, gracias, ¿y usted?','How are you? (formal) – Fine, thanks, and you?'],['Hasta luego. – Adiós, hasta mañana.','See you later. – Bye, see you tomorrow.'],['Buenas noches, ¡que descanses!','Good night, sleep well!']],
 ex:['g|Me ___ Laura.|llamo','g|¿Cómo te ___?|llamas','g|¿Cómo se ___ usted?|llama','g|Yo ___ de Irlanda. (ser)|soy','g|¿De dónde ___ tú? (ser)|eres','g|¿De dónde ___ usted? (ser)|es','g|Ella ___ de Sevilla. (ser)|es','m|It’s 9 am. You meet your neighbour:|Buenos días~Buenas noches~Buenas tardes','m|It’s 11 pm. You arrive at a friend’s party:|Buenas noches~Buenos días~Buenas tardes','m|Formal: “Where are you from?”|¿De dónde es usted?~¿De dónde eres usted?~¿De dónde eres?','m|A woman says “nice to meet you”:|Encantada~Encantado~Encantados','m|___ te llamas? – Me llamo Juan.|¿Cómo~¿Qué~¿Dónde~¿Quién','m|___ eres? – De Bristol.|¿De dónde~¿Dónde~¿Cómo','o:wordorder|Where are you from?|¿De dónde eres?','o:wordorder|My name is Sara and I am from Dublin.|Me llamo Sara y soy de Dublín','t|Translate: Hello, my name is Tom.|Hola, me llamo Tom/Hola, soy Tom/¡Hola! Me llamo Tom','t|Translate: I am from London. (ser de)|Soy de Londres/Yo soy de Londres','t|Translate (informal): How are you? – Fine, thanks.|¿Cómo estás? – Bien, gracias/¿Qué tal? – Bien, gracias','t|Make it formal: ¿Cómo te llamas?|¿Cómo se llama usted?/¿Cómo se llama?']},

{id:'a1-02',level:'A1',title:'Sonidos, alfabeto y tildes',cat:'accent',vocab:['a1-alfabeto'],
 topics:['Las cinco vocales','Consonantes difíciles: c/z, j/g, ll, ñ, r/rr, h','El alfabeto y deletrear','La sílaba tónica y la tilde'],
 source:'Libro Libre cap. 1 (El alfabeto) · FSI Units 1–2 (Pronunciation drills) · Rules for Spanish Accent Marks (C. Mena) · MFLE Reference Grammar',
 goals:['pronunciar las vocales y consonantes del castellano','deletrear su nombre','saber dónde va el acento de una palabra y cuándo lleva tilde'],
 grammar:`<h3>1. Five pure vowels</h3>
<p>Spanish has only five vowel sounds, always short and clear, never “gliding” like English <i>day</i> or <i>go</i>: <b>a</b> (casa) · <b>e</b> (mesa) · <b>i</b> (sí) · <b>o</b> (todo) · <b>u</b> (tú). Every vowel is pronounced, even in unstressed syllables: <i>chocolate</i> = cho-co-la-te.</p>
<h3>2. Consonants that differ from English</h3>
<table><tr><th>letter</th><th>sound (Spain)</th><th>examples</th></tr>
<tr><td><b>c</b> + e, i · <b>z</b></td><td>[θ] like <i>th</i> in “think”</td><td>cerveza, cine, gracias, Zaragoza</td></tr>
<tr><td><b>c</b> + a, o, u · <b>qu</b> + e, i</td><td>[k]</td><td>casa, queso, aquí</td></tr>
<tr><td><b>j</b> · <b>g</b> + e, i</td><td>[x] throaty, like Scottish <i>loch</i></td><td>jamón, José, gente, Gijón</td></tr>
<tr><td><b>g</b> + a, o, u · <b>gu</b> + e, i</td><td>[g]</td><td>gato, guerra, guitarra</td></tr>
<tr><td><b>h</b></td><td>silent</td><td>hola, hotel, ahora</td></tr>
<tr><td><b>ll</b> · <b>y</b></td><td>like <i>y</i> in “yes”</td><td>calle, llamar, yo, playa</td></tr>
<tr><td><b>ñ</b></td><td>like <i>ny</i> in “canyon”</td><td>España, mañana, año</td></tr>
<tr><td><b>r</b></td><td>one quick tap</td><td>pero, caro, hablar</td></tr>
<tr><td><b>rr</b> · initial <b>r</b></td><td>rolled (trill)</td><td>perro, Roma, Enrique</td></tr>
<tr><td><b>b</b> · <b>v</b></td><td>same sound</td><td>vino, bien, Valencia</td></tr>
<tr><td><b>d</b> between vowels</td><td>soft, like <i>th</i> in “this”</td><td>cansado, todo, Madrid</td></tr></table>
<h3>3. The alphabet</h3>
<p>a, be, ce, de, e, efe, ge, hache, i, jota, ka, ele, eme, ene, <b>eñe</b>, o, pe, cu, erre, ese, te, u, uve, uve doble, equis, i griega (ye), zeta. To spell: <i>¿Cómo se escribe? – Ge, a, ere, ce, i, a: García.</i></p>
<h3>4. Stress and the written accent (tilde)</h3>
<div class="rule"><b>Rule 1:</b> words ending in a <b>vowel, -n or -s</b> → stress on the <b>second-to-last</b> syllable: <i>CA-sa, HA-blan, LU-nes</i>.<br><b>Rule 2:</b> words ending in any <b>other consonant</b> → stress on the <b>last</b> syllable: <i>ha-BLAR, ciu-DAD, es-pa-ÑOL</i>.<br><b>Exception → tilde:</b> <i>ca-FÉ, in-GLÉS, can-CIÓN, FÁ-cil, ÁR-bol</i>. Every word stressed on the third-to-last syllable has a tilde: <i>TE-lé-fo-no, SÁ-ba-do, MÚ-si-ca</i>.</div>
<p>The tilde also distinguishes meaning: <i>tú</i> (you) / <i>tu</i> (your) · <i>él</i> (he) / <i>el</i> (the) · <i>sí</i> (yes) / <i>si</i> (if) · <i>sé</i> (I know) / <i>se</i> · <i>más</i> (more) · and all question words: <i>qué, cómo, dónde</i>. It can change the whole word: <i>hablo</i> (I speak) / <i>habló</i> (he spoke).</p>
<div class="ch">The tilde is part of the spelling – a missing accent is a spelling mistake. On phones, hold the vowel key to get á é í ó ú; this app also has buttons under every answer field.</div>`,
 pitfalls:['Pronouncing the <b>h</b>: <i>*Hhola</i> → «ola».','English diphthongs: <i>*no-u</i> → a short pure <b>no</b>.','<b>pero</b> (but) vs <b>perro</b> (dog) – one tap vs trill.','Forgetting the tilde in question words: <i>*¿Como te llamas?</i> → ¿Cómo te llamas?'],
 spain:'En el centro y norte de España, <b>casa</b> [s] y <b>caza</b> [θ] suenan distinto. En Andalucía y Canarias muchos dicen las dos con [s] (seseo). Las dos pronunciaciones son correctas; en este curso las voces son del centro peninsular.',
 examples:[['España, mañana, año.','Spain, tomorrow, year.'],['Una cerveza, por favor. Gracias.','A beer, please. Thank you.'],['Jamón, jardín, gente, Gijón.','Ham, garden, people, Gijón.'],['El perro de Roberto corre por la calle.','Roberto’s dog runs along the street.'],['Pero no es caro.','But it isn’t expensive.'],['Hola, ¿hay un hotel por aquí?','Hello, is there a hotel around here?'],['La calle Mayor está allí.','Calle Mayor is over there.'],['¿Cómo se escribe tu apellido?','How do you spell your surname?'],['Se escribe con hache: H-E-R-N-Á-N-D-E-Z.','It’s spelt with an h: H-E-R-N-Á-N-D-E-Z.'],['Me gusta el café y la música.','I like coffee and music.'],['El teléfono está en el salón.','The phone is in the living room.'],['Vivo en Valencia, en la avenida del Puerto.','I live in Valencia, on the avenida del Puerto.']],
 ex:['m|Which word has the [θ] sound (“th”) in Spain?|cine~casa~queso~gato','m|Which letter is silent?|h~j~g~r','m|How is “j” pronounced in “jamón”?|throaty, like “loch”~like English “j”~like “y”','m|Which word has a trilled (rolled) r?|perro~pero~caro~hora','m|Where is the stress in “hablan”?|HA-blan~ha-BLAN','m|Where is the stress in “ciudad”?|ciu-DAD~CIU-dad','m|Which word needs a tilde?|cafe → café~casa~hablar~mesa','m|Which is correct?|teléfono~telefono~teléfóno','m|“Él” with a tilde means…|he~the','m|“Tú” with a tilde means…|you~your','g|Spell with the right accent: Soy ingl___s.|é','g|Add the accent: ¿C___mo te llamas?|ó','g|Add the accent: la canci___n|ó','g|Add the accent: el s___bado|á','d|Write the word you hear.|España','d|Write the word you hear.|gracias','d|Write the word you hear.|mañana','t|Write the Spanish letter name for “ñ”.|eñe','t|Spell the city “Gijón” – write it correctly with the accent.|Gijón']},

{id:'a1-03',level:'A1',title:'El, la, un, una – género y número',cat:'gender',vocab:['a1-clase','a1-casa'],
 topics:['Artículos determinados: el, la, los, las','Artículos indeterminados: un, una, unos, unas','Masculino y femenino','El plural','hay'],
 source:'Libro Libre cap. 1 (Definite and indefinite articles, Pluralizing nouns) · Greenfield Lessons 1–3 · MFLE Reference Grammar (Nouns, Articles)',
 goals:['usar el artículo correcto','formar el plural de los sustantivos','decir qué hay en un lugar'],
 grammar:`<h3>1. Every noun has a gender</h3>
<p>Spanish nouns are <b>masculine</b> or <b>feminine</b> – even things. The article tells you which:</p>
<table><tr><th></th><th>masculine</th><th>feminine</th></tr>
<tr><td>the (singular)</td><td><span class="el">el</span> libro</td><td><span class="la">la</span> mesa</td></tr>
<tr><td>the (plural)</td><td><span class="el">los</span> libros</td><td><span class="la">las</span> mesas</td></tr>
<tr><td>a / an</td><td><span class="el">un</span> libro</td><td><span class="la">una</span> mesa</td></tr>
<tr><td>some</td><td><span class="el">unos</span> libros</td><td><span class="la">unas</span> mesas</td></tr></table>
<h3>2. How to guess the gender</h3>
<div class="rule"><b>Masculine:</b> most nouns in <b>-o</b> (el libro), and many in <b>-or, -aje, -l, -r</b> (el ordenador, el viaje, el hotel, el bar).<br><b>Feminine:</b> most nouns in <b>-a</b> (la casa) and all in <b>-ción, -sión, -dad, -tad, -tud, -umbre</b> (la estación, la ciudad, la libertad).</div>
<p>Important exceptions: <span class="el">el</span> día, <span class="el">el</span> mapa, <span class="el">el</span> problema, <span class="el">el</span> idioma, <span class="el">el</span> sofá · <span class="la">la</span> mano, <span class="la">la</span> foto, <span class="la">la</span> moto, <span class="la">la</span> radio. Nouns in -e or consonant must be learned: <span class="la">la</span> calle, <span class="la">la</span> noche, <span class="el">el</span> coche, <span class="el">el</span> café.</p>
<p>People: <i>el chico / la chica, el profesor / la profesora</i>; some are the same: <i>el/la estudiante, el/la turista</i>.</p>
<h3>3. Plural</h3>
<p>Vowel → <b>+s</b>: casa → casas, coche → coches. Consonant → <b>+es</b>: ciudad → ciudades, hotel → hoteles. <b>-z → -ces</b>: lápiz → lápices. Words in -ión lose the accent: estación → estaciones.</p>
<h3>4. hay = there is / there are</h3>
<div class="rule"><i>En la clase <b>hay</b> una pizarra y veinte sillas.</i> <i>¿<b>Hay</b> un bar por aquí?</i> – hay is used with <b>un/una/unos</b>, numbers or no article – never with el/la (then use <i>está</i>, see unit A1-6).</div>`,
 pitfalls:['<b>*la día</b> → el día; <b>*el mano</b> → la mano.','<b>*Hay el banco</b> → Hay un banco / El banco está allí.','<b>*los ciudads</b> → las ciudades.','<b>*una problema</b> → un problema (words in -ma from Greek are often masculine).'],
 spain:'«Hay» es una palabra que usará todos los días: <i>¿Hay wifi?</i>, <i>¿Hay mesa para dos?</i>, <i>¿Hay pan?</i> En un bar o restaurante es la forma natural de preguntar si algo está disponible.',
 examples:[['El libro y la mesa.','The book and the table.'],['Los chicos y las chicas.','The boys and the girls.'],['Un café y una tostada, por favor.','A coffee and a piece of toast, please.'],['Es un problema muy grande.','It’s a very big problem.'],['La estación está cerca.','The station is nearby.'],['En el piso hay dos habitaciones.','There are two bedrooms in the flat.'],['¿Hay un supermercado por aquí?','Is there a supermarket around here?'],['No hay leche.','There is no milk.'],['Tengo unas fotos de Granada.','I have some photos of Granada.'],['Las ciudades españolas son muy bonitas.','Spanish cities are very pretty.'],['El día es largo en verano.','The day is long in summer.'],['Necesito un lápiz y unos papeles.','I need a pencil and some papers.']],
 ex:['m|___ libro|el~la','m|___ mesa|la~el','m|___ día|el~la','m|___ mano|la~el','m|___ ciudad|la~el','m|___ problema|el~la','m|___ coche|el~la','m|___ estación|la~el','g|___ casa (a)|una','g|___ hotel (a)|un','g|___ chicas (the)|las','g|___ libros (the)|los','g|Plural: el hotel → los ___|hoteles','g|Plural: la ciudad → las ___|ciudades','g|Plural: el lápiz → los ___|lápices','g|Plural: la canción → las ___|canciones','m|___ un banco cerca de aquí.|Hay~Está~Es','t|Translate: There is a bar and two restaurants.|Hay un bar y dos restaurantes','t|Translate: Is there wifi?|¿Hay wifi?/¿Hay wi-fi?']},

{id:'a1-04',level:'A1',title:'Ser y los adjetivos – ¿cómo es?',cat:'agree',vocab:['a1-adjetivos','a1-profesiones'],
 topics:['ser: presente completo','Pronombres personales','Nacionalidades y profesiones','Concordancia del adjetivo','muy, bastante, un poco'],
 source:'Libro Libre cap. 2 (Personal pronouns, Ser, Los adjetivos) · Greenfield Lessons 4–5 · FSI Unit 3 (Basic sentences)',
 goals:['describir a personas y cosas','decir la nacionalidad y la profesión','hacer concordar los adjetivos'],
 grammar:`<h3>1. ser – the full present tense</h3>
<table><tr><th>person</th><th>pronoun</th><th>ser</th></tr>
<tr><td>I</td><td>yo</td><td><em>soy</em></td></tr><tr><td>you (inf.)</td><td>tú</td><td><em>eres</em></td></tr><tr><td>he / she / you (formal)</td><td>él / ella / usted</td><td><em>es</em></td></tr>
<tr><td>we</td><td>nosotros / nosotras</td><td><em>somos</em></td></tr><tr><td>you all (inf.) – Spain</td><td>vosotros / vosotras</td><td><em>sois</em></td></tr><tr><td>they / you all (formal)</td><td>ellos / ellas / ustedes</td><td><em>son</em></td></tr></table>
<p><b>ser</b> is used for what someone or something <i>is</i>: name, origin, nationality, profession, character, appearance. <i>Soy profesora. Es alto y muy simpático. Somos de Australia.</i></p>
<div class="rule">Profession <b>without</b> un/una: <i>Soy enfermero</i> (I’m a nurse), not <s>soy un enfermero</s> – unless you add an adjective: <i>Es un médico excelente.</i></div>
<h3>2. Adjectives agree</h3>
<table><tr><th></th><th>masc. sg.</th><th>fem. sg.</th><th>masc. pl.</th><th>fem. pl.</th></tr>
<tr><td>-o / -a</td><td>alto</td><td>alta</td><td>altos</td><td>altas</td></tr>
<tr><td>-e</td><td>grande</td><td>grande</td><td>grandes</td><td>grandes</td></tr>
<tr><td>consonant</td><td>joven</td><td>joven</td><td>jóvenes</td><td>jóvenes</td></tr>
<tr><td>nationality</td><td>inglés</td><td>inglesa</td><td>ingleses</td><td>inglesas</td></tr></table>
<p>Adjectives normally come <b>after</b> the noun: <i>una ciudad bonita, un piso pequeño</i>. Mixed group → masculine plural: <i>Juan y María son simpáticos.</i></p>
<h3>3. Nationalities (lower case!)</h3>
<p>español/española · inglés/inglesa · escocés/escocesa · irlandés/irlandesa · galés/galesa · alemán/alemana · francés/francesa · italiano/italiana · estadounidense · canadiense · australiano/australiana.</p>
<h3>4. Intensifiers</h3>
<p><i>muy</i> (very) · <i>bastante</i> (quite) · <i>un poco</i> (a bit – usually for negative things: <i>es un poco caro</i>) · <i>nada</i> (not at all: <i>no es nada caro</i>).</p>`,
 pitfalls:['<b>*Soy un profesor</b> → Soy profesor.','<b>*la casa bonito</b> → la casa bonit<b>a</b>.','<b>*Ella es Inglesa</b> → inglesa (lower case).','<b>*Somos simpáticas</b> for a mixed group → simpáticos.'],
 spain:'En España se usa <b>vosotros</b> (vosotros sois) para hablar a varios amigos. <b>Ustedes</b> (ustedes son) es solo formal. En Latinoamérica se dice ustedes a todos: aquí aprenderá las dos formas.',
 examples:[['Soy inglés y soy ingeniero.','I’m English and I’m an engineer.'],['¿Eres española? – No, soy italiana.','Are you Spanish? – No, I’m Italian.'],['Mi jefa es muy simpática.','My boss is very nice.'],['Somos de Australia.','We are from Australia.'],['¿Vosotros sois estudiantes?','Are you (all) students?'],['Ellos son altos y morenos.','They are tall and dark-haired.'],['Madrid es una ciudad grande y moderna.','Madrid is a big, modern city.'],['El piso es pequeño pero muy bonito.','The flat is small but very pretty.'],['La paella es un plato típico de Valencia.','Paella is a typical dish from Valencia.'],['El metro no es nada caro.','The metro isn’t expensive at all.'],['Ustedes son de Canadá, ¿verdad?','You are from Canada, right? (formal)'],['Mis vecinos son muy jóvenes.','My neighbours are very young.']],
 ex:['g|Yo ___ escocés. (ser)|soy','g|Tú ___ muy simpático. (ser)|eres','g|Nosotros ___ de Irlanda. (ser)|somos','g|Vosotros ___ estudiantes. (ser)|sois','g|Ellas ___ médicas. (ser)|son','g|Usted ___ el señor López, ¿verdad? (ser)|es','g:agree|Una casa ___ (bonito)|bonita','g:agree|Unos pisos ___ (caro)|caros','g:agree|Unas chicas ___ (inglés)|inglesas','g:agree|Dos ciudades ___ (grande)|grandes','g:agree|Mis amigos son ___ (joven)|jóvenes','m|She is a doctor.|Es médica.~Es una médica.~Está médica.','m|Juan y Marta son muy ___.|simpáticos~simpáticas~simpático','m|Mixed nationality: “We are Scottish (we = man + woman)”|Somos escoceses~Somos escocesas~Somos escocés','o:wordorder|It is a very pretty city.|Es una ciudad muy bonita','o:wordorder|My friends are not Spanish.|Mis amigos no son españoles','t|Translate: I am Irish and I am a teacher. (woman)|Soy irlandesa y soy profesora','t|Translate: The flat is small but cheap.|El piso es pequeño pero barato','t|Translate: Are you (all, informal) English?|¿Sois ingleses?/¿Vosotros sois ingleses?/¿Sois inglesas?']},

{id:'a1-05',level:'A1',title:'Verbos en -ar – trabajo y estudios',cat:'conj',vocab:['a1-verbos-ar','a1-numeros'],
 topics:['Presente de los verbos regulares en -ar','La negación con «no»','Preguntas de sí/no','Los números 0–100'],
 source:'Greenfield Lesson 1 (First conjugation) · Libro Libre cap. 2 (Los números 0–100) y cap. 3 · FSI Unit 5 (White’s first day at work)',
 goals:['hablar de su trabajo, sus estudios y su día','negar y hacer preguntas','usar los números hasta 100 (edad, teléfono, precios)'],
 grammar:`<h3>1. Regular -ar verbs</h3>
<p>Remove <b>-ar</b> and add the ending of the person:</p>
<table><tr><th></th><th>hablar (speak)</th><th>trabajar (work)</th><th>estudiar (study)</th></tr>
<tr><td>yo</td><td>habl<em>o</em></td><td>trabaj<em>o</em></td><td>estudi<em>o</em></td></tr>
<tr><td>tú</td><td>habl<em>as</em></td><td>trabaj<em>as</em></td><td>estudi<em>as</em></td></tr>
<tr><td>él / ella / usted</td><td>habl<em>a</em></td><td>trabaj<em>a</em></td><td>estudi<em>a</em></td></tr>
<tr><td>nosotros/as</td><td>habl<em>amos</em></td><td>trabaj<em>amos</em></td><td>estudi<em>amos</em></td></tr>
<tr><td>vosotros/as</td><td>habl<em>áis</em></td><td>trabaj<em>áis</em></td><td>estudi<em>áis</em></td></tr>
<tr><td>ellos / ellas / ustedes</td><td>habl<em>an</em></td><td>trabaj<em>an</em></td><td>estudi<em>an</em></td></tr></table>
<p>Many everyday verbs work like this: <i>hablar, trabajar, estudiar, escuchar, mirar, comprar, cocinar, llegar, tomar, necesitar, buscar, viajar, desayunar, cenar</i>. The Spanish present also covers “I am working” and near-future plans: <i>Mañana trabajo</i> = I’m working tomorrow.</p>
<h3>2. Negation and questions</h3>
<div class="rule"><b>no</b> goes directly before the verb: <i>No hablo alemán. No trabajamos los domingos.</i><br>Yes/no questions = statement + intonation going up: <i>¿Hablas inglés?</i> <i>¿Trabaja usted aquí?</i> Answer: <i>Sí, … / No, no …</i> (two “no”s!): <i>No, no hablo francés.</i></div>
<h3>3. Numbers 0–100</h3>
<p>0 cero · 1 uno · 2 dos · 3 tres · 4 cuatro · 5 cinco · 6 seis · 7 siete · 8 ocho · 9 nueve · 10 diez · 11 once · 12 doce · 13 trece · 14 catorce · 15 quince · 16 dieciséis · 17 diecisiete · 18 dieciocho · 19 diecinueve · 20 veinte · 21 veintiuno · 22 veintidós · 23 veintitrés … 30 treinta · 31 treinta y uno · 40 cuarenta · 50 cincuenta · 60 sesenta · 70 setenta · 80 ochenta · 90 noventa · 100 cien.</p>
<p>16–29 are written as one word; from 31 on with <b>y</b>: <i>cuarenta y cinco</i>. Before a masculine noun uno → <b>un</b>, before feminine → <b>una</b>: <i>veintiún años, treinta y una personas</i>.</p>
<div class="ch">Age uses <b>tener</b> (to have), not ser: <i>Tengo treinta y dos años.</i> Phone numbers are often read in pairs: 6 12 34 56 78 → seis, doce, treinta y cuatro, cincuenta y seis, setenta y ocho.</div>`,
 pitfalls:['<b>*Yo hablas</b> → yo hablo, tú hablas.','<b>*Yo no hablo no</b> → No, no hablo.','<b>*veinte y uno</b> → veintiuno; <b>*treintaicinco</b> → treinta y cinco.','<b>*Soy 30 años</b> → Tengo 30 años.'],
 spain:'Los horarios de trabajo en España suelen ser de 9 a 14 h y de 16 a 19 h (jornada partida), aunque cada vez más empresas tienen jornada continua. En verano muchas oficinas hacen «jornada intensiva» hasta las 15 h.',
 examples:[['Trabajo en una empresa de informática.','I work in an IT company.'],['¿Hablas español? – Sí, un poco.','Do you speak Spanish? – Yes, a little.'],['No hablo alemán.','I don’t speak German.'],['Estudiamos español los lunes y los miércoles.','We study Spanish on Mondays and Wednesdays.'],['¿Dónde trabajáis vosotros?','Where do you (all) work?'],['Mi marido cocina muy bien.','My husband cooks very well.'],['Ellos llegan mañana a Barcelona.','They arrive in Barcelona tomorrow.'],['¿Necesita usted ayuda?','Do you need help?'],['Tengo treinta y cuatro años.','I’m thirty-four.'],['Mi número es el seis, doce, treinta y cuatro, cincuenta y seis, setenta y ocho.','My number is 612 34 56 78.'],['Son cuarenta y cinco euros.','That’s forty-five euros.'],['No trabajo los fines de semana.','I don’t work at weekends.']],
 ex:['g|Yo ___ en un hospital. (trabajar)|trabajo','g|¿Tú ___ inglés? (hablar)|hablas','g|Ella ___ Medicina. (estudiar)|estudia','g|Nosotros ___ en casa. (cenar)|cenamos','g|¿Vosotros ___ música clásica? (escuchar)|escucháis','g|Ellos ___ un piso en Madrid. (buscar)|buscan','g|Usted ___ ayuda, ¿verdad? (necesitar)|necesita','g:neg|___ hablo francés. (negative)|No','m|Do you speak English? – No, I don’t.|No, no hablo inglés.~No, hablo no inglés.~No hablo no inglés.','g|21 = ___|veintiuno','g|35 = treinta y ___|cinco','g|16 = ___|dieciséis','g|100 = ___|cien','g|I’m 28. – Tengo ___ años.|veintiocho/28','m|Age: I am 40.|Tengo cuarenta años.~Soy cuarenta años.~Estoy cuarenta años.','o:wordorder|We don’t work on Sundays.|No trabajamos los domingos','o:wordorder|Do you work here? (usted)|¿Trabaja usted aquí?','t|Translate: I study Spanish and I work in a bank.|Estudio español y trabajo en un banco','t|Translate: They don’t speak Spanish.|No hablan español/Ellos no hablan español/Ellas no hablan español']},

{id:'a1-06',level:'A1',title:'Estar, hay y la ciudad',cat:'serestar',vocab:['a1-ciudad'],
 topics:['estar: presente','¿Dónde está…? – lugar','¿Cómo estás? – estados','hay vs. está','Preposiciones de lugar'],
 source:'Greenfield Lesson 2 (Estar) · Libro Libre cap. 2 (Estar, Los adjetivos y las preposiciones con estar) · FSI Unit 4 (White meets Molina at the Embassy)',
 goals:['decir dónde está algo','decir cómo está uno','distinguir hay y está','describir un barrio'],
 grammar:`<h3>1. estar – to be (where / how)</h3>
<table><tr><th></th><th>estar</th></tr><tr><td>yo</td><td><em>estoy</em></td></tr><tr><td>tú</td><td><em>estás</em></td></tr><tr><td>él / ella / usted</td><td><em>está</em></td></tr><tr><td>nosotros/as</td><td><em>estamos</em></td></tr><tr><td>vosotros/as</td><td><em>estáis</em></td></tr><tr><td>ellos / ellas / ustedes</td><td><em>están</em></td></tr></table>
<div class="rule"><b>estar</b> for <b>location</b>: <i>¿Dónde está el museo? – Está en la plaza.</i><br><b>estar</b> for <b>states and feelings</b>: <i>Estoy cansado. ¿Estás bien? La tienda está cerrada.</i></div>
<p>Typical adjectives with estar: <i>bien, mal, cansado, contento, enfadado, nervioso, enfermo, ocupado, abierto, cerrado, lleno, vacío, limpio, sucio</i>.</p>
<h3>2. hay or está?</h3>
<table><tr><th>hay</th><th>está / están</th></tr>
<tr><td>something <b>new</b> – does it exist? (un, una, unos, numbers, no article)</td><td>something <b>known</b> – where is it? (el, la, mi, names)</td></tr>
<tr><td><i>¿Hay una farmacia por aquí?</i></td><td><i>¿Dónde está la farmacia?</i></td></tr>
<tr><td><i>En mi calle hay dos bares.</i></td><td><i>Los bares están en la plaza.</i></td></tr></table>
<h3>3. Where? – prepositions of place</h3>
<p><i>en</i> (in/at/on) · <i>al lado de</i> (next to) · <i>cerca de</i> (near) · <i>lejos de</i> (far from) · <i>delante de</i> (in front of) · <i>detrás de</i> (behind) · <i>enfrente de</i> (opposite) · <i>entre</i> (between) · <i>encima de / debajo de</i> (on top of / under) · <i>a la derecha / a la izquierda</i> (on the right / left) · <i>aquí, ahí, allí</i> (here, there, over there).</p>
<div class="rule">de + el = <b>del</b>: <i>al lado <b>del</b> banco</i> (but <i>al lado de la farmacia</i>).</div>`,
 pitfalls:['<b>*Soy en Madrid</b> → Estoy en Madrid.','<b>*Soy cansado</b> → Estoy cansado.','<b>*Hay el museo en la plaza</b> → El museo está en la plaza.','<b>*al lado de el banco</b> → al lado del banco.'],
 spain:'Casi todos los pueblos y ciudades tienen una <b>Plaza Mayor</b> o plaza principal con el ayuntamiento, una iglesia y bares con terraza. Para orientarse, «la plaza» es el punto de referencia.',
 examples:[['¿Dónde está la estación? – Está muy cerca.','Where is the station? – It’s very close.'],['Estoy en casa.','I’m at home.'],['¿Cómo estás? – Estoy un poco cansada.','How are you? – I’m a bit tired.'],['El banco está al lado de la farmacia.','The bank is next to the pharmacy.'],['Perdone, ¿hay un cajero por aquí?','Excuse me, is there a cash machine around here?'],['En mi barrio hay muchos bares.','There are lots of bars in my neighbourhood.'],['El museo está enfrente del parque.','The museum is opposite the park.'],['Los domingos las tiendas están cerradas.','The shops are closed on Sundays.'],['Estamos muy contentos en Sevilla.','We are very happy in Seville.'],['¿Estáis bien? – Sí, estamos bien.','Are you all OK? – Yes, we’re fine.'],['La farmacia está entre el bar y el banco.','The pharmacy is between the bar and the bank.'],['Mi piso está lejos del centro.','My flat is far from the centre.']],
 ex:['g|Yo ___ en el trabajo. (estar)|estoy','g|¿Dónde ___ tú? (estar)|estás','g|El museo ___ en la plaza. (estar)|está','g|Nosotros ___ cansados. (estar)|estamos','g|¿Vosotros ___ bien? (estar)|estáis','g|Las tiendas ___ cerradas. (estar)|están','m|___ en Barcelona. (I am…)|Estoy~Soy~Hay','m|Mi hermana ___ enfermera.|es~está~hay','m|Mi hermana ___ enferma.|está~es~hay','m|¿___ un supermercado por aquí?|Hay~Está~Es','m|¿Dónde ___ el supermercado?|está~hay~es','g|El banco está al lado ___ cine.|del','g|La farmacia está cerca ___ la estación.|de','m|The bar is opposite the church.|El bar está enfrente de la iglesia.~El bar hay enfrente de la iglesia.~El bar es enfrente de la iglesia.','o:wordorder|Where is the station?|¿Dónde está la estación?','o:wordorder|There are two parks in my neighbourhood.|En mi barrio hay dos parques','t|Translate: I am tired.|Estoy cansado/Estoy cansada','t|Translate: The museum is closed.|El museo está cerrado','t|Translate: Is there a pharmacy near here?|¿Hay una farmacia cerca de aquí?/¿Hay una farmacia por aquí?/¿Hay una farmacia por aquí cerca?']}
]);

{id:'a1-07',level:'A1',title:'Tener, la familia y los posesivos',cat:'conj',vocab:['a1-familia'],
 topics:['tener: presente','tener que + infinitivo','La familia','Posesivos: mi, tu, su, nuestro, vuestro','¿Cuántos…?'],
 source:'Libro Libre cap. 2 (Tener) y cap. 4 (Family, Expressing possession) · Greenfield Lessons 7 y 15 (Possessive adjectives, Tener and its idioms)',
 goals:['hablar de su familia','expresar posesión','decir lo que tiene que hacer'],
 grammar:`<h3>1. tener – to have</h3>
<table><tr><th></th><th>tener</th></tr><tr><td>yo</td><td><em>tengo</em></td></tr><tr><td>tú</td><td><em>tienes</em></td></tr><tr><td>él / ella / usted</td><td><em>tiene</em></td></tr><tr><td>nosotros/as</td><td><em>tenemos</em></td></tr><tr><td>vosotros/as</td><td><em>tenéis</em></td></tr><tr><td>ellos / ustedes</td><td><em>tienen</em></td></tr></table>
<p><i>Tengo dos hermanos. ¿Tienes hijos? No tenemos coche.</i> Age: <i>Mi hija tiene seis años.</i></p>
<div class="rule"><b>tener que + infinitive</b> = to have to: <i>Tengo que trabajar mañana. ¿Tienes que estudiar?</i></div>
<h3>2. Possessive adjectives</h3>
<table><tr><th></th><th>singular noun</th><th>plural noun</th></tr>
<tr><td>my</td><td>mi hermano</td><td>mis hermanos</td></tr>
<tr><td>your (tú)</td><td>tu madre</td><td>tus padres</td></tr>
<tr><td>his / her / its / your (usted) / their</td><td>su casa</td><td>sus casas</td></tr>
<tr><td>our</td><td>nuestro piso / nuestra calle</td><td>nuestros / nuestras</td></tr>
<tr><td>your (vosotros)</td><td>vuestro hijo / vuestra hija</td><td>vuestros / vuestras</td></tr></table>
<p>Possessives agree with the <b>thing owned</b>, not the owner: <i>nuestra casa</i> (casa is feminine). <i>su</i> is ambiguous (his/her/your/their); if needed, use <i>de</i>: <i>la casa de Ana, el coche de ustedes</i>.</p>
<h3>3. The family</h3>
<p>el padre / la madre (los padres = parents) · el hermano / la hermana · el hijo / la hija (los hijos = children) · el abuelo / la abuela · el tío / la tía · el primo / la prima · el marido / la mujer (husband/wife; also: el esposo, la esposa) · la pareja (partner) · el novio / la novia.</p>
<p><b>¿Cuántos/cuántas?</b> agrees with the noun: <i>¿Cuántos hermanos tienes? ¿Cuántas hijas tiene usted?</i></p>`,
 pitfalls:['<b>*Yo teno</b> → tengo.','<b>*mi hermanos</b> → mis hermanos.','<b>*Tengo de trabajar</b> → Tengo que trabajar.','<b>*nuestro casa</b> → nuestra casa.'],
 spain:'En España las familias suelen comer juntas los domingos, a menudo en casa de los abuelos. Es normal que los jóvenes vivan con sus padres hasta los 29–30 años, por el precio de la vivienda.',
 examples:[['Tengo dos hermanos y una hermana.','I have two brothers and one sister.'],['¿Tienes hijos? – Sí, tengo una hija.','Do you have children? – Yes, I have a daughter.'],['Mi hija tiene seis años.','My daughter is six.'],['Mis padres viven en Escocia.','My parents live in Scotland.'],['Su marido es de Bilbao.','Her husband is from Bilbao.'],['Nuestra casa está cerca del mar.','Our house is near the sea.'],['¿Cómo se llama vuestro perro?','What’s your (pl.) dog called?'],['Tengo que trabajar el sábado.','I have to work on Saturday.'],['¿Cuántos primos tienes?','How many cousins do you have?'],['No tenemos coche.','We don’t have a car.'],['Los abuelos de mi mujer son de Galicia.','My wife’s grandparents are from Galicia.'],['¿Tiene usted el pasaporte?','Do you have your passport?']],
 ex:['g|Yo ___ un hermano. (tener)|tengo','g|¿Tú ___ hijos? (tener)|tienes','g|Mi padre ___ 65 años. (tener)|tiene','g|Nosotros no ___ coche. (tener)|tenemos','g|¿Vosotros ___ perro? (tener)|tenéis','g|Ellos ___ que trabajar. (tener)|tienen','g|___ hermanos son altos. (my)|Mis','g|___ casa es grande. (our)|Nuestra','g|¿Dónde viven ___ padres? (your, tú)|tus','g|___ hijo se llama Leo. (your, vosotros)|Vuestro','m|I have to study.|Tengo que estudiar.~Tengo estudiar.~Tengo de estudiar.','m|¿___ hermanas tienes?|Cuántas~Cuántos~Cuánto','m|My mother’s sister is my…|tía~prima~abuela','m|The son of my uncle is my…|primo~sobrino~hermano','o:wordorder|My parents live in London.|Mis padres viven en Londres','o:wordorder|How many children do you have? (usted)|¿Cuántos hijos tiene usted?','t|Translate: I have two daughters.|Tengo dos hijas','t|Translate: We have to work tomorrow.|Tenemos que trabajar mañana','t|Translate: Her husband is Spanish.|Su marido es español/Su esposo es español']},

{id:'a1-08',level:'A1',title:'Verbos en -er/-ir, la hora y los días',cat:'conj',vocab:['a1-tiempo','a1-verbos-er-ir'],
 topics:['Presente de -er y -ir','¿Qué hora es? – Es la una / Son las…','¿A qué hora…?','Días, meses, fechas','Frecuencia: siempre, a veces, nunca'],
 source:'Greenfield Lessons 3, 6, 23, 28 (ER/IR verbs, Time of day, Days–Months) · Libro Libre cap. 2 (Días, meses, La hora)',
 goals:['hablar de lo que hace normalmente','decir y preguntar la hora','dar fechas y hablar de la semana'],
 grammar:`<h3>1. Regular -er and -ir verbs</h3>
<table><tr><th></th><th>comer (eat)</th><th>vivir (live)</th></tr>
<tr><td>yo</td><td>com<em>o</em></td><td>viv<em>o</em></td></tr><tr><td>tú</td><td>com<em>es</em></td><td>viv<em>es</em></td></tr><tr><td>él / ella / usted</td><td>com<em>e</em></td><td>viv<em>e</em></td></tr>
<tr><td>nosotros</td><td>com<em>emos</em></td><td>viv<em>imos</em></td></tr><tr><td>vosotros</td><td>com<em>éis</em></td><td>viv<em>ís</em></td></tr><tr><td>ellos / ustedes</td><td>com<em>en</em></td><td>viv<em>en</em></td></tr></table>
<p>-er and -ir differ only in nosotros and vosotros. Like comer: <i>beber, leer, aprender, comprender, correr, vender</i>. Like vivir: <i>escribir, abrir, recibir, subir, compartir</i>.</p>
<h3>2. What time is it?</h3>
<div class="rule"><b>Es la una</b> (1:00) – but <b>Son las dos / las tres…</b><br>y cuarto (:15) · y media (:30) · menos cuarto (:45 → <i>son las cinco menos cuarto</i> = 4:45) · y diez / menos diez.<br><b>¿A qué hora…?</b> – <b>A las</b> ocho. <b>A la</b> una.<br>de la mañana (am) · de la tarde (pm until dark) · de la noche (night) · al mediodía.</div>
<p>Timetables use the 24-hour clock: <i>El tren sale a las 17:40</i> (diecisiete cuarenta).</p>
<h3>3. Days and months (lower case!)</h3>
<p>lunes, martes, miércoles, jueves, viernes, sábado, domingo. <b>No preposition</b>: <i>el lunes</i> = on Monday, <i>los lunes</i> = on Mondays, <i>el fin de semana</i>.</p>
<p>enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre. Dates: <i>Hoy es lunes, 3 de mayo.</i> <i>Mi cumpleaños es el 12 de octubre.</i> Years: <i>en 2024</i> (dos mil veinticuatro).</p>
<h3>4. How often?</h3>
<p><i>siempre</i> (always) · <i>normalmente</i> · <i>a menudo</i> (often) · <i>a veces</i> (sometimes) · <i>casi nunca</i> · <i>nunca</i> (never) · <i>todos los días</i> (every day) · <i>una vez a la semana</i>.</p>`,
 pitfalls:['<b>*Es las tres</b> → Son las tres. <b>*Son la una</b> → Es la una.','<b>*en lunes</b> → el lunes.','<b>*Lunes</b>, <b>*Mayo</b> → lunes, mayo (lower case).','<b>*vivemos</b> → vivimos.'],
 spain:'España vive «una hora tarde»: se come entre las 14 y las 15:30 h y se cena hacia las 21–22 h. Muchas tiendas pequeñas cierran de 14 a 17 h. El domingo casi todo cierra fuera del centro de las ciudades grandes.',
 examples:[['¿Qué hora es? – Son las tres y cuarto.','What time is it? – It’s quarter past three.'],['Es la una y media.','It’s half past one.'],['¿A qué hora comes? – A las dos y media.','What time do you have lunch? – At half past two.'],['Vivo en Málaga desde enero.','I’ve lived in Málaga since January.'],['Los sábados leo el periódico en una terraza.','On Saturdays I read the paper on a terrace.'],['Normalmente cenamos a las nueve.','We usually have dinner at nine.'],['¿Bebéis vino? – A veces.','Do you (all) drink wine? – Sometimes.'],['Escribo correos todo el día.','I write emails all day.'],['El banco abre a las ocho y media.','The bank opens at half past eight.'],['Hoy es miércoles, catorce de febrero.','Today is Wednesday, the fourteenth of February.'],['Mi cumpleaños es el veinte de julio.','My birthday is on the twentieth of July.'],['Nunca como carne.','I never eat meat.']],
 ex:['g|Yo ___ en Valencia. (vivir)|vivo','g|¿Tú ___ carne? (comer)|comes','g|Ella ___ muchos libros. (leer)|lee','g|Nosotros ___ en el centro. (vivir)|vivimos','g|¿Vosotros ___ cerveza? (beber)|bebéis','g|Ellos ___ correos. (escribir)|escriben','g|La tienda ___ a las diez. (abrir)|abre','m|3:00|Son las tres~Es las tres~Son tres','m|1:30|Es la una y media~Son las una y media~Es una y media','m|4:45|Son las cinco menos cuarto~Son las cuatro menos cuarto~Son las cuatro y cuarenta y cinco minutos menos','g|8:15 – Son las ocho y ___.|cuarto','m|On Monday I work.|El lunes trabajo.~En lunes trabajo.~Lunes en trabajo.','m|The day after jueves is…|viernes~miércoles~sábado','m|Which is written correctly?|el 5 de mayo~el 5 de Mayo~el 5 Mayo','g|¿___ qué hora cenas? – ___ las nueve.|A;A','o:wordorder|We never eat at home on Sundays.|Nunca comemos en casa los domingos','t|Translate: What time is it? – It’s two o’clock.|¿Qué hora es? – Son las dos','t|Translate: I live in Madrid and I work in Getafe.|Vivo en Madrid y trabajo en Getafe','t|Translate: The shop opens at ten.|La tienda abre a las diez']},

{id:'a1-09',level:'A1',title:'Ir, ir a + infinitivo y el transporte',cat:'prep',vocab:['a1-transporte'],
 topics:['ir: presente','ir a / al','ir a + infinitivo (planes)','Medios de transporte: en tren, a pie','venir y salir'],
 source:'Libro Libre cap. 4 (The expression ir + a + infinitivo) · Greenfield Lesson 10 (Irregular verbs) · FSI Unit 4–5',
 goals:['decir adónde va y cómo','hablar de planes','preguntar por horarios y transportes'],
 grammar:`<h3>1. ir – to go</h3>
<table><tr><th></th><th>ir</th><th>venir (come)</th><th>salir (leave, go out)</th></tr>
<tr><td>yo</td><td><em>voy</em></td><td><em>vengo</em></td><td><em>salgo</em></td></tr>
<tr><td>tú</td><td><em>vas</em></td><td><em>vienes</em></td><td>sales</td></tr>
<tr><td>él / ella / usted</td><td><em>va</em></td><td><em>viene</em></td><td>sale</td></tr>
<tr><td>nosotros</td><td><em>vamos</em></td><td>venimos</td><td>salimos</td></tr>
<tr><td>vosotros</td><td><em>vais</em></td><td>venís</td><td>salís</td></tr>
<tr><td>ellos / ustedes</td><td><em>van</em></td><td><em>vienen</em></td><td>salen</td></tr></table>
<div class="rule"><b>ir a</b> + place: <i>Voy a Sevilla. Vamos a la playa.</i> a + el = <b>al</b>: <i>Voy al médico, al cine, al trabajo.</i><br><b>¿Adónde vas?</b> (where to?) vs <b>¿Dónde estás?</b> (where?).</div>
<h3>2. ir a + infinitive – plans and the near future</h3>
<div class="rule"><i>Voy a comer con mis amigos. ¿Qué vas a hacer el fin de semana? Vamos a ver una película.</i></div>
<p>This is the most common way to talk about the future in speech. <b>Vamos a…</b> also means “let’s…”: <i>¡Vamos a tomar algo!</i></p>
<h3>3. Transport</h3>
<p><b>en</b> + transport: <i>en coche, en tren, en autobús, en metro, en avión, en bici, en taxi</i> – but <b>a pie / andando</b> (on foot). <i>coger el metro</i> (Spain) = to take the metro. <i>¿Cuánto se tarda?</i> = how long does it take? – <i>Se tarda media hora.</i></p>
<p>from … to: <i>de Madrid a Toledo, desde las ocho hasta las diez</i>.</p>`,
 pitfalls:['<b>*Voy a el cine</b> → Voy al cine.','<b>*Voy en pie</b> → Voy a pie / andando.','<b>*¿Dónde vas?</b> → ¿Adónde vas? (in speech ¿Dónde vas? is also heard).','<b>*Voy a trabajo mañana</b> → Voy a trabajar mañana / Voy al trabajo.'],
 spain:'En España «coger» se usa sin problema: <i>coger el autobús, coger un taxi</i>. Los trenes de alta velocidad (AVE) conectan Madrid con Barcelona en unas 2 h 30 y con Sevilla en 2 h 30. El abono transporte para jóvenes y los descuentos de Renfe hacen el tren muy popular.',
 examples:[['Voy al trabajo en metro.','I go to work by metro.'],['¿Adónde vas? – Voy a la farmacia.','Where are you going? – I’m going to the pharmacy.'],['Mañana vamos a Toledo en tren.','Tomorrow we are going to Toledo by train.'],['¿Qué vas a hacer este fin de semana?','What are you going to do this weekend?'],['Voy a visitar a mis suegros.','I’m going to visit my in-laws.'],['El tren sale a las nueve y diez.','The train leaves at ten past nine.'],['¿Vienes con nosotros al cine?','Are you coming to the cinema with us?'],['Salgo de casa a las ocho.','I leave home at eight.'],['Siempre voy andando, está muy cerca.','I always walk, it’s very close.'],['¿Cuánto se tarda de Madrid a Segovia?','How long does it take from Madrid to Segovia?'],['Se tarda una media hora en AVE.','It takes about half an hour by high-speed train.'],['¡Vamos a tomar algo!','Let’s go for a drink!']],
 ex:['g|Yo ___ al gimnasio. (ir)|voy','g|¿Adónde ___ tú? (ir)|vas','g|Nosotros ___ a la playa. (ir)|vamos','g|¿Vosotros ___ en coche? (ir)|vais','g|Ellos ___ de Francia. (venir)|vienen','g|Yo ___ de casa a las siete. (salir)|salgo','g|¿Tú ___ a la fiesta? (venir)|vienes','g|Voy ___ médico. (a + el)|al','g|Vamos ___ la playa.|a','m|I go by train.|Voy en tren.~Voy a tren.~Voy con tren.','m|I walk to work.|Voy al trabajo a pie.~Voy al trabajo en pie.~Voy a el trabajo andando.','g|Mañana ___ a comer en casa de Luis. (ir, nosotros)|vamos','m|What are you going to do tomorrow?|¿Qué vas a hacer mañana?~¿Qué vas hacer mañana?~¿Qué vas a haces mañana?','m|¿___ vas? – Al supermercado.|Adónde~Dónde~Cuándo','o:wordorder|I’m going to visit my parents.|Voy a visitar a mis padres','o:wordorder|The bus leaves at eight.|El autobús sale a las ocho','t|Translate: We are going to Valencia by car.|Vamos a Valencia en coche','t|Translate: What are you going to eat? (tú)|¿Qué vas a comer?','t|Translate: I’m going to the cinema.|Voy al cine']},

{id:'a1-10',level:'A1',title:'Comer y beber – gustar y pedir en el bar',cat:'gustar',vocab:['a1-comida','a1-bar'],
 topics:['gustar: me gusta / me gustan','encantar','También / tampoco','Pedir en un bar: ¿me pones…?, quería…','La comida española'],
 source:'Libro Libre cap. 4 (The verb gustar) y cap. 5 (Food, Restaurant conversation) · FSI Unit 6 (White and Molina have lunch together)',
 goals:['decir lo que le gusta y lo que no','pedir comida y bebida en un bar o restaurante','reaccionar: a mí también / a mí tampoco'],
 grammar:`<h3>1. gustar – “to be pleasing”</h3>
<p>In Spanish the thing you like is the <b>subject</b>; the person is an indirect object pronoun:</p>
<table><tr><th></th><th>+ singular / infinitive</th><th>+ plural</th></tr>
<tr><td>(a mí)</td><td><b>me</b> gusta el café</td><td><b>me</b> gustan las tapas</td></tr>
<tr><td>(a ti)</td><td><b>te</b> gusta bailar</td><td><b>te</b> gustan los perros</td></tr>
<tr><td>(a él / ella / usted)</td><td><b>le</b> gusta</td><td><b>le</b> gustan</td></tr>
<tr><td>(a nosotros)</td><td><b>nos</b> gusta</td><td><b>nos</b> gustan</td></tr>
<tr><td>(a vosotros)</td><td><b>os</b> gusta</td><td><b>os</b> gustan</td></tr>
<tr><td>(a ellos / ustedes)</td><td><b>les</b> gusta</td><td><b>les</b> gustan</td></tr></table>
<div class="rule"><i>No me gusta el pescado. ¿Te gusta cocinar? A mi hermana le encantan los churros.</i> Use the article with nouns: <i>Me gusta <b>el</b> vino</i>. <b>encantar</b> = to love (things): <i>Me encanta Sevilla.</i> <b>mucho</b> after the verb: <i>Me gusta mucho.</i></div>
<h3>2. Agreeing and disagreeing</h3>
<table><tr><th>statement</th><th>same</th><th>different</th></tr>
<tr><td>Me gusta el té.</td><td>A mí también.</td><td>A mí no.</td></tr>
<tr><td>No me gusta el té.</td><td>A mí tampoco.</td><td>A mí sí.</td></tr></table>
<h3>3. Ordering in a bar or restaurant</h3>
<div class="rule">Very common in Spain: <b>¿Me pones…?</b> / <b>Ponme…</b> (bar, informal) · <b>Quería…</b> / <b>Me gustaría…</b> (polite) · <b>Para mí…</b> (for me…) · <b>De primero / de segundo / de postre</b> (menu courses) · <b>La cuenta, por favor</b> / <b>¿Me cobras?</b></div>
<p>A <i>tapa</i> is a small portion, a <i>ración</i> a big one to share, a <i>pincho</i> a snack on bread. <i>caña</i> = small draught beer, <i>tinto</i> = red wine, <i>tinto de verano</i> = red wine with lemonade, <i>café solo / cortado / con leche</i>.</p>`,
 pitfalls:['<b>*Yo gusto el café</b> → Me gusta el café.','<b>*Me gusta las tapas</b> → Me gustan las tapas.','<b>*Me gusta café</b> → Me gusta el café.','<b>*A mí también no</b> → A mí tampoco.'],
 spain:'El <b>menú del día</b> (de lunes a viernes, a mediodía) incluye primero, segundo, postre, pan y bebida por unos 12–16 €. En muchos bares, con la bebida te ponen una <b>tapa gratis</b> (sobre todo en Granada, León o Jaén).',
 examples:[['Me gusta mucho el jamón.','I really like ham.'],['No me gustan las aceitunas.','I don’t like olives.'],['¿Te gusta el vino tinto?','Do you like red wine?'],['A mi hijo le encantan los churros con chocolate.','My son loves churros with chocolate.'],['Nos gusta comer en las terrazas.','We like eating on terraces.'],['No me gusta el café solo. – A mí tampoco.','I don’t like black coffee. – Me neither.'],['Me encanta cocinar. – A mí no.','I love cooking. – I don’t.'],['Hola, ¿me pones una caña y un agua con gas?','Hi, can I have a small beer and a sparkling water?'],['Para mí, de primero, gazpacho.','For me, gazpacho as a starter.'],['Quería una ración de calamares, por favor.','I’d like a portion of squid, please.'],['¿Qué hay de postre?','What is there for dessert?'],['La cuenta, por favor. – Ahora mismo.','The bill, please. – Right away.']],
 ex:['g|___ gusta el chocolate. (a mí)|Me','g|¿___ gustan los perros? (a ti)|Te','g|A Ana ___ encanta bailar.|le','g|___ gusta viajar. (a nosotros)|Nos','g|¿___ gusta la paella? (a vosotros)|Os','g|A mis padres ___ gusta el campo.|les','g|Me ___ las tapas. (gustar)|gustan','g|Me ___ el pescado. (gustar)|gusta','g|Nos ___ ir a la playa. (encantar)|encanta','m|I don’t like coffee. – Me neither.|A mí tampoco.~A mí también.~Yo tampoco gusto.','m|I like olives. – I don’t.|A mí no.~A mí tampoco.~Yo no.','m|Which is correct?|Me gusta el vino.~Yo gusto el vino.~Me gusto el vino.','m|In a bar in Spain, the most natural order:|¿Me pones un café con leche?~Yo quiero que me da un café.~Dame café ahora.','m|A small draught beer is…|una caña~un tinto~un cortado','o:gustar|My sister loves Seville.|A mi hermana le encanta Sevilla','o:gustar|We don’t like fish.|No nos gusta el pescado','t|Translate: I like tapas.|Me gustan las tapas','t|Translate: Do you like dancing? (tú)|¿Te gusta bailar?','t|Translate: The bill, please.|La cuenta, por favor']},

{id:'a1-11',level:'A1',title:'Querer, poder, hacer – verbos irregulares',cat:'stem',vocab:['a1-verbos-irreg','a1-ocio'],
 topics:['Cambio de raíz e→ie, o→ue, e→i, u→ue','Verbos con «yo» irregular: hago, pongo, salgo…','querer / poder + infinitivo','El tiempo libre'],
 source:'Libro Libre cap. 4 (Stem-changing verbs) · Greenfield Lessons 8 y 10 (Radical changing verbs, Irregular verbs)',
 goals:['decir lo que quiere y puede hacer','hablar del tiempo libre','conjugar los verbos irregulares más frecuentes'],
 grammar:`<h3>1. Stem-changing verbs – the “boot”</h3>
<p>The stressed vowel of the stem changes in all forms <b>except nosotros and vosotros</b>:</p>
<table><tr><th></th><th>e → ie<br>querer</th><th>o → ue<br>poder</th><th>e → i<br>pedir</th><th>u → ue<br>jugar</th></tr>
<tr><td>yo</td><td>qu<em>ie</em>ro</td><td>p<em>ue</em>do</td><td>p<em>i</em>do</td><td>j<em>ue</em>go</td></tr>
<tr><td>tú</td><td>qu<em>ie</em>res</td><td>p<em>ue</em>des</td><td>p<em>i</em>des</td><td>j<em>ue</em>gas</td></tr>
<tr><td>él / usted</td><td>qu<em>ie</em>re</td><td>p<em>ue</em>de</td><td>p<em>i</em>de</td><td>j<em>ue</em>ga</td></tr>
<tr><td>nosotros</td><td>queremos</td><td>podemos</td><td>pedimos</td><td>jugamos</td></tr>
<tr><td>vosotros</td><td>queréis</td><td>podéis</td><td>pedís</td><td>jugáis</td></tr>
<tr><td>ellos</td><td>qu<em>ie</em>ren</td><td>p<em>ue</em>den</td><td>p<em>i</em>den</td><td>j<em>ue</em>gan</td></tr></table>
<p>e → ie: <i>empezar, cerrar, pensar, preferir, entender, despertarse</i> · o → ue: <i>volver, dormir, costar, encontrar, acostarse</i> · e → i: <i>repetir, servir, seguir, vestirse</i>.</p>
<h3>2. Irregular “yo” forms</h3>
<p><b>hacer</b> → hago · <b>poner</b> → pongo · <b>salir</b> → salgo · <b>traer</b> → traigo · <b>conocer</b> → conozco · <b>saber</b> → sé · <b>dar</b> → doy · <b>ver</b> → veo · and both: <b>tener</b> → tengo, tienes · <b>venir</b> → vengo, vienes · <b>decir</b> → digo, dices.</p>
<h3>3. querer and poder + infinitive</h3>
<div class="rule"><i>Quiero aprender español. ¿Puedes venir mañana? No puedo, tengo que trabajar.</i><br>Polite requests: <i>¿Puede hablar más despacio, por favor? ¿Me puedes ayudar?</i></div>
<p><b>jugar a</b> + sport/game: <i>Juego al fútbol / al pádel.</i> <b>tocar</b> + instrument: <i>Toco la guitarra.</i> <b>hacer</b> + activity: <i>hacer deporte, hacer yoga, hacer senderismo</i>.</p>`,
 pitfalls:['<b>*Yo quero</b> → quiero.','<b>*Nosotros podemos</b> ✓ but <b>*nosotros puedemos</b> ✗ (no change in nosotros).','<b>*Yo hace</b> → hago; <b>*Yo cono</b> → conozco.','<b>*Juego fútbol</b> → Juego al fútbol (in Spain).'],
 spain:'El <b>pádel</b> es uno de los deportes más populares de España: hay pistas en casi todos los barrios. Y el senderismo, la playa, las terrazas y «salir de tapas» llenan los fines de semana.',
 examples:[['Quiero aprender a bailar flamenco.','I want to learn to dance flamenco.'],['¿Puedes venir el sábado? – No, no puedo.','Can you come on Saturday? – No, I can’t.'],['¿Puede hablar más despacio, por favor?','Could you speak more slowly, please?'],['Los sábados juego al pádel con unos amigos.','On Saturdays I play padel with some friends.'],['¿Qué haces en tu tiempo libre?','What do you do in your free time?'],['Hago yoga dos veces por semana.','I do yoga twice a week.'],['La película empieza a las diez.','The film starts at ten.'],['¿Cuánto cuesta la entrada?','How much does the ticket cost?'],['Prefiero el mar a la montaña.','I prefer the sea to the mountains.'],['No entiendo, ¿puedes repetir?','I don’t understand, can you repeat?'],['Duermo ocho horas.','I sleep eight hours.'],['Siempre pido lo mismo: un cortado.','I always order the same: a cortado.']],
 ex:['g|Yo ___ un café. (querer)|quiero','g|¿Tú ___ venir mañana? (poder)|puedes','g|Nosotros ___ ir a la playa. (querer)|queremos','g|¿Vosotros ___ ayudarme? (poder)|podéis','g|El museo ___ a las diez. (cerrar)|cierra','g|¿Cuánto ___ el billete? (costar)|cuesta','g|Mi hijo ___ al fútbol. (jugar)|juega','g|Yo siempre ___ paella. (pedir)|pido','g|Yo ___ los deberes por la tarde. (hacer)|hago','g|Yo ___ la mesa. (poner)|pongo','g|Yo no ___ la respuesta. (saber)|sé','g|Yo ___ a mucha gente aquí. (conocer)|conozco','g|¿Qué ___ (tú) los fines de semana? (hacer)|haces','m|Which form is WRONG?|puedemos~puedo~puedes~pueden','m|I play tennis.|Juego al tenis.~Toco el tenis.~Hago al tenis.','m|Could you repeat, please? (usted)|¿Puede repetir, por favor?~¿Puedes repites, por favor?~¿Pode repetir, por favor?','o:stem|I want to learn Spanish.|Quiero aprender español','t|Translate: I can’t, I have to work.|No puedo, tengo que trabajar','t|Translate: What do you do at weekends? (tú)|¿Qué haces los fines de semana?']},

{id:'a1-12',level:'A1',title:'De compras – números, precios y demostrativos',cat:'gender',vocab:['a1-ropa','a1-compras'],
 topics:['Este, ese, aquel','¿Cuánto cuesta / cuestan?','Números 100 – 1.000.000','La ropa y los colores','Pedir en una tienda'],
 source:'Libro Libre cap. 4 (Numbers from 100 to 1.000.000) y cap. 7 (Demonstratives) · Greenfield Lessons 20, 26 (Demonstrative adjectives, Numerals) · FSI Unit 9',
 goals:['preguntar precios y entenderlos','señalar cosas: este, ese, aquel','comprar ropa y comida'],
 grammar:`<h3>1. Demonstratives – this, that</h3>
<table><tr><th></th><th>masc. sg.</th><th>fem. sg.</th><th>masc. pl.</th><th>fem. pl.</th></tr>
<tr><td>this / these (here)</td><td>este</td><td>esta</td><td>estos</td><td>estas</td></tr>
<tr><td>that / those (there, near you)</td><td>ese</td><td>esa</td><td>esos</td><td>esas</td></tr>
<tr><td>that / those (over there)</td><td>aquel</td><td>aquella</td><td>aquellos</td><td>aquellas</td></tr></table>
<p><i>¿Cuánto cuesta esta camiseta? Me gustan esos zapatos. Aquella casa es muy antigua.</i> Without a noun they work as pronouns: <i>Quiero este, no ese.</i> For an idea or unknown thing: <b>esto, eso</b>: <i>¿Qué es esto? Eso es.</i></p>
<h3>2. Prices</h3>
<div class="rule"><b>¿Cuánto cuesta</b> el bolso? – Cuesta treinta euros. · <b>¿Cuánto cuestan</b> los zapatos? – Cuestan cincuenta euros.<br><b>¿Cuánto es?</b> (How much is it all?) – Son doce euros con cincuenta (12,50 €).</div>
<h3>3. Big numbers</h3>
<p>100 cien · 101 ciento uno · 200 doscientos/as · 300 trescientos · 400 cuatrocientos · 500 <b>quinientos</b> · 600 seiscientos · 700 <b>setecientos</b> · 800 ochocientos · 900 <b>novecientos</b> · 1000 mil · 2000 dos mil · 1.000.000 un millón.</p>
<p>Hundreds agree with the noun: <i>doscient<b>as</b> personas</i>. Spain writes <b>1.500</b> (point for thousands) and <b>2,50 €</b> (comma for decimals): <i>dos euros con cincuenta</i>.</p>
<h3>4. Clothes and colours</h3>
<p>Colours are adjectives and agree: <i>una camisa blanca, unos pantalones negros</i>. Colours in -e or consonant only change in plural: <i>verde/verdes, azul/azules, gris/grises</i>. <i>naranja, rosa</i> often don’t change.</p>
<div class="rule">In a shop: <i>¿Le puedo ayudar? – Solo estoy mirando, gracias.</i> · <i>¿Tiene esta camisa en la talla M?</i> · <i>¿Puedo probármelo?</i> · <i>¿Dónde están los probadores?</i> · <i>Me lo llevo.</i> (I’ll take it.)</div>`,
 pitfalls:['<b>*¿Cuánto cuesta los zapatos?</b> → ¿Cuánto cuestan…?','<b>*cinco cientos</b> → quinientos; <b>*nueve cientos</b> → novecientos.','<b>*esta zapatos</b> → estos zapatos.','<b>*una camisa blanco</b> → una camisa blanca.'],
 spain:'Las <b>rebajas</b> empiezan el 7 de enero y el 1 de julio. En los mercados se pide el turno con «¿Quién es el último?». Se puede pagar con tarjeta casi en todas partes, también pequeñas cantidades, y con el móvil.',
 examples:[['¿Cuánto cuesta esta camiseta? – Doce euros.','How much is this T-shirt? – Twelve euros.'],['¿Cuánto cuestan esos zapatos?','How much are those shoes?'],['Me gusta aquella chaqueta azul.','I like that blue jacket over there.'],['¿Qué es esto? – Es un abanico.','What’s this? – It’s a fan.'],['¿Tiene esta camisa en la talla M?','Do you have this shirt in size M?'],['¿Puedo probármela?','Can I try it on?'],['Me la llevo.','I’ll take it.'],['Son veinticinco euros con cincuenta.','That’s twenty-five euros fifty.'],['El piso cuesta doscientos cincuenta mil euros.','The flat costs two hundred and fifty thousand euros.'],['Quinientos gramos de queso manchego, por favor.','Five hundred grams of Manchego cheese, please.'],['Solo estoy mirando, gracias.','I’m just looking, thanks.'],['¿Puedo pagar con tarjeta?','Can I pay by card?']],
 ex:['g|___ camiseta (this)|esta','g|___ zapatos (these)|estos','g|___ chaqueta (that, near you)|esa','g|___ coches (those, near you)|esos','g|___ casa (that, over there)|aquella','m|¿Cuánto ___ los pantalones?|cuestan~cuesta~cuesto','m|¿Cuánto ___ el bolso?|cuesta~cuestan~cuestas','m|500|quinientos~cincocientos~cinco cientos','m|700|setecientos~sietecientos~setenta cientos','m|900|novecientos~nuevecientos~noventa cientos','g|200 personas = ___ personas|doscientas','g:agree|una camisa ___ (blanco)|blanca','g:agree|unos pantalones ___ (negro)|negros','g:agree|dos coches ___ (azul)|azules','m|¿Qué es ___? (unknown thing in your hand)|esto~este~esta','o:wordorder|How much do these shoes cost?|¿Cuánto cuestan estos zapatos?','t|Translate: I’ll take it. (el jersey)|Me lo llevo','t|Translate: Can I pay by card?|¿Puedo pagar con tarjeta?/¿Se puede pagar con tarjeta?','t|Write as words: 1.500 €|mil quinientos euros']}
]);
