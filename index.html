{id:'b1-01',level:'B1',title:'Mañana será otro día – el futuro',cat:'fut',vocab:['b1-futuro-planes'],
 topics:['Futuro simple: forma regular e irregular','ir a + infinitivo vs. futuro','Futuro de probabilidad: estará en casa','Hacer predicciones y promesas'],
 source:'Greenfield Lesson 21 (Future tense) · Libro Libre cap. 10 (The future)',
 goals:['hacer predicciones y promesas','hablar de planes y proyectos','expresar suposiciones sobre el presente'],
 grammar:`<h3>1. Forma</h3>
<p>Infinitivo completo + <b>-é, -ás, -á, -emos, -éis, -án</b> (las mismas terminaciones para -ar, -er, -ir):</p>
<table><tr><th></th><th>hablar</th><th>tener</th><th>hacer</th></tr>
<tr><td>yo</td><td>hablar<em>é</em></td><td>tendr<em>é</em></td><td>har<em>é</em></td></tr>
<tr><td>tú</td><td>hablar<em>ás</em></td><td>tendr<em>ás</em></td><td>har<em>ás</em></td></tr>
<tr><td>él / usted</td><td>hablar<em>á</em></td><td>tendr<em>á</em></td><td>har<em>á</em></td></tr>
<tr><td>nosotros</td><td>hablar<em>emos</em></td><td>tendr<em>emos</em></td><td>har<em>emos</em></td></tr>
<tr><td>vosotros</td><td>hablar<em>éis</em></td><td>tendr<em>éis</em></td><td>har<em>éis</em></td></tr>
<tr><td>ellos</td><td>hablar<em>án</em></td><td>tendr<em>án</em></td><td>har<em>án</em></td></tr></table>
<p>Raíces irregulares: <b>tendr-</b> (tener), <b>pondr-</b> (poner), <b>saldr-</b> (salir), <b>vendr-</b> (venir), <b>podr-</b> (poder), <b>sabr-</b> (saber), <b>habr-</b> (haber), <b>querr-</b> (querer), <b>har-</b> (hacer), <b>dir-</b> (decir).</p>
<h3>2. ¿Futuro o «ir a»?</h3>
<div class="rule"><b>ir a + infinitivo</b>: planes e intenciones, lo que ya está decidido: <i>Este verano <b>voy a hacer</b> el Camino de Santiago.</i><br><b>futuro</b>: predicciones, promesas, el futuro más lejano o menos seguro: <i>Mañana <b>lloverá</b> en el norte. Te <b>llamaré</b>, te lo prometo. Algún día <b>viviré</b> junto al mar.</i></div>
<p>En la conversación, el presente también expresa futuro cercano: <i>Mañana te llamo.</i></p>
<h3>3. Futuro de probabilidad</h3>
<p>El futuro expresa una <b>suposición sobre el presente</b>: <i>¿Dónde está Luis? – No sé, <b>estará</b> en el trabajo.</i> (= probablemente está) · <i>¿Qué hora es? – <b>Serán</b> las nueve.</i> · <i>Tendrá unos cuarenta años.</i></p>
<p>Expresiones útiles: <i>dentro de dos años</i> (in two years’ time), <i>el año que viene / el próximo año</i>, <i>pasado mañana</i>, <i>algún día</i>, <i>cuanto antes</i>.</p>`,
 pitfalls:['<b>*teneré</b> → tendré; <b>*haceré</b> → haré; <b>*saleré</b> → saldré.','<b>*Voy a llamaré</b> → Voy a llamar / Llamaré.','<b>*hablaré</b> sin tilde: <i>hablare</i> no existe en el uso actual.','<b>*En dos años</b> para «in two years’ time» → <b>Dentro de</b> dos años.'],
 spain:'Si alguien dice «ya te llamaré» o «ya veremos», no siempre es una promesa firme: a menudo significa «quizás». El tono y el contexto lo dicen todo.',
 examples:[['Mañana hará sol en todo el país.','Tomorrow it will be sunny throughout the country.'],['Te llamaré cuando llegue.','I’ll call you when I arrive.'],['El año que viene viviremos en Valencia.','Next year we’ll live in Valencia.'],['¿Vendrás a la boda? – Claro, no me la perderé.','Will you come to the wedding? – Of course, I won’t miss it.'],['Este verano voy a hacer el Camino de Santiago.','This summer I’m going to do the Camino de Santiago.'],['Dentro de cinco años hablaré español perfectamente.','In five years’ time I’ll speak Spanish perfectly.'],['¿Dónde está Ana? – Estará en el gimnasio.','Where’s Ana? – She’s probably at the gym.'],['¿Qué hora es? – Serán las ocho.','What time is it? – It must be about eight.'],['No sé cuántos años tiene; tendrá unos cuarenta.','I don’t know how old he is; he must be about forty.'],['Te prometo que no lo diré a nadie.','I promise I won’t tell anyone.'],['Habrá mucha gente en el concierto.','There will be lots of people at the concert.'],['Ya veremos.','We’ll see.']],
 ex:['g|Mañana yo ___ temprano. (salir)|saldré','g|¿___ (tú) tiempo el sábado? (tener)|Tendrás','g|Ella ___ a las diez. (venir)|vendrá','g|Nosotros ___ la cena. (hacer)|haremos','g|¿Qué ___ (vosotros) en vacaciones? (hacer)|haréis','g|Ellos no ___ venir. (poder)|podrán','g|Te lo ___ mañana. (decir, yo)|diré','g|___ mucha gente. (haber)|Habrá','g|No sé dónde está; ___ en casa. (estar, probabilidad)|estará','g|¿Qué hora es? – ___ las tres. (ser, probabilidad)|Serán','m|Promesa: «I’ll call you tomorrow.»|Te llamaré mañana.~Te llamo ayer.~Te voy a llamado mañana.','m|«dentro de dos años» significa…|in two years’ time~two years ago~for two years','m|Suposición: «He must be about thirty.»|Tendrá unos treinta años.~Tiene que treinta años.~Tendría unos treinta años ayer.','m|Forma incorrecta:|teneré~tendré~tendrás','o:fut|Next year we will live in Madrid.|El año que viene viviremos en Madrid','t|Traduzca: I will do it tomorrow.|Lo haré mañana/Mañana lo haré','t|Traduzca: Will you come with us? (tú)|¿Vendrás con nosotros?/¿Vas a venir con nosotros?']},

{id:'b1-02',level:'B1',title:'Yo que tú… – el condicional',cat:'cond',vocab:['b1-consejos'],
 topics:['Condicional simple: forma','Cortesía: ¿podría…?, me gustaría','Consejos: yo que tú, deberías','Hipótesis sobre el pasado: serían las diez'],
 source:'Greenfield Lesson 21 (Present conditional) · Libro Libre cap. 10 (The conditional)',
 goals:['pedir cosas de forma muy educada','dar consejos','expresar deseos e hipótesis'],
 grammar:`<h3>1. Forma</h3>
<p>Misma raíz que el futuro + <b>-ía, -ías, -ía, -íamos, -íais, -ían</b>:</p>
<table><tr><th></th><th>gustar</th><th>poder</th><th>hacer</th></tr>
<tr><td>yo</td><td>gustar<em>ía</em></td><td>podr<em>ía</em></td><td>har<em>ía</em></td></tr>
<tr><td>tú</td><td>gustar<em>ías</em></td><td>podr<em>ías</em></td><td>har<em>ías</em></td></tr>
<tr><td>él / usted</td><td>gustar<em>ía</em></td><td>podr<em>ía</em></td><td>har<em>ía</em></td></tr>
<tr><td>nosotros</td><td>gustar<em>íamos</em></td><td>podr<em>íamos</em></td><td>har<em>íamos</em></td></tr>
<tr><td>vosotros</td><td>gustar<em>íais</em></td><td>podr<em>íais</em></td><td>har<em>íais</em></td></tr>
<tr><td>ellos</td><td>gustar<em>ían</em></td><td>podr<em>ían</em></td><td>har<em>ían</em></td></tr></table>
<p>Irregulares (como en el futuro): tendría, pondría, saldría, vendría, podría, sabría, habría, querría, haría, diría.</p>
<h3>2. Usos</h3>
<div class="rule"><b>Cortesía</b>: <i>¿<b>Podría</b> ayudarme? <b>Me gustaría</b> reservar una mesa. ¿Te <b>importaría</b> cerrar la ventana?</i><br><b>Consejos</b>: <i><b>Deberías</b> descansar más. <b>Yo que tú</b>, hablaría con el casero. <b>Yo en tu lugar</b>, no lo compraría.</i><br><b>Deseos</b>: <i>Me <b>encantaría</b> vivir en Cádiz. <b>Preferiría</b> quedarme en casa.</i><br><b>Hipótesis</b>: <i>Con más dinero, <b>viajaría</b> más.</i> (con <i>si</i> + imperfecto de subjuntivo → B2)</div>
<p>Probabilidad en el pasado: <i>¿A qué hora llegó? – <b>Serían</b> las once.</i> (= probablemente eran las once).</p>`,
 pitfalls:['<b>*Podería</b> → podría; <b>*tenería</b> → tendría.','<b>*Me gustaría que vienes</b> → Me gustaría que vinieras (B2).','<b>*Yo que tú, iré al médico</b> → Yo que tú, iría al médico.','<b>*¿Puedes me ayudar?</b> → ¿Podrías ayudarme?'],
 spain:'«¿Me podrías…?» y «¿Te importaría…?» suavizan cualquier petición. En una tienda o al teléfono con la administración, «Querría / Quería saber si…» es la fórmula estándar.',
 examples:[['¿Podría hablar más despacio, por favor?','Could you speak more slowly, please?'],['Me gustaría reservar una mesa para cuatro.','I’d like to book a table for four.'],['¿Te importaría abrir la ventana?','Would you mind opening the window?'],['Deberías ir al médico.','You should go to the doctor.'],['Yo que tú, hablaría con el casero.','If I were you, I’d talk to the landlord.'],['Yo en tu lugar, no lo haría.','In your place, I wouldn’t do it.'],['Me encantaría vivir cerca del mar.','I’d love to live near the sea.'],['Preferiría ir mañana, si no te importa.','I’d rather go tomorrow, if you don’t mind.'],['Con más tiempo, aprendería a tocar la guitarra.','With more time, I’d learn to play the guitar.'],['¿A qué hora volvió? – Serían las dos.','What time did he get back? – It must have been about two.'],['¿Qué harías tú?','What would you do?'],['Sería genial verte pronto.','It would be great to see you soon.']],
 ex:['g|¿___ (usted) ayudarme? (poder)|Podría','g|Me ___ un café con leche. (gustar)|gustaría','g|Tú ___ descansar más. (deber)|deberías','g|Yo que tú, ___ con ella. (hablar)|hablaría','g|Yo en tu lugar, no lo ___. (hacer)|haría','g|¿Qué ___ (tú) en mi situación? (hacer)|harías','g|Nosotros ___ ir en tren. (preferir)|preferiríamos','g|Con más dinero, ellos ___ una casa. (comprar)|comprarían','g|¿Te ___ cerrar la puerta? (importar)|importaría','g|Llegó tarde; ___ las once. (ser, probabilidad)|serían','m|Muy educado: «Can you help me?» (usted)|¿Podría ayudarme?~¿Puede me ayudar?~¿Podría me ayudar?','m|Consejo: «If I were you, I’d take the train.»|Yo que tú, cogería el tren.~Yo que tú, cogeré el tren.~Si yo eres tú, cojo el tren.','m|Forma correcta:|tendría~tenería~teniría','m|Forma correcta:|diría~deciría~dicería','o:cond|I would love to visit Granada.|Me encantaría visitar Granada','t|Traduzca: I’d like a glass of water, please.|Me gustaría un vaso de agua, por favor/Quería un vaso de agua, por favor/Querría un vaso de agua, por favor','t|Traduzca: You should sleep more. (tú)|Deberías dormir más']},

{id:'b1-03',level:'B1',title:'Quiero que vengas – el presente de subjuntivo',cat:'subj',vocab:['b1-relaciones'],
 topics:['Formación del presente de subjuntivo','Irregulares: sea, esté, vaya, haya, sepa, dé','Deseos y peticiones: quiero que, espero que, ojalá','Mismo sujeto (infinitivo) vs. sujeto distinto (que + subjuntivo)'],
 source:'Greenfield Lessons 17–18 (Present subjunctive, Irregular present subjunctives) · Libro Libre cap. 10 (Introduction to the subjunctive)',
 goals:['formar el presente de subjuntivo','expresar deseos para otras personas','usar ojalá y las fórmulas de buenos deseos'],
 grammar:`<h3>1. Formación</h3>
<p>Forma «yo» del presente → quitar <b>-o</b> → terminación «contraria»:</p>
<table><tr><th></th><th>hablar → hablo</th><th>comer → como</th><th>tener → tengo</th></tr>
<tr><td>yo</td><td>habl<em>e</em></td><td>com<em>a</em></td><td>teng<em>a</em></td></tr>
<tr><td>tú</td><td>habl<em>es</em></td><td>com<em>as</em></td><td>teng<em>as</em></td></tr>
<tr><td>él / usted</td><td>habl<em>e</em></td><td>com<em>a</em></td><td>teng<em>a</em></td></tr>
<tr><td>nosotros</td><td>habl<em>emos</em></td><td>com<em>amos</em></td><td>teng<em>amos</em></td></tr>
<tr><td>vosotros</td><td>habl<em>éis</em></td><td>com<em>áis</em></td><td>teng<em>áis</em></td></tr>
<tr><td>ellos</td><td>habl<em>en</em></td><td>com<em>an</em></td><td>teng<em>an</em></td></tr></table>
<p>Así: <i>hacer → haga, decir → diga, poner → ponga, salir → salga, venir → venga, conocer → conozca, ver → vea</i>. Cambios de raíz como en el presente: <i>quiera, pueda, pida, duerma (durmamos)</i>. Ortografía: <i>llegue, busque, empiece</i>.</p>
<div class="rule">Irregulares: <b>ser</b> → sea · <b>estar</b> → esté · <b>ir</b> → vaya · <b>haber</b> → haya · <b>saber</b> → sepa · <b>dar</b> → dé</div>
<h3>2. Deseos y peticiones</h3>
<div class="rule"><b>Mismo sujeto</b> → infinitivo: <i>Quiero <b>ir</b> a la fiesta.</i> (yo quiero, yo voy)<br><b>Sujeto distinto</b> → <b>que + subjuntivo</b>: <i>Quiero que <b>vengas</b> a la fiesta.</i> (yo quiero, tú vienes)</div>
<p>Verbos: <i>querer que, esperar que, preferir que, necesitar que, pedir que, desear que</i>. <b>Ojalá</b> (+ que) + subjuntivo: <i>¡Ojalá haga buen tiempo mañana!</i></p>
<h3>3. Buenos deseos (muy frecuentes)</h3>
<p><i>¡Que te vaya bien! ¡Que lo pases bien! ¡Que aproveche! ¡Que te mejores! ¡Que descanses! ¡Que tengas suerte! ¡Que cumplas muchos más!</i></p>`,
 pitfalls:['<b>*Quiero que vienes</b> → Quiero que vengas.','<b>*Quiero que yo vaya</b> → Quiero ir.','<b>*Ojalá hace sol</b> → Ojalá haga sol.','<b>*Espero que estás bien</b> → Espero que estés bien.'],
 spain:'Al empezar a comer, alguien siempre dice «<b>¡Que aproveche!</b>» (o «¡Buen provecho!»). Al despedirse de alguien enfermo: «<b>¡Que te mejores!</b>». Y al irse de vacaciones: «<b>¡Que lo pases muy bien!</b>».',
 examples:[['Quiero que vengas a mi cumpleaños.','I want you to come to my birthday.'],['Espero que estés bien.','I hope you’re well.'],['Mi madre quiere que la llame más.','My mother wants me to call her more.'],['Te pido que no se lo digas a nadie.','I’m asking you not to tell anyone.'],['Prefiero que nos veamos el viernes.','I’d rather we met on Friday.'],['Necesito que me ayudes con la mudanza.','I need you to help me with the move.'],['¡Ojalá haga buen tiempo el fin de semana!','I hope the weather is good at the weekend!'],['Ojalá que tengas suerte en la entrevista.','I hope you’re lucky in the interview.'],['¡Que te mejores!','Get well soon!'],['¡Que aproveche!','Enjoy your meal!'],['¡Que lo pases muy bien en Ibiza!','Have a great time in Ibiza!'],['Quiero aprender a cocinar; y quiero que me enseñes tú.','I want to learn to cook – and I want you to teach me.']],
 ex:['g|Quiero que tú ___ conmigo. (venir)|vengas','g|Espero que ___ (vosotros) bien. (estar)|estéis','g|Mis padres quieren que yo ___ Medicina. (estudiar)|estudie','g|Necesito que me ___ (tú) un favor. (hacer)|hagas','g|¡Ojalá ___ sol mañana! (hacer)|haga','g|Te pido que no ___ tarde. (llegar)|llegues','g|Prefiero que ___ (nosotros) en casa. (cenar)|cenemos','g|Espero que ___ un buen viaje. (tener, tú)|tengas','g|Quiero que ___ (ellos) a la fiesta. (ir)|vayan','g|Ojalá ___ (él) la verdad. (saber)|sepa','g|Espero que no ___ problemas. (haber)|haya','m|I want to go. / I want you to go.|Quiero ir. / Quiero que vayas.~Quiero que voy. / Quiero ir tú.~Quiero vaya. / Quiero que vas.','m|Get well soon!|¡Que te mejores!~¡Que te mejoras!~¡Te mejorarás!','m|Enjoy your meal!|¡Que aproveche!~¡Que aprovecha!~¡Aprovecha la comida!','o:subj|I hope you have a good time.|Espero que lo pases bien','t|Traduzca: I want you to call me. (tú)|Quiero que me llames','t|Traduzca: I hope it doesn’t rain.|Espero que no llueva/Ojalá no llueva/Ojalá que no llueva']},

{id:'b1-04',level:'B1',title:'Me alegra que estés aquí – emociones y valoraciones',cat:'subj',vocab:['b1-emociones'],
 topics:['Emociones + que + subjuntivo: me alegra que, me molesta que','Valoraciones: es importante / necesario / normal que','es verdad / está claro que + indicativo','Recomendaciones: te recomiendo / aconsejo que'],
 source:'Greenfield Lesson 17 (Present subjunctive – uses) · Libro Libre cap. 10',
 goals:['expresar sentimientos sobre lo que hacen otros','valorar situaciones','dar recomendaciones'],
 grammar:`<h3>1. Emociones</h3>
<p>Verbos tipo <i>gustar</i> + <b>que + subjuntivo</b> cuando hay otro sujeto:</p>
<div class="rule"><i>Me alegra que <b>estés</b> aquí. Me molesta que la gente <b>hable</b> tan alto. Me encanta que me <b>llames</b>. Me da pena que te <b>vayas</b>. Me preocupa que no <b>duerma</b> bien.</i><br>También: <i>Estoy contento de que… Siento que… Tengo miedo de que…</i></div>
<p>Mismo sujeto → infinitivo: <i>Me alegra <b>verte</b>. Siento <b>llegar</b> tarde.</i></p>
<h3>2. Valoraciones impersonales</h3>
<p><b>Es + adjetivo + que + subjuntivo</b>: <i>Es importante que <b>llegues</b> puntual. Es normal que <b>estés</b> nervioso. Es mejor que lo <b>hablemos</b>. Es una pena que no <b>puedas</b> venir. Es necesario que <b>traigan</b> el pasaporte.</i></p>
<p>Sin sujeto concreto → infinitivo: <i>Es importante <b>dormir</b> bien.</i></p>
<div class="rule">¡Atención! Las expresiones de <b>certeza</b> llevan <b>indicativo</b>: <i>Es verdad que <b>es</b> caro. Está claro que <b>tienes</b> razón. Es evidente que <b>llueve</b>.</i></div>
<h3>3. Recomendar y aconsejar</h3>
<p><i>Te recomiendo que <b>pruebes</b> el pulpo. Le aconsejo que <b>pida</b> cita previa. Os sugiero que <b>vengáis</b> pronto.</i></p>`,
 pitfalls:['<b>*Me alegra que estás aquí</b> → Me alegra que estés aquí.','<b>*Es verdad que sea caro</b> → Es verdad que es caro.','<b>*Es importante que dormir</b> → Es importante dormir / que duermas.','<b>*Siento que llego tarde</b> → Siento llegar tarde.'],
 spain:'«¡Qué pena que no puedas venir!» y «¡Qué bien que hayas venido!» son reacciones típicas. Con «qué» delante, la frase se vuelve aún más expresiva – y sigue el subjuntivo.',
 examples:[['Me alegra mucho que estés aquí.','I’m really glad you’re here.'],['Me molesta que los vecinos hagan ruido por la noche.','It bothers me that the neighbours make noise at night.'],['Me encanta que me escribas.','I love it when you write to me.'],['¡Qué pena que no puedas venir!','What a shame you can’t come!'],['Es importante que llegues a tiempo.','It’s important that you arrive on time.'],['Es normal que estés nerviosa.','It’s normal for you to be nervous.'],['Es mejor que lo hablemos con calma.','It’s better if we talk about it calmly.'],['Es verdad que el alquiler es muy caro.','It’s true that the rent is very expensive.'],['Te recomiendo que pruebes el salmorejo.','I recommend you try the salmorejo.'],['Le aconsejo que pida cita previa.','I advise you to make an appointment.'],['Siento llegar tarde.','Sorry I’m late.'],['Me preocupa que mi padre trabaje tanto.','It worries me that my father works so much.']],
 ex:['g|Me alegra que ___ (tú) bien. (estar)|estés','g|Me molesta que la gente ___ basura. (tirar)|tire','g|Es importante que ___ (vosotros) puntuales. (ser)|seáis','g|Es normal que ___ (tú) cansado. (estar)|estés','g|Es una pena que no ___ (ellos) venir. (poder)|puedan','g|Te recomiendo que ___ (tú) el museo. (visitar)|visites','g|Le aconsejo que ___ (usted) el formulario. (rellenar)|rellene','g|Es verdad que el piso ___ pequeño. (ser)|es','g|Está claro que ___ (tú) razón. (tener)|tienes','g|Siento ___ tarde. (llegar, yo)|llegar','m|It’s important to sleep well. (general)|Es importante dormir bien.~Es importante que dormir bien.~Es importante que duerme bien.','m|I’m glad you came. (tú, emotion now about future/present)|Me alegra que vengas.~Me alegra que vienes.~Me alegra venir tú.','m|It’s clear that he is right.|Está claro que tiene razón.~Está claro que tenga razón.','o:subj|It bothers me that you arrive late.|Me molesta que llegues tarde','t|Traduzca: What a shame you can’t come! (tú)|¡Qué pena que no puedas venir!','t|Traduzca: It’s better that we take a taxi.|Es mejor que cojamos un taxi/Es mejor que tomemos un taxi']},

{id:'b1-05',level:'B1',title:'Creo que sí, no creo que… – opinión y duda',cat:'subj',vocab:['b1-opinion'],
 topics:['creo / pienso / me parece que + indicativo','no creo / no pienso que + subjuntivo','Duda: dudo que, quizás, tal vez, a lo mejor','Opinar, acordar y discrepar'],
 source:'Greenfield Lessons 17 y 30 (Subjunctive, Survey of moods) · MFLE Reference Grammar (Subjunctive)',
 goals:['dar y pedir opiniones','expresar acuerdo, desacuerdo y duda','usar bien indicativo o subjuntivo con verbos de opinión'],
 grammar:`<h3>1. Opinión afirmativa → indicativo</h3>
<div class="rule"><i><b>Creo que</b> el metro <b>es</b> la mejor opción. <b>Pienso que</b> <b>tienes</b> razón. <b>Me parece que</b> <b>va</b> a llover. <b>Estoy seguro de que</b> <b>vendrá</b>.</i></div>
<h3>2. Opinión negativa → subjuntivo</h3>
<div class="rule"><i><b>No creo que</b> <b>sea</b> buena idea. <b>No pienso que</b> <b>tengas</b> razón. <b>No me parece que</b> <b>esté</b> bien. <b>No estoy seguro de que</b> <b>venga</b>.</i></div>
<p>Pero en preguntas negativas se suele usar indicativo: <i>¿No crees que es tarde?</i></p>
<h3>3. Duda y posibilidad</h3>
<p><b>Dudo que</b> + subjuntivo: <i>Dudo que lleguemos a tiempo.</i> · <b>Es posible / probable que</b> + subjuntivo: <i>Es posible que llueva.</i> · <b>Quizás / tal vez</b> + subjuntivo (o indicativo si es más seguro): <i>Quizás vaya mañana.</i> · <b>A lo mejor</b> + <b>indicativo</b> (siempre): <i>A lo mejor voy mañana.</i></p>
<h3>4. Opinar en una conversación</h3>
<p><i>En mi opinión… · Para mí… · Desde mi punto de vista… · ¿Tú qué opinas? · ¿Qué te parece?</i> · Acuerdo: <i>Estoy de acuerdo contigo. Tienes razón. Eso es. Claro.</i> · Desacuerdo: <i>No estoy de acuerdo. Yo no lo veo así. Depende. Sí, pero…</i></p>`,
 pitfalls:['<b>*Creo que sea verdad</b> → Creo que es verdad.','<b>*No creo que es verdad</b> → No creo que sea verdad.','<b>*A lo mejor llueva</b> → A lo mejor llueve.','<b>*Estoy de acuerdo con ti</b> → contigo.'],
 spain:'En una conversación española es normal interrumpir y opinar con pasión – «¡Qué va!», «Hombre, depende…», «Ya, pero…». No es agresivo: es participar.',
 examples:[['Creo que el metro es la mejor opción.','I think the metro is the best option.'],['No creo que sea buena idea.','I don’t think it’s a good idea.'],['Me parece que va a llover.','It looks like it’s going to rain.'],['Dudo que lleguemos a tiempo.','I doubt we’ll get there on time.'],['Es posible que me cambie de trabajo.','I might change jobs.'],['Quizás vayamos a la playa el domingo.','Maybe we’ll go to the beach on Sunday.'],['A lo mejor me quedo en casa.','Maybe I’ll stay at home.'],['¿Tú qué opinas? – Pues yo no lo veo así.','What do you think? – Well, I don’t see it that way.'],['Estoy totalmente de acuerdo contigo.','I completely agree with you.'],['Hombre, depende de la situación.','Well, it depends on the situation.'],['No estoy seguro de que tengan razón.','I’m not sure they’re right.'],['¿No crees que es demasiado caro?','Don’t you think it’s too expensive?']],
 ex:['g|Creo que el museo ___ los lunes. (cerrar)|cierra','g|No creo que el museo ___ hoy. (abrir)|abra','g|Pienso que ___ (tú) razón. (tener)|tienes','g|No pienso que ___ (tú) razón. (tener)|tengas','g|Dudo que ___ (ellos) venir. (poder)|puedan','g|Es posible que ___ mañana. (llover)|llueva','g|A lo mejor ___ (yo) al cine. (ir)|voy','g|Me parece que ___ demasiado tarde. (ser)|es','g|No me parece que ___ justo. (ser)|sea','g|Estoy seguro de que ___ (él). (venir, futuro)|vendrá','m|I don’t think it’s true.|No creo que sea verdad.~No creo que es verdad.~No pienso es verdad.','m|Maybe I’ll go. (a lo mejor)|A lo mejor voy.~A lo mejor vaya.~A lo mejor iré a.','m|I agree with you.|Estoy de acuerdo contigo.~Estoy de acuerdo con ti.~Soy de acuerdo contigo.','m|Correct sentence:|Creo que tienes razón.~Creo que tengas razón.~No creo que tienes razón.','o:subj|I doubt that he knows the answer.|Dudo que sepa la respuesta','t|Traduzca: I think it’s a good idea.|Creo que es una buena idea/Pienso que es una buena idea','t|Traduzca: I don’t think they will come.|No creo que vengan']},

{id:'b1-06',level:'B1',title:'Cuando llegues, llámame – tiempo y finalidad',cat:'subj',vocab:['b1-tramites'],
 topics:['cuando + subjuntivo (futuro) / + indicativo (hábito, pasado)','en cuanto, hasta que, antes de que, después de que','para + infinitivo / para que + subjuntivo','sin + infinitivo / sin que'],
 source:'Greenfield Lessons 17–18 y 30 (Subjunctive in adverbial clauses)',
 goals:['hablar de acciones futuras encadenadas','expresar finalidad','organizar trámites y citas'],
 grammar:`<h3>1. cuando: ¿indicativo o subjuntivo?</h3>
<table><tr><th>indicativo</th><th>subjuntivo</th></tr>
<tr><td>hábito o hecho general (presente): <i>Cuando <b>llego</b> a casa, ceno.</i></td><td rowspan="2"><b>futuro</b> (todavía no ha pasado): <i>Cuando <b>llegues</b> a casa, llámame. Cuando <b>tenga</b> tiempo, te ayudaré.</i></td></tr>
<tr><td>pasado: <i>Cuando <b>llegué</b>, ya estaban allí.</i></td></tr></table>
<div class="rule">Igual con <b>en cuanto</b> (as soon as), <b>hasta que</b> (until), <b>mientras</b> (while), <b>después de que</b>: <i>En cuanto <b>sepa</b> algo, te aviso. Espera aquí hasta que <b>vuelva</b>.</i><br><b>antes de que</b> siempre lleva subjuntivo: <i>Vámonos antes de que <b>llueva</b>.</i></div>
<p>¡Nunca futuro después de <i>cuando</i>! <s>Cuando llegarás</s> → <i>Cuando llegues</i>. Pero en la pregunta sí: <i>¿Cuándo llegarás?</i></p>
<h3>2. Finalidad: para / para que</h3>
<div class="rule">Mismo sujeto → <b>para + infinitivo</b>: <i>Ahorro <b>para comprar</b> un piso.</i><br>Sujeto distinto → <b>para que + subjuntivo</b>: <i>Te lo explico <b>para que lo entiendas</b>.</i></div>
<p><b>sin + infinitivo</b> / <b>sin que + subjuntivo</b>: <i>Se fue sin despedirse. Se fue sin que nadie lo viera.</i> (B2)</p>
<h3>3. Trámites: vocabulario de la administración</h3>
<p><i>pedir cita previa · rellenar un formulario · el justificante · el certificado de empadronamiento · la ventanilla · el plazo · presentar una solicitud · adjuntar un documento</i>.</p>`,
 pitfalls:['<b>*Cuando llegarás, llámame</b> → Cuando llegues, llámame.','<b>*Te llamo cuando tengo tiempo</b> (future) → cuando tenga tiempo.','<b>*para que lo entender</b> → para que lo entiendas.','<b>*Ahorro para que compre un piso</b> (same subject) → para comprar.'],
 spain:'En la administración española todo funciona con <b>cita previa</b> y con un <b>justificante</b>. Un consejo: «Cuando vayas, lleva fotocopias de todo».',
 examples:[['Cuando llegues a casa, mándame un mensaje.','When you get home, send me a message.'],['Cuando tenga tiempo, te ayudaré con la mudanza.','When I have time, I’ll help you with the move.'],['Cuando era pequeño, vivía en un pueblo.','When I was little, I lived in a village.'],['En cuanto sepa algo, te aviso.','As soon as I know anything, I’ll let you know.'],['Espera aquí hasta que vuelva.','Wait here until I come back.'],['Vámonos antes de que empiece a llover.','Let’s go before it starts raining.'],['Ahorro para comprarme un piso.','I’m saving to buy myself a flat.'],['Te lo explico para que lo entiendas.','I’m explaining it so that you understand it.'],['Le doy mi número para que me llame.','I’ll give you my number so you can call me.'],['Cuando vayas al ayuntamiento, lleva el contrato.','When you go to the town hall, take the contract.'],['Hay que pedir cita previa antes de ir.','You have to make an appointment before going.'],['Se fue sin pagar.','He left without paying.']],
 ex:['g|Cuando ___ (tú) a Madrid, llámame. (llegar)|llegues','g|Cuando ___ (yo) a casa, siempre me ducho. (llegar)|llego','g|Cuando ___ (yo) joven, jugaba al tenis. (ser)|era','g|En cuanto ___ (yo) la respuesta, te escribo. (saber)|sepa','g|Espera hasta que ___ (ellos). (volver)|vuelvan','g|Vámonos antes de que ___ tarde. (ser)|sea','g|Estudio para ___ un buen trabajo. (encontrar)|encontrar','g|Te lo digo para que lo ___ (tú). (saber)|sepas','g|Hablo despacio para que me ___ (vosotros). (entender)|entendáis','g|Cuando ___ (nosotros) dinero, viajaremos. (tener)|tengamos','m|When you finish, tell me.|Cuando termines, dímelo.~Cuando terminarás, dímelo.~Cuando terminas, dímelo mañana.','m|I’m saving to buy a car.|Ahorro para comprar un coche.~Ahorro para que compre un coche.~Ahorro por comprar un coche.','m|As soon as I can…|En cuanto pueda…~En cuanto puedo mañana…~En cuanto podré…','o:subj|Call me when you arrive.|Llámame cuando llegues','t|Traduzca: When I have time, I will call you.|Cuando tenga tiempo, te llamaré/Cuando tenga tiempo te llamo/Cuando tenga tiempo, te llamo','t|Traduzca: I’ll explain it so that you understand. (tú)|Te lo explico para que lo entiendas/Te lo explico para que entiendas']}
]);

{id:'b1-07',level:'B1',title:'El piso que busco – oraciones de relativo',cat:'rel',vocab:['b1-vivienda'],
 topics:['que, quien, donde, lo que','el que / la que / los que después de preposición','Relativo + indicativo (conocido) o subjuntivo (desconocido)','Describir lo que se busca'],
 source:'Greenfield Lesson 16 (Relative pronouns) · MFLE Reference Grammar (Relative pronouns)',
 goals:['unir frases con relativos','describir algo que se busca o se necesita','definir cosas y personas'],
 grammar:`<h3>1. Los relativos básicos</h3>
<p><b>que</b> – el más frecuente, para personas y cosas: <i>El piso <b>que</b> vimos ayer. La chica <b>que</b> trabaja conmigo.</i></p>
<p><b>donde</b> = lugar: <i>El barrio <b>donde</b> vivo es tranquilo.</i> · <b>lo que</b> = la cosa que / what: <i>No entiendo <b>lo que</b> dices. <b>Lo que</b> más me gusta es el clima.</i> · <b>quien / quienes</b> = personas, sobre todo tras preposición: <i>La persona con <b>quien</b> hablé.</i></p>
<h3>2. Preposición + artículo + que</h3>
<div class="rule"><i>La empresa <b>en la que</b> trabajo. El amigo <b>con el que</b> viajé. Las personas <b>a las que</b> invité. El tema <b>del que</b> hablamos.</i> (el artículo concuerda con el antecedente)</div>
<h3>3. ¿Indicativo o subjuntivo?</h3>
<table><tr><th>indicativo</th><th>subjuntivo</th></tr>
<tr><td>el antecedente es <b>conocido / existe</b>:<br><i>Vivo en un piso que <b>tiene</b> terraza.</i></td><td>el antecedente es <b>desconocido / buscado / no existe</b>:<br><i>Busco un piso que <b>tenga</b> terraza. No hay nadie que lo <b>sepa</b>. ¿Conoces a alguien que <b>hable</b> ruso?</i></td></tr></table>
<p>Con personas desconocidas no se usa la <i>a</i> personal: <i>Busco <b>a</b> la chica que habla ruso</i> (conocida) / <i>Busco una chica que hable ruso</i> (cualquiera).</p>
<h3>4. Definir</h3>
<p><i>Es una cosa que sirve para… · Es un lugar donde… · Es una persona que…</i> – muy útil cuando no sabe una palabra.</p>`,
 pitfalls:['<b>*El piso cual vimos</b> → El piso que vimos.','<b>*No entiendo que dices</b> → No entiendo lo que dices.','<b>*Busco un piso que tiene ascensor</b> (todavía no lo tengo) → que tenga ascensor.','<b>*La empresa que trabajo</b> → La empresa en la que trabajo.'],
 spain:'En los anuncios de pisos verá: <i>exterior</i> (que da a la calle), <i>interior</i> (que da al patio), <i>reformado</i>, <i>con ascensor</i>, <i>gastos de comunidad incluidos</i>. «Busco un piso que sea exterior y tenga ascensor» es una frase que repetirá mucho.',
 examples:[['El piso que vimos ayer era muy luminoso.','The flat we saw yesterday was very bright.'],['La vecina que vive arriba es muy amable.','The neighbour who lives upstairs is very kind.'],['El barrio donde vivo es muy tranquilo.','The neighbourhood where I live is very quiet.'],['No entiendo lo que dices.','I don’t understand what you’re saying.'],['Lo que más me gusta de España es la gente.','What I like most about Spain is the people.'],['La empresa en la que trabajo es alemana.','The company I work for is German.'],['El amigo con el que viajé vive en Cádiz.','The friend I travelled with lives in Cádiz.'],['Busco un piso que tenga terraza.','I’m looking for a flat that has a terrace.'],['¿Conoces a alguien que hable francés?','Do you know anyone who speaks French?'],['No hay nadie que sepa la respuesta.','There’s nobody who knows the answer.'],['Es una cosa que sirve para abrir botellas.','It’s a thing used for opening bottles.'],['Vivo en un piso que tiene dos balcones.','I live in a flat that has two balconies.']],
 ex:['g|El libro ___ estoy leyendo es muy bueno.|que','g|El pueblo ___ nací es pequeño.|donde','g|No sé ___ quieres.|lo que','g|La mujer con ___ hablé es la directora.|quien/la que','g|La empresa en ___ trabajo es grande.|la que','g|El chico con ___ salgo es de Vigo.|el que/quien','g|Busco un piso que ___ ascensor. (tener)|tenga','g|Vivo en un piso que ___ ascensor. (tener)|tiene','g|¿Hay alguien que ___ conducir? (saber)|sepa','g|Tengo un amigo que ___ chino. (hablar)|habla','g|No hay ningún bar que ___ abierto. (estar)|esté','m|What I need is time.|Lo que necesito es tiempo.~Que necesito es tiempo.~El que necesito es tiempo.','m|I’m looking for a job that is interesting (any).|Busco un trabajo que sea interesante.~Busco un trabajo que es interesante.','m|The town where I live…|El pueblo donde vivo…~El pueblo que vivo…~El pueblo cual vivo…','o:rel|The friend I live with is from Seville.|El amigo con el que vivo es de Sevilla','t|Traduzca: I don’t understand what you say. (tú)|No entiendo lo que dices','t|Traduzca: I need someone who speaks Spanish.|Necesito a alguien que hable español/Necesito alguien que hable español']},

{id:'b1-08',level:'B1',title:'Ya se había ido – el pluscuamperfecto',cat:'perf',vocab:['b1-anecdotas'],
 topics:['había + participio','Anterioridad en el pasado: ya, todavía no, nunca antes','Narrar con cuatro pasados','Reaccionar a una historia'],
 source:'Greenfield Lesson 27 (Past perfect indicative)',
 goals:['contar qué había pasado antes de otro momento del pasado','combinar los tiempos del pasado en una narración','reaccionar a anécdotas'],
 grammar:`<h3>1. Forma</h3>
<p>Imperfecto de <b>haber</b> + participio: <i><b>había, habías, había, habíamos, habíais, habían</b> + hablado / comido / hecho…</i></p>
<h3>2. Uso: el pasado del pasado</h3>
<div class="rule"><i>Cuando llegamos al cine, la película <b>ya había empezado</b>.</i> (primero empezó la película, después llegamos)<br><i>Nunca <b>había visto</b> el mar antes de venir a España.</i><br><i>Me dijo que <b>había perdido</b> las llaves.</i></div>
<p>Marcadores: <i>ya, todavía no, nunca (antes), antes, aquel día…</i></p>
<h3>3. Los cuatro pasados en una historia</h3>
<table><tr><th>tiempo</th><th>función</th><th>ejemplo</th></tr>
<tr><td>perfecto</td><td>pasado reciente / período actual</td><td><i>Hoy me <b>ha pasado</b> algo increíble.</i></td></tr>
<tr><td>indefinido</td><td>los hechos</td><td><i><b>Salí</b> de casa, <b>cogí</b> el metro…</i></td></tr>
<tr><td>imperfecto</td><td>el escenario</td><td><i><b>Había</b> mucha gente y <b>hacía</b> calor.</i></td></tr>
<tr><td>pluscuamperfecto</td><td>lo que pasó antes</td><td><i>…y me di cuenta de que <b>había olvidado</b> la cartera.</i></td></tr></table>
<h3>4. Reaccionar</h3>
<p><i>¿En serio? · ¡No me digas! · ¡Qué fuerte! · ¡Qué mala suerte! · ¡Qué bien! · ¿Y qué pasó después? · ¡Menos mal!</i> (thank goodness)</p>`,
 pitfalls:['<b>*Cuando llegué, la película ya empezaba</b> → ya había empezado.','<b>*Había hacido</b> → había hecho.','<b>*Había lo visto</b> → Lo había visto.','<b>*Habían mucha gente</b> → Había mucha gente.'],
 spain:'«¡Qué fuerte!» es la reacción española por excelencia ante algo sorprendente (bueno o malo). «¡No me digas!» y «¡Anda ya!» expresan incredulidad.',
 examples:[['Cuando llegamos, la película ya había empezado.','When we arrived, the film had already started.'],['Nunca había probado el pulpo antes.','I had never tried octopus before.'],['Me dijo que había perdido el tren.','He told me he had missed the train.'],['Ya habíamos cenado cuando nos llamaste.','We had already had dinner when you called us.'],['Hoy me ha pasado algo increíble.','Something incredible happened to me today.'],['Salí de casa y me di cuenta de que había olvidado las llaves.','I left home and realised I had forgotten my keys.'],['No sabía que habías vivido en Chile.','I didn’t know you had lived in Chile.'],['¿En serio? ¡No me digas!','Really? You don’t say!'],['¡Qué fuerte! ¿Y qué pasó después?','No way! And what happened next?'],['¡Menos mal que tenías otra copia!','Thank goodness you had another copy!'],['El tren ya se había ido.','The train had already left.'],['Era la primera vez que había visto nevar.','It was the first time I had seen it snow.']],
 ex:['g|Cuando llegué, el tren ya ___ salido. (haber)|había','g|Nosotros nunca ___ estado en Asturias. (haber)|habíamos','g|¿Tú ya ___ comido? (haber)|habías','g|Ellos ya se ___ ido. (haber)|habían','g|Me dijo que había ___ un accidente. (tener)|tenido','g|Cuando llegamos, ya habían ___ la cena. (hacer)|hecho','g|Nunca había ___ algo así. (ver)|visto','g|Me di cuenta de que había ___ el móvil. (olvidar)|olvidado','m|When I arrived, she had already left.|Cuando llegué, ella ya se había ido.~Cuando llegué, ella ya se iba.~Cuando llegaba, ella ya se ha ido.','m|I had never seen it.|Nunca lo había visto.~Nunca había lo visto.~Nunca lo había veído.','m|Reaction to surprising news:|¡Qué fuerte!~¡Qué aproveche!~¡Que te mejores!','m|There had been a problem.|Había habido un problema.~Habían habido un problema.~Había hubo un problema.','o:perf|We had already eaten when they arrived.|Ya habíamos comido cuando llegaron','t|Traduzca: I had never been to Spain before.|Nunca había estado en España antes/Nunca antes había estado en España/No había estado nunca en España antes','t|Traduzca: He said he had lost his wallet.|Dijo que había perdido la cartera/Dijo que había perdido su cartera']},

{id:'b1-09',level:'B1',title:'¡No te preocupes! – imperativo negativo y con pronombres',cat:'imper',vocab:['b1-normas'],
 topics:['Imperativo negativo = no + subjuntivo','Pronombres: antes del verbo en negativo','Combinar: dímelo / no me lo digas','Normas, consejos y avisos'],
 source:'Greenfield Lesson 19 (Commands) · Libro Libre cap. 10 (The imperative)',
 goals:['prohibir y aconsejar','tranquilizar a alguien','entender carteles y normas'],
 grammar:`<h3>1. Imperativo negativo</h3>
<p>Siempre <b>no + presente de subjuntivo</b>:</p>
<table><tr><th></th><th>hablar</th><th>comer</th><th>ir</th><th>hacer</th></tr>
<tr><td>tú</td><td>no habl<em>es</em></td><td>no com<em>as</em></td><td>no vayas</td><td>no hagas</td></tr>
<tr><td>usted</td><td>no habl<em>e</em></td><td>no com<em>a</em></td><td>no vaya</td><td>no haga</td></tr>
<tr><td>vosotros</td><td>no habl<em>éis</em></td><td>no com<em>áis</em></td><td>no vayáis</td><td>no hagáis</td></tr>
<tr><td>ustedes</td><td>no habl<em>en</em></td><td>no com<em>an</em></td><td>no vayan</td><td>no hagan</td></tr></table>
<h3>2. Pronombres</h3>
<div class="rule">Afirmativo → <b>detrás, unidos</b>: <i>Dímelo. Siéntate. Cómpralo. Dáselo.</i><br>Negativo → <b>delante, separados</b>: <i>No me lo digas. No te sientes ahí. No lo compres. No se lo des.</i></div>
<p>Tildes: <i>di + me + lo → dímelo; compra + lo → cómpralo; da + se + lo → dáselo</i>.</p>
<h3>3. Frases muy frecuentes</h3>
<p><i>¡No te preocupes! · ¡No pasa nada! · ¡No te olvides de…! · ¡No me digas! · No hace falta. · ¡No te pierdas…! · No dejes la puerta abierta.</i></p>
<p>Carteles con infinitivo o «se»: <i>No fumar. Prohibido aparcar. No se admiten perros.</i></p>`,
 pitfalls:['<b>*No habla</b> (orden a tú) → No hables.','<b>*No dímelo</b> → No me lo digas.','<b>*No vas</b> (orden) → No vayas.','<b>*Lo no toques</b> → No lo toques.'],
 spain:'«No te preocupes» y «No pasa nada» se oyen constantemente en España: para tranquilizar, para perdonar un pequeño error o para decir «de nada». Son frases imprescindibles.',
 examples:[['¡No te preocupes, no pasa nada!','Don’t worry, it’s fine!'],['No llegues tarde, por favor.','Please don’t be late.'],['No te olvides de las llaves.','Don’t forget the keys.'],['No me lo digas, ya lo sé.','Don’t tell me, I already know.'],['No toques eso, está caliente.','Don’t touch that, it’s hot.'],['No vayas por esa calle, está en obras.','Don’t go down that street, there are roadworks.'],['No hagáis ruido, el bebé está durmiendo.','Don’t make any noise, the baby is sleeping.'],['Señora, no se preocupe, ahora se lo arreglamos.','Don’t worry, madam, we’ll fix it for you now.'],['Dáselo a tu hermano. – No, no se lo des todavía.','Give it to your brother. – No, don’t give it to him yet.'],['No hace falta que vengas.','You don’t need to come.'],['No dejéis la basura en la escalera.','Don’t leave the rubbish on the stairs.'],['Prohibido aparcar.','No parking.']],
 ex:['g|(tú, hablar) No ___ tan alto.|hables','g|(tú, comer) No ___ tan rápido.|comas','g|(tú, ir) No ___ solo.|vayas','g|(tú, hacer) No ___ eso.|hagas','g|(tú, decir) No se lo ___ a nadie.|digas','g|(usted, preocuparse) No se ___.|preocupe','g|(vosotros, llegar) No ___ tarde.|lleguéis','g|(ustedes, tocar) No ___ las obras.|toquen','g|(tú, olvidarse) No te ___ del pan.|olvides','m|Don’t tell me! (tú)|¡No me lo digas!~¡No dímelo!~¡No me lo dices!','m|Buy it! / Don’t buy it! (tú, el libro)|Cómpralo. / No lo compres.~Lo compra. / No cómpralo.~Cómpralo. / No lo compras.','m|Don’t worry! (tú)|¡No te preocupes!~¡No preocúpate!~¡No te preocupas!','m|Don’t sit there! (vosotros)|¡No os sentéis ahí!~¡No sentaos ahí!~¡No os sentáis ahí!','o:imper|Don’t forget your passport. (tú)|No te olvides del pasaporte','t|Traduzca: Don’t worry. (usted)|No se preocupe','t|Traduzca: Don’t do it! (tú)|¡No lo hagas!/No lo hagas']},

{id:'b1-10',level:'B1',title:'Me dijo que… – el estilo indirecto',cat:'pretimp',vocab:['b1-comunicacion'],
 topics:['Transmitir lo que alguien dice: dice que + presente','En pasado: dijo que + imperfecto / pluscuamperfecto / condicional','Preguntas indirectas: me preguntó si / dónde','Peticiones: me pidió que + subjuntivo'],
 source:'Greenfield Lesson 30 (Survey of moods and tenses) · FSI conversation stimulus (reporting)',
 goals:['contar lo que otra persona ha dicho','transmitir preguntas y peticiones','dejar y transmitir recados'],
 grammar:`<h3>1. Presente: dice que…</h3>
<p>Si el verbo introductor está en presente, los tiempos no cambian: <i>«Estoy cansada». → Dice que <b>está</b> cansada.</i> Cambian las personas y los pronombres: <i>«Mi coche…» → Dice que <b>su</b> coche…</i></p>
<h3>2. Pasado: dijo que…</h3>
<table><tr><th>estilo directo</th><th>estilo indirecto (dijo que…)</th></tr>
<tr><td>presente: «Vivo en Lugo»</td><td>imperfecto: <i>vivía en Lugo</i></td></tr>
<tr><td>indefinido / perfecto: «Lo he visto / Lo vi»</td><td>pluscuamperfecto: <i>lo había visto</i></td></tr>
<tr><td>futuro: «Iré mañana»</td><td>condicional: <i>iría al día siguiente</i></td></tr>
<tr><td>ir a: «Voy a llamar»</td><td><i>iba a llamar</i></td></tr></table>
<p>Cambian también: <i>hoy → aquel día, mañana → al día siguiente, aquí → allí, este → ese/aquel</i>.</p>
<h3>3. Preguntas y peticiones</h3>
<div class="rule">Pregunta de sí/no → <b>si</b>: <i>«¿Vienes?» → Me preguntó <b>si</b> iba.</i><br>Pregunta con palabra interrogativa → se mantiene (con tilde): <i>«¿Dónde vives?» → Me preguntó <b>dónde</b> vivía.</i><br>Orden o petición → <b>que + subjuntivo</b>: <i>«Llámame» → Me dice que lo <b>llame</b> / Me dijo que lo <b>llamara</b> (B2).</i></div>
<p>Verbos útiles: <i>decir, comentar, contar, explicar, preguntar, pedir, recomendar, avisar, prometer</i>.</p>`,
 pitfalls:['<b>*Me preguntó que si vienes</b> → Me preguntó si venía.','<b>*Dijo que vendrá mañana</b> (contado días después) → Dijo que vendría al día siguiente.','<b>*Me preguntó dónde vivo</b> (en pasado) → dónde vivía.','<b>*Me pidió que lo llamo</b> → que lo llamara / llame.'],
 spain:'En el trabajo se dejan muchos recados: «Ha llamado tu madre, dice que la llames», «Ha venido el técnico y ha dicho que vuelve mañana». Nótese que con el perfecto («ha dicho») muchos hablantes no cambian el tiempo.',
 examples:[['Ana dice que está cansada.','Ana says she’s tired.'],['Ha llamado tu madre: dice que la llames.','Your mother called: she says to call her.'],['Me dijo que vivía en Lugo.','He told me he lived in Lugo.'],['Me contó que había perdido el trabajo.','She told me she had lost her job.'],['Dijo que vendría al día siguiente.','He said he would come the next day.'],['Me preguntó si quería un café.','She asked me if I wanted a coffee.'],['Le pregunté dónde estaba la estación.','I asked him where the station was.'],['El médico me dijo que descansara.','The doctor told me to rest.'],['Me pidió que no se lo dijera a nadie.','She asked me not to tell anyone.'],['Dicen que mañana va a llover.','They say it’s going to rain tomorrow.'],['El técnico ha dicho que vuelve mañana.','The technician has said he’s coming back tomorrow.'],['¿Qué te ha dicho? – Que llega tarde.','What did he say? – That he’s running late.']],
 ex:['g|«Estoy enfermo». → Dice que ___ enfermo.|está','g|«Estoy enfermo». → Dijo que ___ enfermo.|estaba','g|«Vivo en Madrid». → Me dijo que ___ en Madrid.|vivía','g|«He perdido el tren». → Dijo que ___ perdido el tren.|había','g|«Iré mañana». → Dijo que ___ al día siguiente.|iría','g|«¿Tienes hambre?» → Me preguntó ___ tenía hambre.|si','g|«¿Dónde trabajas?» → Me preguntó ___ trabajaba.|dónde','g|«Voy a llamar». → Dijo que ___ a llamar.|iba','g|«Llámame». → Me dice que lo ___. (llamar)|llame','m|«¿Vienes a la fiesta?» → Me preguntó…|si iba a la fiesta.~que si vienes a la fiesta.~si vendrás a la fiesta ayer.','m|“mañana” in reported speech (past) becomes…|al día siguiente~ayer~hoy','m|She asked me where I lived.|Me preguntó dónde vivía.~Me preguntó donde vivo.~Me preguntó que dónde vivo yo ayer.','o:pretimp|He told me that he was tired.|Me dijo que estaba cansado','t|Traduzca: She said that she would call me.|Dijo que me llamaría/Me dijo que me llamaría','t|Traduzca: He asked me if I spoke English.|Me preguntó si hablaba inglés']},

{id:'b1-11',level:'B1',title:'Acabo de llegar – perífrasis verbales',cat:'conj',vocab:['b1-trabajo-estudios'],
 topics:['acabar de + infinitivo','volver a + infinitivo','dejar de / empezar a / ponerse a','seguir + gerundio, llevar + tiempo + gerundio','hay que / tener que / deber'],
 source:'FSI Units (Pattern drills: verb constructions) · Greenfield Lessons 15 y 24',
 goals:['expresar matices de tiempo y de inicio/fin de acciones','hablar de cuánto tiempo lleva haciendo algo','expresar obligación'],
 grammar:`<h3>1. Inicio, fin, repetición</h3>
<table><tr><th>perífrasis</th><th>significado</th><th>ejemplo</th></tr>
<tr><td><b>acabar de</b> + inf.</td><td>just (done)</td><td><i>Acabo de llegar.</i> (I’ve just arrived)</td></tr>
<tr><td><b>empezar a / ponerse a</b> + inf.</td><td>start to</td><td><i>Empecé a estudiar en enero. Se puso a llorar.</i></td></tr>
<tr><td><b>dejar de</b> + inf.</td><td>stop doing</td><td><i>He dejado de fumar.</i></td></tr>
<tr><td><b>volver a</b> + inf.</td><td>do again</td><td><i>¿Puedes volver a explicarlo?</i></td></tr>
<tr><td><b>estar a punto de</b> + inf.</td><td>be about to</td><td><i>Estoy a punto de salir.</i></td></tr></table>
<h3>2. Continuidad y duración</h3>
<div class="rule"><b>seguir</b> + gerundio = still / keep on: <i>¿Sigues viviendo en Málaga? Sigue lloviendo.</i><br><b>llevar</b> + tiempo + gerundio = to have been doing for: <i><b>Llevo</b> dos años <b>estudiando</b> español.</i> (= Hace dos años que estudio español.) · <i>¿Cuánto tiempo llevas aquí?</i></div>
<h3>3. Obligación</h3>
<p><b>tener que</b> (personal): <i>Tengo que renovar el NIE.</i> · <b>hay que</b> (impersonal, general): <i>Hay que pedir cita.</i> · <b>deber</b> (moral / consejo): <i>Debes respetar las normas.</i> · <b>no hace falta</b> + inf. / que + subj. (not necessary).</p>`,
 pitfalls:['<b>*Acabo llegar</b> → Acabo de llegar.','<b>*He parado de fumar</b> → He dejado de fumar.','<b>*Estudio español desde dos años</b> → Llevo dos años estudiando / Estudio español desde hace dos años.','<b>*Hay que tú vengas</b> → Tienes que venir.'],
 spain:'«¿Cuánto tiempo llevas en España?» es una de las primeras preguntas que le harán. Respuesta natural: «Llevo un año y medio aquí».',
 examples:[['Acabo de llegar a casa.','I’ve just got home.'],['Mi padre ha dejado de fumar.','My father has stopped smoking.'],['Empecé a trabajar aquí en marzo.','I started working here in March.'],['¿Puedes volver a explicarlo?','Can you explain it again?'],['Estoy a punto de salir, te llamo luego.','I’m about to go out, I’ll call you later.'],['Llevo dos años estudiando español.','I’ve been studying Spanish for two years.'],['¿Cuánto tiempo llevas en España?','How long have you been in Spain?'],['¿Sigues trabajando en el hospital?','Are you still working at the hospital?'],['Sigue lloviendo.','It’s still raining.'],['Hay que pedir cita previa.','You have to make an appointment.'],['No hace falta que traigas nada.','You don’t need to bring anything.'],['De repente se puso a llover.','Suddenly it started to rain.']],
 ex:['g|Acabo ___ comer.|de','g|He dejado ___ fumar.|de','g|Empecé ___ trabajar en mayo.|a','g|¿Puedes volver ___ repetirlo?|a','g|Llevo tres años ___ aquí. (vivir)|viviendo','g|¿Sigues ___ en Barcelona? (trabajar)|trabajando','g|___ que pedir cita. (impersonal)|Hay','g|Estoy a punto ___ salir.|de','g|¿Cuánto tiempo ___ (tú) estudiando español? (llevar)|llevas','m|I’ve just arrived.|Acabo de llegar.~Acabo llegar.~Termino de llegar.','m|I’ve been living here for five years.|Llevo cinco años viviendo aquí.~Vivo aquí por cinco años.~Estoy viviendo aquí desde cinco años.','m|It’s still raining.|Sigue lloviendo.~Todavía llueve ya.~Sigue a llover.','m|He stopped working.|Dejó de trabajar.~Paró trabajar.~Dejó a trabajar.','o:conj|I have been learning Spanish for one year.|Llevo un año aprendiendo español','t|Traduzca: I have just finished.|Acabo de terminar','t|Traduzca: You have to make an appointment. (impersonal)|Hay que pedir cita/Hay que pedir cita previa']},

{id:'b1-12',level:'B1',title:'Sin embargo… – conectores y argumentación',cat:'conn',vocab:['b1-sociedad'],
 topics:['Causa: porque, como, ya que, es que','Consecuencia: por eso, así que, por lo tanto','Contraste: pero, sino, sin embargo, aunque','Ordenar ideas: en primer lugar, además, por último','Estructurar una opinión'],
 source:'MFLE Reference Grammar (Conjunctions) · Greenfield Lesson 30',
 goals:['argumentar a favor y en contra','enlazar ideas en un texto o en una intervención oral','dar razones y sacar conclusiones'],
 grammar:`<h3>1. Causa</h3>
<p><b>porque</b> (después de la idea principal): <i>No voy porque estoy cansado.</i> · <b>como</b> (siempre al principio): <i>Como estoy cansado, no voy.</i> · <b>ya que / puesto que</b> (más formal) · <b>es que…</b> (para justificarse, coloquial): <i>Es que no he podido…</i> · <b>por</b> + nombre / infinitivo: <i>por el tráfico</i>.</p>
<h3>2. Consecuencia</h3>
<p><i><b>por eso</b>, <b>así que</b>, <b>por lo tanto</b> (formal), <b>entonces</b></i>: <i>Estaba cerrado, así que volvimos a casa.</i></p>
<h3>3. Contraste y oposición</h3>
<div class="rule"><b>pero</b> = but · <b>sino</b> = but rather (tras negación): <i>No es inglés <b>sino</b> irlandés.</i> · <b>sin embargo / no obstante</b> = however (nueva frase o tras punto y coma) · <b>aunque</b> + indicativo (hecho): <i>Aunque llueve, salimos.</i> · <b>en cambio / mientras que</b> = whereas · <b>a pesar de</b> + nombre/infinitivo: <i>a pesar del frío</i>.</div>
<h3>4. Organizar un discurso</h3>
<p><i>En primer lugar… · Por un lado… por otro (lado)… · Además… · También… · Incluso… · Por ejemplo… · Es decir… · En resumen… · En conclusión… · Por último…</i></p>
<p>Ejemplo de estructura: <b>opinión</b> (Creo que…) → <b>argumento 1</b> + ejemplo → <b>argumento 2</b> (Además…) → <b>contraargumento</b> (Es verdad que…, sin embargo…) → <b>conclusión</b> (Por todo esto…).</p>`,
 pitfalls:['<b>*Porque estoy cansado, no voy</b> (al principio) → Como estoy cansado, no voy.','<b>*No es caro pero barato</b> → No es caro sino barato.','<b>*Sin embargo que</b> → Sin embargo, … / aunque…','<b>*¿Porqué?</b> → ¿Por qué? (pregunta) / porque (respuesta).'],
 spain:'En una conversación, «es que…» es la manera más española de justificarse: «¿Por qué no viniste?» – «Es que tenía mucho trabajo». Suena natural y amable.',
 examples:[['No voy a la fiesta porque estoy muy cansado.','I’m not going to the party because I’m very tired.'],['Como no tenía coche, fui en autobús.','As I didn’t have a car, I went by bus.'],['Es que no he tenido tiempo.','The thing is, I haven’t had time.'],['El museo estaba cerrado, así que fuimos a un bar.','The museum was closed, so we went to a bar.'],['No es inglés, sino irlandés.','He isn’t English but Irish.'],['El piso es pequeño; sin embargo, es muy luminoso.','The flat is small; however, it’s very bright.'],['Aunque llovía, salimos a pasear.','Although it was raining, we went for a walk.'],['A pesar del tráfico, llegamos a tiempo.','Despite the traffic, we arrived on time.'],['Por un lado es caro, por otro, la calidad es muy buena.','On the one hand it’s expensive, on the other, the quality is very good.'],['Además, el transporte público funciona muy bien.','Moreover, public transport works very well.'],['En mi pueblo hay paz; en cambio, en la ciudad hay más oportunidades.','In my village there is peace; on the other hand, the city has more opportunities.'],['En resumen, creo que vale la pena.','In short, I think it’s worth it.']],
 ex:['g|___ no tenía dinero, no compré nada. (as/since, al principio)|Como','g|No fui ___ estaba enfermo.|porque','g|No es caro ___ barato.|sino','g|Llovía; ___, salimos. (however)|sin embargo','g|___ estaba cansada, fue a la fiesta. (although)|Aunque','g|Estaba cerrado, ___ volvimos a casa. (so)|así que/por eso','g|A pesar ___ frío, fuimos a la playa.|del','g|Por un lado es barato; por ___, es feo.|otro','m|“The thing is, I didn’t have time.”|Es que no tuve tiempo.~Es porque no tuve tiempo.~Como no tuve tiempo es.','m|Not Spanish but Portuguese.|No es español sino portugués.~No es español pero portugués.~No es español sin embargo portugués.','m|¿___ no viniste? – ___ estaba enfermo.|Por qué / Porque~Porque / Por qué~Porqué / Por que','m|In conclusion…|En conclusión~En conclusión que~Al conclusión','o:conn|As it was raining, we stayed at home.|Como llovía, nos quedamos en casa','t|Traduzca: Although it is expensive, I’m going to buy it.|Aunque es caro, voy a comprarlo/Aunque es caro, lo voy a comprar','t|Traduzca: The flat is old; however, it is very nice.|El piso es antiguo; sin embargo, es muy bonito/El piso es viejo; sin embargo, es muy bonito']}
]);
