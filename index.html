function clozeView(t,el){const text=trackText(t);const words=text.split(/(\s+)/);let n=0,k=0;const blanks=[];
  const html=words.map(w=>{if(/^\s+$/.test(w))return esc(w).replace(/\n/g,'<br>');const core=w.match(/^([«"(¿¡]*)([A-Za-zÁÉÍÓÚÑÜáéíóúñü]{4,})([.,!?;:»")]*)$/);n++;
    if(core&&n%6===3&&!/:$/.test(w)){blanks.push(core[2]);return esc(core[1])+`<input type="text" data-c="${k++}" style="width:${core[2].length*10+16}px" autocomplete="off" autocapitalize="off" spellcheck="false">`+esc(core[3])}return esc(w)}).join('');
  el.innerHTML=`<div class="transcript cloze">${html}</div><div class="row" style="margin-top:10px"><button class="pri" id="cchk">${T('Corregir','Check')}</button><button id="csol">${T('Mostrar soluciones','Show answers')}</button><span id="cres"></span></div>`;
  $('#cchk').onclick=()=>{let ok=0;$$('[data-c]',el).forEach(i=>{const a=blanks[+i.dataset.c];const g=baseNorm(i.value).toLowerCase(),x=baseNorm(a).toLowerCase();const r=g===x||(S.settings.noTilde&&stripAcc(g)===stripAcc(x));i.className=r?'r':'w';if(r)ok++});const pct=ok/blanks.length;$('#cres').innerHTML=`<b>${ok}/${blanks.length}</b> ${L('correctas','correct')}`;hist().n+=blanks.length;hist().ok+=ok;addXP(Math.round(ok/2));const st=S.listen[t.id]=S.listen[t.id]||{};st.cloze=Math.max(st.cloze||0,pct);save()};
  $('#csol').onclick=()=>$$('[data-c]',el).forEach(i=>{if(i.className!=='r'){i.value=blanks[+i.dataset.c];i.className='w'}})}
function inlineQuiz(el,items,onScore){
  const RF=/^(Verdadero~Falso|Falso~Verdadero)$/;
  el.innerHTML=`<div class="card">${items.map((it,i)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)" data-q="${i}"><div><b>${i+1}.</b> ${esc(it.prompt)}</div>${it.type==='m'?`<div class="row" style="margin-top:6px">${(RF.test(it.answerRaw)?['Verdadero','Falso']:shuffle(it.options)).map(o=>`<label class="chip"><input type="radio" name="q${i}" value="${esc(o)}" style="display:none">${esc(o)}</label>`).join('')}</div>`:`<input type="text" style="margin-top:6px" autocomplete="off" autocapitalize="off">`}<div class="qfb small"></div></div>`).join('')}
  <div class="row" style="margin-top:14px"><button class="pri" id="qchk">${T('Corregir','Check')}</button><span id="qres"></span></div></div>`;
  $$('.chip',el).forEach(c=>c.onclick=()=>{$$('.chip',c.parentNode).forEach(x=>x.classList.remove('on'));c.classList.add('on');c.querySelector('input').checked=true});
  $('#qchk').onclick=()=>{let ok=0;items.forEach((it,i)=>{const box=$(`[data-q="${i}"]`,el);let given,res;
    if(it.type==='m'){const r=$('input:checked',box);given=r?r.value:'';res={ok:given===it.correct,best:it.correct}}else{given=$('input',box).value;res=check(given,it.answers||it.gaps.map(g=>g[0]))}
    if(res.ok){ok++;errorFixed(it)}else logError(it,given,it.cat);
    $('.qfb',box).innerHTML=res.ok?`<span style="color:var(--ok)">✓ ${L('correcto','correct')}</span>`:`<span style="color:var(--bad)">✗ ${L('correcto','correct')}: <b>${esc(res.best)}</b></span>${it.explain?' – '+esc(it.explain):''}`});
    hist().n+=items.length;hist().ok+=ok;addXP(ok*2);$('#qres').innerHTML=`<b>${ok}/${items.length}</b> ${L('correctas','correct')}`;onScore&&onScore(ok/items.length)}}

function speakTask(id){const t=(SW.speak||[]).find(x=>x.id===id);if(!t)return R.speak();let rec=null,mr=null,chunks=[],timerH=null;

  <div class="card" style="margin-top:14px"><h3>${T('Autocontrol después de hablar','Self-check after speaking')}</h3>${(META.speakChecklist||[]).map((c,i)=>`<label class="row small" style="margin:4px 0"><input type="checkbox"> ${esc(c)}</label>`).join('')}<div id="auto" class="small" style="margin-top:10px"></div>
  <div class="row" style="margin-top:12px"><button id="copy">📋 ${T('Copiar para corrección de Claude','Copy for Claude correction')}</button><a class="btn" href="#/errors">${T('Añadir errores →','Add mistakes →')}</a></div>${t.model?`<details style="margin-top:12px"><summary>${T('Respuesta modelo','Model answer')}</summary><div class="row" style="margin-top:8px"><button class="sm" data-say="${esc(t.model)}">▶ ${T('Escuchar el modelo','Listen to the model')}</button></div><div class="readtext" style="font-size:15px;margin-top:8px">${esc(t.model)}</div></details>`:''}</div>`;
  const tm=$('#tm');function timer(sec,down,label){clearInterval(timerH);let s=sec;tm.textContent=fmt(s);timerH=setInterval(()=>{if(!tm.isConnected){clearInterval(timerH);return}s+=down?-1:1;tm.textContent=(label||'')+fmt(Math.max(0,s));if(down&&s<=0){clearInterval(timerH);toast(L('Se acabó la preparación – ¡a hablar!','Preparation time is over – now speak!'))}},1000)}

    rec=recognizeLong((fin,int)=>{$('#live').innerHTML=esc(fin)+'<span class="muted">'+esc(int)+'</span>'});};
  $('#stop').onclick=()=>{clearInterval(timerH);$('#start').disabled=false;$('#stop').disabled=true;if(rec)rec.stop();if(mr&&mr.state!=='inactive')mr.stop();
    setTimeout(()=>{const txt=liveText();const a=analyzeText(txt,t.level);$('#auto').innerHTML=txt?a.html:'';S.speaking.push({id:t.id,date:today(),text:txt.slice(0,4000),secs:tm.textContent});hist().n++;hist().ok++;addXP(10);save()},600)};

/* Claude correction (hosted version, sample capability) */
function addAiButton(row,getText,t,kind){if(!IN_VIEWER)return;const b=document.createElement('button');b.className='pri';b.textContent=L('✨ Corrección de Claude','✨ Claude correction');row.insertBefore(b,row.firstChild);
  const out=document.createElement('div');out.style.marginTop='12px';row.parentNode.insertBefore(out,row.nextSibling);
  b.onclick=async()=>{const txt=getText().trim();if(txt.split(/\s+/).length<4){toast(L('Primero escriba o dicte un texto.','Please write or dictate a text first.'));return}
    let sample=null;try{sample=await window.claude.use('sample')}catch(e){}if(!sample){toast(L('La corrección de Claude no está disponible aquí – use «Copiar».','Claude correction is not available in this view – use “Copy”.'));b.remove();return}
    b.disabled=true;out.innerHTML=`<div class="fb">${T('Claude está corrigiendo …','Claude is correcting …')}</div>`;
    const cats=Object.entries(META.cats).filter(([k])=>!['other','ending','listening','lesen','pronun','punct'].includes(k)).map(([k,v])=>k+' = '+((window.I18N&&I18N.cats[k]||[])[0]||v.n)).join('; ');
    const exl=LANG()==='es'?'Spanish (simple, clear Spanish)':'English';
    const prompt='You are a strict, precise but encouraging teacher of Spanish as spoken in Spain (castellano peninsular; vosotros and Spain vocabulary are correct). Target level: '+t.level+'. Context: '+(t.exam||'everyday life in Spain')+'.\n'+
      (kind==='speak'?'The text is an automatic transcript of a SPOKEN answer. Ignore missing punctuation, ¿ ¡, capitalisation and accent marks; judge grammar, vocabulary, sentence structure, coherence and task completion.':'The text is a WRITTEN answer. Accent marks (tildes) and ¿ ¡ count.')+'\n'+
      'Task: '+t.title+'. '+String(t.prompt||'').replace(/<[^>]+>/g,' ')+' '+(t.points?'Content points: '+t.points.join('; '):'')+'\n\nLearner text:\n<<<\n'+txt+'\n>>>\n\n'+
      'Write all explanations in '+exl+'. Reply ONLY with JSON in exactly this shape:\n{"level":"estimated CEFR level, e.g. A2+","assessment":"2-4 sentences overall assessment (task completion, coherence, vocabulary, structures)","points_met":["…"],"points_missing":["…"],"errors":[{"wrong":"exact wrong excerpt (short sentence/clause)","right":"corrected version of the same excerpt","category":"one of these keys: '+cats+'","rule":"short rule"}],"improved":"complete improved version at '+t.level+' level, natural Spanish from Spain","patterns":["the 3 most important recurring error patterns"]}\nList EVERY real error separately (max 25).';
    try{const r=await sample.json(prompt,{modelTier:'default'});renderAi(out,r||{})}
    catch(e){out.innerHTML=`<div class="fb warn">${T('La corrección ha fallado','Correction failed')} (${esc(e&&(e.code||e.message)||'error')}). ${T('Inténtelo más tarde o use «Copiar».','Please try again later or use “Copy”.')}</div>`}
    b.disabled=false}}
function renderAi(out,r){const fs=Array.isArray(r.errors)?r.errors.filter(f=>f&&f.wrong&&f.right):[];
  out.innerHTML=`<div class="card" style="border-color:var(--accent)"><div class="row"><b>${T('Corrección de Claude','Claude correction')}</b><span class="spacer"></span><span class="pill acc">${T('estimado','estimated')}: ${esc(r.level||'?')}</span></div><p>${esc(r.assessment||'')}</p>
   ${(r.points_missing||[]).length?`<p class="small"><b>${T('Puntos que faltan','Missing content points')}:</b> ${(r.points_missing||[]).map(esc).join(' · ')}</p>`:''}
   ${fs.length?`<div style="overflow-x:auto"><table class="t"><tr><th>${T('Incorrecto','Wrong')}</th><th>${T('Correcto','Right')}</th><th>${T('Patrón','Pattern')}</th><th>${T('Regla','Rule')}</th></tr>${fs.map(f=>`<tr><td style="color:var(--bad)">${esc(f.wrong)}</td><td><b>${esc(f.right)}</b> ${sayBtn(f.right)}</td><td class="small">${esc(catName(f.category))}</td><td class="small">${esc(f.rule||'')}</td></tr>`).join('')}</table></div>
   <div class="row" style="margin-top:10px"><button class="pri" id="aiAdd">${T('Pasar '+fs.length+' errores a Errores','Transfer '+fs.length+' mistakes into Mistake training')}</button></div>`:`<p><span class="pill ok">${T('No se han encontrado errores.','No mistakes found.')}</span></p>`}
   ${(r.patterns||[]).length?`<p class="small" style="margin-top:10px"><b>${T('Patrones repetidos','Recurring patterns')}:</b> ${(r.patterns||[]).map(esc).join(' · ')}</p>`:''}
   ${r.improved?`<details style="margin-top:8px"><summary>${T('Versión mejorada','Improved version')}</summary><div class="row" style="margin-top:8px"><button class="sm" data-say="${esc(r.improved)}">▶ ${T('Escuchar','Listen')}</button></div><div class="readtext" style="font-size:15px;margin-top:8px;white-space:pre-wrap">${esc(r.improved)}</div></details>`:''}</div>`;
  const add=out.querySelector('#aiAdd');if(add)add.onclick=()=>{let n=0;for(const f of fs){const spec='man|'+String(f.wrong).replace(/\|/g,'/')+'|'+String(f.right).replace(/\|/g,'/')+'|'+String(f.rule||'').replace(/\|/g,'/');const key='man:'+hash(spec);if(S.errors.find(e=>e.key===key&&!e.closed))continue;
      S.errors.push({id:'e'+Date.now().toString(36)+n,key,spec,src:'manual',cat:META.cats[f.category]?f.category:'other',given:String(f.wrong).slice(0,300),exp:String(f.right).slice(0,300),ts:Date.now(),date:today(),count:1,streak:0,due:today(),closed:false});n++}
    save();updateBadge();add.disabled=true;add.textContent=L(n+' errores pasados ✓',n+' mistakes transferred ✓')}}
function analyzeText(txt,level){const words=txt.split(/\s+/).filter(Boolean),sents=txt.split(/[.!?]+/).filter(s=>s.trim());
  const B='(^|[^a-záéíóúñü])',E='([^a-záéíóúñü]|$)';
  const conns=(META.connectors||[]).filter(c=>new RegExp(B+c.replace(/ /g,'\\s+')+E,'i').test(txt));
  const sub=(META.subordinators||[]).filter(c=>new RegExp(B+c.replace(/ /g,'\\s+')+E,'i').test(txt));
  const tgt={A1:0,A2:2,B1:4,B2:6}[level]||4;
  return{words:words.length,conns,sub,html:`<b>${T('Análisis automático','Automatic analysis')}:</b> ${words.length} ${L('palabras','words')} · ${sents.length} ${L('frases','sentences')} · Ø ${sents.length?Math.round(words.length/sents.length):0} ${L('palabras/frase','words/sentence')}<br>${T('Conectores','Connectors')} (${conns.length}): ${conns.map(esc).join(', ')||'–'} ${conns.length<tgt?`<span class="pill warn">${L('Objetivo','Target')} ${level}: ≥ ${tgt}</span>`:`<span class="pill ok">${L('bien','good')}</span>`}<br>${T('Subordinadas con','Subordinate clauses with')}: ${sub.map(esc).join(', ')||'–'}`}}
function copy(text){(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(L('Copiado – péguelo en Claude.','Copied to the clipboard – paste it into Claude.'))).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(L('Copiado.','Copied.'))}catch(e){prompt('Copy:',text)}ta.remove()})}
function claudePrompt(kind,t,text){return `You are my strict but encouraging teacher of Spanish as spoken in Spain (castellano peninsular). My target level: ${t.level}. Context: ${t.exam||'everyday life in Spain'}.\n${kind==='speak'?'Here is the automatic transcript of my SPOKEN answer (recognition errors are possible – only judge real grammar/vocabulary errors; ignore punctuation and accent marks).':'Here is my WRITTEN text (accent marks and ¿ ¡ count).'}\n\nTask: ${t.title}\n${(t.promptText||t.prompt||'').replace(/<[^>]+>/g,' ')}\n\nMy text:\n"""\n${text}\n"""\n\nPlease:\n1. Assess it (task completion, coherence, vocabulary, structures) and estimate my CEFR level.\n2. List EVERY mistake in a table: Wrong | Right | Category (ser/estar, gender/article, agreement, conjugation, tense choice preterite/imperfect, subjunctive, pronouns, por/para, prepositions, accents, vocabulary, register tú/usted) | short rule in English.\n3. Show an improved, natural version at ${t.level} level, as someone from Spain would say/write it.\n4. Name my 3 most important recurring error patterns and give me 5 short exercises for them.`}

function writingChecks(txt,t){const out=[];let bad=0;const n=txt.split(/\s+/).filter(Boolean).length;
  if(n<t.words*0.9){out.push(L('⚠ Demasiado corto','⚠ Too short')+`: ${n}/${t.words}`);bad++}
  if(t.formal){if(!/^(Estimad[oa]s?|Muy señor|Señor|Señora|Buenos días|A quien corresponda)/m.test(txt.trim())){out.push(L('⚠ Falta un saludo formal (Estimado/a señor/a …: / Buenos días:)','⚠ Formal greeting missing (Estimado/a señor/a …: / Buenos días:)'));bad++}
    if(!/(Atentamente|Un cordial saludo|Saludos cordiales|Reciba un cordial saludo|Un saludo)/i.test(txt)){out.push(L('⚠ Falta una despedida formal (Atentamente / Un cordial saludo)','⚠ Formal closing missing (Atentamente / Un cordial saludo)'));bad++}
    if(/(^|[^a-záéíóúñ])(tú|te|ti|tu|tus|contigo)([^a-záéíóúñ]|$)/i.test(txt)){out.push(L('⚠ «tú/te/tu» en un texto formal – use usted (le, su, se lo…)','⚠ “tú/te/tu” in a formal text – use usted (le, su, se lo…)'));bad++}}
  if(t.informal&&/^(Estimad[oa]|Muy señor)/m.test(txt.trim())){out.push(L('⚠ Tarea informal – mejor «Hola, …» o «Querido/a …:»','⚠ Informal task – “Hola, …” or “Querido/a …:” fits better'));bad++}
  const q=(txt.match(/\?/g)||[]).length,iq=(txt.match(/¿/g)||[]).length;if(q>iq){out.push(L('ℹ Hay «?» sin «¿» de apertura','ℹ There are “?” without an opening “¿”'))}
  const ex=(txt.match(/!/g)||[]).length,iex=(txt.match(/¡/g)||[]).length;if(ex>iex){out.push(L('ℹ Hay «!» sin «¡» de apertura','ℹ There are “!” without an opening “¡”'))}
  const noacc=(txt.match(/(^|[^a-záéíóúñ])(esta en|tambien|despues|aqui|asi|mas que|ademas|dias|facil|dificil|adios|ingles|cafe|telefono|numero|musica|rapido|ultimo|pagina|habia|tenia|queria|podia|sabia|hacia|vivia|estaria|seria|haria|ire|sere|tendre|podre)(?=[^a-záéíóúñ]|$)/gi)||[]).length;if(noacc)out.push(L('ℹ Posibles tildes que faltan','ℹ Possibly missing accent marks')+` (${noacc})`);
  if((t.points||[]).length)out.push(L('☐ Compruebe: ¿ha tratado los '+t.points.length+' puntos de contenido?','☐ Check: have you covered all '+t.points.length+' content points?'));
  return{bad,html:out.join('<br>')||L('✓ Controles formales superados.','✓ Formal checks passed.')}}

  async store(h){try{const d=await BK.db();await new Promise(r=>{const t=d.transaction('h','readwrite');t.objectStore('h').put(h,'backup');t.oncomplete=r;t.onerror=r})}catch(e){}},
  async pick(){try{const h=await window.showDirectoryPicker({id:'et-backup',mode:'readwrite',startIn:'documents'});BK.h=h;await BK.store(h);return h}catch(e){return null}},
  async perm(ask){if(!BK.h)return false;const o={mode:'readwrite'};try{if((await BK.h.queryPermission(o))==='granted')return true;if(ask)return (await BK.h.requestPermission(o))==='granted'}catch(e){}return false},
  name(){return 'Spanish-Trainer-Backup-'+today()+'.json'},
  async write(ask){if(!(await BK.perm(ask)))return false;try{const f=await BK.h.getFileHandle(BK.name(),{create:true});const w=await f.createWritable();await w.write(JSON.stringify(S,null,1));await w.close();S.lastBackup=today();save();return true}catch(e){return false}},
  async auto(){if(!BK.ok)return;await BK.load();if(!BK.h||S.lastBackup===today())return;if(await BK.write(false))toast('💾 '+L('Copia diaria guardada en','Daily backup saved in')+' «'+BK.h.name+'».')}
};
window.backupNow=backupNow;async function backupNow(){if(BK.ok){if(!BK.h)await BK.load();if(!BK.h){toast(L('Elija la carpeta de copias.','Please choose the backup folder.'));if(!(await BK.pick()))return}
    if(await BK.write(true)){toast('💾 '+L('Copia guardada en','Backup saved in')+' «'+BK.h.name+'»: '+BK.name());return}}
  const nm=BK.name(),txt=JSON.stringify(S,null,1);
  try{const f=new File([txt],nm,{type:'application/json'});if(!BK.ok&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nm});S.lastBackup=today();save();toast(L('💾 Copia compartida.','💾 Backup shared.'));return}}catch(e){if(e&&e.name==='AbortError')return}
  S.lastBackup=today();save();download(nm,txt,'application/json')}

document.readyState!=='loading'?initSelSave():document.addEventListener('DOMContentLoaded',()=>initSelSave());
document.readyState!=='loading'?initDrawer():document.addEventListener('DOMContentLoaded',()=>initDrawer());
/* boot */
i18nBuild();load();document.documentElement.lang=LANG()==='en'?'en':'es';applyTheme();renderNav();updateBadge();renderNavFoot();renderProfileChip();CUR=decR(location.hash.slice(1))||'home';route();
setTimeout(()=>BK.auto(),2500);
/* fetch the audio packs in the background so everything works offline later (skipped on metered connections) */
setTimeout(()=>{try{const c=navigator.connection;if(c&&(c.saveData||c.type==='cellular'))return}catch(e){}if(location.protocol!=='file:')prefetchAll(()=>{const s=$('#audst');if(s)s.innerHTML=audStatus()})},6000);
window.__ET={S:()=>S,cards,UNITS,classify,check,parseItem,pluralOf,save,akey,voiceFor,sentChunks};
})();
