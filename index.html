'b1-01':{title:'Tomorrow is another day – the future',topics:['Simple future: regular and irregular forms','ir a + infinitive vs. future','Future of probability: estará en casa','Making predictions and promises'],goals:['make predictions and promises','talk about plans and projects','express assumptions about the present'],source:'Greenfield Lesson 21 (Future tense) · Libro Libre ch. 10 (The future)',
grammar:`<h3>1. Form</h3><p>Whole infinitive + <b>-é, -ás, -á, -emos, -éis, -án</b> (same endings for -ar, -er, -ir): hablaré, comerás, vivirá. Irregular stems: <b>tendr-</b> (tener), <b>pondr-</b> (poner), <b>saldr-</b> (salir), <b>vendr-</b> (venir), <b>podr-</b> (poder), <b>sabr-</b> (saber), <b>habr-</b> (haber), <b>querr-</b> (querer), <b>har-</b> (hacer), <b>dir-</b> (decir).</p>
<h3>2. Future or “ir a”?</h3><div class="rule"><b>ir a + infinitive</b>: plans and intentions, things already decided: <i>Este verano voy a hacer el Camino de Santiago.</i><br><b>future</b>: predictions, promises, the more distant or less certain future: <i>Mañana lloverá en el norte. Te llamaré, te lo prometo. Algún día viviré junto al mar.</i></div><p>In conversation the present also expresses the near future: <i>Mañana te llamo.</i></p>
<h3>3. Future of probability</h3><p>The future expresses an <b>assumption about the present</b>: <i>¿Dónde está Luis? – No sé, estará en el trabajo.</i> (= he’s probably at work) · <i>¿Qué hora es? – Serán las nueve.</i> · <i>Tendrá unos cuarenta años.</i></p><p>Useful: <i>dentro de dos años</i> (in two years’ time), <i>el año que viene / el próximo año</i>, <i>pasado mañana</i>, <i>algún día</i>, <i>cuanto antes</i>.</p>`,
pitfalls:['<b>*teneré</b> → tendré; <b>*haceré</b> → haré; <b>*saleré</b> → saldré.','<b>*Voy a llamaré</b> → Voy a llamar / Llamaré.','<b>hablaré</b> needs its accent mark.','<b>*En dos años</b> for “in two years’ time” → <b>Dentro de</b> dos años.'],
spain:'If someone says “ya te llamaré” or “ya veremos”, it isn’t always a firm promise: it often means “maybe”. Tone and context tell you everything.'},
'b1-02':{title:'If I were you… – the conditional',topics:['Simple conditional: form','Politeness: ¿podría…?, me gustaría','Advice: yo que tú, deberías','Hypotheses about the past: serían las diez'],goals:['ask for things very politely','give advice','express wishes and hypotheses'],source:'Greenfield Lesson 21 (Present conditional) · Libro Libre ch. 10 (The conditional)',
grammar:`<h3>1. Form</h3><p>Same stem as the future + <b>-ía, -ías, -ía, -íamos, -íais, -ían</b>: gustaría, podría, haría. Irregulars (as in the future): tendría, pondría, saldría, vendría, podría, sabría, habría, querría, haría, diría.</p>
<h3>2. Uses</h3><div class="rule"><b>Politeness</b>: <i>¿Podría ayudarme? Me gustaría reservar una mesa. ¿Te importaría cerrar la ventana?</i><br><b>Advice</b>: <i>Deberías descansar más. Yo que tú, hablaría con el casero. Yo en tu lugar, no lo compraría.</i><br><b>Wishes</b>: <i>Me encantaría vivir en Cádiz. Preferiría quedarme en casa.</i><br><b>Hypotheses</b>: <i>Con más dinero, viajaría más.</i> (with <i>si</i> + imperfect subjunctive → B2)</div><p>Probability in the past: <i>¿A qué hora llegó? – Serían las once.</i> (= it was probably eleven).</p>`,
pitfalls:['<b>*Podería</b> → podría; <b>*tenería</b> → tendría.','<b>*Me gustaría que vienes</b> → Me gustaría que vinieras (B2).','<b>*Yo que tú, iré al médico</b> → Yo que tú, iría al médico.','<b>*¿Puedes me ayudar?</b> → ¿Podrías ayudarme?'],
spain:'“¿Me podrías…?” and “¿Te importaría…?” soften any request. In a shop or on the phone with officials, “Querría / Quería saber si…” is the standard formula.'},
'b1-03':{title:'I want you to come – the present subjunctive',topics:['Forming the present subjunctive','Irregulars: sea, esté, vaya, haya, sepa, dé','Wishes and requests: quiero que, espero que, ojalá','Same subject (infinitive) vs. different subject (que + subjunctive)'],goals:['form the present subjunctive','express wishes for other people','use ojalá and good-wish formulas'],source:'Greenfield Lessons 17–18 (Present subjunctive, Irregular present subjunctives) · Libro Libre ch. 10 (Introduction to the subjunctive)',
grammar:`<h3>1. Formation</h3><p>“yo” form of the present → drop <b>-o</b> → “opposite” ending: -ar → <b>-e</b> (hable, hables, hable, hablemos, habléis, hablen), -er/-ir → <b>-a</b> (coma, viva). So: <i>tener → tenga, hacer → haga, decir → diga, poner → ponga, salir → salga, venir → venga, conocer → conozca, ver → vea</i>. Stem changes as in the present: <i>quiera, pueda, pida, duerma (durmamos)</i>. Spelling: <i>llegue, busque, empiece</i>.</p>
<div class="rule">Irregulars: <b>ser</b> → sea · <b>estar</b> → esté · <b>ir</b> → vaya · <b>haber</b> → haya · <b>saber</b> → sepa · <b>dar</b> → dé</div>
<h3>2. Wishes and requests</h3><div class="rule"><b>Same subject</b> → infinitive: <i>Quiero ir a la fiesta.</i> (I want, I go)<br><b>Different subject</b> → <b>que + subjunctive</b>: <i>Quiero que vengas a la fiesta.</i> (I want, you come)</div><p>Verbs: <i>querer que, esperar que, preferir que, necesitar que, pedir que, desear que</i>. <b>Ojalá</b> (+ que) + subjunctive: <i>¡Ojalá haga buen tiempo mañana!</i></p>
<h3>3. Good wishes (very common)</h3><p><i>¡Que te vaya bien!</i> (all the best) · <i>¡Que lo pases bien!</i> (have fun) · <i>¡Que aproveche!</i> (enjoy your meal) · <i>¡Que te mejores!</i> (get well) · <i>¡Que descanses!</i> (rest well) · <i>¡Que tengas suerte!</i> (good luck) · <i>¡Que cumplas muchos más!</i> (many happy returns)</p>`,
pitfalls:['<b>*Quiero que vienes</b> → Quiero que vengas.','<b>*Quiero que yo vaya</b> → Quiero ir.','<b>*Ojalá hace sol</b> → Ojalá haga sol.','<b>*Espero que estás bien</b> → Espero que estés bien.'],
spain:'When a meal starts, someone always says “<b>¡Que aproveche!</b>” (or “¡Buen provecho!”). When saying goodbye to someone who is ill: “<b>¡Que te mejores!</b>”. And when someone goes on holiday: “<b>¡Que lo pases muy bien!</b>”.'},
'b1-04':{title:'I’m glad you’re here – emotions and judgements',topics:['Emotions + que + subjunctive: me alegra que, me molesta que','Judgements: es importante / necesario / normal que','es verdad / está claro que + indicative','Recommendations: te recomiendo / aconsejo que'],goals:['express feelings about what others do','judge situations','give recommendations'],source:'Greenfield Lesson 17 (Present subjunctive – uses) · Libro Libre ch. 10',
grammar:`<h3>1. Emotions</h3><p>gustar-type verbs + <b>que + subjunctive</b> when there is another subject:</p><div class="rule"><i>Me alegra que estés aquí. Me molesta que la gente hable tan alto. Me encanta que me llames. Me da pena que te vayas. Me preocupa que no duerma bien.</i><br>Also: <i>Estoy contento de que… Siento que… Tengo miedo de que…</i></div><p>Same subject → infinitive: <i>Me alegra verte. Siento llegar tarde.</i></p>
<h3>2. Impersonal judgements</h3><p><b>Es + adjective + que + subjunctive</b>: <i>Es importante que llegues puntual. Es normal que estés nervioso. Es mejor que lo hablemos. Es una pena que no puedas venir.</i> No specific subject → infinitive: <i>Es importante dormir bien.</i></p>
<div class="rule">Careful! Expressions of <b>certainty</b> take the <b>indicative</b>: <i>Es verdad que es caro. Está claro que tienes razón. Es evidente que llueve.</i></div>
<h3>3. Recommending and advising</h3><p><i>Te recomiendo que pruebes el pulpo. Le aconsejo que pida cita previa. Os sugiero que vengáis pronto.</i></p>`,
pitfalls:['<b>*Me alegra que estás aquí</b> → Me alegra que estés aquí.','<b>*Es verdad que sea caro</b> → Es verdad que es caro.','<b>*Es importante que dormir</b> → Es importante dormir / que duermas.','<b>*Siento que llego tarde</b> → Siento llegar tarde.'],
spain:'“¡Qué pena que no puedas venir!” and “¡Qué bien que hayas venido!” are typical reactions. With “qué” in front, the sentence becomes even more expressive – and the subjunctive still follows.'},
'b1-05':{title:'I think so, I don’t think… – opinion and doubt',topics:['creo / pienso / me parece que + indicative','no creo / no pienso que + subjunctive','Doubt: dudo que, quizás, tal vez, a lo mejor','Giving opinions, agreeing and disagreeing'],goals:['give and ask for opinions','express agreement, disagreement and doubt','use indicative or subjunctive correctly with opinion verbs'],source:'Greenfield Lessons 17 and 30 (Subjunctive, Survey of moods) · MFLE Reference Grammar (Subjunctive)',
grammar:`<h3>1. Positive opinion → indicative</h3><div class="rule"><i>Creo que el metro es la mejor opción. Pienso que tienes razón. Me parece que va a llover. Estoy seguro de que vendrá.</i></div>
<h3>2. Negative opinion → subjunctive</h3><div class="rule"><i>No creo que sea buena idea. No pienso que tengas razón. No me parece que esté bien. No estoy seguro de que venga.</i></div><p>But in negative questions the indicative is usual: <i>¿No crees que es tarde?</i></p>
<h3>3. Doubt and possibility</h3><p><b>Dudo que</b> + subjunctive · <b>Es posible / probable que</b> + subjunctive · <b>Quizás / tal vez</b> + subjunctive (or indicative if more certain) · <b>A lo mejor</b> + <b>indicative</b> (always): <i>A lo mejor voy mañana.</i></p>
<h3>4. Giving opinions in conversation</h3><p><i>En mi opinión… · Para mí… · Desde mi punto de vista… · ¿Tú qué opinas? · ¿Qué te parece?</i> · Agreeing: <i>Estoy de acuerdo contigo. Tienes razón. Eso es. Claro.</i> · Disagreeing: <i>No estoy de acuerdo. Yo no lo veo así. Depende. Sí, pero…</i></p>`,
pitfalls:['<b>*Creo que sea verdad</b> → Creo que es verdad.','<b>*No creo que es verdad</b> → No creo que sea verdad.','<b>*A lo mejor llueva</b> → A lo mejor llueve.','<b>*Estoy de acuerdo con ti</b> → contigo.'],
spain:'In a Spanish conversation it’s normal to interrupt and give opinions passionately – “¡Qué va!”, “Hombre, depende…”, “Ya, pero…”. It isn’t aggressive: it’s taking part.'},
'b1-06':{title:'When you arrive, call me – time and purpose',topics:['cuando + subjunctive (future) / + indicative (habit, past)','en cuanto, hasta que, antes de que, después de que','para + infinitive / para que + subjunctive','sin + infinitive / sin que'],goals:['talk about linked future actions','express purpose','organise paperwork and appointments'],source:'Greenfield Lessons 17–18 and 30 (Subjunctive in adverbial clauses)',
grammar:`<h3>1. cuando: indicative or subjunctive?</h3><p><b>Indicative</b> for habits or general facts (<i>Cuando llego a casa, ceno</i>) and for the past (<i>Cuando llegué, ya estaban allí</i>). <b>Subjunctive</b> for the <b>future</b> (it hasn’t happened yet): <i>Cuando llegues a casa, llámame. Cuando tenga tiempo, te ayudaré.</i></p>
<div class="rule">The same with <b>en cuanto</b> (as soon as), <b>hasta que</b> (until), <b>mientras</b> (while), <b>después de que</b>: <i>En cuanto sepa algo, te aviso. Espera aquí hasta que vuelva.</i><br><b>antes de que</b> always takes the subjunctive: <i>Vámonos antes de que llueva.</i></div><p>Never the future after <i>cuando</i>! <s>Cuando llegarás</s> → <i>Cuando llegues</i>. But in a question it’s fine: <i>¿Cuándo llegarás?</i></p>
<h3>2. Purpose: para / para que</h3><div class="rule">Same subject → <b>para + infinitive</b>: <i>Ahorro para comprar un piso.</i><br>Different subject → <b>para que + subjunctive</b>: <i>Te lo explico para que lo entiendas.</i></div><p><b>sin + infinitive</b> / <b>sin que + subjunctive</b>: <i>Se fue sin despedirse. Se fue sin que nadie lo viera.</i> (B2)</p>
<h3>3. Paperwork vocabulary</h3><p><i>pedir cita previa</i> (book an official appointment) · <i>rellenar un formulario</i> (fill in a form) · <i>el justificante</i> (proof/receipt) · <i>el certificado de empadronamiento</i> · <i>la ventanilla</i> (counter) · <i>el plazo</i> (deadline) · <i>presentar una solicitud</i> (submit an application) · <i>adjuntar un documento</i> (attach a document).</p>`,
pitfalls:['<b>*Cuando llegarás, llámame</b> → Cuando llegues, llámame.','<b>*Te llamo cuando tengo tiempo</b> (future) → cuando tenga tiempo.','<b>*para que lo entender</b> → para que lo entiendas.','<b>*Ahorro para que compre un piso</b> (same subject) → para comprar.'],
spain:'Spanish administration runs on <b>cita previa</b> and a <b>justificante</b>. A tip: “Cuando vayas, lleva fotocopias de todo” (when you go, take photocopies of everything).'},
'b1-07':{title:'The flat I’m looking for – relative clauses',topics:['que, quien, donde, lo que','el que / la que / los que after a preposition','Relative + indicative (known) or subjunctive (unknown)','Describing what you’re looking for'],goals:['join sentences with relatives','describe something you’re looking for or need','define things and people'],source:'Greenfield Lesson 16 (Relative pronouns) · MFLE Reference Grammar (Relative pronouns)',
grammar:`<h3>1. Basic relatives</h3><p><b>que</b> – the most frequent, for people and things: <i>El piso que vimos ayer. La chica que trabaja conmigo.</i> · <b>donde</b> = where: <i>El barrio donde vivo es tranquilo.</i> · <b>lo que</b> = the thing that / what: <i>No entiendo lo que dices. Lo que más me gusta es el clima.</i> · <b>quien / quienes</b> = people, especially after a preposition: <i>La persona con quien hablé.</i></p>
<h3>2. Preposition + article + que</h3><div class="rule"><i>La empresa en la que trabajo. El amigo con el que viajé. Las personas a las que invité. El tema del que hablamos.</i> (the article agrees with the antecedent)</div>
<h3>3. Indicative or subjunctive?</h3><p>The antecedent is <b>known / exists</b> → indicative: <i>Vivo en un piso que tiene terraza.</i> The antecedent is <b>unknown / sought / doesn’t exist</b> → subjunctive: <i>Busco un piso que tenga terraza. No hay nadie que lo sepa. ¿Conoces a alguien que hable ruso?</i></p><p>With unknown people there is no personal <i>a</i>: <i>Busco a la chica que habla ruso</i> (known) / <i>Busco una chica que hable ruso</i> (anyone).</p>
<h3>4. Defining</h3><p><i>Es una cosa que sirve para… · Es un lugar donde… · Es una persona que…</i> – very useful when you don’t know a word.</p>`,
pitfalls:['<b>*El piso cual vimos</b> → El piso que vimos.','<b>*No entiendo que dices</b> → No entiendo lo que dices.','<b>*Busco un piso que tiene ascensor</b> (I don’t have it yet) → que tenga ascensor.','<b>*La empresa que trabajo</b> → La empresa en la que trabajo.'],
spain:'In flat ads you’ll see: <i>exterior</i> (facing the street), <i>interior</i> (facing the courtyard), <i>reformado</i> (renovated), <i>con ascensor</i>, <i>gastos de comunidad incluidos</i>. “Busco un piso que sea exterior y tenga ascensor” is a sentence you’ll repeat a lot.'},
'b1-08':{title:'She had already left – the pluperfect',topics:['había + participle','Earlier in the past: ya, todavía no, nunca antes','Narrating with four past tenses','Reacting to a story'],goals:['say what had happened before another past moment','combine past tenses in a narrative','react to anecdotes'],source:'Greenfield Lesson 27 (Past perfect indicative)',
grammar:`<h3>1. Form</h3><p>Imperfect of <b>haber</b> + participle: <i>había, habías, había, habíamos, habíais, habían</i> + hablado / comido / hecho…</p>
<h3>2. Use: the past of the past</h3><div class="rule"><i>Cuando llegamos al cine, la película ya había empezado.</i> (first the film started, then we arrived)<br><i>Nunca había visto el mar antes de venir a España.</i><br><i>Me dijo que había perdido las llaves.</i></div><p>Markers: <i>ya, todavía no, nunca (antes), antes, aquel día…</i></p>
<h3>3. The four past tenses in a story</h3><p><b>perfect</b> – recent past / current period: <i>Hoy me ha pasado algo increíble.</i> · <b>preterite</b> – the events: <i>Salí de casa, cogí el metro…</i> · <b>imperfect</b> – the scene: <i>Había mucha gente y hacía calor.</i> · <b>pluperfect</b> – what happened before: <i>…y me di cuenta de que había olvidado la cartera.</i></p>
<h3>4. Reacting</h3><p><i>¿En serio? · ¡No me digas! · ¡Qué fuerte! · ¡Qué mala suerte! · ¡Qué bien! · ¿Y qué pasó después? · ¡Menos mal!</i> (thank goodness)</p>`,
pitfalls:['<b>*Cuando llegué, la película ya empezaba</b> → ya había empezado.','<b>*Había hacido</b> → había hecho.','<b>*Había lo visto</b> → Lo había visto.','<b>*Habían mucha gente</b> → Había mucha gente.'],
spain:'“¡Qué fuerte!” is the quintessential Spanish reaction to something surprising (good or bad). “¡No me digas!” and “¡Anda ya!” express disbelief.'},
'b1-09':{title:'Don’t worry! – negative commands and pronouns',topics:['Negative imperative = no + subjunctive','Pronouns go before the verb in the negative','Combining: dímelo / no me lo digas','Rules, advice and warnings'],goals:['forbid and advise','reassure someone','understand signs and rules'],source:'Greenfield Lesson 19 (Commands) · Libro Libre ch. 10 (The imperative)',
grammar:`<h3>1. Negative imperative</h3><p>Always <b>no + present subjunctive</b>: tú <i>no hables, no comas, no vayas, no hagas</i> · usted <i>no hable, no coma</i> · vosotros <i>no habléis, no comáis</i> · ustedes <i>no hablen, no coman</i>.</p>
<h3>2. Pronouns</h3><div class="rule">Affirmative → <b>after, attached</b>: <i>Dímelo. Siéntate. Cómpralo. Dáselo.</i><br>Negative → <b>before, separate</b>: <i>No me lo digas. No te sientes ahí. No lo compres. No se lo des.</i></div><p>Accent marks: <i>di + me + lo → dímelo; compra + lo → cómpralo; da + se + lo → dáselo</i>.</p>
<h3>3. Very frequent phrases</h3><p><i>¡No te preocupes! · ¡No pasa nada! · ¡No te olvides de…! · ¡No me digas! · No hace falta. · ¡No te pierdas…! · No dejes la puerta abierta.</i></p><p>Signs use the infinitive or “se”: <i>No fumar. Prohibido aparcar. No se admiten perros.</i></p>`,
pitfalls:['<b>*No habla</b> (command to tú) → No hables.','<b>*No dímelo</b> → No me lo digas.','<b>*No vas</b> (command) → No vayas.','<b>*Lo no toques</b> → No lo toques.'],
spain:'“No te preocupes” and “No pasa nada” are heard constantly in Spain: to reassure, to forgive a small mistake or to say “you’re welcome”. They are essential phrases.'},
'b1-10':{title:'She told me that… – reported speech',topics:['Reporting what someone says: dice que + present','In the past: dijo que + imperfect / pluperfect / conditional','Indirect questions: me preguntó si / dónde','Requests: me pidió que + subjunctive'],goals:['report what someone has said','pass on questions and requests','leave and pass on messages'],source:'Greenfield Lesson 30 (Survey of moods and tenses) · FSI conversation stimulus (reporting)',
grammar:`<h3>1. Present: dice que…</h3><p>If the reporting verb is in the present, tenses don’t change: <i>«Estoy cansada». → Dice que está cansada.</i> Persons and pronouns change: <i>«Mi coche…» → Dice que su coche…</i></p>
<h3>2. Past: dijo que…</h3><p>present → <b>imperfect</b> (<i>vivía en Lugo</i>) · preterite / perfect → <b>pluperfect</b> (<i>lo había visto</i>) · future → <b>conditional</b> (<i>iría al día siguiente</i>) · ir a → <i>iba a llamar</i>. Also: <i>hoy → aquel día, mañana → al día siguiente, aquí → allí, este → ese/aquel</i>.</p>
<h3>3. Questions and requests</h3><div class="rule">Yes/no question → <b>si</b>: <i>«¿Vienes?» → Me preguntó si iba.</i><br>Question word → kept (with accent): <i>«¿Dónde vives?» → Me preguntó dónde vivía.</i><br>Command or request → <b>que + subjunctive</b>: <i>«Llámame» → Me dice que lo llame / Me dijo que lo llamara (B2).</i></div><p>Useful verbs: <i>decir, comentar, contar, explicar, preguntar, pedir, recomendar, avisar, prometer</i>.</p>`,
pitfalls:['<b>*Me preguntó que si vienes</b> → Me preguntó si venía.','<b>*Dijo que vendrá mañana</b> (reported days later) → Dijo que vendría al día siguiente.','<b>*Me preguntó dónde vivo</b> (in the past) → dónde vivía.','<b>*Me pidió que lo llamo</b> → que lo llamara / llame.'],
spain:'At work people leave lots of messages: “Ha llamado tu madre, dice que la llames”, “Ha venido el técnico y ha dicho que vuelve mañana”. Note that with the perfect (“ha dicho”) many speakers don’t change the tense.'},
'b1-11':{title:'I’ve just arrived – verb phrases',topics:['acabar de + infinitive','volver a + infinitive','dejar de / empezar a / ponerse a','seguir + gerund, llevar + time + gerund','hay que / tener que / deber'],goals:['express nuances of time and the start/end of actions','say how long you have been doing something','express obligation'],source:'FSI Units (Pattern drills: verb constructions) · Greenfield Lessons 15 and 24',
grammar:`<h3>1. Start, end, repetition</h3><p><b>acabar de</b> + inf. = just (done): <i>Acabo de llegar.</i> · <b>empezar a / ponerse a</b> + inf. = start to: <i>Empecé a estudiar en enero. Se puso a llorar.</i> · <b>dejar de</b> + inf. = stop doing: <i>He dejado de fumar.</i> · <b>volver a</b> + inf. = do again: <i>¿Puedes volver a explicarlo?</i> · <b>estar a punto de</b> + inf. = be about to: <i>Estoy a punto de salir.</i></p>
<h3>2. Continuity and duration</h3><div class="rule"><b>seguir</b> + gerund = still / keep on: <i>¿Sigues viviendo en Málaga? Sigue lloviendo.</i><br><b>llevar</b> + time + gerund = to have been doing for: <i>Llevo dos años estudiando español.</i> (= Hace dos años que estudio español.) · <i>¿Cuánto tiempo llevas aquí?</i></div>
<h3>3. Obligation</h3><p><b>tener que</b> (personal): <i>Tengo que renovar el NIE.</i> · <b>hay que</b> (impersonal, general): <i>Hay que pedir cita.</i> · <b>deber</b> (moral duty / advice): <i>Debes respetar las normas.</i> · <b>no hace falta</b> + inf. / que + subj. (not necessary).</p>`,
pitfalls:['<b>*Acabo llegar</b> → Acabo de llegar.','<b>*He parado de fumar</b> → He dejado de fumar.','<b>*Estudio español desde dos años</b> → Llevo dos años estudiando / Estudio español desde hace dos años.','<b>*Hay que tú vengas</b> → Tienes que venir.'],
spain:'“¿Cuánto tiempo llevas en España?” is one of the first questions you’ll be asked. A natural answer: “Llevo un año y medio aquí.”'},
'b1-12':{title:'However… – connectors and arguing',topics:['Cause: porque, como, ya que, es que','Consequence: por eso, así que, por lo tanto','Contrast: pero, sino, sin embargo, aunque','Ordering ideas: en primer lugar, además, por último','Structuring an opinion'],goals:['argue for and against','link ideas in a text or a spoken contribution','give reasons and draw conclusions'],source:'MFLE Reference Grammar (Conjunctions) · Greenfield Lesson 30',
grammar:`<h3>1. Cause</h3><p><b>porque</b> (after the main idea): <i>No voy porque estoy cansado.</i> · <b>como</b> (always at the start): <i>Como estoy cansado, no voy.</i> · <b>ya que / puesto que</b> (more formal) · <b>es que…</b> (to justify yourself, colloquial) · <b>por</b> + noun / infinitive: <i>por el tráfico</i>.</p>
<h3>2. Consequence</h3><p><i>por eso, así que, por lo tanto</i> (formal), <i>entonces</i>: <i>Estaba cerrado, así que volvimos a casa.</i></p>
<h3>3. Contrast</h3><div class="rule"><b>pero</b> = but · <b>sino</b> = but rather (after a negative): <i>No es inglés sino irlandés.</i> · <b>sin embargo / no obstante</b> = however · <b>aunque</b> + indicative (fact): <i>Aunque llueve, salimos.</i> · <b>en cambio / mientras que</b> = whereas · <b>a pesar de</b> + noun/infinitive.</div>
<h3>4. Organising what you say</h3><p><i>En primer lugar… · Por un lado… por otro (lado)… · Además… · También… · Incluso… · Por ejemplo… · Es decir… · En resumen… · En conclusión… · Por último…</i></p><p>A model structure: <b>opinion</b> (Creo que…) → <b>argument 1</b> + example → <b>argument 2</b> (Además…) → <b>counter-argument</b> (Es verdad que…, sin embargo…) → <b>conclusion</b> (Por todo esto…).</p>`,
pitfalls:['<b>*Porque estoy cansado, no voy</b> (at the start) → Como estoy cansado, no voy.','<b>*No es caro pero barato</b> → No es caro sino barato.','<b>*Sin embargo que</b> → Sin embargo, … / aunque…','<b>*¿Porqué?</b> → ¿Por qué? (question) / porque (answer).'],
spain:'In conversation “es que…” is the most Spanish way to justify yourself: “¿Por qué no viniste?” – “Es que tenía mucho trabajo”. It sounds natural and friendly.'},
'b2-01':{title:'I wanted you to come – the imperfect subjunctive',topics:['Formed from the 3rd person plural of the preterite','-ra and -se','Sequence of tenses: quería que + imperfect subjunctive','como si, ojalá + imperfect subjunctive'],goals:['use the subjunctive in past contexts','express unlikely wishes','make unreal comparisons with “como si”'],source:'Greenfield Lesson 31 (Past subjunctive)',
grammar:`<h3>1. Formation</h3><p>3rd person plural of the preterite → drop <b>-ron</b> → add <b>-ra, -ras, -ra, -ramos, -rais, -ran</b>: hablaron → hablara, comieron → comiera, tuvieron → tuviera, fueron → fuera, hicieron → hiciera, dijeron → dijera, pudieron → pudiera, pidieron → pidiera, durmieron → durmiera, leyeron → leyera.</p><p>The <b>-se</b> form (hablase, tuviese) is equivalent; in Spain it’s heard quite a lot, especially in the north and in careful speech. Accent in nosotros: <i>habláramos, tuviéramos</i>.</p>
<h3>2. Uses</h3><div class="rule"><b>Sequence of tenses</b>: if the main verb is past or conditional, the subjunctive becomes imperfect: <i>Quiero que vengas → Quería que vinieras. Me pidió que la llamara. Me gustaría que habláramos.</i><br><b>Unlikely or impossible wishes</b>: <i>¡Ojalá tuviera más tiempo!</i> (vs <i>Ojalá tenga</i> = possible)<br><b>Como si</b> + imperfect subjunctive: <i>Habla como si fuera el jefe.</i></div><p>Politeness: <i>Quisiera</i> (= I would like) <i>hablar con el director.</i></p>`,
pitfalls:['<b>*Quería que vienes</b> → Quería que vinieras.','<b>*tenieran</b> → tuvieran; <b>*hacieran</b> → hicieran.','<b>*como si es</b> → como si fuera.','<b>*hablaramos</b> without accent → habláramos.'],
spain:'“Quisiera…” is the most formal way to ask for something (in a hotel, in a letter). In everyday conversation you hear “quería…” or “me gustaría…” more.'},
'b2-02':{title:'If I had time… – conditional sentences',topics:['Real condition: si + present → present/future/imperative','Unlikely condition: si + imperfect subjunctive → conditional','Impossible (past) condition: si + pluperfect subjunctive → perfect conditional','Others: en caso de que, siempre que, a no ser que'],goals:['talk about real, hypothetical and impossible conditions','imagine other lives','regret what didn’t happen'],source:'Greenfield Lessons 32 and 35 (Simple conditions, Present unreal conditions, Past contrary-to-fact conditions)',
grammar:`<h3>1. Three types of condition</h3><p><b>Real / possible</b>: si + present indicative → present, future, imperative: <i>Si llueve, nos quedamos en casa.</i><br><b>Unlikely / unreal in the present</b>: si + imperfect subjunctive → conditional: <i>Si tuviera tiempo, aprendería a bailar.</i><br><b>Impossible (past)</b>: si + pluperfect subjunctive → perfect conditional: <i>Si lo hubiera sabido, te habría llamado.</i></p>
<div class="rule">Never future or conditional after conditional <b>si</b>! <s>Si tendré</s> / <s>Si tendría</s> → <i>Si tengo / Si tuviera</i>.</div><p>Mixed: <i>Si hubiera estudiado Medicina, ahora sería médico.</i> (past → present)</p>
<h3>2. Other conditional conjunctions (+ subjunctive)</h3><p><i>en caso de que</i> (in case), <i>siempre que / con tal de que</i> (provided that), <i>a no ser que / a menos que</i> (unless): <i>Te lo dejo siempre que me lo devuelvas. Iremos a la playa a no ser que llueva.</i></p><p><b>de + infinitive</b> (more formal): <i>De haberlo sabido, no habría venido.</i></p>`,
pitfalls:['<b>*Si tendría dinero…</b> → Si tuviera dinero…','<b>*Si llueve, nos quedaríamos</b> → Si llueve, nos quedamos / Si lloviera, nos quedaríamos.','<b>*Si lo habría sabido</b> → Si lo hubiera sabido.','<b>*a no ser que llueve</b> → a no ser que llueva.'],
spain:'In spoken Spanish in Spain you often hear “Si lo hubiera sabido, te <b>hubiera llamado</b>” (with -ra in both halves). It’s acceptable; “habría llamado” is the more recommended form in writing.'},
'b2-03':{title:'It would have been better… – compound subjunctive and conditional',topics:['Perfect subjunctive: haya hecho','Pluperfect subjunctive: hubiera hecho','Perfect conditional: habría hecho','Reproaches and regrets'],goals:['judge events that have happened','express regret and reproach','make assumptions about the past'],source:'Greenfield Lessons 29 and 34 (Perfect conditional, Past perfect subjunctive)',
grammar:`<h3>1. Perfect subjunctive: haya + participle</h3><p>To judge a <b>recent</b> past event, or one completed before a future moment: <i>Me alegro de que hayas venido. No creo que haya llegado todavía. Espero que lo hayáis pasado bien. Cuando hayas terminado, avísame.</i></p>
<h3>2. Pluperfect subjunctive: hubiera + participle</h3><p>For something before a past moment, and for impossible wishes: <i>Me sorprendió que no hubieras llamado. ¡Ojalá no hubiera dicho eso! Me habría gustado que hubieras estado allí.</i></p>
<h3>3. Perfect conditional: habría + participle</h3><p>Unreal action in the past: <i>Yo no lo habría hecho.</i> · Reproach: <i>Habría sido mejor avisar antes.</i> · Probability further back in the past: <i>Cuando llegué, ya se habrían ido.</i></p><p>Very common reproaches: <i>¡Haberlo dicho antes!</i> (You should have said so earlier!) · <i>Deberías haber llamado. Tendrías que haberme avisado.</i></p>`,
pitfalls:['<b>*Me alegro de que has venido</b> → de que hayas venido.','<b>*Ojalá no había dicho eso</b> → Ojalá no hubiera dicho eso.','<b>*Deberías haber llamaste</b> → Deberías haber llamado.','<b>*Yo no lo haría hecho</b> → Yo no lo habría hecho.'],
spain:'“¡Haberlo dicho!” is a very typical reaction in Spain when someone complains too late: “Es que yo no quería ir a ese restaurante” – “¡Pues haberlo dicho!”'},
'b2-04':{title:'For sale, was built – the passive and impersonal constructions',topics:['Passive with ser: fue construido por…','Reflexive passive: se venden pisos','Impersonal: se + 3rd sg., generic tú, uno','estar + participle (result)'],goals:['understand news and formal texts','present information without an agent','choose between ser + participle and se'],source:'Greenfield Lesson 36 (Passive voice) · Libro Libre ch. 8 (The impersonal and passive se)',
grammar:`<h3>1. Passive with “ser”</h3><p><b>ser + participle</b> (agrees with the subject) + <b>por</b> (agent): <i>La Alhambra fue construida por los nazaríes. Los ladrones fueron detenidos por la policía.</i> Typical of the press, history and formal texts; rare in conversation.</p>
<h3>2. Reflexive passive – the most common</h3><div class="rule"><b>se + verb in the 3rd person</b> (singular or plural depending on the subject), no agent: <i>Se vende piso. Se venden pisos. Se construyó en el siglo XIV. Se han detectado varios casos.</i></div>
<h3>3. Impersonal</h3><p><b>se + 3rd singular</b> with people or no object: <i>En España se vive bien. Se busca a los responsables.</i> · <b>generic tú</b> (very colloquial): <i>Aquí pagas y te sientas donde quieras.</i> · <b>uno/una</b>: <i>Uno nunca sabe.</i> · <b>3rd plural</b> (someone): <i>Dicen que va a subir el precio.</i></p>
<h3>4. estar + participle = result</h3><p><i>La tienda está cerrada. El problema está resuelto. La mesa está reservada.</i> (compare: <i>La tienda fue cerrada por la policía</i> – action)</p>`,
pitfalls:['<b>*Se vende pisos</b> → Se venden pisos.','<b>*La catedral fue construido</b> → fue construida.','<b>*Fue construido de los romanos</b> → por los romanos.','<b>*La puerta es abierta</b> (result) → está abierta.'],
spain:'Spanish newspaper headlines use the reflexive passive and the present a lot: “<b>Se disparan</b> los precios del alquiler” (rents soar), “<b>Detenidos</b> dos jóvenes por…” (participle without a verb).'},
'b2-05':{title:'By then I’ll have finished – future perfect and probability',topics:['Future perfect: habré hecho','Action completed before a future moment','Probability about the recent past: habrá salido','Summary: degrees of probability'],goals:['talk about what will have happened at a future moment','make assumptions about the recent past','grade your certainty'],source:'Greenfield Lesson 29 (Future perfect indicative)',
grammar:`<h3>1. Form</h3><p>Future of <b>haber</b> + participle: <i>habré, habrás, habrá, habremos, habréis, habrán</i> + hablado / hecho…</p>
<h3>2. Before a future moment</h3><div class="rule"><i>Para junio habré terminado el máster. Cuando llegues, ya habremos cenado. Dentro de diez años habrán construido la nueva línea de metro.</i></div>
<h3>3. Assumption about the recent past</h3><p>Just as the simple future expresses probability in the present, the future perfect expresses it about something that <b>has happened</b>: <i>No contesta… Habrá salido.</i> (= he has probably gone out) · <i>¿Por qué no ha venido Luis? – Se le habrá olvidado.</i></p>
<h3>4. Degrees of probability</h3><p>certain: <i>Está en casa / Ha salido / Salió.</i> · probable: <i>Estará en casa / Habrá salido / Saldría.</i> · possible: <i>Puede que esté / A lo mejor está · Puede que haya salido · Puede que saliera.</i></p>`,
pitfalls:['<b>*Para junio terminaré</b> (meaning “will be finished”) → habré terminado.','<b>*Habrá salió</b> → Habrá salido.','<b>*Puede que ha salido</b> → Puede que haya salido.','<b>*A lo mejor haya salido</b> → A lo mejor ha salido.'],
spain:'When someone is late, the typical explanation is: “Habrá pillado un atasco” (he must have got stuck in traffic) or “Se habrá quedado dormido” (he must have overslept). “Pillar” is very colloquial (= to catch, to run into).'},
'b2-06':{title:'Even if it rains – concession and cause',topics:['aunque + indicative (fact) / + subjunctive (hypothesis or irrelevant fact)','por mucho que, por más que, a pesar de que','Cause: como, ya que, puesto que, dado que, debido a','Consequence: de ahí que + subjunctive, tan… que'],goals:['argue with nuance','acknowledge opposing arguments without accepting them','explain causes and consequences in a formal register'],source:'Greenfield Lesson 30 (Survey of moods) · MFLE Reference Grammar (Conjunctions)',
grammar:`<h3>1. aunque: indicative or subjunctive</h3><p><b>aunque + indicative</b> = a real fact, new information: <i>Aunque llueve, vamos a salir.</i> (I know it’s raining) · <b>aunque + subjunctive</b> = hypothesis, or a fact that doesn’t matter: <i>Aunque llueva, vamos a salir.</i> (rain or no rain) · <i>Aunque tengas razón, no me convences.</i> With the imperfect subjunctive = very unlikely: <i>Aunque me pagaran el doble, no trabajaría allí.</i></p>
<h3>2. Other concessives</h3><p><b>por mucho que / por más que</b> + subjunctive (or indicative for a fact): <i>Por mucho que lo intente, no lo consigo.</i> · <b>a pesar de que</b> · <b>a pesar de</b> + noun/infinitive · <b>aun así</b> (even so) · <b>si bien</b> (formal).</p>
<h3>3. Cause (formal register)</h3><p><b>ya que / puesto que / dado que</b> + indicative: <i>Dado que el plazo termina hoy, les rogamos que…</i> · <b>debido a</b> + noun: <i>debido a la huelga</i> · <b>no porque… sino porque</b>: <i>No lo digo porque sea mi amigo, sino porque es verdad.</i></p>
<h3>4. Consequence</h3><p><b>tan</b> + adj + <b>que</b> / <b>tanto</b> + noun + <b>que</b>: <i>Había tanta gente que no pudimos entrar.</i> · <b>de ahí que</b> + subjunctive (formal): <i>El alquiler ha subido mucho; de ahí que muchos jóvenes vivan con sus padres.</i> · <b>por consiguiente / en consecuencia</b>.</p>`,
pitfalls:['<b>*Aunque lloverá</b> → Aunque llueva / Aunque llueve.','<b>*Por mucho que lo intento</b> (hypothesis) → Por mucho que lo intente.','<b>*debido a que la huelga</b> → debido a la huelga.','<b>*de ahí que viven</b> → de ahí que vivan.'],
spain:'In TV debates and talk shows (tertulias), “Ya, pero…”, “Vale, aun así…” and “No es por nada, pero…” are the colloquial ways to introduce an objection.'},
'b2-07':{title:'He got nervous – verbs of change and advanced ser/estar',topics:['ponerse + adjective (quick change)','volverse, hacerse, quedarse, convertirse en, llegar a ser','ser/estar with evaluative adjectives: es lógico, está bien','estar + adjective for a subjective impression: ¡qué guapa estás!'],goals:['describe changes of state and personality','use ser and estar with nuance','avoid translating “become” literally'],source:'MFLE Reference Grammar (Ser and estar) · FSI Unit 7 (Review drill ser – estar)',
grammar:`<h3>1. “To become” in Spanish</h3><p><b>ponerse</b> + adj. – quick, temporary change (emotions, appearance): <i>Se puso rojo. Me pongo nervioso en los exámenes.</i> · <b>quedarse</b> + adj. – result of something, often negative or surprising: <i>Se quedó sorprendido. Me quedé sin trabajo.</i> · <b>volverse</b> + adj. – deep, lasting change of character: <i>Se volvió muy desconfiado.</i> · <b>hacerse</b> + adj./noun – voluntary or gradual (profession, ideology, religion): <i>Se hizo médico. Se hizo vegetariano. Se está haciendo tarde.</i> · <b>convertirse en</b> + noun – total transformation: <i>El pueblo se convirtió en un destino turístico.</i> · <b>llegar a ser</b> – after effort, an achievement: <i>Llegó a ser directora.</i></p>
<h3>2. ser/estar with nuance</h3><p><b>ser</b> + evaluative adjective + que/infinitive: <i>Es lógico que estés enfadado.</i> · <b>estar bien / mal</b> (judging an action): <i>Está bien que lo digas. Eso no está bien.</i></p><p><b>estar</b> + adjective = subjective impression or change from the norm: <i>¡Qué guapa estás hoy! El niño está muy alto. La paella está salada.</i> Expressions: <i>estar de acuerdo, de vacaciones, de pie, de mal humor, de moda; estar para + inf.</i></p>`,
pitfalls:['<b>*Llegué nervioso</b> (became) → Me puse nervioso.','<b>*Se convirtió médico</b> → Se hizo médico / Se convirtió en médico.','<b>Me quedé sin trabajo</b> ✓ – not <b>*Me hice sin trabajo</b>.','<b>*Eres muy guapa hoy</b> (today’s impression) → Estás muy guapa hoy.'],
spain:'“Se está haciendo tarde” (it’s getting late) is the polite phrase to start saying goodbye at a Spanish dinner… although there’s usually still an hour of sobremesa to go.'},
'b2-08':{title:'It slipped my mind – “se” and advanced pronouns',topics:['Accidental se: se me olvidó, se me rompió, se le cayó','Uses of “se”: reflexive, reciprocal, impersonal, passive, aspectual (comerse, irse)','Pronoun duplication: A Juan le…, El libro lo…','Leísmo and laísmo in Spain'],goals:['talk about accidents and mishaps without blaming yourself','recognise the different uses of “se”','understand how pronouns are used in real Spain'],source:'Libro Libre ch. 6 (Reflexive verbs) · Greenfield Lessons 11 and 22 · Reflexive Verbs in Spanish (CMCSD)',
grammar:`<h3>1. Accidental “se” – it wasn’t my fault</h3><p><b>se + indirect pronoun + verb</b> (agreeing with the thing): presents the event as involuntary.</p><div class="rule"><i>Se me ha olvidado la cartera. Se me olvidaron las llaves. Se le cayó el vaso. Se nos ha roto la lavadora. Se me ocurre una idea. Se les acabó el pan.</i></div><p>Compare: <i>Rompí el vaso</i> (I did it) / <i>Se me rompió el vaso</i> (it was an accident).</p>
<h3>2. The uses of “se”</h3><p>reflexive (<i>Se ducha</i>) · reciprocal (<i>Se quieren mucho. Nos vemos mañana.</i>) · replacing le/les (<i>Se lo di</i>) · impersonal / passive (<i>Se vive bien. Se venden pisos.</i>) · aspectual / intensive (<i>Se comió toda la tarta. Me voy.</i> – completeness, emphasis) · accidental (<i>Se me olvidó</i>).</p>
<h3>3. Duplication</h3><p>If the object comes <b>before</b> the verb, it’s repeated with a pronoun: <i>El libro lo compré ayer. A María la vi en el metro.</i> The indirect object is almost always duplicated: <i>Le dije a Juan que…</i></p>
<h3>4. Leísmo and laísmo</h3><p><b>Leísmo</b> for male persons (accepted): <i>A Pedro le vi ayer</i> (= lo vi). <b>Laísmo</b> (not accepted in the standard, common in Madrid and Castile): <s>La dije que viniera</s> → <i>Le dije que viniera</i>.</p>`,
pitfalls:['<b>Me olvidé las llaves</b> (possible, but more natural) → Se me olvidaron las llaves.','<b>*Se me olvidó las llaves</b> → Se me olvidaron (plural).','<b>*El libro compré ayer</b> → El libro lo compré ayer.','<b>*La dije la verdad</b> (laísmo) → Le dije la verdad.'],
spain:'“Se me ha ido la olla” (colloquial: I lost it / I completely forgot) and “se me ha ido el santo al cielo” (I’ve completely forgotten what I was going to say) are two very Spanish expressions with accidental “se”.'},
'b2-09':{title:'He told me to call him – advanced reported speech',topics:['Commands and requests in the past: me pidió que + imperfect subjunctive','Precise reporting verbs: aconsejar, sugerir, insistir en, negar','Reporting with nuance: que si…, que no sé qué…','Time and place references'],goals:['summarise conversations with precise verbs','report commands, advice and complaints in the past','understand colloquial reported speech'],source:'Greenfield Lessons 30–31 (Survey of moods and tenses, Past subjunctive)',
grammar:`<h3>1. Commands, requests and advice</h3><p>«Llámame.» → <i>Me dice que lo llame</i> (present) / <i>Me dijo que lo llamara</i> (past). «No llegues tarde.» → <i>Me pidió que no llegara tarde.</i> «Deberías descansar.» → <i>Me aconsejó que descansara.</i></p>
<h3>2. Verbs that summarise the intention</h3><p><i>pedir, rogar, exigir, aconsejar, recomendar, sugerir, proponer, insistir en, prohibir, permitir</i> + que + subjunctive · <i>afirmar, asegurar, reconocer, admitir, negar, quejarse de, advertir, prometer</i> + que + indicative (negar que → subjunctive).</p><div class="rule">«No he sido yo.» → <i>Negó haberlo hecho / Negó que lo hubiera hecho.</i> · «Vale, me equivoqué.» → <i>Reconoció que se había equivocado.</i> · «Venid a cenar.» → <i>Nos invitó a cenar.</i></div>
<h3>3. Colloquial reported speech</h3><p>In conversation <b>que</b> is often used at the start, and <b>que si…</b>: <i>¿Qué te ha dicho? – Que no puede venir. · Y me empezó a contar que si el trabajo, que si la familia, que si no sé qué…</i> (and so on and so forth).</p><p>Changes: <i>hoy → ese día; mañana → al día siguiente; ayer → el día anterior; aquí → allí; venir → ir; traer → llevar</i>.</p>`,
pitfalls:['<b>*Me dijo que lo llamo</b> → que lo llamara.','<b>*Negó que lo había hecho</b> → Negó que lo hubiera hecho.','<b>*Me sugirió de ir</b> → Me sugirió ir / que fuera.','<b>*Me dijo que viene aquí mañana</b> (reported later) → que iría allí al día siguiente.'],

<script>

'use strict';

/* ---------------- text normalisation & diff ---------------- */
const DETS=new Set('el la los las lo un una unos unas mi mis tu tus su sus nuestro nuestra nuestros nuestras vuestro vuestra vuestros vuestras este esta estos estas ese esa esos esas aquel aquella aquellos aquellas al del ningún ninguna algún alguna'.split(' '));

function parseItem(spec,ctx){

const AIX={packs:[],m:{},v:'0'};const AP={cached:new Set()};
function akey(t){return 't'+hash(String(t).replace(/___/g,'…').replace(/\s+/g,' ').trim())}
const hasRendered=()=>false;async function clipURL(){return null}async function prefetchAll(){return true}

const FEM=/m[oó]nica|marisol|paulina|helena|laura|elvira|luc[ií]a|sabina|esperanza|dalia|ximena|abril|elena|triana|irene|estrella|vera|lola|ana\b|sara|carmen|isabel|paloma|conchita|penélope|penelope|angelica|ang[eé]lica|female|mujer|google espa/i;
const MAS=/jorge|pablo|diego|juan|[aá]lvaro|carlos|alonso|arnau|dar[ií]o|enrique|tristan|rodrigo|ra[uú]l|gerardo|miguel|antonio|jos[eé]|alberto|enrique|eddy|reed|rocko|grandpa|male|hombre|nil\b|teo\b|saul|sa[uú]l/i;
function vGender(v){const n=v.name||'';if(MAS.test(n)&&!/female/i.test(n))return 'm';if(FEM.test(n))return 'f';return '?'}
/* rank: Spain first, then natural/online/enhanced voices, then any Spanish */
function vScore(v){let s=0;if(/es[-_]ES/i.test(v.lang))s+=100;if(/natural|online|neural|enhanced|premium|mejorad/i.test(v.name))s+=20;if(/google/i.test(v.name))s+=8;if(v.localService)s+=2;

function pluralOf(lemma,code,art){code=(code||'').trim();if(code)return code;if(/^(los|las)$/.test(art))return '';

function runSession(opt){

  if(!items.length){main().innerHTML=`<div class="card">${T('No hay ejercicios.','No exercises available.')} <a href="${opt.back||'#/home'}">${T('Volver','Back')}</a></div>`;return}

    const wrong=results.filter(r=>!r.ok);
    main().innerHTML=`<div class="quiz">${levelBarHTML(lvlNow())}<div class="qcard result"><div class="muted">${esc(opt.title)}</div><div class="big">${Math.round(pct*100)}%</div><p>${T(ok+' de '+items.length+' correctas · '+Math.round(st.secs/60)+' min',ok+' of '+items.length+' correct · '+Math.round(st.secs/60)+' min')}</p>
    ${opt.passMsg?`<p>${opt.passMsg(st)}</p>`:''}
    ${wrong.length?`<h3>${T('Para repasar','To review')}</h3><table class="t">${wrong.map(r=>`<tr><td>${esc(r.it.prompt.replace(/___/g,'…'))}</td><td><b>${esc(r.exp)}</b><br><span class="small muted">${esc(catName(r.cat))}</span></td></tr>`).join('')}</table>`:''}
    <div class="row" style="justify-content:center;margin-top:20px">${wrong.length?`<button class="pri" id="again">${T('Repetir los errores ahora','Repeat the mistakes now')}</button>`:''}<a class="btn" href="${opt.back||'#/home'}">${T('Terminar','Done')}</a></div></div></div>`;
    FX.result(pct);{const nl=LEVELS.filter(levelReached).find(l=>!lv0.includes(l));const nu=UNITS.find(u=>unitDone(u)&&!ud0.has(u.id));if(nl)setTimeout(()=>FX.levelUp(nl),1600);else if(nu)setTimeout(()=>FX.unitDone(nu.title),1600)}
    const a=$('#again');if(a)a.onclick=()=>runSession(Object.assign({},opt,{items:wrong.map(r=>r.it),title:opt.title+' – '+L('repaso','review'),onDone:null,passMsg:null}));}
  const lvlNow=()=>opt.level||(items[Math.min(idx,items.length-1)]||{}).level||ctxLevel();
  const liveOv=()=>opt.unit?{[opt.unit]:ok/items.length}:null;
  const refreshLv=()=>{const el=$('.lvbar',main());if(el)el.outerHTML=levelBarHTML(lvlNow(),liveOv())};
  function head(){return `<div class="qhead"><a class="btn sm" href="${opt.back||'#/home'}">✕</a><div class="bar"><i style="width:${idx/items.length*100}%"></i></div><span class="small muted">${idx+1}/${items.length}</span></div>${levelBarHTML(lvlNow(),liveOv())}`}
  function grade(it,given,res,extra){
    hist().n++;if(res.ok){hist().ok++;ok++}addXP(res.ok?3:1);
    let cat=it.cat;if(!res.ok)cat=classify(given,res.best||'',it);
    if(!res.ok)logError(it,given,cat);else errorFixed(it);
    if(res.ok&&res.kind==='punct')logMinor(it,given,'punct');
    if(res.ok&&res.kind==='accent')logMinor(it,given,'accent');
    results.push({it,ok:res.ok,exp:res.best||'',cat});opt.onItem&&opt.onItem(it,res.ok,given);refreshLv();

    let html='';
    if(res.ok){html=`<div class="fb ${res.kind==='exact'?'ok':'warn'}"><b class="h">${res.kind==='exact'?T('✓ ¡Correcto!','✓ Correct!'):res.kind==='punct'?T('✓ Correcto – pero revise la puntuación (¿ ¡ ,)','✓ Correct – but check the punctuation (¿ ¡ ,)'):T('✓ Correcto – pero ojo con las tildes','✓ Correct – but watch the accents')}</b>${res.kind!=='exact'?`<div class="ans">${esc(exp)}</div>`:''}${it.explain?`<div style="margin-top:6px">${esc(it.explain)}</div>`:''}</div>`}
    else{html=`<div class="fb bad"><b class="h">${T('✗ No del todo','✗ Not quite')} – <span class="pill bad">${esc(catName(cat))}</span></b>
      <div>${T('Correcto','Correct')}: <span class="ans">${esc(exp)}</span> ${sayBtn(it.type==='g'?fillGaps(it):exp)}</div>

function backupNag(){const lb=S.lastBackup;if(lb&&daysBetween(lb,today())<7)return '';return `<div class="fb warn small">${T('Su progreso se guarda en el navegador.','Your progress is stored in the browser.')} ${lb?T('Última copia: '+lb+'.','Last backup: '+lb+'.'):T('Todavía no hay copia de seguridad.','No backup yet.')} <a href="#" onclick="event.preventDefault();backupNow()">💾 ${T('Guardar ahora','Back up now')}</a></div>`}
function catStats(){const m={};for(const e of S.errors){const c=m[e.cat]=m[e.cat]||{cat:e.cat,open:0,total:0};c.total+=e.count||1;if(!e.closed)c.open++}return Object.values(m).sort((a,b)=>b.open-a.open||b.total-a.total)}

  $$('[data-del]').forEach(b=>b.onclick=()=>{const i=S.saved.findIndex(y=>y.k===b.dataset.del);if(i>=0){S.saved.splice(i,1);save()}R.saved()});

/* PATH */
R.path=function(lv){

function currentLevel(){const u=currentUnit();if(u)return u.level;let l='A1';for(const x of LEVELS)if(levelReached(x))l=x;return l}

/* UNIT */
R.unit=function(id,tab){const u=unitById(id);if(!u)return R.path();
  const st=uState(u.id);tab=tab||'gram';S.lastPos={unit:u.id,tab,at:Date.now()};save();

    ${u.pitfalls?`<div class="card" style="margin-top:14px"><b>${T('Errores típicos','Typical mistakes')}</b><ul style="margin:6px 0 0">${u.pitfalls.map((g,i)=>`<li>${TH(g,(UE(u).pitfalls||[])[i])}</li>`).join('')}</ul></div>`:''}
    ${u.spain?`<div class="card" style="margin-top:14px"><b>🇪🇸 ${T('En España','In Spain')}</b><p class="small" style="margin:6px 0 0">${TH(u.spain,UE(u).spain)}</p></div>`:''}
    ${unitTracksHTML(u)}
    <div class="row" style="margin-top:18px"><button class="pri" onclick="nav('#/unit/${u.id}/exs')">${T('Siguiente: ejemplos →','Next: examples →')}</button></div>`}
  else if(tab==='exs'){ut.innerHTML=`<div class="card"><div class="row" style="margin-bottom:6px"><button class="sm" id="playall">▶ ${T('Escuchar todos','Play all')}</button><span class="small muted">${T('¡Repita en voz alta!','Repeat out loud!')} ${T('Ocultar inglés','Hide English')}: <label><input type="checkbox" id="hideEn"> </label></span></div>${(u.examples||[]).map(e=>`<div class="ex">${sayBtn(e[0])}${starBtn(e[0],e[1],u.level+' · '+u.title)}<div><div class="de">${esc(e[0])}</div><div class="en">${esc(e[1]||'')}</div></div></div>`).join('')}</div>
    <div class="row" style="margin-top:14px"><button class="pri" onclick="nav('#/unit/${u.id}/voc')">${T('Siguiente: vocabulario →','Next: vocabulary →')}</button><a class="btn" href="#/dictation/${u.id}">${T('Dictado con estas frases','Dictation with these sentences')}</a><a class="btn" href="#/shadow/${u.id}">${T('Repetir en voz alta','Repeat aloud')}</a></div>`;
    $('#hideEn').onchange=e=>$$('.ex .en').forEach(x=>x.style.visibility=e.target.checked?'hidden':'');
    $('#playall').onclick=()=>sayList((u.examples||[]).map(e=>e[0]))}
  else if(tab==='voc'){ut.innerHTML=vc.length?`<div class="card"><div class="row"><b>${vc.length} ${L('palabras','words')}</b><span class="spacer"></span><button class="pri" id="learnU">${T('Aprender estas palabras','Learn these words')}</button></div><div class="tw"><table class="t" style="margin-top:10px">${vc.map(c=>vocRow(c,u.level+' · '+u.title)).join('')}</table></div></div>`:`<p class="muted">${T('Esta unidad no tiene vocabulario propio – vea la sección Vocabulario.','No vocabulary of its own for this unit – see the Vocabulary section.')}</p>`;
    const b=$('#learnU');if(b)b.onclick=()=>vocabSession(vc.filter(c=>!S.vocab[c.id]).slice(0,S.settings.dailyNew*2).concat(vc.filter(c=>S.vocab[c.id]&&S.vocab[c.id].due<=today())),L('Vocabulario','Vocabulary')+': '+u.title,'#/unit/'+u.id+'/voc')}
  else if(tab==='prac'){const items=unitItems(u);
    ut.innerHTML=`<div class="card"><p>${T(items.length+' ejercicios. Aprobado a partir del 80 %. Mejor resultado hasta ahora: <b>'+(st.att?Math.round(st.best*100)+'%':'–')+'</b> ('+(st.att||0)+' intentos).',items.length+' exercises. Pass mark 80 %. Best result so far: <b>'+(st.att?Math.round(st.best*100)+'%':'–')+'</b> ('+(st.att||0)+' attempts).')}</p><p class="small muted">${T('Consejo: primero lea la gramática y diga los ejemplos en voz alta. Cada respuesta incorrecta va automáticamente a Errores.','Tip: read the grammar first and say the examples out loud. Every wrong answer goes automatically into Mistake training.')}</p><button class="pri" id="go">${T('Empezar la práctica','Start practice')}</button></div>`;

      passMsg:st2=>st2.pct>=0.8?T('✓ Unidad completada. Siga con la siguiente unidad.','✓ Unit completed. On to the next unit.'):T('Todavía no llega al 80 % – repita los errores, vuelva a mirar la gramática e inténtelo otra vez.','Not yet 80 % – repeat the mistakes, look at the grammar again, then try again.')})}};
function vocRow(c,src){return `<tr><td class="nw">${sayBtn(nounStr(c))}${starBtn(nounStr(c),c.en,src,c.id)}</td><td>${artSpan(c)}${c.plural?` <span class="small muted">· ${L('pl.','pl.')} ${esc(plStr(c))}</span>`:''}${c.forms&&c.forms!=='f.'?` <span class="small muted">(${esc(c.forms)})</span>`:''}</td><td>${esc(c.en)}</td><td class="small muted">${c.exEs?sayBtn(c.exEs)+' '+esc(c.exEs):''}</td><td>${vstate(c.id)?`<span class="pill ${vstate(c.id).box>=3?'ok':''}">${L('Caja','Box')} ${vstate(c.id).box}</span>`:''}</td></tr>`}

/* LEVEL TEST */
R.test=function(l){const us=levelUnits(l);const pool=[];
  us.forEach(u=>{const its=unitItems(u);pool.push(...sample(its,Math.max(2,Math.ceil(40/us.length))))});
  const vc=sample(cards().filter(c=>c.level===l&&c.kind==='noun'),6).map(c=>vItem(c,'prod'));
  const items=shuffle(sample(pool,40).concat(vc));
  main().innerHTML=`<h1>${T('Prueba de nivel','Level test')} ${l}</h1><p class="sub">${T(items.length+' ejercicios de todas las unidades '+l+' (gramática + vocabulario). Aprobado a partir del 80 %.',items.length+' exercises from all '+l+' units (grammar + vocabulary). Pass mark 80 %.')}</p><div class="card"><p>${T('Aprobar (≥ 80 %) marca el nivel como superado.','Passing (≥ 80 %) marks the level as passed.')}</p><button class="pri" id="go">${T('Empezar la prueba','Start the test')}</button></div>`;
  $('#go').onclick=()=>runSession({title:L('Prueba de nivel','Level test')+' '+l,items,back:'#/path/'+l,onDone:st=>{const Lv=S.levels[l]=S.levels[l]||{};Lv.best=Math.max(Lv.best||0,st.pct);Lv.tries=(Lv.tries||0)+1;
      if(st.pct>=0.8){Lv.passed=true;Lv.unlocked=true;Lv.testedOut=true;const i=LEVELS.indexOf(l);for(let k=0;k<i;k++){const P=S.levels[LEVELS[k]]=S.levels[LEVELS[k]]||{};P.passed=true;P.unlocked=true;P.testedOut=true}if(LEVELS[i+1]){S.levels[LEVELS[i+1]]=S.levels[LEVELS[i+1]]||{};S.levels[LEVELS[i+1]].unlocked=true}}save()},
    passMsg:st=>st.pct>=0.8?T('✓ ¡'+l+' superado!','✓ '+l+' passed!'):T('No superado. Los ejercicios incorrectos están ahora en Errores.','Not passed. The exercises you got wrong are now in Mistake training.')})};

/* VOCAB */
function vItem(c,mode){const src='vocab';const key='v:'+c.id+':'+mode;
  if(mode==='prod'){const ans=[nounStr(c)];if(c.art==='el/la')ans.push('el '+c.lemma,'la '+c.lemma);const l2=c.lemma.replace(/\s*\(.*\)$/,'');if(l2!==c.lemma)ans.push((c.art?c.art+' ':'')+l2);return{type:'t',prompt:L('En español'+(c.art?' (con artículo)':''),'In Spanish'+(c.art?' (with article)':''))+': '+c.en,answers:ans,cat:c.art?'gender':'vocab',src,key,spec:'v|'+c.id+'|prod',level:c.level,card:c,explain:c.exEs}}
  if(mode==='plural')return{type:'t',prompt:L('Plural de','Plural of')+' '+nounStr(c)+' '+L('(con artículo)','(with article)')+': ',answers:[plStr(c)],cat:'plural',src,key,spec:'v|'+c.id+'|plural',level:c.level,card:c};
  if(mode==='pret'||mode==='perf'){const f=c.forms.split('·').map(x=>x.trim());
    if(mode==='pret')return{type:'t',prompt:L('Pretérito indefinido','Simple past (preterite)')+' (yo): '+c.lemma+' → '+L('ayer yo','yesterday I')+' ___',answers:[f[1]],cat:'pret',src,key,spec:'v|'+c.id+'|pret',level:c.level,card:c,explain:c.forms};
    return{type:'t',prompt:L('Pretérito perfecto','Present perfect')+' (él/ella): '+c.lemma+' → '+L('hoy él','today he')+' ___',answers:[(c.lemma.endsWith('se')?'se ':'')+'ha '+f[2]],cat:'perf',src,key,spec:'v|'+c.id+'|perf',level:c.level,card:c,explain:c.forms}}
  if(mode==='listen')return{type:'d',prompt:c.art?L('Escriba la palabra con su artículo','Write the word with its article'):L('Escriba la palabra','Write the word'),answers:[nounStr(c)],cat:'spelling',src,key,spec:'v|'+c.id+'|listen',level:c.level,card:c};
  const others=sample(cards().filter(x=>x.level===c.level&&x.id!==c.id&&x.en!==c.en),3).map(x=>x.en);
  return{type:'m',prompt:L('¿Qué significa','What does this mean')+': '+nounStr(c)+'?',correct:c.en,options:[c.en,...others],answers:[c.en],cat:'vocab',src,key,spec:'v|'+c.id+'|recog',level:c.level,card:c}}
function itemFromSpec(spec,e){if(spec.startsWith('sv|')){const x=(S.saved||[]).find(y=>y.k===spec.slice(3));return x?{type:'t',prompt:L('En español','In Spanish')+': '+(x.en||x.de),answers:[x.de],cat:'vocab',src:'saved',key:e.key,spec,level:''}:null}
  if(spec.startsWith('v|')){const [,id,mode]=spec.split('|');const c=cardById(id);return c?vItem(c,mode):null}
  if(spec.startsWith('man|')){const p=spec.split('|');return{type:'t',prompt:L('Corrija','Correct this')+': «'+p[1]+'»',answers:[p[2]],cat:e.cat,src:'manual',key:e.key,spec,level:e.level||'',explain:p[3]||''}}
  if(spec.startsWith('dict|')){const p=spec.split('|');return{type:'d',prompt:'',answers:[p[1]],cat:'listening',src:'dict',key:e.key,spec,level:e.level||''}}
  return parseItem(spec,{src:e.src,key:e.key,cat:e.cat,level:e.level})}
function vocabSession(list,title,back){
  if(!list.length){toast(L('No hay palabras pendientes.','No words due.'));return}
  const intro=list.filter(c=>!S.vocab[c.id]);let i=0;
  function showIntro(){if(i>=intro.length)return quiz();const c=intro[i];
    main().innerHTML=`<div class="quiz"><div class="qhead"><a class="btn sm" href="${back}">✕</a><div class="bar"><i style="width:${i/intro.length*100}%"></i></div><span class="small muted">${L('Nueva','New')} ${i+1}/${intro.length}</span></div>
    ${levelBarHTML(c.level)}<div class="qcard flash"><div class="muted small">${esc(c.theme||'')}</div><div class="w">${artSpan(c)} ${sayBtn(nounStr(c))} ${starBtn(nounStr(c),c.en,c.level+' · '+(c.theme||''),c.id)}</div>${c.plural?`<div class="pl">${T('Plural','Plural')}: <span class="plu">${esc(plStr(c))}</span></div>`:''}${c.forms&&c.forms!=='f.'?`<div class="pl">${esc(c.forms)}</div>`:''}<div style="font-size:20px;margin-top:10px">${esc(c.en)}</div>${c.exEs?`<div class="exs">${sayBtn(c.exEs)} ${esc(c.exEs)}${c.exEn?`<br><span class="small">${esc(c.exEn)}</span>`:''}</div>`:''}
    <div class="row" style="justify-content:center;margin-top:22px"><button class="pri" id="n">${T('Entendido','Got it')} → ⏎</button></div></div></div>`;
    say(nounStr(c));$('#n').onclick=()=>{i++;showIntro()};document.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#n').click()}}}
  function quiz(){document.onkeydown=null;const items=[];
    for(const c of list){const v=S.vocab[c.id];const box=v?v.box:0;let mode;
      if(box<=1)mode=Math.random()<.5?'recog':'prod';else{const r=Math.random();mode=r<.55?'prod':r<.75?'listen':'recog';if(c.kind==='noun'&&c.plural&&Math.random()<.25)mode='plural';if(c.kind==='verb'&&/·.*·/.test(c.forms)&&c.level!=='A1'&&Math.random()<.4)mode=Math.random()<.5?'pret':'perf'}
      items.push(vItem(c,mode))}
    runSession({title,items:shuffle(items),back,onItem:(it,ok)=>{vReview(it.card,ok);if(!S.vocab[it.card.id].first){S.vocab[it.card.id].first=today();hist().new++}}})}
  showIntro();}
R.vocab=function(sub){
  if(sub==='review'){const due=vocabDue();return vocabSession(sample(due,60),L('Repaso','Review'),'#/vocab')}
  const decks=VOCAB.map(d=>{const cs=cards().filter(c=>c.deck===d.id);return{d,n:cs.length,st:cs.filter(c=>S.vocab[c.id]).length,ln:cs.filter(c=>S.vocab[c.id]&&S.vocab[c.id].box>=3).length}});
  main().innerHTML=`<h1>${T('Vocabulario','Vocabulary')}</h1><p class="sub">${cards().length} ${T('palabras por nivel y tema. Aprenda siempre los sustantivos con su artículo – <span class="el">el</span> (masculino) · <span class="la">la</span> (femenino) tienen colores distintos.','words, by level and topic. Always learn nouns with their article – <span class="el">el</span> (masculine) · <span class="la">la</span> (feminine) are colour-coded.')}</p>
  <div class="grid g3"><div class="card stat"><b>${vocabDue().length}</b><span>${T('para hoy','due today')}</span><div style="margin-top:8px"><a class="btn pri sm" href="#/vocab/review">${T('Repasar','Review')}</a></div></div><div class="card stat"><b>${vocabStarted()}</b><span>${T('empezadas','started')}</span></div><div class="card stat"><b>${vocabLearned()}</b><span>${T('consolidadas (caja ≥ 3)','consolidated (box ≥ 3)')}</span></div></div>
  <div class="row" style="margin:16px 0"><input type="text" id="vs" placeholder="${L('Buscar palabra (español o inglés)…','Search a word (Spanish or English)…')}" style="max-width:340px"><button id="newBtn" class="pri">${T(S.settings.dailyNew+' palabras nuevas',S.settings.dailyNew+' new words')}</button></div><div id="vsr"></div>
  ${LEVELS.map(l=>`<h2><span class="lvl">${l}</span></h2><div class="grid g3">${decks.filter(x=>x.d.level===l).map(x=>`<div class="card click" data-deck="${x.d.id}"><b>${esc(x.d.theme)}</b>${x.d.themeEn&&LANG()!=='es'?`<div class="small tr-en">${esc(x.d.themeEn)}</div>`:''}<div class="small muted">${x.n} ${L('palabras','words')} · ${x.ln} ${L('consolidadas','consolidated')}</div><div class="bar ok" style="margin-top:6px"><i style="width:${x.n?x.ln/x.n*100:0}%"></i></div></div>`).join('')}</div>`).join('')}`;
  $$('[data-deck]').forEach(c=>c.onclick=()=>nav('#/deck/'+c.dataset.deck));

/* ERRORS */
R.errors=function(sub,arg){
  if(sub==='train'){const es=dueErrors().length?dueErrors():openErrors();const items=shuffle(es).slice(0,25).map(e=>itemFromSpec(e.spec,e)).filter(Boolean);return runSession({title:L('Corregir errores','Mistake training'),items,back:'#/errors'})}
  if(sub==='cat'){return catTrain(arg)}
  const cs=catStats();const op=openErrors(),closed=S.errors.filter(e=>e.closed);
  main().innerHTML=`<h1>${T('Errores','Mistake training')}</h1><p class="sub">${T('Cada respuesta incorrecta se guarda, se asigna automáticamente a un patrón de error y se repite hasta que la acierte en <b>dos días distintos</b> (abierto → en observación → corregido).','Every wrong answer is saved, automatically assigned to a mistake pattern and repeated until you get it right on <b>two different days</b> (open → watching → fixed).')}</p>
  <div class="grid g4"><div class="card stat"><b>${op.filter(e=>!e.streak).length}</b><span>${T('abiertos','open')}</span></div><div class="card stat"><b>${op.filter(e=>e.streak).length}</b><span>${T('en observación (1× bien)','watching (1× right)')}</span></div><div class="card stat"><b>${closed.length}</b><span>${T('corregidos','fixed')}</span></div><div class="card stat"><b>${dueErrors().length}</b><span>${T('para hoy','due today')}</span><div style="margin-top:6px"><a class="btn pri sm" href="#/errors/train">${T('Empezar','Start')}</a></div></div></div>
  <h2>${T('Patrones de error','Mistake patterns')}</h2><div class="card">${cs.length?`<table class="t"><tr><th>${T('Patrón','Pattern')}</th><th>${T('abiertos','open')}</th><th>${T('total','total')}</th><th></th></tr>${cs.map(c=>`<tr><td><b>${esc(catName(c.cat))}</b><div class="small muted">${esc((META.cats[c.cat]||{}).d||'')}</div></td><td>${c.open}</td><td>${c.total}</td><td><a class="btn sm" href="#/errors/cat/${c.cat}">${T('Practicar','Train')}</a></td></tr>`).join('')}</table>`:`<p class="muted">${T('Todavía no hay errores. En cuanto practique, aquí aparecerán sus patrones personales.','No mistakes yet. As soon as you practise, your personal mistake patterns appear here.')}</p>`}</div>
  <h2>${T('Añadir un error propio','Add your own mistake')}</h2><div class="card"><p class="small muted">${T('P. ej. de una corrección, de clase o de una conversación. Se repetirá como todos los demás.','E.g. from a correction, a class or a conversation. It will be repeated like all the others.')}</p>
  <div class="grid g2"><input type="text" id="mw" placeholder="${L('Incorrecto: p. ej. Soy cansado.','Wrong: e.g. Soy cansado.')}"><input type="text" id="mr" placeholder="${L('Correcto: Estoy cansado.','Right: Estoy cansado.')}"></div>
  <div class="row" style="margin-top:8px"><select id="mc" style="max-width:300px">${Object.entries(META.cats).map(([k,v])=>`<option value="${k}">${esc(catName(k))}</option>`).join('')}</select><input type="text" id="mn" placeholder="${L('Nota / regla (opcional)','Note / rule (optional)')}" style="flex:1"><button class="pri" id="madd">${T('Añadir','Add')}</button></div></div>
  <h2>${T('Todos los errores abiertos','All open mistakes')} (${op.length})</h2><div class="card tw"><table class="t"><tr><th>${T('Fecha','Date')}</th><th>${T('Patrón','Pattern')}</th><th>${T('Su respuesta','Your answer')}</th><th>${T('Correcto','Correct')}</th><th>×</th><th>${T('Estado','Status')}</th></tr>${op.slice().reverse().slice(0,200).map(e=>`<tr><td class="small">${e.date}</td><td class="small">${esc(catName(e.cat))}</td><td class="small" style="color:var(--bad)">${esc(e.given||'—')}</td><td class="small"><b>${esc(e.exp)}</b></td><td>${e.count}</td><td>${e.streak?`<span class="pill warn">${T('en observación','watching')}</span>`:`<span class="pill bad">${T('abierto','open')}</span>`}</td></tr>`).join('')}</table></div>`;
  $('#madd').onclick=()=>{const w=$('#mw').value.trim(),r=$('#mr').value.trim();if(!w||!r)return toast(L('Escriba la versión incorrecta y la correcta.','Please enter the wrong and the right version.'));const spec='man|'+w.replace(/\|/g,'/')+'|'+r.replace(/\|/g,'/')+'|'+$('#mn').value.replace(/\|/g,'/');
    S.errors.push({id:'e'+Date.now().toString(36),key:'man:'+hash(spec),spec,src:'manual',cat:$('#mc').value,given:w,exp:r,ts:Date.now(),date:today(),count:1,streak:0,due:today(),closed:false});save();updateBadge();toast(L('Error guardado.','Mistake saved.'));R.errors()}};
function catTrain(cat){const c=META.cats[cat]||{n:cat};const errs=openErrors().filter(e=>e.cat===cat).map(e=>itemFromSpec(e.spec,e)).filter(Boolean);
  const pool=[];UNITS.filter(u=>unitReached(u)).forEach(u=>unitItems(u).forEach(it=>{if(it.cat===cat||(u.cat===cat))pool.push(it)}));
  const extra=sample(pool.filter(p=>!errs.find(e=>e.key===p.key)),Math.max(0,15-errs.length));
  const rel=UNITS.filter(u=>u.cat===cat||(u.tags||[]).includes(cat));
  main().innerHTML=`<a href="#/errors" class="small">← ${T('Errores','Mistake training')}</a><h1>${esc(catName(cat))}</h1><p class="sub">${esc(c.d||'')}</p><div class="gram" style="padding-top:14px">${TH(c.tip||'',(IC().cats||{})[cat])}</div>
  ${rel.length?`<p class="small" style="margin-top:12px">${T('Unidades relacionadas','Related units')}: ${rel.map(u=>`<a href="#/unit/${u.id}">${u.level} ${U(u.title)}</a>`).join(' · ')}</p>`:''}
  <div class="row" style="margin-top:14px"><button class="pri" id="go">${T('Practicar '+errs.length+' errores propios + '+extra.length+' ejercicios extra','Practise '+errs.length+' own mistakes + '+extra.length+' extra exercises')}</button></div>`;
  $('#go').onclick=()=>runSession({title:L('Práctica dirigida','Targeted')+': '+catName(cat),items:shuffle(errs.concat(extra)),back:'#/errors/cat/'+cat})}

/* DICTATION & SHADOWING */
R.dictation=function(uid){const pool=[];const us=uid?[unitById(uid)]:UNITS.filter(unitReached);us.forEach(u=>(u.examples||[]).forEach(e=>pool.push({u,s:e[0]})));
  const items=sample(pool,uid?pool.length:12).map(p=>({type:'d',prompt:'',answers:[p.s],cat:'listening',src:'dict',key:'d:'+hash(p.s),spec:'dict|'+p.s,level:p.u.level}));
  runSession({title:L('Dictado','Dictation'),items,back:uid?'#/unit/'+uid+'/exs':'#/listen'})};
R.shadow=function(uid){const pool=[];const us=uid?[unitById(uid)]:UNITS.filter(unitReached);us.forEach(u=>(u.examples||[]).forEach(e=>pool.push(e[0])));
  shadowSession(uid?pool:sample(pool,10),uid?'#/unit/'+uid+'/exs':'#/speak')};
function shadowSession(sents,back){let i=0,scores=[];
  function show(){if(i>=sents.length){main().innerHTML=`<div class="quiz"><div class="qcard result"><div class="big">${scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length*100):0}%</div><p>${T('Porcentaje medio de reconocimiento','Average recognition rate')}</p><a class="btn pri" href="${back}">${T('Terminar','Done')}</a></div></div>`;return}
    const s=sents[i];main().innerHTML=`<div class="quiz"><div class="qhead"><a class="btn sm" href="${back}">✕</a><div class="bar"><i style="width:${i/sents.length*100}%"></i></div><span class="small muted">${i+1}/${sents.length}</span></div>
    <div class="qcard"><div class="qtype">${T('Repetir en voz alta','Repeat aloud')}</div><div class="qprompt">${esc(s)}</div><div class="row"><button id="pl">▶ ${T('Modelo','Model')}</button><button id="sl">▶ ${T('Despacio','Slowly')}</button><span class="spacer"></span>${REC?`<button class="mic" id="mic" title="${L('Hablar','Speak')}">🎤</button>`:''}</div>
    ${REC?'':`<div style="margin-top:14px"><textarea id="dict" style="min-height:70px" placeholder="${L('Toque aquí, luego el micrófono de su teclado y diga la frase (idioma del teclado: español).','Tap here, then your keyboard’s microphone and say the sentence (keyboard language: Spanish).')}"></textarea><div class="row" style="margin-top:8px"><button class="pri" id="dchk">${T('Comprobar pronunciación','Check pronunciation')}</button><span class="small muted">${T('El dictado del teclado reconoce lo que ha dicho.','Keyboard dictation recognises what you said.')}</span></div></div>`}
    <div id="out" style="margin-top:14px"></div><div class="qfoot"><button id="nx" class="pri">${T('Siguiente','Next')}</button></div></div></div>`;
    $('#pl').onclick=()=>say(s);$('#sl').onclick=()=>saySlow(s);setTimeout(()=>say(s),300);
    $('#nx').onclick=()=>{i++;show()};
    const evalS=t=>{const sc=speechScore(s,t);scores.push(sc.score);hist().n++;if(sc.score>=0.85)hist().ok++;addXP(2);if(sc.missed.length)logPron(s,sc.missed,t);
        $('#out').innerHTML=`<div class="fb ${sc.score>=0.85?'ok':sc.score>=0.6?'warn':'bad'}"><b class="h">${Math.round(sc.score*100)}% ${T('reconocido','recognised')}</b><div>${T('Reconocido','Recognised')}: «${esc(t)}»</div><div style="margin-top:6px">${sc.html}</div>${sc.missed.length?`<div class="small" style="margin-top:6px">${T('No reconocido','Not recognised')}: ${sc.missed.map(w=>`<b>${esc(w)}</b> ${sayBtn(w)}`).join(' ')}</div>`:''}</div>`};
    const dc=$('#dchk');if(dc)dc.onclick=()=>{const t=$('#dict').value.trim();if(t)evalS(t)};
    const mic=$('#mic');if(mic)mic.onclick=async()=>{const m=$('#mic');m.classList.add('rec');$('#out').innerHTML=`<span class="muted">${T('Le escucho…','Listening…')}</span>`;
      try{const t=await recognize(x=>$('#out').innerHTML='<span class="muted">'+esc(x)+'</span>');m.classList.remove('rec');evalS(t)}
      catch(e){m.classList.remove('rec');$('#out').innerHTML=`<div class="fb warn">${T('Micrófono / reconocimiento no disponible','Microphone / recognition not available')} (${esc(e.error||e.message||e)}). ${T('Revise el permiso del micrófono en el navegador.','Check the microphone permission in your browser.')}</div>`}}}
  show()}
function wnorm(s){return stripAcc(baseNorm(s).toLowerCase()).replace(/[.,!?¿¡;:"«»'()–-]/g,' ').split(/\s+/).filter(Boolean)}
function speechScore(target,heard){const a=wnorm(target),b=wnorm(heard);const d=lcs(a,b);const hit=d.filter(x=>x[0]==='=').length;const missed=d.filter(x=>x[0]==='-').map(x=>x[1]);
  return{score:a.length?hit/a.length:0,missed,html:d.filter(x=>x[0]!=='+').map(([k,w])=>k==='='?`<span style="color:var(--ok)">${esc(w)}</span>`:`<span style="color:var(--bad);text-decoration:underline">${esc(w)}</span>`).join(' ')}}
function logPron(sent,missed,heard){const key='pr:'+hash(sent);const ex=S.errors.find(e=>e.key===key&&!e.closed);
  if(ex){ex.count++;ex.given=heard;ex.date=today();ex.streak=0}else S.errors.push({id:'e'+Date.now().toString(36),key,spec:'dict|'+sent,src:'speak',cat:'pronun',given:heard+'  ('+L('no reconocido','not recognised')+': '+missed.join(', ')+')',exp:sent,ts:Date.now(),date:today(),count:1,streak:0,due:addDays(today(),1),closed:false});save();updateBadge()}

function unitTracksHTML(u){const tr=[];(LISTEN.groups||[]).forEach(g=>g.tracks.forEach(t=>{if(t.unit===u.id)tr.push(t)}));if(!tr.length)return '';
  return `<div class="card" style="margin-top:14px"><b>♪ ${T('Diálogos y audios de esta unidad','Dialogues and audio for this unit')}</b><p class="small muted" style="margin:4px 0 8px">${T('Leídos en voz alta por la voz española de su dispositivo – con preguntas, huecos, transcripción y práctica frase a frase.','Read aloud by your device’s Spanish voice – with questions, gap text, transcript and line-by-line practice.')}</p><div class="chips">${tr.map(t=>`<a class="chip" href="#/listen/track/${t.id}">${t.qs&&t.qs.length?'★ ':''}${esc(t.label)} · ${esc(t.title.slice(0,40))}</a>`).join('')}</div></div>`}
/* LISTENING */
function trackLines(t){if(t._lines)return t._lines;const out=[];String(t.d||'').split('\n').forEach(l=>{l=l.trim();if(!l)return;const m=l.match(/^([^:]{1,24}):\s+(.+)$/);if(m&&t.v&&t.v[m[1]])out.push([m[1],m[2]]);else out.push(['',l])});return t._lines=out}
function trackText(t){return trackLines(t).map(([w,x])=>w?w+': '+x:x).join('\n')}
function findTrack(id){for(const g of LISTEN.groups||[]){const t=g.tracks.find(x=>x.id===id);if(t)return {t,g}}return {}}
function audioPanel(){return `<div class="card"><h3>${T('Voz','Voice')}</h3><p class="small" id="vstat">${voiceStatusHTML()}</p><div class="row"><button class="sm" id="vtest">▶ ${T('Probar la voz','Test the voice')}</button><a class="small" href="#/settings">${T('Cambiar voz','Change voice')}</a></div></div>`}
function bindAudioPanel(){const b=$('#vtest');if(b)b.onclick=()=>say('¡Hola! Me llamo Lucía. ¿Y tú, cómo te llamas?');const n=$('#vstat');if(n){loadVoices();n.innerHTML=voiceStatusHTML()}}
R.listen=function(sub,arg){
  if(sub==='track')return trackView(arg);
  const groups=LISTEN.groups||[];
  main().innerHTML=`<h1>${T('Escuchar','Listening')}</h1><p class="sub">${T('Todos los diálogos y textos los lee en voz alta la voz española de su dispositivo (sin archivos de audio). (1) Dictado con las frases de sus unidades. (2) Diálogos por nivel: primero escuchar sin texto y responder las preguntas ★, luego huecos, transcripción y práctica frase a frase.','All dialogues and texts are read aloud by your device’s Spanish voice (no audio files). (1) Dictation with the sentences of your units. (2) Dialogues by level: first listen without the text and answer the questions ★, then gap text, transcript and line-by-line practice.')}</p>
  <div class="grid g3"><div class="card click" onclick="nav('#/dictation')"><h3>${T('Dictado (todos los niveles)','Dictation (all levels)')}</h3><p class="small muted">${T('12 frases de sus unidades. Escuchar → escribir → comparación palabra por palabra.','12 sentences from your units. Listen → write → word-by-word comparison.')}</p></div>
  <div class="card"><h3>${T('Consejos','Listening tips')}</h3><p class="small muted">${T('1× sin transcripción: responder las preguntas. 2× con transcripción. Luego los huecos. Al final: frase a frase y en voz alta (shadowing). Si va rápido: velocidad 0.75×.','1× without transcript: answer the questions. 2× with transcript. Then the gap text. Finally: line by line and out loud (shadowing). Too fast? Use speed 0.75×.')}</p></div>
  ${audioPanel()}</div>
  ${LEVELS.filter(l=>groups.some(g=>g.level===l)).map(l=>`<h2>${T('Diálogos y textos','Dialogues and texts')} <span class="lvl">${l}</span></h2>`+groups.filter(g=>g.level===l).map(g=>{const done=g.tracks.filter(t=>(S.listen[t.id]||{}).best!=null).length;
   return `<details class="card lgroup" ${g.level===currentLevel()?'open':''}><summary><b>${esc(g.title)}</b> <span class="small muted">· ${g.tracks.length} ${L('audios','tracks')}${done?` · ${done} ${L('hechos','done')}`:''}</span></summary><p class="small muted">${esc(g.note||'')}</p><div class="tw"><table class="t">${g.tracks.map(t=>{const st=S.listen[t.id]||{};return `<tr><td style="width:70px"><span class="pill">${esc(t.label)}</span></td><td><a href="#/listen/track/${t.id}"><b>${t.qs&&t.qs.length?'★ ':''}${esc(t.title)}</b></a>${t.titleEn&&LANG()!=='es'?`<div class="small tr-en">${esc(t.titleEn)}</div>`:''}</td><td class="small">${t.qs&&t.qs.length?t.qs.length+' '+L('preguntas','questions')+' · ':''}${L('huecos · frase a frase','gaps · line by line')}</td><td>${st.best!=null?`<span class="pill ${st.best>=0.8?'ok':'warn'}">${Math.round(st.best*100)}%</span>`:''}</td></tr>`}).join('')}</table></div></details>`}).join('')).join('')}`;
  bindAudioPanel()};
function trackView(id){const {t,g}=findTrack(id);if(!t)return R.listen();
  main().innerHTML=`<a href="#/listen" class="small">← ${T('Escuchar','Listening')}</a><h1>${esc(t.title)}</h1><p class="sub">${t.titleEn&&LANG()!=='es'?`<span class="tr-en">${esc(t.titleEn)}</span><br>`:''}${esc(g.title)} · <span class="lvl">${g.level}</span>${t.unit&&unitById(t.unit)?` · <a href="#/unit/${t.unit}">${U(unitById(t.unit).title)}</a>`:''}</p>
  <div class="card">${playerHTML('tp')}${t.task?`<p class="small" style="margin:8px 0 0"><b>${T('Tarea','Task')}:</b> ${TH(esc(t.task),t.taskEn?esc(t.taskEn):'')}</p>`:''}</div>
  <div class="tabs"><button data-t="q" class="on">${t.qs&&t.qs.length?T('Preguntas','Questions'):T('Tarea','Task')}</button><button data-t="c">${T('Huecos','Gap text')}</button><button data-t="tr">${T('Transcripción','Transcript')}</button><button data-t="ln">${T('Frase a frase','Line by line')}</button></div><div id="tt"></div>`;
  const TL=trackLines(t).map(([w,x])=>({who:w,text:x,role:w&&t.v?t.v[w]:'f'}));
  bindPlayer('tp',TL,{hideText:true,onLine:i=>$$('#tt .trl').forEach((x,j)=>x.classList.toggle('on',j===i))});
  const tabs=$$('.tabs button');tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.toggle('on',x===b));show(b.dataset.t)});
  function show(k){const tt=$('#tt');if(k==='ln')stopSay();
    if(k==='tr')tt.innerHTML=`<div class="transcript">${trackLines(t).map(([w,x])=>`<span class="trl">${w?`<b>${esc(w)}:</b> `:''}${esc(x)}</span>`).join('<br>')}</div>${t.en?`<details class="card" style="margin-top:10px"><summary>${T('Traducción al inglés','English translation')}</summary><div class="small" style="white-space:pre-wrap;margin-top:6px">${esc(t.en)}</div></details>`:''}${t.gloss?`<details class="card" style="margin-top:10px"><summary>${T('Ayuda de vocabulario','Vocabulary help')}</summary><table class="t">${t.gloss.map(x=>`<tr><td>${sayBtn(x[0])} ${esc(x[0])}</td><td class="muted">${esc(x[1])}</td></tr>`).join('')}</table></details>`:''}<p class="small muted">${T('Consejo: lea la transcripción mientras escucha y luego repita fragmentos en voz alta (shadowing).','Tip: read the transcript while listening, then repeat sections out loud (shadowing).')}</p>`;
    else if(k==='c')clozeView(t,tt);
    else if(k==='ln')linesView(t,tt);
