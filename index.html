<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Español"><meta name="theme-color" content="#c60b1e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Español-Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc;
  --accent:#c8102e; --accent-ink:#fff; --accent-soft:#fbe9ec;
  --ok:#1f7a4d; --ok-soft:#e3f3ea; --bad:#b42318; --bad-soft:#fdeceb; --warn:#a15c00; --warn-soft:#fff4e0;
  --el:#1f5fbf; --la:#c0262d; --ella:#1d7f4e; --pl:#7a4bb3;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1f1f24; --ink:#ececf0; --muted:#a0a0aa; --line:#33333b;
    --accent:#ff5a6e; --accent-soft:#3a1c22; --ok:#5fd39a; --ok-soft:#173326; --bad:#ff7b70; --bad-soft:#3b1d1b;
    --warn:#ffbe5c; --warn-soft:#3a2c14; --el:#78a9ff; --la:#ff7f86; --ella:#5fd39a; --pl:#c3a2f0;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16161a; --panel:#1f1f24; --ink:#ececf0; --muted:#a0a0aa; --line:#33333b;
  --accent:#ff5a6e; --accent-soft:#3a1c22; --ok:#5fd39a; --ok-soft:#173326; --bad:#ff7b70; --bad-soft:#3b1d1b;
  --warn:#ffbe5c; --warn-soft:#3a2c14; --el:#78a9ff; --la:#ff7f86; --ella:#5fd39a; --pl:#c3a2f0; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
a{color:var(--accent)}
#shell{display:flex;min-height:100vh}
#nav{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand b{display:block;font-size:17px}.brand small{color:var(--muted);font-size:12px}
.flag{width:30px;height:30px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px;line-height:1}
#nav nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px}
#nav nav a i{font-style:normal;width:20px;text-align:center;color:var(--muted)}
#nav nav a:hover{background:var(--bg)}
#nav nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#nav nav a.on i{color:var(--accent)}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.badge:empty{display:none}
.navfoot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 8px 0}
main{flex:1;min-width:0;padding:28px 36px 80px;max-width:1080px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:28px 0 10px}
h3{font-size:16px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card.click{cursor:pointer;transition:border-color .15s}
.card.click:hover{border-color:var(--accent)}
.card h3{margin-top:0}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--muted)}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.pri:hover{filter:brightness(1.07)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
button.sm{padding:4px 10px;font-size:13px}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:220px;line-height:1.55}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:8px}
.bar.ok>i{background:var(--ok)}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.lvl{font-weight:800;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--ink);color:var(--panel)}
.unitrow{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.unitrow:hover{border-color:var(--accent)}
.unitrow.locked{opacity:.5;cursor:not-allowed}
.unitrow .num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:700;font-size:13px;flex:none}
.unitrow.done .num{background:var(--ok);color:#fff}
.unitrow .t{flex:1;min-width:0}.unitrow .t b{display:block}.unitrow .t small{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 18px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--muted)}
.tabs button.on{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.gram{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 22px 18px}
.gram table{border-collapse:collapse;margin:10px 0 14px;font-size:15px;width:auto;max-width:100%}
.gram th,.gram td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.gram th{background:var(--bg);font-weight:600}
.gram .rule{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:12px 0}
.gram .warn{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:6px;margin:12px 0}
.gram .ch{background:var(--bg);border-left:4px solid var(--muted);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:15px}
.gram em{color:var(--accent);font-style:normal;font-weight:600}
.gram code,.mono{font-family:var(--mono);font-size:.92em}
.ex{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:none}
.ex .de{font-weight:500}.ex .en{color:var(--muted);font-size:14px}
.say{border:none;background:var(--bg);width:30px;height:30px;padding:0;border-radius:50%;flex:none;justify-content:center;font-size:13px}
.say:hover{background:var(--accent-soft);color:var(--accent)}
.el{color:var(--el);font-weight:600}.la{color:var(--la);font-weight:600}.ella{color:var(--ella);font-weight:600}.plu{color:var(--pl);font-weight:600}
/* exercise */
.quiz{max-width:760px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.qhead .bar{flex:1}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
.qtype{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.qprompt{font-size:20px;line-height:1.5;margin-bottom:16px}
.qprompt input.gap{display:inline-block;width:auto;min-width:90px;padding:3px 8px;font-size:18px;margin:0 3px;border-width:0 0 2px;border-radius:4px;background:var(--bg)}
.qprompt .hint{color:var(--muted);font-size:15px}
.opts{display:grid;gap:8px}
.opts button{justify-content:flex-start;padding:12px 14px;font-size:17px;text-align:left}
.opts button.sel{border-color:var(--accent);background:var(--accent-soft)}
.opts button.right{border-color:var(--ok);background:var(--ok-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-bottom:10px}
.tiles.pool{border-style:solid;background:var(--bg)}
.tile{padding:7px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:17px;user-select:none}
.tile:hover{border-color:var(--accent)}
.fb{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb.warn{background:var(--warn-soft)}
.fb b.h{display:block;margin-bottom:4px;font-size:16px}
.fb .ans{font-size:17px;font-weight:600}
.diff ins{background:var(--ok-soft);color:var(--ok);text-decoration:none;border-radius:3px;padding:0 2px;font-weight:600}
.diff del{background:var(--bad-soft);color:var(--bad);border-radius:3px;padding:0 2px}
.keys{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.keys button{padding:4px 11px;font-size:15px}
.qfoot{display:flex;gap:10px;margin-top:18px;align-items:center}
.flash{text-align:center;padding:30px 20px}
.flash .w{font-size:32px;font-weight:700;margin:6px 0}
.flash .pl{color:var(--muted)}
.flash .exs{color:var(--muted);margin-top:12px;font-size:16px}
.result{text-align:center;padding:30px}
.result .big{font-size:54px;font-weight:800;line-height:1}
/* table */
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.transcript{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:14px 16px;font-size:15px;max-height:420px;overflow:auto;border:1px solid var(--line)}
.cloze input{display:inline-block;width:auto;padding:1px 6px;font-size:15px;border-width:0 0 2px;border-radius:3px;margin:0 2px}
.cloze input.r{background:var(--ok-soft);border-color:var(--ok)}
.cloze input.w{background:var(--bad-soft);border-color:var(--bad)}
audio{width:100%;margin:8px 0}
.mic{width:64px;height:64px;border-radius:50%;justify-content:center;font-size:24px}
.mic.rec{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--accent-soft)}}
.timer{font-family:var(--mono);font-size:22px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.readtext{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;font-size:17px;line-height:1.7}
.readtext p{margin:0 0 12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;font-size:14px}
#toast.on{opacity:1}
.heat{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line);display:block}
.loading{padding:40px;color:var(--muted)}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
@media (max-width:860px){
  #shell{flex-direction:column}
  #nav{width:auto;height:auto;position:static;padding:10px}
  #nav nav{display:flex;overflow-x:auto;gap:4px}
  #nav nav a{white-space:nowrap;font-size:14px}
  .brand,.navfoot{display:none}
  main{padding:18px 16px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}.qprompt{font-size:18px}}
/* phone / tablet refinements */
main{padding-left:max(36px, env(safe-area-inset-left, 0px));padding-right:max(36px, env(safe-area-inset-right, 0px))}
@media (max-width:860px){
  #nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-left:max(10px, env(safe-area-inset-left, 0px));padding-right:max(10px, env(safe-area-inset-right, 0px));border-right:none;border-bottom:1px solid var(--line)}
  #nav nav{scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #nav nav::-webkit-scrollbar{display:none}
  main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .navfoot{display:block;order:2;padding:6px 4px 0;font-size:11px}
  .navfoot .bar{display:none}
  .tabs{overflow-x:auto;flex-wrap:nowrap}
  .tabs button{white-space:nowrap}
  .qcard{padding:16px}
  .opts button{font-size:16px}
  .unitrow{padding:10px}
  table.t{font-size:13px}
  .card table.t{display:block;overflow-x:auto}
}
input,textarea,select{font-size:16px}
button,.btn,.tile,.chip{touch-action:manipulation}

@media (max-width:860px){.navfoot .nf-x{display:none}.navfoot{padding:4px 6px 0}.navfoot div{margin:0!important}}

.profchip{font-size:13px;padding:10px 10px 0;color:var(--muted)}.profchip:empty{display:none}.profchip b{color:var(--ink)}
@media (max-width:860px){.profchip{padding:4px 6px 0}}

.tr-en{color:var(--muted);font-weight:400;font-size:.88em}
.tr-en[style*=block]{margin-top:2px}

.profchip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.langbar{display:inline-flex;align-items:center;gap:4px}
.langbar .lb{font:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line,#ccc);background:transparent;color:var(--ink);cursor:pointer;min-height:30px}
.langbar .lb.on{background:var(--accent,#c8102e);border-color:var(--accent,#c8102e);color:#fff}
.profchip .ver{font-size:11px;opacity:.6;margin-left:auto}

/* ---------- fx: animations ---------- */
#fxl{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.fx-canvas{position:absolute;inset:0;width:100%;height:100%}
.fx-dot{position:absolute;width:8px;height:8px;border-radius:50%;margin:-4px 0 0 -4px;animation:fxDot .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fxDot{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.fx-float{position:absolute;transform:translate(-50%,0);font-weight:800;font-size:18px;color:var(--ok,#2e9e5b);text-shadow:0 1px 0 rgba(255,255,255,.6);animation:fxFloat 1.25s ease-out forwards;white-space:nowrap}
@keyframes fxFloat{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.qcard{position:relative}
.quiz .qcard:not(.result){animation:fxIn .32s cubic-bezier(.2,.8,.3,1)}
@keyframes fxIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.qcard.fx-ok{animation:fxOk .55s ease}
@keyframes fxOk{0%{box-shadow:0 0 0 0 rgba(46,158,91,.55)}40%{transform:scale(1.015)}100%{box-shadow:0 0 0 18px rgba(46,158,91,0);transform:none}}
.qcard.fx-shake{animation:fxShake .45s ease}
@keyframes fxShake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.fb{animation:fxFb .3s ease}
@keyframes fxFb{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.opts button.right{animation:fxPulse .5s ease}
@keyframes fxPulse{50%{transform:scale(1.04)}}
.qhead .bar i{transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar i{transition:width .6s ease}
.tile{transition:transform .15s ease}.tile:active{transform:scale(.94)}
.fx-combo{position:absolute;top:-14px;right:14px;background:linear-gradient(135deg,#ff8a00,#c8102e);color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(200,16,46,.35);animation:fxCombo 2.2s ease forwards;z-index:3}
@keyframes fxCombo{0%{opacity:0;transform:scale(.4) rotate(-8deg)}12%{opacity:1;transform:scale(1.12) rotate(2deg)}20%{transform:scale(1) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.fx-banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.12);animation:fxFade .25s ease}
.fx-banner.out{opacity:0;transition:opacity .45s}
.fx-b-in{background:var(--panel,#fff);color:var(--ink);border-radius:22px;padding:26px 34px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);max-width:min(86vw,420px);animation:fxBanner .6s cubic-bezier(.2,1.4,.4,1)}
.fx-emoji{font-size:54px;line-height:1;animation:fxBounce 1s ease .2s}
.fx-big{font-size:24px;font-weight:800;margin-top:8px}
.fx-small{color:var(--muted);margin-top:4px}
@keyframes fxFade{from{opacity:0}}
@keyframes fxBanner{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes fxBounce{0%,100%{transform:none}30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
.fx-stars{display:flex;justify-content:center;gap:10px;margin:4px 0 6px;font-size:40px}
.fx-stars span{color:var(--line,#ddd);transform:scale(0);animation:fxStar .5s cubic-bezier(.2,1.6,.4,1) forwards}
.fx-stars span.on{color:#f2b705;text-shadow:0 2px 10px rgba(242,183,5,.5)}
@keyframes fxStar{to{transform:scale(1)}}
.qcard.result{animation:fxBanner .5s cubic-bezier(.2,1.2,.4,1)}
.flame{display:inline-block}.flame.lit{animation:fxFlame 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes fxFlame{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.12) rotate(-6deg)}50%{transform:scale(.96) rotate(3deg)}75%{transform:scale(1.08) rotate(-2deg)}}
.fx-tick{animation:fxPulse .45s ease}
.card.click,.unitrow{transition:transform .15s ease,box-shadow .15s ease}
.card.click:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){.quiz .qcard,.fb,.flame.lit,.qcard.result,.fx-stars span{animation:none!important}.fx-stars span{transform:none}}
.tr-en-block{margin:14px 0 4px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel)}
.tr-en-block>summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.tr-en-block[open]>summary{margin-bottom:8px}

/* ---------- big, obvious Next / Check button ---------- */
.qfoot{flex-wrap:wrap}
.qfoot #nx,.qfoot #chk{flex:1 1 100%;min-height:60px;font-size:21px;font-weight:800;justify-content:center;border-radius:16px;letter-spacing:.01em;box-shadow:0 8px 22px rgba(200,16,46,.30)}
.qfoot #nx{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 8px 22px rgba(31,122,77,.35);animation:nxIn .45s cubic-bezier(.2,1.3,.4,1),nxPulse 1.8s ease-in-out .5s infinite}
.qfoot #nx::after{content:"→";font-size:26px;margin-left:10px;line-height:1}

connectors:['y','pero','o','porque','que','cuando','si','aunque','también','además','entonces','luego','después','antes','primero','por eso','por lo tanto','así que','sin embargo','no obstante','en cambio','mientras','mientras que','ya que','puesto que','como','pues','o sea','es decir','por ejemplo','en primer lugar','por un lado','por otro lado','en resumen','en conclusión','al final','finalmente','por último','a pesar de','aun así','de hecho','en mi opinión','creo que','para mí','sobre todo','incluso','tampoco','ni','sino','para que','con tal de que','a menos que','siempre que','en cuanto','hasta que','desde que','por lo general','en cualquier caso','dicho esto'],

speakChecklist:['¿He tratado todos los puntos de la tarea?','¿Concuerdan los adjetivos con el sustantivo (la casa bonita, los pisos caros)?','¿He usado bien ser y estar (es simpático / está cansado / está en Madrid)?','¿He conjugado los verbos (yo hablo, tú hablas, él habla…)?','¿Pasado: indefinido para acciones terminadas (ayer fui), imperfecto para descripciones y costumbres (antes iba)?','¿He usado conectores (porque, pero, además, sin embargo, por eso)?','¿He dado mi opinión con un motivo y un ejemplo?','¿He reaccionado a la otra persona (¿Y tú?, ¡Qué bien!, Yo también / Yo tampoco)?','¿Registro adecuado: tú o usted?'],
cats:{
 conj:{n:'Conjugación',d:'Terminación de persona incorrecta (hablo, hablas, habla…).',tip:'<table><tr><th></th><th>-ar (hablar)</th><th>-er (comer)</th><th>-ir (vivir)</th></tr><tr><td>yo</td><td>habl<em>o</em></td><td>com<em>o</em></td><td>viv<em>o</em></td></tr><tr><td>tú</td><td>habl<em>as</em></td><td>com<em>es</em></td><td>viv<em>es</em></td></tr><tr><td>él/ella/usted</td><td>habl<em>a</em></td><td>com<em>e</em></td><td>viv<em>e</em></td></tr><tr><td>nosotros</td><td>habl<em>amos</em></td><td>com<em>emos</em></td><td>viv<em>imos</em></td></tr><tr><td>vosotros</td><td>habl<em>áis</em></td><td>com<em>éis</em></td><td>viv<em>ís</em></td></tr><tr><td>ellos/ustedes</td><td>habl<em>an</em></td><td>com<em>en</em></td><td>viv<em>en</em></td></tr></table><p>The ending alone tells you the person, so subject pronouns are usually dropped: <i>Hablo inglés</i> = I speak English. <b>usted</b> takes the él/ella form, <b>ustedes</b> the ellos form.</p>'},
 stem:{n:'Cambio de raíz',d:'e→ie, o→ue, e→i (quiero, puedo, pido) o forma irregular del «yo» (hago, tengo).',tip:'<p>Stem-changing verbs change the stressed vowel in all forms <b>except nosotros and vosotros</b> (the “boot”):</p><table><tr><th></th><th>e→ie querer</th><th>o→ue poder</th><th>e→i pedir</th></tr><tr><td>yo</td><td>qu<em>ie</em>ro</td><td>p<em>ue</em>do</td><td>p<em>i</em>do</td></tr><tr><td>tú</td><td>qu<em>ie</em>res</td><td>p<em>ue</em>des</td><td>p<em>i</em>des</td></tr><tr><td>él</td><td>qu<em>ie</em>re</td><td>p<em>ue</em>de</td><td>p<em>i</em>de</td></tr><tr><td>nosotros</td><td>queremos</td><td>podemos</td><td>pedimos</td></tr><tr><td>vosotros</td><td>queréis</td><td>podéis</td><td>pedís</td></tr><tr><td>ellos</td><td>qu<em>ie</em>ren</td><td>p<em>ue</em>den</td><td>p<em>i</em>den</td></tr></table><p>jugar → j<em>ue</em>go. Irregular “yo” forms: hago, pongo, salgo, traigo, tengo, vengo, digo, conozco, sé, doy, veo.</p>'},

 gender:{n:'Género / artículo',d:'Artículo equivocado: el/la, un/una, los/las.',tip:'<p>Every noun is masculine or feminine. Learn it <b>with the article</b>.</p><table><tr><th></th><th>masc.</th><th>fem.</th></tr><tr><td>the (sg.)</td><td>el</td><td>la</td></tr><tr><td>the (pl.)</td><td>los</td><td>las</td></tr><tr><td>a / some</td><td>un / unos</td><td>una / unas</td></tr></table><p>Usually <b>-o</b> = masc., <b>-a, -ción, -sión, -dad, -tad, -tud</b> = fem. Exceptions: el día, el mapa, el problema, el idioma, el tema, el sofá; la mano, la radio, la foto, la moto. Feminine nouns starting with stressed a- take <b>el</b> in the singular: el agua, el aula, el hambre (but las aguas).</p><p>a + el = <b>al</b>, de + el = <b>del</b>.</p>'},
 agree:{n:'Concordancia',d:'El adjetivo no concuerda en género o número con el sustantivo.',tip:'<p>Adjectives agree in gender and number with the noun and usually go <b>after</b> it: <i>un piso pequeño, una casa pequeña, unos pisos pequeños, unas casas pequeñas</i>.</p><p>Adjectives in -e or consonant only change for number: <i>un coche grande / una casa grande; un chico joven / unos chicos jóvenes</i>. Nationalities in a consonant add -a: <i>inglés → inglesa, español → española</i>.</p><p>Before a masc. sg. noun: bueno → <b>buen</b>, malo → <b>mal</b>, grande → <b>gran</b> (great): <i>un buen día, un gran país</i>.</p>'},
 gustar:{n:'Gustar y similares',d:'Estructura de gustar, encantar, doler, interesar (me gusta / me gustan).',tip:'<p><b>gustar</b> works like “to please”: the thing liked is the subject, the person is an indirect object pronoun.</p><table><tr><td>(a mí)</td><td><b>me</b></td><td rowspan="6">gusta + singular / infinitive<br>gustan + plural</td></tr><tr><td>(a ti)</td><td><b>te</b></td></tr><tr><td>(a él/ella/usted)</td><td><b>le</b></td></tr><tr><td>(a nosotros)</td><td><b>nos</b></td></tr><tr><td>(a vosotros)</td><td><b>os</b></td></tr><tr><td>(a ellos/ustedes)</td><td><b>les</b></td></tr></table><p><i>Me gusta el café. Me gustan las tapas. Nos gusta viajar. A Ana le encanta Sevilla. Me duele la cabeza / me duelen los pies.</i> Never <s>yo gusto</s>.</p>'},
 pron:{n:'Pronombres',d:'Pronombre de objeto directo/indirecto o su posición (lo/la/le, se lo).',tip:'<table><tr><th></th><th>direct</th><th>indirect</th></tr><tr><td>me / you</td><td>me / te</td><td>me / te</td></tr><tr><td>him, it (m) / her, it (f), you (usted)</td><td>lo / la</td><td>le</td></tr><tr><td>us / you pl.</td><td>nos / os</td><td>nos / os</td></tr><tr><td>them</td><td>los / las</td><td>les</td></tr></table><p>Pronouns go <b>before</b> a conjugated verb (<i>Lo compro</i>) and are <b>attached</b> to infinitives, gerunds and positive commands (<i>Voy a comprarlo, Estoy comprándolo, ¡Cómpralo!</i>). Indirect before direct: <i>me lo, te la</i>. le/les + lo/la → <b>se</b>: <i>Se lo doy</i> (not le lo).</p><p>In Spain you will often hear <b>le</b> for a male person as direct object (leísmo): <i>A Juan le veo mañana</i> – accepted for people.</p>'},
 reflex:{n:'Verbos reflexivos',d:'Falta o sobra el pronombre reflexivo (me levanto, se ducha).',tip:'<p>Reflexive verbs carry <b>-se</b> in the infinitive and use a pronoun that matches the subject:</p><table><tr><td>yo</td><td><b>me</b> levanto</td></tr><tr><td>tú</td><td><b>te</b> levantas</td></tr><tr><td>él/ella/usted</td><td><b>se</b> levanta</td></tr><tr><td>nosotros</td><td><b>nos</b> levantamos</td></tr><tr><td>vosotros</td><td><b>os</b> levantáis</td></tr><tr><td>ellos/ustedes</td><td><b>se</b> levantan</td></tr></table><p>With body parts use the article, not a possessive: <i>Me lavo <b>las</b> manos</i> (not mis manos). Infinitive: <i>Tengo que levantarme / Me tengo que levantar</i>.</p>'},
 prep:{n:'Preposiciones',d:'Preposición incorrecta (a, en, de, con…), incluida la «a» personal.',tip:'<p><b>ir a</b> (direction): <i>Voy a Madrid, voy al médico</i>. <b>estar en</b> (location): <i>Estoy en Madrid</i>. <b>ser de</b> (origin/material): <i>Soy de Londres</i>. Transport: <i>en tren, en coche, en metro</i> but <i>a pie</i>. Time: <i>a las tres, el lunes</i> (no preposition!), <i>en agosto, en verano, por la mañana</i>.</p><p><b>Personal a</b>: before a person as direct object: <i>Veo <b>a</b> mi madre. Conozco <b>a</b> Pedro.</i> (but <i>Veo la catedral</i>).</p><p>Verb + preposition: pensar <b>en</b>, soñar <b>con</b>, casarse <b>con</b>, enamorarse <b>de</b>, depender <b>de</b>, empezar <b>a</b>, aprender <b>a</b>, tratar <b>de</b>.</p>'},
 porpara:{n:'Por / para',d:'Confusión entre por y para.',tip:'<div class="rule"><b>para</b> → goal, destination, recipient, deadline, purpose: <i>Estudio <b>para</b> hablar con mis vecinos. El tren <b>para</b> Sevilla. Un regalo <b>para</b> ti. <b>Para</b> el lunes.</i></div><div class="rule"><b>por</b> → cause, through/along, exchange, means, duration, approximate time: <i>Gracias <b>por</b> todo. Paseamos <b>por</b> el Retiro. Lo compré <b>por</b> 10 euros. Hablamos <b>por</b> teléfono. <b>Por</b> la mañana.</i></div><p>Test: “in order to / for (recipient, deadline)” → para. “because of / through / per / by” → por.</p>'},
 perf:{n:'Pretérito perfecto',d:'Forma o uso de haber + participio (he comido).',tip:'<p><b>haber</b> (he, has, ha, hemos, habéis, han) + participle (-ar → <b>-ado</b>, -er/-ir → <b>-ido</b>). Irregular: hecho, dicho, visto, escrito, puesto, vuelto, abierto, roto, muerto, descubierto.</p><p>In Spain the perfect is used for the past <b>within the current period</b>: <i>hoy, esta mañana, esta semana, este año, ya, todavía no, alguna vez, nunca</i>: <i>Hoy <b>he comido</b> paella. ¿<b>Has estado</b> alguna vez en Granada?</i> Never separate haber and the participle; pronouns go before haber: <i>Lo he visto</i>.</p>'},
 pret:{n:'Pretérito indefinido',d:'Forma del indefinido (hablé, comí, fui, tuve…).',tip:'<table><tr><th></th><th>-ar</th><th>-er/-ir</th></tr><tr><td>yo</td><td>habl<em>é</em></td><td>com<em>í</em></td></tr><tr><td>tú</td><td>habl<em>aste</em></td><td>com<em>iste</em></td></tr><tr><td>él</td><td>habl<em>ó</em></td><td>com<em>ió</em></td></tr><tr><td>nosotros</td><td>habl<em>amos</em></td><td>com<em>imos</em></td></tr><tr><td>vosotros</td><td>habl<em>asteis</em></td><td>com<em>isteis</em></td></tr><tr><td>ellos</td><td>habl<em>aron</em></td><td>com<em>ieron</em></td></tr></table><p>Irregular stems (no accents!): tuv-, estuv-, pud-, pus-, sup-, hic-/hiz-, quis-, vin-, dij- (dijeron), traj-, hub- + -e, -iste, -o, -imos, -isteis, -ieron. <b>ser/ir</b>: fui, fuiste, fue, fuimos, fuisteis, fueron. Used with <i>ayer, anoche, el año pasado, en 2019, hace tres días</i>.</p>'},
 imperf:{n:'Pretérito imperfecto',d:'Forma del imperfecto (hablaba, comía, era, iba).',tip:'<p>-ar: habl<em>aba</em>, -abas, -aba, -ábamos, -abais, -aban. -er/-ir: com<em>ía</em>, -ías, -ía, -íamos, -íais, -ían. Only three irregulars: <b>ser</b> (era), <b>ir</b> (iba), <b>ver</b> (veía).</p><p>Use: habits in the past (<i>De niño jugaba al fútbol</i>), descriptions and background (<i>Hacía sol, había mucha gente</i>), age and time in the past (<i>Tenía diez años. Eran las ocho</i>).</p>'},
 pretimp:{n:'Indefinido o imperfecto',d:'Elección incorrecta entre indefinido e imperfecto al narrar.',tip:'<div class="rule"><b>Indefinido</b> = the events, the story moving forward, finished actions with a clear limit: <i>Llegué, vi el piso y lo alquilé.</i></div><div class="rule"><b>Imperfecto</b> = the scene: background, description, what was going on, habits: <i>Llovía y no había nadie en la calle.</i></div><p>Together: <i>Mientras <b>cenábamos</b> (background), <b>sonó</b> el teléfono (event).</i> Changes of meaning: <i>conocí</i> (I met) / <i>conocía</i> (I knew); <i>supe</i> (I found out) / <i>sabía</i> (I knew); <i>quise</i> (I tried) / <i>no quise</i> (I refused).</p>'},
 fut:{n:'Futuro',d:'Forma del futuro simple (hablaré, tendré, haré).',tip:'<p>Infinitive + <b>-é, -ás, -á, -emos, -éis, -án</b>: hablaré, comerás, vivirá. Irregular stems: tendr-, saldr-, vendr-, pondr-, podr-, sabr-, habr-, querr-, har-, dir-.</p><p>Spoken Spanish often uses <b>ir a + infinitivo</b> for plans (<i>Voy a cenar fuera</i>). The future also expresses <b>probability</b> now: <i>¿Dónde está Ana? – Estará en casa</i> (She’s probably at home).</p>'},
 cond:{n:'Condicional',d:'Forma o uso del condicional (hablaría, podría).',tip:'<p>Infinitive (or future stem) + <b>-ía, -ías, -ía, -íamos, -íais, -ían</b>: hablaría, tendría, haría, podría, diría.</p><p>Uses: politeness (<i>¿Podría ayudarme? Me gustaría un café</i>), advice (<i>Yo que tú, iría al médico. Deberías descansar</i>), hypotheses with <i>si + imperfecto de subjuntivo</i> (<i>Si tuviera tiempo, viajaría más</i>).</p>'},
 subj:{n:'Subjuntivo',d:'Indicativo en lugar de subjuntivo o al revés, o forma incorrecta.',tip:'<p><b>Form:</b> take the “yo” form of the present, drop -o, swap the vowel: -ar → <b>-e</b> (hable), -er/-ir → <b>-a</b> (coma, viva, tenga, haga, diga). Irregular: sea, esté, vaya, haya, sepa, dé.</p><p><b>When (WEIRDO):</b> Wishes (<i>quiero que vengas, ojalá</i>), Emotions (<i>me alegra que</i>), Impersonal judgements (<i>es importante que</i>), Recommendations (<i>te recomiendo que</i>), Doubt/denial (<i>no creo que, dudo que</i>), Ojalá. Also after <i>para que, antes de que, sin que</i>, and <i>cuando</i> + future meaning (<i>cuando llegues</i>).</p><p>Only with a <b>change of subject</b>: <i>Quiero ir</i> (I want to go) vs <i>Quiero que vayas</i> (I want you to go). <i>Creo que es</i> (indicative) but <i>No creo que sea</i> (subjunctive).</p>'},
 impsubj:{n:'Imperfecto de subjuntivo',d:'Forma o uso del imperfecto de subjuntivo (hablara, tuviera, fuera).',tip:'<p>Take the <b>ellos</b> form of the preterite, drop -ron, add <b>-ra, -ras, -ra, -ramos, -rais, -ran</b>: hablaron → habla<em>ra</em>, tuvieron → tuvie<em>ra</em>, fueron → fue<em>ra</em>, dijeron → dije<em>ra</em>. (Alternative -se: hablase.) Nosotros has an accent: habláramos, tuviéramos.</p><p>Use: subjunctive contexts in the past (<i>Quería que vinieras</i>), unreal conditions (<i>Si tuviera dinero…</i>), <i>ojalá</i> for unlikely wishes, <i>como si</i> (<i>Habla como si fuera el jefe</i>).</p>'},
 imper:{n:'Imperativo',d:'Forma del imperativo (habla, no hables, siéntese).',tip:'<table><tr><th></th><th>affirmative</th><th>negative</th></tr><tr><td>tú</td><td>habla, come, escribe</td><td>no hables, no comas</td></tr><tr><td>usted</td><td>hable, coma</td><td>no hable, no coma</td></tr><tr><td>vosotros</td><td>hablad, comed</td><td>no habléis, no comáis</td></tr><tr><td>ustedes</td><td>hablen, coman</td><td>no hablen, no coman</td></tr></table><p>Irregular tú: <b>di, haz, ve, pon, sal, sé, ten, ven</b>. Pronouns are attached to affirmative commands (<i>dímelo, siéntese</i>) and go before negative ones (<i>no me lo digas</i>). In speech in Spain the vosotros command is often <i>¡Sentaros!</i>, but write <i>¡Sentaos!</i></p>'},
 comp:{n:'Comparación',d:'Comparativo o superlativo incorrecto (más… que, tan… como, el más…).',tip:'<p><b>más / menos + adj. + que</b>: <i>Madrid es más grande que Toledo.</i> <b>tan + adj. + como</b>: <i>Es tan caro como el otro.</i> <b>tanto/a/os/as + noun + como</b>: <i>No tengo tanto tiempo como tú.</i></p><p>Irregular: bueno → <b>mejor</b>, malo → <b>peor</b>, grande (age) → <b>mayor</b>, pequeño (age) → <b>menor</b>. Superlative: <i>el/la más… de</i>: <i>Es el barrio más bonito <b>de</b> la ciudad.</i> Absolute: <i>-ísimo</i>: <i>carísimo, buenísimo</i>.</p>'},
 rel:{n:'Relativos',d:'Pronombre relativo incorrecto (que, quien, donde, lo que, el que).',tip:'<p><b>que</b> is the default (people and things): <i>El piso que he visto. La chica que vive arriba.</i> After a preposition: <b>el/la/los/las que</b> or <b>quien</b> (people): <i>La amiga con la que viajé / con quien viajé.</i> <b>donde</b> = where. <b>lo que</b> = what (the thing that): <i>No entiendo lo que dices.</i> <b>cuyo/a</b> = whose (agrees with the thing owned).</p><p>Unknown or non-existent antecedent → subjunctive: <i>Busco un piso que <b>tenga</b> terraza.</i></p>'},
 neg:{n:'Negación',d:'Falta «no» o la doble negación (no… nada, no… nunca).',tip:'<p><b>no</b> goes directly before the verb (and before object pronouns): <i>No lo sé. No me gusta.</i> Spanish uses <b>double negatives</b>: <i>No tengo nada. No viene nadie. No voy nunca. No me gusta tampoco.</i> If the negative word comes first, drop no: <i>Nunca voy. Nadie viene.</i></p>'},
 wordorder:{n:'Orden de palabras',d:'Palabras en orden incorrecto (adjetivo, pronombre, pregunta).',tip:'<p>Adjectives usually <b>after</b> the noun: <i>un coche rojo</i>. Object pronouns <b>before</b> the conjugated verb: <i>Te quiero. Lo tengo.</i> Questions often invert verb and subject: <i>¿Dónde vive tu hermano?</i> – and need <b>¿ … ?</b>. no comes before the verb: <i>No hablo alemán.</i></p>'},
 accent:{n:'Tildes',d:'Falta o sobra una tilde (á, é, í, ó, ú) o la diéresis (ü).',tip:'<p>Stress rules: words ending in a <b>vowel, -n or -s</b> are stressed on the second-to-last syllable (<i>casa, hablan, lunes</i>); words ending in any other consonant on the last (<i>hablar, ciudad, español</i>). A <b>tilde</b> marks every exception: <i>café, inglés, canción, fácil, árbol, teléfono, música</i>. All words stressed on the third-to-last syllable carry one (<i>sábado, rápido</i>).</p><p>Question words: <b>qué, quién, cómo, dónde, cuándo, cuánto</b>. Meaning pairs: <i>tú</i> (you) / <i>tu</i> (your), <i>él</i> (he) / <i>el</i> (the), <i>sí</i> (yes) / <i>si</i> (if), <i>más</i> (more) / <i>mas</i> (but), <i>sé</i> (I know) / <i>se</i>, <i>té</i> (tea) / <i>te</i>. Past forms: hablé, habló; imperfect -ía: tenía, vivía.</p>'},
 plural:{n:'Plural',d:'Plural incorrecto (luces, canciones, lunes).',tip:'<p>Vowel → <b>+s</b>: casa → casas. Consonant → <b>+es</b>: ciudad → ciudades, mes → meses. <b>-z → -ces</b>: luz → luces, vez → veces. Accent may disappear or appear: canción → canciones, joven → jóvenes, examen → exámenes. Unstressed -es/-is endings stay the same: el lunes → los lunes, la crisis → las crisis.</p>'},
 conn:{n:'Conectores',d:'Conector incorrecto o falta un conector (porque, aunque, sin embargo…).',tip:'<p><b>porque</b> (because – answer), <b>como</b> (since – at the start), <b>ya que / puesto que</b> (since, formal); <b>pero</b> (but), <b>sino</b> (but rather, after a negative: <i>no es caro sino barato</i>), <b>sin embargo</b> (however), <b>aunque</b> (although); <b>por eso / así que / por lo tanto</b> (so, therefore); <b>además</b> (moreover). ¿Por qué? (why) vs porque (because) vs el porqué (the reason).</p>'},
 vocab:{n:'Vocabulario',d:'Palabra equivocada o desconocida.',tip:'<p>Learn words in context and with the article. Watch the <b>false friends</b>: <i>embarazada</i> = pregnant (not embarrassed → <i>avergonzado</i>), <i>constipado</i> = having a cold, <i>actual</i> = current, <i>librería</i> = bookshop (library = <i>biblioteca</i>), <i>carpeta</i> = folder (carpet = <i>alfombra</i>), <i>éxito</i> = success (exit = <i>salida</i>), <i>asistir</i> = to attend, <i>realizar</i> = to carry out.</p>'},
 spelling:{n:'Ortografía',d:'Error de escritura (b/v, h, ll/y, c/z/qu, g/j).',tip:'<p><b>h</b> is silent but written: <i>hola, hacer, hay</i>. <b>b/v</b> sound the same – learn the spelling. <b>c</b> before e/i and <b>z</b> before a/o/u are both [θ] in Spain: <i>cine, zapato</i>; so: <i>luz → luces, empezar → empecé</i>. [k] = <b>c</b> + a/o/u, <b>qu</b> + e/i: <i>casa, queso, aquí</i>. [x] = <b>j</b> or <b>g</b> + e/i: <i>jamón, gente</i>; [g] before e/i = <b>gu</b>: <i>guerra, guitarra</i>; <b>gü</b> to pronounce the u: <i>pingüino, vergüenza</i>. Only <b>r</b> → <b>rr</b> between vowels for the trill: <i>pero / perro</i>.</p>'},
 caps:{n:'Mayúsculas',d:'Mayúscula/minúscula incorrecta.',tip:'<p>Spanish uses <b>lower case</b> for days (<i>lunes</i>), months (<i>enero</i>), languages and nationalities (<i>inglés, español</i>) and <i>usted</i>. Capitals for names of people, places, institutions and the first word of a sentence.</p>'},
 punct:{n:'Puntuación',d:'Faltan los signos de apertura ¿ ¡ o una coma.',tip:'<p>Questions and exclamations are framed on <b>both sides</b>: <i>¿Cómo estás? ¡Qué bien!</i> They can start in the middle of a sentence: <i>Oye, ¿vienes mañana?</i> Comma before <i>pero</i> and around inserted phrases; no comma before <i>que</i>.</p>'},
 ending:{n:'Terminación',d:'Terminación incorrecta (persona, tiempo, género).',tip:'<p>Check: who is the subject (person → verb ending)? What time (present, past, future → tense ending)? Masculine/feminine, singular/plural (→ adjective ending)?</p>'},
 listening:{n:'Comprensión auditiva / dictado',d:'Error al escuchar o en el dictado.',tip:'<p>Listen first for the general sense, then for details. In fast Spanish, words run together (<i>¿Qué es esto?</i> → «quéesesto»), final <b>-s</b> may be weak (south), and <b>d</b> between vowels softens (<i>cansado</i> → «cansao» in casual speech). Use the slow button and the line-by-line mode.</p>'},
 lesen:{n:'Comprensión lectora',d:'Respuesta incorrecta en una tarea de lectura.',tip:'<p>Read the questions first, then the text. Look for the key words of the question (and their synonyms) in the text. Watch for negation (<i>no, nunca, tampoco</i>) and contrast words (<i>pero, sin embargo</i>).</p>'},
 pronun:{n:'Pronunciación',d:'El reconocimiento de voz no entendió una o varias palabras.',tip:'<p>Spanish vowels are short and pure: <b>a e i o u</b>, never gliding (no “ay”, “ow”). Stress the right syllable (<i>hablo</i> vs <i>habló</i>!). <b>r</b> = one tap, <b>rr</b> and initial r = trill. <b>j</b> = a throaty [x]; <b>z/ce/ci</b> = [θ] like English “th” in Spain; <b>ll/y</b> ≈ English “y”; <b>ñ</b> = “ny”. <b>h</b> is silent; <b>b</b> and <b>v</b> sound the same.</p>'},
 other:{n:'Otros',d:'Otros errores.',tip:''}
},
spain:{
 intro:'Aquí está el español que necesita en la calle: situaciones reales con frases útiles (todas con audio), enlaces a los diálogos y tareas orales, y las claves culturales que no vienen en la gramática.',
 introEn:'This is the Spanish you need on the street: real situations with useful phrases (all with audio), links to the dialogues and speaking tasks, and the cultural keys that are not in the grammar books.',
 levels:'El curso sigue el Marco Común Europeo (A1 → B2). Con A2 se desenvuelve en tiendas, bares, médico y transporte. Con B1 puede mantener conversaciones sobre casi todo lo cotidiano. Con B2 habla con fluidez y naturalidad con nativos. Haga la prueba de cada nivel para ver dónde está.',
 levelsEn:'The course follows the Common European Framework (A1 → B2). At A2 you get by in shops, bars, at the doctor’s and on transport. At B1 you can hold conversations about almost everything in daily life. At B2 you speak fluently and naturally with native speakers. Take each level test to see where you are.',
 situations:[
  {icon:'☕',t:'En el bar y de tapas',te:'At the bar, having tapas',html:'Se pide en la barra o se espera al camarero. Es normal pedir de forma directa: «Ponme una caña» / «Me pones un café con leche». Se paga al final («¿Me cobras?»). La propina es pequeña y voluntaria (redondear o dejar unas monedas).',htmlEn:'You order at the bar or wait for the waiter. Ordering directly is normal: “Ponme una caña” (Give me a small beer) / “Me pones un café con leche”. You pay at the end (“¿Me cobras?”). Tips are small and optional (round up or leave a few coins).',phrases:[['Hola, ¿me pones una caña, por favor?','Hi, can I have a small beer, please?'],['Un café con leche y una tostada con tomate.','A white coffee and toast with tomato.'],['¿Qué tapas tenéis?','What tapas do you have?'],['Una ración de patatas bravas para compartir.','A portion of patatas bravas to share.'],['¿Me cobras, por favor?','Can I pay, please?'],['¿Se puede pagar con tarjeta?','Can I pay by card?']],links:[['#/listen/track/l-a1-05','♪ En el bar'],['#/speak/task/s-a1-3','◉ Pedir en un bar']]},
  {icon:'🚆',t:'Transporte: metro, Renfe, autobús',te:'Transport: metro, trains, buses',html:'En las ciudades: metro, autobús y Cercanías. Para largas distancias: AVE y otros trenes de Renfe (o Iryo/Ouigo), y autobuses (ALSA). Se compran billetes en la app, la máquina o la taquilla. «Ida» = one way, «ida y vuelta» = return.',htmlEn:'In cities: metro, buses and Cercanías (commuter trains). For long distances: AVE and other Renfe trains (or Iryo/Ouigo) and coaches (ALSA). Tickets from the app, the machine or the ticket office. “Ida” = one way, “ida y vuelta” = return.',phrases:[['Un billete de ida y vuelta a Toledo, por favor.','A return ticket to Toledo, please.'],['¿A qué hora sale el próximo tren?','What time does the next train leave?'],['¿De qué andén sale?','Which platform does it leave from?'],['¿Este autobús va al centro?','Does this bus go to the centre?'],['¿Dónde tengo que bajarme?','Where do I have to get off?'],['Perdone, ¿está libre este asiento?','Excuse me, is this seat free?']],links:[['#/listen/track/l-a1-09','♪ En la estación'],['#/speak/task/s-a2-2','◉ Comprar un billete']]},
  {icon:'🏠',t:'Buscar piso y empadronarse',te:'Finding a flat & registering',html:'Pisos en Idealista o Fotocasa. Normalmente: una fianza de uno o dos meses y contrato de alquiler. Con el contrato se va al ayuntamiento a <b>empadronarse</b> (registro de vecinos) – necesario para el centro de salud y muchos trámites. Extranjeros: NIE / TIE en la policía (cita previa).',htmlEn:'Flats on Idealista or Fotocasa. Usually: a deposit (fianza) of one or two months and a rental contract. With the contract you go to the town hall to <b>empadronarse</b> (residents’ register) – needed for the health centre and many procedures. Foreigners: NIE / TIE at the police (appointment needed).',phrases:[['Llamo por el piso que anuncian en Idealista.','I’m calling about the flat you are advertising on Idealista.'],['¿Está amueblado?','Is it furnished?'],['¿Los gastos de comunidad están incluidos?','Are the service charges included?'],['¿Cuánto es la fianza?','How much is the deposit?'],['Quería pedir cita previa para empadronarme.','I’d like to make an appointment to register as a resident.'],['¿Qué documentos tengo que traer?','What documents do I have to bring?']],links:[['#/listen/track/l-a2-08','♪ Ver un piso'],['#/read/r-a2-2','❐ Anuncio de piso'],['#/write/task/w-b1-2','✎ Correo a la casera']]},
  {icon:'🩺',t:'Médico y farmacia',te:'Doctor & pharmacy',html:'Con la tarjeta sanitaria se pide cita en el <b>centro de salud</b> (médico de cabecera). Urgencias en el hospital para emergencias; teléfono 112. En la farmacia (cruz verde) aconsejan mucho y venden sin receta medicamentos sencillos.',htmlEn:'With your health card you book an appointment at the <b>centro de salud</b> (GP). A&E (urgencias) at the hospital for emergencies; phone 112. At the pharmacy (green cross) they give a lot of advice and sell simple medicines without a prescription.',phrases:[['Quería pedir cita con mi médico de cabecera.','I’d like an appointment with my GP.'],['Me duele mucho la garganta.','My throat hurts a lot.'],['Tengo fiebre desde ayer.','I’ve had a temperature since yesterday.'],['¿Tiene algo para la tos?','Do you have something for a cough?'],['Soy alérgico a la penicilina.','I’m allergic to penicillin.'],['¿Cada cuántas horas lo tomo?','How often do I take it?']],links:[['#/listen/track/l-a2-02','♪ En el centro de salud'],['#/speak/task/s-a2-1','◉ En la farmacia']]},
  {icon:'🛒',t:'Comprar: mercado, súper, tiendas',te:'Shopping: market, supermarket, shops',html:'En el mercado se pide por turno: al llegar se pregunta «¿Quién es el último?». Fruta y verdura se compran por kilo; fiambre «en lonchas finas». Horarios: muchas tiendas cierran a mediodía (14–17 h) y abren hasta las 20:30 o 21 h; los domingos casi todo está cerrado fuera de las grandes ciudades.',htmlEn:'At the market you queue by turn: when you arrive you ask “¿Quién es el último?” (Who is last?). Fruit and veg by the kilo; cold meats “en lonchas finas” (thin slices). Hours: many shops close at midday (2–5 pm) and open until 8:30 or 9 pm; on Sundays almost everything is closed outside the big cities.',phrases:[['¿Quién es el último?','Who is last (in the queue)?'],['Póngame un kilo de tomates, por favor.','A kilo of tomatoes, please.'],['Doscientos gramos de jamón, en lonchas finas.','200 grams of ham, thinly sliced.'],['¿Algo más? – No, nada más, gracias.','Anything else? – No, that’s all, thanks.'],['¿Puedo probármelo?','Can I try it on?'],['¿Tiene una talla más grande?','Do you have a bigger size?']],links:[['#/listen/track/l-a1-11','♪ En el mercado'],['#/listen/track/l-a1-12','♪ En una tienda de ropa']]},
  {icon:'🏦',t:'Banco, teléfono y trámites',te:'Bank, phone & paperwork',html:'Para casi todo se necesita <b>cita previa</b> (online). Trámites frecuentes: abrir una cuenta, alta en la Seguridad Social, tarjeta sanitaria, cambio de domicilio. Al teléfono: «¿Dígame?» / «¿Sí?», y para identificarse «Le llamo de parte de…».',htmlEn:'For almost everything you need a <b>cita previa</b> (appointment, online). Frequent procedures: opening an account, registering with Social Security, health card, change of address. On the phone: “¿Dígame?” / “¿Sí?”, and to introduce yourself “Le llamo de parte de…” (I’m calling on behalf of…).',phrases:[['Quería abrir una cuenta.','I’d like to open an account.'],['¿Me lo puede repetir más despacio, por favor?','Could you repeat that more slowly, please?'],['¿Cómo se escribe?','How do you spell it?'],['Le llamo de parte de la empresa Ruiz.','I’m calling on behalf of the Ruiz company.'],['¿Puedo dejar un mensaje?','Can I leave a message?'],['Perdone, no le he entendido.','Sorry, I didn’t understand you.']],links:[['#/listen/track/l-a2-11','♪ Una llamada'],['#/read/r-b1-1','❐ Carta del ayuntamiento']]},
  {icon:'🗺',t:'Pedir y entender direcciones',te:'Asking for & understanding directions',html:'Se pregunta con «Perdone, ¿para ir a…?» o «¿Sabe dónde está…?». Las respuestas usan el imperativo de usted: «Siga recto, gire a la derecha, cruce la plaza». Medidas: «a cinco minutos andando», «la segunda calle a la izquierda».',htmlEn:'Ask with “Perdone, ¿para ir a…?” (Excuse me, how do I get to…?) or “¿Sabe dónde está…?”. Answers use the usted command: “Siga recto, gire a la derecha, cruce la plaza”. Distances: “five minutes’ walk”, “the second street on the left”.',phrases:[['Perdone, ¿para ir a la Plaza Mayor?','Excuse me, how do I get to the Plaza Mayor?'],['¿Está lejos de aquí?','Is it far from here?'],['Siga todo recto y gire a la izquierda.','Go straight on and turn left.'],['Está a cinco minutos andando.','It’s five minutes’ walk.'],['¿Hay una farmacia por aquí cerca?','Is there a pharmacy near here?']],links:[['#/listen/track/l-a1-07','♪ Por la ciudad'],['#/listen/track/l-a2-12','♪ Cómo llegar']]},
  {icon:'💬',t:'Hacer amigos y quedar',te:'Making friends & meeting up',html:'En España se queda mucho: «¿Quedamos para tomar algo?». Las citas son flexibles; se cena tarde (21–22 h). Entre amigos se saluda con dos besos (mejilla derecha primero) entre mujeres y entre hombre y mujer; los hombres se dan la mano o un abrazo.',htmlEn:'People in Spain meet up a lot: “¿Quedamos para tomar algo?” (Shall we meet for a drink?). Times are flexible; dinner is late (9–10 pm). Friends greet with two kisses (right cheek first) between women and between a man and a woman; men shake hands or hug.',phrases:[['¿Quedamos el viernes para tomar algo?','Shall we meet on Friday for a drink?'],['¿A qué hora te viene bien?','What time suits you?'],['Vale, perfecto. ¿Dónde quedamos?','OK, perfect. Where shall we meet?'],['Lo siento, no puedo, ¿lo dejamos para otro día?','Sorry, I can’t – shall we leave it for another day?'],['¡Qué ganas de verte!','I can’t wait to see you!']],links:[['#/listen/track/l-a2-10','♪ Quedar con amigos'],['#/speak/task/s-b1-2','◉ Organizar un plan']]}
 ],
 culture:[
  {t:'Tú o usted',te:'tú or usted',html:'En España se tutea mucho más que en otros países: entre jóvenes, compañeros de trabajo, en tiendas modernas y bares. <b>Usted</b> con personas mayores, en situaciones formales, en la administración y cuando alguien le habla de usted. Si duda, empiece con usted – la otra persona le dirá «puedes tutearme».',htmlEn:'In Spain people use tú much more than in other countries: among young people, colleagues, in modern shops and bars. <b>Usted</b> with older people, in formal situations, with officials and when someone addresses you as usted. If in doubt, start with usted – the other person will say “puedes tutearme” (you can say tú).'},
  {t:'Vosotros y el español de España',te:'vosotros & Spain’s Spanish',html:'En España se usa <b>vosotros</b> (vosotros habláis) para «you» plural informal; <b>ustedes</b> solo es formal. Este curso enseña el castellano peninsular: <i>coche, ordenador, móvil, zumo, patata, coger el autobús, vale</i>. En Latinoamérica: ustedes para todos, carro, computadora, celular, jugo, papa.',htmlEn:'Spain uses <b>vosotros</b> (vosotros habláis) for informal plural “you”; <b>ustedes</b> is only formal. This course teaches peninsular Spanish: <i>coche, ordenador, móvil, zumo, patata, coger el autobús, vale</i>. In Latin America: ustedes for everyone, carro, computadora, celular, jugo, papa.'},
  {t:'Horarios españoles',te:'Spanish timetables',html:'Desayuno ligero (8 h), almuerzo a media mañana, <b>comida</b> fuerte a las 14–15 h, merienda a las 18 h, <b>cena</b> a las 21–22 h. «Buenos días» hasta la hora de comer, «buenas tardes» hasta que anochece, luego «buenas noches» (también para saludar). La <b>sobremesa</b> – la charla después de comer – es sagrada.',htmlEn:'Light breakfast (8 am), a mid-morning snack, the main <b>meal</b> at 2–3 pm, a snack at 6 pm, <b>dinner</b> at 9–10 pm. “Buenos días” until lunch, “buenas tardes” until dark, then “buenas noches” (also as a greeting). The <b>sobremesa</b> – chatting at the table after a meal – is sacred.'},
  {t:'Lenguas y acentos',te:'Languages & accents',html:'El castellano es oficial en todo el país; además el catalán (Cataluña, Baleares, Comunidad Valenciana: valenciano), el gallego y el euskera son cooficiales en sus regiones. Acentos: en el centro y norte se distingue <i>casa</i> [s] y <i>caza</i> [θ]; en gran parte de Andalucía y Canarias se pronuncia igual (seseo/ceceo) y se aspira la -s final.',htmlEn:'Castilian is official everywhere; in addition Catalan (Catalonia, Balearics, Valencia: Valencian), Galician and Basque are co-official in their regions. Accents: in the centre and north <i>casa</i> [s] and <i>caza</i> [θ] are different; in much of Andalusia and the Canaries they sound the same (seseo/ceceo) and final -s is aspirated.'},
  {t:'Muletillas de la conversación',te:'Conversation fillers',html:'Para sonar natural: <b>vale</b> (OK), <b>venga</b> (come on / OK, bye), <b>pues</b> (well), <b>bueno</b> (well…), <b>o sea</b> (I mean), <b>¿sabes?</b>, <b>¡qué va!</b> (no way), <b>¡anda!</b> (wow), <b>hombre</b> (of course / come on), <b>es que…</b> (the thing is…). Al teléfono y al despedirse: «venga, hasta luego».',htmlEn:'To sound natural: <b>vale</b> (OK), <b>venga</b> (come on / OK, bye), <b>pues</b> (well), <b>bueno</b> (well…), <b>o sea</b> (I mean), <b>¿sabes?</b> (you know?), <b>¡qué va!</b> (no way), <b>¡anda!</b> (wow), <b>hombre</b> (of course / come on), <b>es que…</b> (the thing is…). On the phone and saying goodbye: “venga, hasta luego”.'},
  {t:'Cortesía directa',te:'Direct politeness',html:'En España se pide de forma más directa que en inglés: «Ponme un café» no es descortés. La cortesía va en el tono, en <i>por favor</i> y en una sonrisa. En cambio, dar muchas vueltas puede sonar raro. Se interrumpe con frecuencia en las conversaciones: es señal de interés, no de mala educación.',htmlEn:'In Spain requests are more direct than in English: “Ponme un café” (Give me a coffee) is not rude. Politeness is in the tone, in <i>por favor</i> and a smile. Beating around the bush can sound odd. People often interrupt each other in conversation: it shows interest, not rudeness.'}
 ]
}
