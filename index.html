redemittel:['Buenos días. Me duele mucho la garganta.','Tengo un poco de fiebre desde ayer.','¿Tiene algo para el dolor de garganta?','¿Hace falta receta?','¿Cada cuántas horas lo tomo?','Soy alérgico a…'],
model:'Buenos días. Mire, desde hace dos días me duele mucho la garganta y anoche tuve un poco de fiebre, treinta y siete y medio. ¿Tiene algo para el dolor de garganta? ¿Hace falta receta? Ah, vale. ¿Y cada cuántas horas lo tomo? ¿Antes o después de comer? Ah, una cosa: soy alérgica a la penicilina. Perfecto, muchas gracias.'},
{id:'s-a2-2',level:'A2',title:'Comprar un billete de tren',exam:'Situación real',short:'Compre un billete de ida y vuelta y pregunte por horarios y andén.',prep:1,time:2,
prompt:'<p>Quiere ir de Madrid a Toledo el sábado y volver el domingo. Vaya a la taquilla: pregunte por horarios, precio, duración y andén.</p>',
points:['destino y fechas','ida y vuelta','horarios disponibles','precio y duración','andén'],
redemittel:['Un billete de ida y vuelta a Toledo, por favor.','Para el sábado por la mañana.','¿A qué hora sale el primer tren?','¿Cuánto se tarda?','¿Cuánto cuesta?','¿De qué andén sale?'],
model:'Buenos días. Quería un billete de ida y vuelta a Toledo, por favor. La ida, el sábado por la mañana, y la vuelta, el domingo por la tarde. ¿A qué hora sale el primer tren el sábado? ¿Y cuánto se tarda? Muy bien, el de las nueve y veinte. ¿Y para volver el domingo, hay alguno sobre las siete? Perfecto. ¿Cuánto es? ¿Y de qué andén sale? Gracias.'},
{id:'s-a2-3',level:'A2',title:'Mis últimas vacaciones',exam:'Monólogo',short:'Cuente un viaje: adónde, con quién, qué hizo, qué tal fue.',prep:2,time:2,
prompt:'<p>Cuente sus últimas vacaciones o un viaje que recuerda bien. Use el pretérito indefinido para los hechos y el imperfecto para las descripciones.</p>',
points:['adónde fue y cuándo','con quién y cómo','dónde se alojó','qué hizo','qué tiempo hacía / cómo era el lugar','qué tal lo pasó'],
redemittel:['El verano pasado fui a…','Fui con mi pareja / con unos amigos.','Nos alojamos en un hotel / una casa rural.','Visitamos… / Comimos… / Hicimos…','Hacía mucho calor / Era un pueblo precioso.','Lo pasamos genial / fatal.'],
model:'El verano pasado fui a Galicia con mi pareja. Fuimos en coche desde Madrid y tardamos seis horas. Nos alojamos en una casa rural cerca de Cangas, al lado del mar. Visitamos Santiago de Compostela, hicimos una excursión a las islas Cíes y comimos marisco casi todos los días. Hacía buen tiempo, pero el agua estaba muy fría. Lo pasamos genial y queremos volver.'},
{id:'s-a2-4',level:'A2',title:'Antes y ahora',exam:'Monólogo',short:'Compare su vida de niño con su vida actual.',prep:2,time:2,
prompt:'<p>Hable de cómo era su vida cuando era niño o niña y compárela con su vida de ahora.</p>',
points:['dónde vivía','cómo era su casa / su colegio','qué hacía en su tiempo libre','qué le gustaba comer','qué ha cambiado'],
redemittel:['Cuando era pequeño, vivía en…','Mi casa era… y tenía…','Todos los veranos íbamos a…','Antes jugaba… y ahora…','Antes no me gustaba…, pero ahora…','Lo que más ha cambiado es…'],
model:'Cuando era pequeña, vivía en un pueblo cerca de Manchester. Mi casa era pequeña pero tenía un jardín muy grande. Iba al colegio andando y después jugaba con mis amigos en el parque. Antes no me gustaba nada la verdura; ahora me encanta. Lo que más ha cambiado es que antes tenía mucho tiempo libre y ahora trabajo mucho, pero vivo en Madrid, que es mucho más divertido.'},
{id:'s-b1-1',level:'B1',title:'Planes de futuro',exam:'Monólogo',short:'Hable de sus planes y predicciones para los próximos cinco años.',prep:2,time:2.5,
prompt:'<p>¿Cómo será su vida dentro de cinco años? Hable de sus planes seguros, de lo que le gustaría y de lo que cree que pasará.</p>',
points:['planes decididos (ir a)','predicciones (futuro)','deseos (me gustaría / ojalá)','condiciones (si + presente)','dudas (no creo que / a lo mejor)'],
redemittel:['El año que viene voy a…','Dentro de cinco años creo que…','Me gustaría… / Me encantaría…','Ojalá pueda…','Si encuentro trabajo, me quedaré en…','No creo que… / A lo mejor…'],
model:'Bueno, el año que viene voy a hacer un curso de español intensivo, porque quiero hablar con más fluidez. Dentro de cinco años creo que seguiré viviendo en España, probablemente en Valencia, porque me encanta el mar. Me gustaría tener mi propia empresa, pero no creo que sea fácil. Si todo va bien, compraré un piso pequeño. Ojalá pueda traer a mis padres a vivir cerca de mí.'},
{id:'s-b1-2',level:'B1',title:'Organizar un plan',exam:'Diálogo',short:'Organice con un amigo una excursión de fin de semana: propuestas, objeciones, acuerdo.',prep:2,time:3,
prompt:'<p>Usted y un amigo quieren hacer una excursión el próximo fin de semana. Proponga un destino, reaccione a las propuestas del otro (imagine sus respuestas) y lleguen a un acuerdo sobre: adónde, cómo, cuándo, qué llevar y cuánto gastar.</p>',
points:['proponer un destino','reaccionar a otra propuesta','decidir el transporte','hora y lugar de encuentro','qué llevar y el presupuesto'],
redemittel:['¿Qué te parece si vamos a…?','¿Por qué no…?','Me parece buena idea, pero…','Yo preferiría…','Vale, entonces quedamos a las… en…','¿Llevamos comida o comemos allí?'],
model:'Oye, ¿qué te parece si el sábado vamos a la sierra de Guadarrama? Podemos hacer una ruta fácil. ¿Cómo? ¿Prefieres ir a la playa? Hombre, la playa me encanta, pero está a cuatro horas, y solo tenemos un día. Yo que tú, lo dejaría para un puente. Vale, entonces vamos a la sierra en el tren de Cercanías, que es muy barato. ¿Quedamos a las ocho en Chamartín? Llevamos bocadillos y agua, y al volver tomamos algo en Cercedilla. Así no gastamos más de veinte euros cada uno.'},
{id:'s-b1-3',level:'B1',title:'Vivir en España: ventajas e inconvenientes',exam:'Monólogo',short:'Dé su opinión argumentada con ejemplos.',prep:3,time:3,
prompt:'<p>Exprese su opinión sobre la vida en España comparándola con su país. Dé al menos dos ventajas y un inconveniente, con ejemplos, y una conclusión.</p>',
points:['introducción y opinión general','dos ventajas con ejemplos','un inconveniente','comparación con su país','conclusión'],
redemittel:['En mi opinión, vivir en España tiene muchas ventajas.','En primer lugar… Además…','Por ejemplo…','Sin embargo, también hay inconvenientes: …','Comparado con mi país, aquí…','En resumen, creo que merece la pena.'],
model:'En mi opinión, vivir en España tiene muchas más ventajas que inconvenientes. En primer lugar, el clima: en mi país llueve casi todos los días, mientras que aquí puedo comer en una terraza en febrero. Además, la gente es muy abierta; por ejemplo, mis vecinos me invitaron a cenar la primera semana. Sin embargo, también hay inconvenientes: los sueldos son más bajos y los alquileres han subido mucho. Aun así, creo que la calidad de vida es mejor. En resumen, me alegro mucho de haber venido.'},
{id:'s-b1-4',level:'B1',title:'Resolver un problema por teléfono',exam:'Situación real',short:'Llame al técnico o a la casera: explique una avería y negocie una solución.',prep:2,time:3,
prompt:'<p>La lavadora de su piso alquilado no funciona desde hace tres días y el agua sale por debajo. Llame a la casera: explique el problema, cuándo empezó, qué ha hecho usted, y pida que se solucione pronto. Proponga horarios para que venga el técnico.</p>',
points:['identificarse','explicar la avería y desde cuándo','qué ha intentado','pedir una solución rápida','acordar día y hora'],
redemittel:['Hola, buenas. Soy…, la inquilina del…','Le llamo porque la lavadora no funciona.','Desde el lunes sale agua por debajo.','Ya he probado a…','¿Podría mandar a un técnico lo antes posible?','Me viene bien el jueves por la tarde, a partir de las cinco.'],
model:'Hola, buenas tardes, ¿la señora Ortega? Soy Emma, la inquilina del tercero A. Le llamo porque desde el lunes la lavadora no funciona bien: cuando la pongo, sale agua por debajo y se moja todo el suelo de la cocina. Ya he probado a limpiar el filtro, pero sigue igual. ¿Podría mandar a un técnico lo antes posible? Es que no puedo lavar la ropa. A mí me viene bien el jueves por la tarde, a partir de las cinco, o el viernes por la mañana. Muchas gracias.'},
{id:'s-b2-1',level:'B2',title:'Debate: ¿teletrabajo para todos?',exam:'Debate',short:'Defienda una postura, haga concesiones y llegue a una conclusión.',prep:3,time:4,
prompt:'<p>Participe en un debate: «El teletrabajo debería ser un derecho para todos los trabajadores que puedan hacerlo». Defienda una postura con argumentos, reconozca los argumentos contrarios (concesión) y proponga una solución.</p>',
points:['postura clara','dos o tres argumentos con ejemplos','concesión: aunque / es cierto que… sin embargo','contraargumento','propuesta o conclusión'],
redemittel:['Desde mi punto de vista…','Por mucho que se diga que…, lo cierto es que…','Es cierto que…; sin embargo…','Aunque reconozco que…, no creo que…','Dado que…, sería razonable…','Por todo ello, propondría…'],
model:'Desde mi punto de vista, el teletrabajo debería ser un derecho, al menos parcialmente. Por mucho que se diga que se pierde productividad, los estudios demuestran lo contrario: la gente trabaja más concentrada y ahorra horas de transporte. Es cierto que el contacto humano es importante; sin embargo, eso no justifica ir a la oficina cinco días a la semana. Aunque reconozco que no todos los trabajos lo permiten, no creo que eso sea un argumento para negárselo a quien sí puede. Dado que la tecnología ya existe, lo razonable sería un modelo mixto. Por todo ello, propondría dos o tres días de teletrabajo por ley.'},
{id:'s-b2-2',level:'B2',title:'Si pudiera elegir…',exam:'Monólogo',short:'Hipótesis: hable de una vida alternativa con condicionales irreales.',prep:2,time:3,
prompt:'<p>Si pudiera vivir un año en cualquier ciudad de España sin preocuparse por el dinero, ¿dónde viviría y qué haría? ¿Y qué habría hecho de otra manera en su vida si hubiera sabido lo que sabe ahora?</p>',
points:['la ciudad elegida y por qué','qué haría allí (condicional)','con quién','una decisión del pasado (si hubiera…, habría…)','reflexión final'],
redemittel:['Si pudiera elegir, viviría en…','Me levantaría… / Pasaría las tardes…','Lo que más me atraería es…','Si hubiera sabido…, habría…','Quizás si hubiera…, ahora…','Aun así, no me arrepiento de…'],
model:'Si pudiera elegir, viviría un año en Cádiz. Me levantaría temprano para pasear por la playa de la Caleta, aprendería a tocar la guitarra flamenca y pasaría las tardes en las terrazas del barrio de la Viña, hablando con la gente. Lo que más me atraería es el humor gaditano. Y si hubiera sabido lo que sé ahora, habría empezado a estudiar español mucho antes; quizá ahora hablaría como un nativo. Aun así, no me arrepiento de nada: todo llega cuando tiene que llegar.'},
{id:'s-b2-3',level:'B2',title:'Una reclamación cara a cara',exam:'Situación real',short:'Reclame con firmeza y cortesía en un hotel; negocie una compensación.',prep:2,time:3,
prompt:'<p>Ha reservado una habitación doble con vistas al mar para tres noches, pero le han dado una habitación interior, ruidosa, junto al ascensor. Hable con el recepcionista: explique el problema, muestre su reserva, exprese su descontento con cortesía y negocie una solución.</p>',
points:['explicar el problema con datos','mostrar la reserva','expresar descontento con cortesía','rechazar una primera solución insuficiente','llegar a un acuerdo'],
redemittel:['Disculpe, quería comentarle un problema con la habitación.','Según mi reserva, …','Comprendo que…, pero…','No me parece aceptable que…','Le agradecería que…','Si no fuera posible, ¿podrían…?'],
model:'Buenas noches. Disculpe, quería comentarle un problema con la habitación. Según mi reserva, que tengo aquí, pagué una habitación doble con vistas al mar, y la que nos han dado es interior y está justo al lado del ascensor: se oye todo. Comprendo que el hotel esté lleno, pero no me parece aceptable pagar por algo que no hemos recibido. Le agradecería que nos cambiaran a una habitación exterior mañana por la mañana. Si no fuera posible, ¿podrían al menos devolvernos la diferencia de precio e incluir el desayuno? Muchas gracias por su comprensión.'}
],
write:[
{id:'w-a1-1',level:'A1',title:'Mensaje a un compañero nuevo',exam:'Mensaje',words:40,time:10,informal:true,
prompt:'<p>Va a compartir piso con un chico español, Álvaro. Escríbale un mensaje de WhatsApp para presentarse.</p>',
points:['saludar','nombre, edad y origen','profesión o estudios','qué le gusta','despedirse'],
redemittel:['¡Hola, Álvaro!','Soy… y tengo… años.','Soy de… pero vivo en…','Trabajo en… / Estudio…','Me gusta… y no me gusta…','¡Hasta pronto! / Un abrazo'],
model:'¡Hola, Álvaro! Soy Kate, tu nueva compañera de piso. Tengo veintiséis años y soy irlandesa, de Cork. Trabajo en un hotel en el centro. Me gusta mucho cocinar, ir al cine y correr por el parque. No fumo y soy muy ordenada. ¡Hasta el sábado! Un abrazo.'},
{id:'w-a1-2',level:'A1',title:'Una postal desde Andalucía',exam:'Postal',words:50,time:12,informal:true,
prompt:'<p>Está de vacaciones en Andalucía. Escriba una postal a un amigo que estudia español.</p>',
points:['dónde está y con quién','cómo es la ciudad','qué tiempo hace','qué hace cada día','qué le gusta más'],
redemittel:['Querido/a…:','Estoy en… con…','La ciudad es muy…','Hace mucho calor / sol.','Todos los días…','Me encanta… ¡Un beso!'],
model:'Querido Tom: Estoy en Granada con mi hermana. La ciudad es muy bonita y tiene mucha historia. Hace mucho calor, ¡treinta y ocho grados! Todos los días visitamos monumentos por la mañana y por la tarde tomamos tapas. En Granada las tapas son gratis con la bebida. Me encanta la Alhambra. ¡Un beso! Laura'},
{id:'w-a2-1',level:'A2',title:'Correo a un amigo: mi nueva vida',exam:'Correo informal',words:80,time:20,informal:true,
prompt:'<p>Lleva tres meses viviendo en España. Escriba un correo a un amigo de su país contándole su nueva vida.</p>',
points:['cuándo llegó y dónde vive','cómo es su piso o su barrio','qué ha hecho estas semanas (pretérito perfecto)','qué le gusta y qué le cuesta','invitarle a visitarle'],
redemittel:['¡Hola, …! ¿Qué tal todo?','Llegué a… hace tres meses.','Vivo en un piso que…','Estas semanas he conocido / he visitado…','Lo que más me gusta es… Lo que más me cuesta es…','¿Por qué no vienes a verme en…?'],
model:'¡Hola, Sam! ¿Qué tal todo por Londres? Yo estoy muy bien. Llegué a Sevilla hace tres meses y ya me siento como en casa. Vivo en un piso pequeño en Triana, al lado del río. Estas semanas he conocido a mucha gente en el trabajo y he visitado Cádiz y Córdoba. Lo que más me gusta es el ambiente de la calle; lo que más me cuesta es entender a los sevillanos cuando hablan rápido. ¿Por qué no vienes a verme en primavera? ¡Un abrazo fuerte!'},
{id:'w-a2-2',level:'A2',title:'Nota para el vecino',exam:'Nota',words:60,time:15,
prompt:'<p>Su vecino de arriba pone la música muy alta por la noche y usted no puede dormir. Escríbale una nota amable para dejar en su buzón.</p>',
points:['presentarse (piso, nombre)','explicar el problema','pedir algo concreto','proponer hablar','despedirse con amabilidad'],
redemittel:['Hola, soy… del segundo B.','Le escribo porque…','Por las noches la música se oye mucho y…','¿Podría bajar el volumen a partir de las…?','Si quiere, podemos hablar.','Muchas gracias y un saludo.'],
model:'Hola, soy Mark, el vecino del segundo B. Le escribo porque estas últimas semanas la música se oye mucho por la noche y me cuesta dormir, porque me levanto a las seis para trabajar. ¿Podría bajar un poco el volumen a partir de las once? Si quiere, podemos hablar cualquier tarde. Muchas gracias por su comprensión. Un saludo, Mark.'},
{id:'w-a2-3',level:'A2',title:'¡Qué día!',exam:'Relato',words:90,time:25,informal:true,
prompt:'<p>Escriba en su blog sobre un día en el que todo salió mal. Use el indefinido para los hechos y el imperfecto para describir la situación.</p>',
points:['cuándo fue y qué tenía que hacer','qué pasó (3–4 hechos)','cómo se sentía','cómo terminó el día'],
redemittel:['El lunes pasado tenía que…','Primero… luego… al final…','Mientras…, de repente…','Hacía… / Estaba muy…','Por suerte / Por desgracia…','Total, que…'],
model:'El lunes pasado tenía una entrevista de trabajo muy importante a las diez. Primero, no sonó el despertador y me levanté a las nueve. Mientras me duchaba, se fue el agua caliente. Salí corriendo de casa, pero llovía muchísimo y no tenía paraguas. Luego el metro se paró veinte minutos en un túnel. Llegué a las diez y cuarto, mojado y muy nervioso. Por suerte, la entrevistadora también llegaba tarde. Total, que al final me dieron el trabajo.'},
{id:'w-b1-1',level:'B1',title:'Pedir información sobre un curso',exam:'Correo formal',words:100,time:25,formal:true,
prompt:'<p>Ha visto en internet un curso intensivo de cocina española en una escuela de Bilbao. Escriba un correo formal para pedir información.</p>',
points:['presentarse y decir dónde vio el anuncio','fechas y horario','precio y forma de pago','nivel de español necesario','alojamiento'],
redemittel:['Estimados señores:','Me dirijo a ustedes porque he visto en su página web…','Me gustaría saber si…','¿Podrían indicarme…?','Les agradecería que me enviaran…','Quedo a la espera de su respuesta. Atentamente,'],
model:'Estimados señores: Me dirijo a ustedes porque he visto en su página web el curso intensivo de cocina vasca de julio y estoy muy interesada. Me gustaría saber cuáles son las fechas exactas y el horario de las clases. ¿Podrían indicarme también el precio total y si es posible pagar en dos plazos? Mi nivel de español es intermedio; ¿es suficiente para seguir el curso? Por último, les agradecería que me informaran sobre alojamientos cercanos a la escuela. Quedo a la espera de su respuesta. Atentamente, Sarah Collins'},
{id:'w-b1-2',level:'B1',title:'Correo a la casera: un problema en el piso',exam:'Correo formal',words:110,time:25,formal:true,
prompt:'<p>En su piso alquilado hay una gotera en el techo del baño desde hace una semana. Ya llamó a la casera, pero no ha contestado. Escríbale un correo formal.</p>',
points:['explicar el problema y desde cuándo','consecuencias (daños, molestias)','recordar que ya llamó','pedir una solución y un plazo','proponer horarios para el técnico'],
redemittel:['Estimada señora…:','Le escribo para informarle de que…','Desde hace una semana…','Como ya le comenté por teléfono…','Le ruego que…','Quedo a su disposición. Un cordial saludo,'],
model:'Estimada señora Ortega: Le escribo para informarle de que desde hace una semana hay una gotera en el techo del baño. Cada vez que llueve cae agua y ya ha aparecido una mancha de humedad bastante grande. Como ya le comenté por teléfono el lunes, me preocupa que el problema empeore. Le ruego que envíe a un técnico lo antes posible, a ser posible antes del fin de semana. Yo estoy en casa por las tardes a partir de las cinco y el sábado por la mañana. Quedo a su disposición para cualquier cosa. Un cordial saludo, Emma Campbell'},
{id:'w-b1-3',level:'B1',title:'Foro: ¿coche o transporte público?',exam:'Texto de opinión',words:120,time:30,informal:true,
prompt:'<p>En un foro de su ciudad se discute: «¿Hay que prohibir los coches en el centro?». Escriba su opinión con argumentos.</p>',
points:['opinión clara','dos argumentos con ejemplos','un argumento contrario y su respuesta','conclusión'],
redemittel:['En mi opinión…','Por un lado… Por otro lado…','Por ejemplo…','Es verdad que…, pero…','Además…','En resumen, creo que…'],
model:'En mi opinión, hay que limitar mucho los coches en el centro, aunque no estoy seguro de que haya que prohibirlos del todo. Por un lado, el centro es pequeño y el transporte público funciona muy bien: con el metro y la bici se llega a todas partes. Por otro lado, la contaminación y el ruido afectan a la salud de los vecinos, sobre todo de los niños. Es verdad que algunas personas necesitan el coche, por ejemplo las personas mayores o los repartidores, pero para ellos se pueden hacer excepciones. En resumen, creo que un centro con menos coches sería mucho más agradable para todos.'},
{id:'w-b2-1',level:'B2',title:'Carta de reclamación',exam:'Carta formal',words:160,time:40,formal:true,
prompt:'<p>Compró un sofá por internet que llegó con tres semanas de retraso y con una pata rota. El servicio de atención al cliente no responde a sus llamadas. Escriba una reclamación formal a la empresa.</p>',
points:['datos del pedido','descripción de los problemas','gestiones ya realizadas','petición concreta (sustitución, reembolso, compensación)','plazo y posibles acciones'],
redemittel:['Me dirijo a ustedes para presentar una reclamación por…','A pesar de que…, …','Dado que no he recibido respuesta…','Les exijo que… / Les ruego que…','En caso de que no…, me veré obligado/a a…','Sin otro particular, les saluda atentamente,'],
model:'Estimados señores: Me dirijo a ustedes para presentar una reclamación por el pedido n.º 45872, un sofá de tres plazas que compré en su tienda en línea el 3 de marzo. A pesar de que la entrega estaba prevista en diez días, el sofá no llegó hasta el 14 de abril, es decir, con tres semanas de retraso. Además, al desembalarlo comprobé que una de las patas estaba rota, por lo que no puede utilizarse. Dado que he llamado en cinco ocasiones a su servicio de atención al cliente sin obtener respuesta, les escribo por este medio. Les ruego que sustituyan el sofá en un plazo máximo de quince días o, en su defecto, que me reembolsen el importe íntegro. En caso de que no reciba una solución, me veré obligada a acudir a la Oficina Municipal de Información al Consumidor. Sin otro particular, les saluda atentamente, Laura Bennett'},
{id:'w-b2-2',level:'B2',title:'Artículo: lo que aprendí viviendo en España',exam:'Artículo',words:180,time:45,
prompt:'<p>Una revista para extranjeros le pide un artículo: «Lo que aprendí viviendo en España». Escriba un texto personal y reflexivo con un título atractivo.</p>',
points:['título e introducción que enganche','dos o tres aprendizajes con anécdotas','contraste antes/después','una reflexión con hipótesis (si no hubiera venido…)','conclusión'],
redemittel:['Cuando llegué a…, no imaginaba que…','Si algo me ha enseñado España es que…','Al principio me sorprendía…; ahora…','Si no hubiera venido, probablemente…','Por mucho que…','Al fin y al cabo…'],
model:'Aprender a perder el tiempo. Cuando llegué a Madrid, hace cuatro años, llevaba una agenda llena y un reloj que miraba cada diez minutos. No imaginaba que la lección más importante que iba a aprender sería, precisamente, a perder el tiempo. Al principio me ponía nervioso que una comida de trabajo durara tres horas o que mis vecinos se pararan media hora a charlar en el portal. Ahora soy yo el que se queda en la sobremesa. Si algo me ha enseñado España es que las relaciones se construyen sin prisa. Si no hubiera venido, probablemente seguiría pensando que la eficacia lo es todo. Por mucho que echo de menos algunas cosas de mi país, sé que no volvería a ser el mismo. Al fin y al cabo, el tiempo que se comparte nunca es tiempo perdido.'}
]};

window.I18N_C={
levels:{A1:{name:'First steps – surviving in Spain',desc:'Greeting, introducing yourself, numbers, the time, ordering in a bar, shopping, asking the way. Present tense of the most frequent regular and irregular verbs, ser/estar/tener/ir, gustar. Based on: Libro Libre ch. 1–4, FSI Units 1–8, Greenfield 1–10.'},A2:{name:'Daily life and the past',desc:'Routine and reflexive verbs, health, ser and estar in depth, pronouns, comparisons, the past tenses (perfect, preterite, imperfect), por/para, the imperative. Based on: Libro Libre ch. 5–10, Greenfield 11–24.'},B1:{name:'Giving opinions, planning and telling stories',desc:'Future and conditional, the present subjunctive (wishes, emotions, opinions, time, purpose), relative clauses, pluperfect, reported speech, verb phrases and connectors. Based on: Greenfield 16–30, Libro Libre ch. 10.'},B2:{name:'Nuance, hypotheses and register',desc:'Imperfect and pluperfect subjunctive, unreal conditions, the passive, future perfect, concessive clauses, verbs of change, advanced “se” and colloquial Spanish from Spain. Based on: Greenfield 29–36.'}},
speakChecklist:['Have I covered all the points of the task?','Do the adjectives agree with the noun (la casa bonita, los pisos caros)?','Have I used ser and estar correctly (es simpático / está cansado / está en Madrid)?','Have I conjugated the verbs (yo hablo, tú hablas, él habla…)?','Past: preterite for finished actions (ayer fui), imperfect for descriptions and habits (antes iba)?','Have I used connectors (porque, pero, además, sin embargo, por eso)?','Have I given my opinion with a reason and an example?','Have I reacted to the other person (¿Y tú?, ¡Qué bien!, Yo también / Yo tampoco)?','Is the register right: tú or usted?'],
sw:{
 's-a1-1':{title:'Introducing yourself',short:'Talk about yourself for 1 minute.',prompt:'<p>Imagine it’s your first day in a Spanish class in Madrid. Introduce yourself to your classmates.</p>',points:['first name and surname','nationality and city','where you live now','job or studies','languages you speak','something you like']},
 's-a1-2':{title:'My family',short:'Describe your family as if showing a photo.',prompt:'<p>A Spanish friend asks about your family. Talk about three or four people: their names, ages, where they live, what they are like.</p>',points:['parents or partner','siblings or children','age and job','character (ser + adjective)']},
 's-a1-3':{title:'Ordering in a bar',short:'Order drinks and tapas for two people and pay.',prompt:'<p>You’re in a tapas bar with a friend. Play the customer: greet, order two drinks and two tapas, ask something about the food and ask for the bill. (You can read the waiter’s lines aloud or practise with the dialogue “En el bar” in Listening.)</p>',points:['greet','order two drinks','ask what tapas there are','order two tapas or a portion','ask for the bill and pay by card']},
 's-a1-4':{title:'My neighbourhood',short:'Describe where you live: what there is and where.',prompt:'<p>Describe your neighbourhood or street to a classmate.</p>',points:['its name and where it is','what there is (shops, bars, parks)','where things are (near, next to)','what you like and don’t like']},
 's-a2-1':{title:'At the pharmacy',short:'Explain your symptoms and ask for a medicine.',prompt:'<p>For two days your throat has been sore and you have a slight temperature. Go to the pharmacy: explain what’s wrong, ask for a medicine and how to take it.</p>',points:['greet and explain the symptoms','say since when','ask if you need a prescription','ask how and when to take it','mention an allergy (if you have one)']},
 's-a2-2':{title:'Buying a train ticket',short:'Buy a return ticket and ask about times and platform.',prompt:'<p>You want to go from Madrid to Toledo on Saturday and return on Sunday. Go to the ticket office: ask about times, price, journey time and platform.</p>',points:['destination and dates','return ticket','available times','price and journey time','platform']},
 's-a2-3':{title:'My last holiday',short:'Tell about a trip: where, with whom, what you did, how it was.',prompt:'<p>Talk about your last holiday or a trip you remember well. Use the preterite for events and the imperfect for descriptions.</p>',points:['where you went and when','with whom and how','where you stayed','what you did','the weather / what the place was like','how you enjoyed it']},
 's-a2-4':{title:'Then and now',short:'Compare your life as a child with your life today.',prompt:'<p>Talk about what your life was like as a child and compare it with your life now.</p>',points:['where you lived','what your house / school was like','what you did in your free time','what you liked to eat','what has changed']},
 's-b1-1':{title:'Plans for the future',short:'Talk about your plans and predictions for the next five years.',prompt:'<p>What will your life be like in five years’ time? Talk about firm plans, what you would like and what you think will happen.</p>',points:['decided plans (ir a)','predictions (future)','wishes (me gustaría / ojalá)','conditions (si + present)','doubts (no creo que / a lo mejor)']},
 's-b1-2':{title:'Organising a plan',short:'Plan a weekend trip with a friend: suggestions, objections, agreement.',prompt:'<p>You and a friend want to go on a trip next weekend. Suggest a destination, react to the other person’s suggestions (imagine their answers) and agree on: where, how, when, what to take and how much to spend.</p>',points:['suggest a destination','react to another suggestion','decide on transport','meeting time and place','what to take and the budget']},
 's-b1-3':{title:'Living in Spain: pros and cons',short:'Give a reasoned opinion with examples.',prompt:'<p>Give your opinion on life in Spain compared with your country. Give at least two advantages and one disadvantage, with examples, and a conclusion.</p>',points:['introduction and overall opinion','two advantages with examples','one disadvantage','comparison with your country','conclusion']},
 's-b1-4':{title:'Solving a problem on the phone',short:'Call the landlady: explain a breakdown and negotiate a solution.',prompt:'<p>The washing machine in your rented flat hasn’t worked for three days and water comes out underneath. Call the landlady: explain the problem, when it started, what you’ve tried, and ask for it to be fixed soon. Suggest times for the technician to come.</p>',points:['say who you are','explain the fault and since when','what you’ve tried','ask for a quick solution','agree on a day and time']},
 's-b2-1':{title:'Debate: remote work for everyone?',short:'Defend a position, make concessions and reach a conclusion.',prompt:'<p>Take part in a debate: “Remote work should be a right for all workers who can do it.” Defend a position with arguments, acknowledge the opposing arguments (concession) and propose a solution.</p>',points:['clear position','two or three arguments with examples','concession: aunque / es cierto que… sin embargo','counter-argument','proposal or conclusion']},
 's-b2-2':{title:'If I could choose…',short:'Hypotheses: talk about an alternative life using unreal conditionals.',prompt:'<p>If you could live for a year in any Spanish city without worrying about money, where would you live and what would you do? And what would you have done differently in your life if you had known what you know now?</p>',points:['the city you choose and why','what you would do there (conditional)','with whom','a past decision (si hubiera…, habría…)','final reflection']},
 's-b2-3':{title:'A complaint face to face',short:'Complain firmly and politely at a hotel; negotiate compensation.',prompt:'<p>You booked a double room with a sea view for three nights, but you’ve been given an inside room, noisy, next to the lift. Talk to the receptionist: explain the problem, show your booking, express your dissatisfaction politely and negotiate a solution.</p>',points:['explain the problem with facts','show the booking','express dissatisfaction politely','reject a first, insufficient solution','reach an agreement']},
 'w-a1-1':{title:'Message to a new flatmate',prompt:'<p>You are going to share a flat with a Spanish guy, Álvaro. Write him a WhatsApp message to introduce yourself.</p>',points:['greet','name, age and origin','job or studies','what you like','sign off']},
 'w-a1-2':{title:'A postcard from Andalusia',prompt:'<p>You are on holiday in Andalusia. Write a postcard to a friend who is learning Spanish.</p>',points:['where you are and with whom','what the city is like','the weather','what you do every day','what you like most']},
 'w-a2-1':{title:'Email to a friend: my new life',prompt:'<p>You have been living in Spain for three months. Write an email to a friend back home about your new life.</p>',points:['when you arrived and where you live','what your flat or neighbourhood is like','what you have done these weeks (present perfect)','what you like and what you find hard','invite them to visit']},
 'w-a2-2':{title:'A note for the neighbour',prompt:'<p>Your upstairs neighbour plays music very loudly at night and you can’t sleep. Write a friendly note to leave in their letterbox.</p>',points:['introduce yourself (flat, name)','explain the problem','ask for something specific','offer to talk','sign off kindly']},
 'w-a2-3':{title:'What a day!',prompt:'<p>Write a blog post about a day when everything went wrong. Use the preterite for the events and the imperfect to describe the situation.</p>',points:['when it was and what you had to do','what happened (3–4 events)','how you felt','how the day ended']},
 'w-b1-1':{title:'Asking for information about a course',prompt:'<p>You have seen an intensive Spanish cookery course at a school in Bilbao online. Write a formal email asking for information.</p>',points:['introduce yourself and say where you saw the ad','dates and timetable','price and method of payment','level of Spanish needed','accommodation']},
 'w-b1-2':{title:'Email to the landlady: a problem in the flat',prompt:'<p>In your rented flat there has been a leak in the bathroom ceiling for a week. You already called the landlady, but she hasn’t answered. Write her a formal email.</p>',points:['explain the problem and since when','consequences (damage, inconvenience)','remind her you already called','ask for a solution and a deadline','suggest times for the technician']},
 'w-b1-3':{title:'Forum: car or public transport?',prompt:'<p>A forum in your city is discussing: “Should cars be banned from the centre?” Write your opinion with arguments.</p>',points:['clear opinion','two arguments with examples','an opposing argument and your reply','conclusion']},
 'w-b2-1':{title:'Letter of complaint',prompt:'<p>You bought a sofa online that arrived three weeks late and with a broken leg. Customer service doesn’t answer your calls. Write a formal complaint to the company.</p>',points:['order details','description of the problems','steps already taken','specific request (replacement, refund, compensation)','deadline and possible action']},
 'w-b2-2':{title:'Article: what I learnt living in Spain',prompt:'<p>A magazine for foreigners asks you for an article: “What I learnt living in Spain”. Write a personal, reflective text with an attractive title.</p>',points:['a catchy title and introduction','two or three lessons with anecdotes','before/after contrast','a reflection with a hypothesis (si no hubiera venido…)','conclusion']}
},

Object.assign(window.I18N_C.units,{
'a1-01':{title:'Hello! – greeting and introducing yourself',topics:['Greetings and goodbyes','llamarse, ser, ser de','tú and usted','Questions: how?, where from?'],goals:['greet and say goodbye at any time of day','say your name and where you’re from and ask other people','choose between tú and usted'],source:'Libro Libre ch. 1 (Greetings, Introductions) · FSI Unit 1 (Useful phrases) · Cactus Language Kit',spain:'When friends introduce each other they give <b>two kisses</b> (right cheek first), also between a man and a woman. In a professional context you shake hands. “¿Qué tal?” is the star greeting: it doesn’t expect a long answer.'},
'a1-02':{title:'Sounds, alphabet and accent marks',topics:['The five vowels','Tricky consonants: c/z, j/g, ll, ñ, r/rr, h','The alphabet and spelling','The stressed syllable and the written accent'],goals:['pronounce Castilian vowels and consonants','spell your name','know where a word is stressed and when it takes an accent mark'],source:'Libro Libre ch. 1 (The alphabet) · FSI Units 1–2 (Pronunciation drills) · Rules for Spanish Accent Marks (C. Mena) · MFLE Reference Grammar',spain:'In central and northern Spain, <b>casa</b> [s] and <b>caza</b> [θ] sound different. In Andalusia and the Canaries many people say both with [s] (seseo). Both pronunciations are correct; the voices in this course are from central Spain.'},
'a1-03':{title:'el, la, un, una – gender and number',topics:['Definite articles: el, la, los, las','Indefinite articles: un, una, unos, unas','Masculine and feminine','The plural','hay'],goals:['use the right article','form the plural of nouns','say what there is in a place'],source:'Libro Libre ch. 1 (Definite and indefinite articles, Pluralizing nouns) · Greenfield Lessons 1–3 · MFLE Reference Grammar (Nouns, Articles)',spain:'“Hay” is a word you’ll use every day: <i>¿Hay wifi?</i>, <i>¿Hay mesa para dos?</i>, <i>¿Hay pan?</i> In a bar or restaurant it’s the natural way to ask if something is available.'},
'a1-04':{title:'ser and adjectives – what is it like?',topics:['ser: full present tense','Subject pronouns','Nationalities and jobs','Adjective agreement','muy, bastante, un poco'],goals:['describe people and things','say your nationality and job','make adjectives agree'],source:'Libro Libre ch. 2 (Personal pronouns, Ser, Adjectives) · Greenfield Lessons 4–5 · FSI Unit 3 (Basic sentences)',spain:'In Spain <b>vosotros</b> (vosotros sois) is used to talk to several friends. <b>Ustedes</b> (ustedes son) is only formal. In Latin America ustedes is used for everyone: here you’ll learn both forms.'},
'a1-05':{title:'-ar verbs – work and studies',topics:['Present tense of regular -ar verbs','Negation with “no”','Yes/no questions','Numbers 0–100'],goals:['talk about your job, studies and day','make negative sentences and ask questions','use numbers up to 100 (age, phone, prices)'],source:'Greenfield Lesson 1 (First conjugation) · Libro Libre ch. 2 (Numbers 0–100) and ch. 3 · FSI Unit 5 (White’s first day at work)',spain:'Working hours in Spain are often 9 am–2 pm and 4–7 pm (split day), though more and more companies work straight through. In summer many offices do “jornada intensiva” until 3 pm.'},
'a1-06':{title:'estar, hay and the city',topics:['estar: present','¿Dónde está…? – location','¿Cómo estás? – states','hay vs. está','Prepositions of place'],goals:['say where something is','say how you are','tell hay and está apart','describe a neighbourhood'],source:'Greenfield Lesson 2 (Estar) · Libro Libre ch. 2 (Estar, Adjectives and prepositions with estar) · FSI Unit 4 (White meets Molina at the Embassy)',spain:'Almost every town has a <b>Plaza Mayor</b> or main square with the town hall, a church and bars with terraces. To find your way, “la plaza” is the point of reference.'},
'a1-07':{title:'tener, family and possessives',topics:['tener: present','tener que + infinitive','The family','Possessives: mi, tu, su, nuestro, vuestro','¿Cuántos…?'],goals:['talk about your family','express possession','say what you have to do'],source:'Libro Libre ch. 2 (Tener) and ch. 4 (Family, Expressing possession) · Greenfield Lessons 7 and 15 (Possessive adjectives, Tener and its idioms)',spain:'In Spain families often have lunch together on Sundays, often at the grandparents’ house. It’s normal for young people to live with their parents until 29–30, because of housing prices.'},
'a1-08':{title:'-er/-ir verbs, the time and the days',topics:['Present of -er and -ir verbs','What time is it? – Es la una / Son las…','At what time…?','Days, months, dates','Frequency: siempre, a veces, nunca'],goals:['talk about what you normally do','tell and ask the time','give dates and talk about the week'],source:'Greenfield Lessons 3, 6, 23, 28 (ER/IR verbs, Time of day, Days–Months) · Libro Libre ch. 2 (Days, months, Time)',spain:'Spain lives “an hour late”: lunch is between 2 and 3:30 pm and dinner around 9–10 pm. Many small shops close from 2 to 5 pm. On Sundays almost everything closes outside big city centres.'},
'a1-09':{title:'ir, ir a + infinitive and transport',topics:['ir: present','ir a / al','ir a + infinitive (plans)','Means of transport: en tren, a pie','venir and salir'],goals:['say where you’re going and how','talk about plans','ask about timetables and transport'],source:'Libro Libre ch. 4 (The expression ir + a + infinitive) · Greenfield Lesson 10 (Irregular verbs) · FSI Units 4–5',spain:'In Spain “coger” is used all the time: <i>coger el autobús, coger un taxi</i>. High-speed AVE trains link Madrid with Barcelona in about 2 h 30 and with Seville in 2 h 30. Youth travel passes and Renfe discounts make the train very popular.'},
'a1-10':{title:'Eating and drinking – gustar and ordering in a bar',topics:['gustar: me gusta / me gustan','encantar','también / tampoco','Ordering in a bar: ¿me pones…?, quería…','Spanish food'],goals:['say what you like and don’t like','order food and drink in a bar or restaurant','react: a mí también / a mí tampoco'],source:'Libro Libre ch. 4 (The verb gustar) and ch. 5 (Food, Restaurant conversation) · FSI Unit 6 (White and Molina have lunch together)',spain:'The <b>menú del día</b> (Monday to Friday, at lunchtime) includes a starter, main course, dessert, bread and a drink for about €12–16. In many bars you get a <b>free tapa</b> with your drink (especially in Granada, León or Jaén).'},
'a1-11':{title:'querer, poder, hacer – irregular verbs',topics:['Stem changes e→ie, o→ue, e→i, u→ue','Verbs with irregular “yo”: hago, pongo, salgo…','querer / poder + infinitive','Free time'],goals:['say what you want to do and can do','talk about free time','conjugate the most frequent irregular verbs'],source:'Libro Libre ch. 4 (Stem-changing verbs) · Greenfield Lessons 8 and 10 (Radical changing verbs, Irregular verbs)',spain:'<b>Padel</b> is one of the most popular sports in Spain: there are courts in almost every neighbourhood. And hiking, the beach, terraces and “salir de tapas” fill the weekends.'},
'a1-12':{title:'Shopping – numbers, prices and demonstratives',topics:['este, ese, aquel','How much does it / do they cost?','Numbers 100 – 1,000,000','Clothes and colours','Asking in a shop'],goals:['ask for and understand prices','point at things: este, ese, aquel','buy clothes and food'],source:'Libro Libre ch. 4 (Numbers from 100 to 1,000,000) and ch. 7 (Demonstratives) · Greenfield Lessons 20, 26 (Demonstrative adjectives, Numerals) · FSI Unit 9',spain:'The <b>sales</b> (rebajas) start on 7 January and 1 July. At markets you ask for your turn with “¿Quién es el último?”. You can pay by card almost everywhere, even small amounts, and by phone.'},
'a2-01':{title:'My daily life – reflexive verbs',topics:['Reflexive verbs: levantarse, ducharse…','Position of the pronoun','Sequence: primero, luego, después','Reflexives that change meaning: ir/irse, llamar/llamarse'],goals:['describe your daily routine','put the reflexive pronoun in the right place','order actions in time'],source:'Libro Libre ch. 6 (Reflexive verbs) · Reflexive Verbs in Spanish (Caledonia-Mumford CSD) · Greenfield Lesson 22',spain:'Many people have a quick coffee at home and then have a snack or breakfast mid-morning in the bar near work: white coffee and toast with tomato and olive oil. The <b>siesta</b> is more of a weekend or summer myth than a daily habit.'},
'a2-02':{title:'The body and health – what’s the matter?',topics:['doler: me duele / me duelen','tener + fiebre, tos, frío, hambre…','estar + enfermo, mareado','Giving advice: tienes que, deberías, ¿por qué no…?','At the doctor’s and the pharmacy'],goals:['explain what hurts and how you feel','book an appointment and understand the doctor','give and understand simple advice'],source:'Libro Libre ch. 6 (Health and the human body, Expressions with tener) · Greenfield Lesson 15 (Tener and its idioms)',spain:'For your GP you book an appointment at the <b>centro de salud</b> (by app, web or phone). For emergencies: hospital or <b>112</b>. On-duty pharmacies (farmacias de guardia) open 24 h on a rota – the list is on the door of every pharmacy.'},
'a2-03':{title:'ser or estar – and what is happening',topics:['ser and estar: the complete system','Adjectives that change meaning','estar + gerund (present continuous)','Irregular gerunds'],goals:['choose correctly between ser and estar','describe character and mood','say what is happening right now'],source:'Libro Libre ch. 5 (Ser versus estar, The present progressive) · FSI Unit 7 (Review drill: the distribution of ser – estar)',spain:'“¡Qué rico está!” is the best compliment for whoever cooked. And if someone says “es muy majo/maja”, it means they are nice – a very Spanish word.'},
'a2-04':{title:'lo, la, le – object pronouns',topics:['Direct object: lo, la, los, las','Indirect object: le, les','Two pronouns: me lo, se lo','Position: before the verb or attached to the infinitive'],goals:['avoid repetition with pronouns','give and ask for things: ¿me lo dejas?','put pronouns in the right place'],source:'Libro Libre ch. 5 (Direct object pronouns) and ch. 7 (Indirect object pronouns) · Greenfield Lesson 11 (Personal pronouns – indirect and direct objects)',spain:'In central Spain <b>leísmo</b> is very common: using “le” instead of “lo” for a man: <i>A Pedro le veo mañana.</i> It’s accepted for male persons (not for things). You’ll hear both forms.'},
'a2-05':{title:'más, menos, tan – comparing',topics:['más / menos … que','tan … como, tanto … como','mejor, peor, mayor, menor','The superlative: el más… de','-ísimo'],goals:['compare cities, flats, products','say what is best and worst','intensify: carísimo, buenísimo'],source:'Libro Libre ch. 7 (Comparisons of inequality, equality, Superlatives) · Greenfield Lesson 25 (Comparison of adjectives and adverbs)',spain:'Comparing cities is a national sport: Madrid or Barcelona, the north or the south, tortilla with onion or without… Be ready to give your opinion.'},
'a2-06':{title:'What have you done today? – the present perfect',topics:['haber + participle','Irregular participles','Markers: hoy, esta semana, ya, todavía no, alguna vez, nunca','Life experiences'],goals:['say what you have done today or this week','talk about experiences: ¿has estado alguna vez en…?','use ya and todavía no'],source:'Libro Libre ch. 10 (The present perfect) · Greenfield Lesson 24 (Present perfect tense – participles)',spain:'A typical feature of Spain’s Spanish: “¿Qué has hecho hoy?” – “He ido al mercado y he comido con mi madre”. In Latin America people would say “¿Qué hiciste hoy?”. In Spain both are understood, but the first sounds more natural for today.'},
'a2-07':{title:'Yesterday, last year – the preterite',topics:['Preterite of regular verbs','Spelling changes: llegué, empecé, busqué, leyó','Markers: ayer, anoche, el lunes pasado, hace dos años, en 2019','Perfect or preterite'],goals:['say what you did yesterday or on your last holiday','use past time markers','choose between “he ido” and “fui”'],source:'Libro Libre ch. 9 (Vacation, Time expressions for the preterite, The preterite) · Greenfield Lesson 12 (Preterit tense)',spain:'When talking about holidays, Spaniards naturally mix: “Este verano <b>he estado</b> en Asturias” (this summer isn’t quite over) and “El verano pasado <b>estuve</b> en Asturias”.'},
'a2-08':{title:'fui, tuve, hice – irregular preterites',topics:['ser / ir: fui, fuiste, fue…','Irregular stems: tuv-, estuv-, hic-, pud-, pus-, quis-, vin-, sup-','dij-, traj-, -jeron','dar, ver; e→i, o→u in -ir verbs (pidió, durmió)'],goals:['tell about a trip or a weekend with the most frequent verbs','master the irregular forms'],source:'Libro Libre ch. 9 (Irregular preterite verbs, parts 1–4, Preterite synthesis) · Greenfield Lesson 13 (Preterit of some irregular verbs)',spain:'“¿Qué tal el finde?” is every Monday’s question at the office. Typical answers: “Fui a la sierra”, “Estuve en casa de mis padres”, “Salimos de cañas”, “No hice nada, ¡qué gusto!”.'},
'a2-09':{title:'When I was little – the imperfect',topics:['Regular imperfect: -aba, -ía','Irregulars: ser, ir, ver','Past habits: de niño, antes, siempre','Descriptions in the past','soler + infinitive'],goals:['talk about your childhood and what life used to be like','describe people and places in the past','compare then and now'],source:'Libro Libre ch. 8 (Childhood and adolescence, Time expressions for the imperfect, The imperfect) · Greenfield Lesson 14 (Imperfect tense)',spain:'Many Spaniards have “el pueblo”: their grandparents’ village, where they spent their summers as children. “En el pueblo jugábamos en la calle hasta las once de la noche” is almost a collective memory.'},
'a2-10':{title:'Telling a story – preterite or imperfect',topics:['Actions (preterite) and circumstances (imperfect)','mientras, cuando, de repente','Verbs that change: conocí/conocía, supe/sabía','Connectors for storytelling'],goals:['tell an anecdote or a small accident','combine the two past tenses correctly','use narrative connectors'],source:'Libro Libre ch. 9 (Preterite versus imperfect) · Greenfield Lessons 12–14',spain:'“Total, que…” is the most Spanish way to get to the end of an anecdote: “Total, que perdimos el tren y llegamos a la boda a las tantas.”'},
'a2-11':{title:'por and para, saber and conocer, impersonal “se”',topics:['para: purpose, destination, recipient, deadline','por: cause, route, price, means, time','saber vs conocer','Impersonal se: se habla, se puede, se alquila'],goals:['choose between por and para in frequent phrases','tell saber and conocer apart','understand and use ads and rules with “se”'],source:'Libro Libre ch. 7 (Saber versus conocer) and ch. 8 (The impersonal and passive se, Por versus para)',spain:'Look for “<b>Se alquila</b>” signs on balconies: it’s still a common way to find a flat. “<b>Se busca</b> camarero/a con experiencia” is the classic job ad on a bar door.'},
'a2-12':{title:'Turn right! – the imperative',topics:['Affirmative imperative: tú, usted, vosotros, ustedes','Irregular imperatives: di, haz, ve, pon, sal, sé, ten, ven','Pronouns with the imperative: dímelo, siéntese','Giving instructions, recipes and directions'],goals:['give instructions and directions','understand recipes and directions','ask for things naturally with the imperative'],source:'Libro Libre ch. 10 (The imperative) · Greenfield Lesson 19 (Commands)',spain:'In Spain the imperative isn’t rude: “Pasa, siéntate”, “Mira, te cuento”, “Oye, ¿tienes hora?”, “Toma, tu café”. What makes it friendly is the tone – and a “por favor” now and then.'}
});
