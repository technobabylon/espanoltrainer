{id:'a2-01',level:'A2',title:'Mi día a día – verbos reflexivos',cat:'reflex',vocab:['a2-rutina'],
 topics:['Verbos reflexivos: levantarse, ducharse…','Posición del pronombre','Secuencia: primero, luego, después','Reflexivos de cambio de significado: ir/irse, llamar/llamarse'],
 source:'Libro Libre cap. 6 (Reflexive verbs) · Reflexive Verbs in Spanish (Caledonia-Mumford CSD) · Greenfield Lesson 22',
 goals:['describir su rutina diaria','usar el pronombre reflexivo en el lugar correcto','ordenar acciones en el tiempo'],
 grammar:`<h3>1. Reflexive verbs</h3>
<p>A reflexive verb describes an action you do <b>to yourself</b>. The infinitive ends in <b>-se</b> and the pronoun matches the subject:</p>
<table><tr><th></th><th>levantarse (get up)</th><th>acostarse (o→ue, go to bed)</th><th>vestirse (e→i, get dressed)</th></tr>
<tr><td>yo</td><td><b>me</b> levanto</td><td><b>me</b> acuesto</td><td><b>me</b> visto</td></tr>
<tr><td>tú</td><td><b>te</b> levantas</td><td><b>te</b> acuestas</td><td><b>te</b> vistes</td></tr>
<tr><td>él / ella / usted</td><td><b>se</b> levanta</td><td><b>se</b> acuesta</td><td><b>se</b> viste</td></tr>
<tr><td>nosotros</td><td><b>nos</b> levantamos</td><td><b>nos</b> acostamos</td><td><b>nos</b> vestimos</td></tr>
<tr><td>vosotros</td><td><b>os</b> levantáis</td><td><b>os</b> acostáis</td><td><b>os</b> vestís</td></tr>
<tr><td>ellos / ustedes</td><td><b>se</b> levantan</td><td><b>se</b> acuestan</td><td><b>se</b> visten</td></tr></table>
<p>Daily routine: <i>despertarse (ie), levantarse, ducharse, lavarse los dientes, afeitarse, peinarse, maquillarse, vestirse, acostarse, dormirse</i>.</p>
<h3>2. Where does the pronoun go?</h3>
<div class="rule">Before the conjugated verb: <i><b>Me</b> ducho por la mañana.</i> · Negative: <i>No <b>me</b> levanto temprano.</i><br>With an infinitive: attached or before the first verb: <i>Tengo que levantar<b>me</b> a las seis = <b>Me</b> tengo que levantar a las seis.</i></div>
<p>With body parts and clothes use <b>el/la</b>, not a possessive: <i>Me lavo <b>las</b> manos. Me pongo <b>el</b> abrigo.</i></p>
<h3>3. Same verb, different meaning</h3>
<p><i>llamar</i> (to call) / <i>llamarse</i> (to be called) · <i>ir</i> (to go) / <i>irse</i> (to leave): <i>Me voy a casa.</i> · <i>dormir</i> (to sleep) / <i>dormirse</i> (to fall asleep) · <i>poner</i> (to put) / <i>ponerse</i> (to put on).</p>
<h3>4. Sequencing</h3>
<p><i>primero</i> (first) · <i>luego / después</i> (then) · <i>más tarde</i> · <i>antes de + infinitive</i> (<i>antes de salir</i>) · <i>después de + infinitive</i> (<i>después de comer</i>) · <i>por último / al final</i>.</p>`,
 pitfalls:['<b>*Levanto a las siete</b> → Me levanto a las siete.','<b>*Me lavo mis manos</b> → Me lavo las manos.','<b>*Tengo que me levantar</b> → Tengo que levantarme / Me tengo que levantar.','<b>*Me acosto</b> → Me acuesto (o→ue).'],
 spain:'Mucha gente toma un café rápido en casa y luego <b>almuerza</b> o desayuna algo a media mañana en el bar cerca del trabajo: café con leche y tostada con tomate y aceite. La <b>siesta</b> es más un mito de fin de semana o de verano que una costumbre diaria.',
 examples:[['Me levanto a las siete y cuarto.','I get up at quarter past seven.'],['Primero me ducho y luego desayuno.','First I shower and then I have breakfast.'],['¿A qué hora te acuestas?','What time do you go to bed?'],['Mi hija se viste sola.','My daughter gets dressed on her own.'],['Nos acostamos tarde los fines de semana.','We go to bed late at weekends.'],['No me afeito todos los días.','I don’t shave every day.'],['Tengo que levantarme muy temprano mañana.','I have to get up very early tomorrow.'],['Me lavo los dientes después de comer.','I brush my teeth after eating.'],['Me pongo el abrigo, hace frío.','I’m putting my coat on, it’s cold.'],['Bueno, me voy. ¡Hasta mañana!','Right, I’m off. See you tomorrow!'],['Antes de salir de casa, me tomo un café.','Before leaving home, I have a coffee.'],['¿Os despertáis con despertador?','Do you (all) wake up with an alarm clock?']],
 ex:['g|Yo ___ levanto a las seis.|me','g|¿A qué hora ___ duchas?|te','g|Mi padre ___ afeita por la mañana.|se','g|Nosotros ___ acostamos tarde.|nos','g|¿Vosotros ___ despertáis pronto?|os','g|Los niños ___ visten solos.|se','g:stem|Yo me ___ a las once. (acostarse)|acuesto','g:stem|Ella se ___ muy rápido. (vestirse)|viste','g:stem|¿Tú te ___ temprano? (despertarse)|despiertas','m|I have to get up early.|Tengo que levantarme temprano.~Tengo que me levantar temprano.~Tengo levantarme temprano.','m|I wash my hands.|Me lavo las manos.~Me lavo mis manos.~Lavo mis manos.','m|Bye, I’m leaving!|¡Adiós, me voy!~¡Adiós, voy!~¡Adiós, me ido!','m|She is called Lucía.|Se llama Lucía.~Llama Lucía.~Es llamada Lucía.','o:reflex|I don’t get up early on Sundays.|No me levanto temprano los domingos','o:reflex|First I shower and then I get dressed.|Primero me ducho y luego me visto','t|Translate: What time do you go to bed? (tú)|¿A qué hora te acuestas?','t|Translate: We get up at seven.|Nos levantamos a las siete','t|Translate: After eating, I brush my teeth.|Después de comer, me lavo los dientes/Después de comer me lavo los dientes']},

{id:'a2-02',level:'A2',title:'El cuerpo y la salud – ¿qué le pasa?',cat:'gustar',vocab:['a2-salud'],
 topics:['doler: me duele / me duelen','tener + fiebre, tos, frío, hambre…','estar + enfermo, mareado','Dar consejos: tienes que, deberías, ¿por qué no…?','En el médico y en la farmacia'],
 source:'Libro Libre cap. 6 (Health and the human body, Expressions with tener) · Greenfield Lesson 15 (Tener and its idioms)',
 goals:['explicar qué le duele y cómo se siente','pedir cita y entender al médico','dar y entender consejos sencillos'],
 grammar:`<h3>1. doler – it hurts</h3>
<p><b>doler</b> (o→ue) works exactly like gustar: the part of the body is the subject.</p>
<div class="rule"><i>Me duele <b>la</b> cabeza.</i> (singular) · <i>Me duelen <b>los</b> pies.</i> (plural) · <i>¿Te duele la espalda? A mi hijo le duele el oído.</i> Body parts take <b>el/la</b>, never mi/tu.</div>
<h3>2. Expressions with tener</h3>
<p><i>tener fiebre</i> (a temperature) · <i>tener tos</i> (a cough) · <i>tener gripe</i> · <i>tener frío / calor</i> (be cold/hot) · <i>tener hambre / sed</i> (be hungry/thirsty) · <i>tener sueño</i> (be sleepy) · <i>tener miedo</i> (be afraid) · <i>tener prisa</i> (be in a hurry) · <i>tener razón</i> (be right) · <i>tener dolor de…</i></p>
<p>Use <b>mucho/mucha</b> (not muy) because they are nouns: <i>Tengo <b>mucha</b> hambre. Tengo <b>mucho</b> frío.</i></p>
<h3>3. estar + state</h3>
<p><i>Estoy enfermo/a, resfriado/a, mareado/a</i> (dizzy), <i>cansado/a, embarazada</i> (pregnant – a false friend!), <i>constipado/a</i> (with a cold – also a false friend).</p>
<h3>4. Advice</h3>
<div class="rule"><i>Tienes que</i> + inf. (strong) · <i>Deberías</i> + inf. (you should) · <i>¿Por qué no…?</i> (why don’t you…) · <i>Es mejor</i> + inf.: <i>Tienes que beber mucha agua. Deberías ir al médico. ¿Por qué no te tomas un ibuprofeno?</i></div>
<p>The doctor asks: <i>¿Qué le pasa? ¿Desde cuándo? ¿Le duele aquí? ¿Es alérgico a algún medicamento?</i> and says: <i>Tómese una pastilla cada ocho horas. Le hago una receta.</i></p>`,
 pitfalls:['<b>*Me duele mi cabeza</b> → Me duele la cabeza.','<b>*Me duele los ojos</b> → Me duelen los ojos.','<b>*Tengo muy hambre</b> → Tengo mucha hambre.','<b>*Estoy embarazada</b> to mean embarrassed → Me da vergüenza.'],
 spain:'Para el médico de cabecera se pide cita en el <b>centro de salud</b> (por app, web o teléfono). Para urgencias: hospital o el <b>112</b>. Las farmacias de guardia abren 24 h por turnos – la lista está en la puerta de cada farmacia.',
 examples:[['¿Qué te pasa? – Me duele mucho la cabeza.','What’s wrong? – I’ve got a bad headache.'],['Me duelen los pies de tanto andar.','My feet hurt from so much walking.'],['A mi hija le duele el oído.','My daughter has earache.'],['Tengo fiebre y mucha tos.','I have a temperature and a bad cough.'],['Estoy resfriado desde el lunes.','I’ve had a cold since Monday.'],['Quería pedir cita con la doctora Martín.','I’d like an appointment with Dr Martín.'],['¿Desde cuándo tiene estos dolores?','How long have you had this pain?'],['Deberías descansar un poco.','You should rest a bit.'],['¿Por qué no vas al médico?','Why don’t you go to the doctor?'],['¿Tiene algo para el dolor de garganta?','Do you have something for a sore throat?'],['Tómese una pastilla cada ocho horas.','Take one tablet every eight hours.'],['Tengo mucha sed, ¿me das un vaso de agua?','I’m very thirsty, can you give me a glass of water?']],
 ex:['g|Me ___ la cabeza. (doler)|duele','g|Me ___ las piernas. (doler)|duelen','g|¿Te ___ el estómago? (doler)|duele','g|A Juan ___ duele la espalda.|le','g|___ duelen los ojos. (a nosotros)|Nos','m|I’m very hungry.|Tengo mucha hambre.~Tengo muy hambre.~Estoy mucha hambre.','m|I’m cold.|Tengo frío.~Estoy frío.~Soy frío.','m|She has a temperature.|Tiene fiebre.~Está fiebre.~Es fiebre.','m|My throat hurts.|Me duele la garganta.~Me duele mi garganta.~Me duelen la garganta.','m|“Estoy embarazada” means…|I’m pregnant~I’m embarrassed~I’m busy','g|Tengo mucha ___. (I’m in a hurry)|prisa','g|Deberías ___ al médico. (ir)|ir','m|Advice: You should rest.|Deberías descansar.~Debes descansas.~Deberías a descansar.','o:gustar|My back hurts a lot.|Me duele mucho la espalda','o:wordorder|Why don’t you take an ibuprofen?|¿Por qué no te tomas un ibuprofeno?','t|Translate: My feet hurt.|Me duelen los pies','t|Translate: I have a cough and a temperature.|Tengo tos y fiebre','t|Translate: You are right. (tú)|Tienes razón']},

{id:'a2-03',level:'A2',title:'Ser o estar – y lo que está pasando',cat:'serestar',vocab:['a2-caracter'],
 topics:['Ser y estar: el sistema completo','Adjetivos que cambian de significado','estar + gerundio (presente continuo)','Gerundios irregulares'],
 source:'Libro Libre cap. 5 (Ser versus estar, The present progressive) · FSI Unit 7 (Review drill: the distribution of ser – estar)',
 goals:['elegir correctamente entre ser y estar','describir el carácter y el estado de ánimo','decir lo que está pasando ahora mismo'],
 grammar:`<h3>1. ser vs estar – the system</h3>
<table><tr><th>ser</th><th>estar</th></tr>
<tr><td><b>D</b>escription / characteristics: <i>Es alta, es simpática.</i></td><td><b>P</b>osition / location: <i>Está en la oficina.</i></td></tr>
<tr><td><b>O</b>ccupation: <i>Es enfermera.</i></td><td><b>L</b>ocation of things and people: <i>Sevilla está en el sur.</i></td></tr>
<tr><td><b>C</b>haracter, origin, nationality: <i>Es de Lugo. Es tranquilo.</i></td><td><b>A</b>ction in progress: <i>Está comiendo.</i></td></tr>
<tr><td><b>T</b>ime, date: <i>Son las dos. Es lunes.</i></td><td><b>C</b>ondition / state, mood: <i>Está cansado, está enfadada.</i></td></tr>
<tr><td><b>O</b>rigin, material: <i>La mesa es de madera.</i></td><td><b>E</b>motion: <i>Estoy contento.</i></td></tr>
<tr><td><b>R</b>elationship: <i>Es mi hermano.</i></td><td></td></tr></table>
<p>Events take <b>ser</b> for location: <i>La fiesta <b>es</b> en mi casa.</i> (but people/things: <i>Mi casa <b>está</b> en el centro.</i>) Marital status is often with estar: <i>Estoy casado / soltero / divorciado</i>.</p>
<h3>2. Same adjective – different meaning</h3>
<table><tr><th>adjective</th><th>ser</th><th>estar</th></tr>
<tr><td>aburrido</td><td>boring</td><td>bored</td></tr><tr><td>listo</td><td>clever</td><td>ready</td></tr><tr><td>rico</td><td>rich</td><td>tasty (food)</td></tr><tr><td>malo</td><td>bad (person/thing)</td><td>ill / gone off</td></tr><tr><td>vivo</td><td>lively, sharp</td><td>alive</td></tr><tr><td>abierto</td><td>open-minded</td><td>open</td></tr></table>
<h3>3. estar + gerund – what is happening now</h3>
<p>Gerund: -ar → <b>-ando</b> (hablando), -er/-ir → <b>-iendo</b> (comiendo, viviendo). Irregular: <i>leer → leyendo, oír → oyendo, dormir → durmiendo, pedir → pidiendo, decir → diciendo, ir → yendo</i>.</p>
<div class="rule"><i>¿Qué estás haciendo? – Estoy cocinando.</i> · <i>Están viendo la tele.</i> · Pronouns: <i>Estoy duchándome / Me estoy duchando.</i></div>
<p>Use it for actions happening <b>right now</b> or temporarily: <i>Estoy leyendo un libro muy bueno.</i> For habits use the simple present: <i>Leo mucho.</i></p>`,
 pitfalls:['<b>*Soy cansado</b> → Estoy cansado.','<b>*Está médico</b> → Es médico.','<b>*La fiesta está en mi casa</b> → La fiesta es en mi casa.','<b>*Estoy leiendo</b> → Estoy leyendo.'],
 spain:'«¡Qué rico está!» es el mejor cumplido para la persona que cocina. Y si alguien dice «es muy majo/maja», significa que es simpático – una palabra muy de España.',
 examples:[['Mi hermano es muy tranquilo, pero hoy está nervioso.','My brother is very calm, but today he’s nervous.'],['¿Dónde estás? – Estoy en el supermercado.','Where are you? – I’m at the supermarket.'],['Esta película es muy aburrida.','This film is very boring.'],['Los niños están aburridos.','The children are bored.'],['¡La paella está riquísima!','The paella is delicious!'],['¿Estás lista? – Sí, ya voy.','Are you ready? – Yes, I’m coming.'],['La reunión es en la sala dos.','The meeting is in room two.'],['La mesa es de madera.','The table is made of wood.'],['¿Qué estás haciendo? – Estoy viendo una serie.','What are you doing? – I’m watching a series.'],['Están durmiendo, no hagas ruido.','They’re sleeping, don’t make any noise.'],['Estoy leyendo una novela de Almudena Grandes.','I’m reading a novel by Almudena Grandes.'],['Mi amigo es muy majo.','My friend is really nice.']],
 ex:['m|Mi madre ___ profesora.|es~está','m|Hoy ___ muy cansada.|estoy~soy','m|Toledo ___ cerca de Madrid.|está~es','m|El concierto ___ en el estadio.|es~está','m|La sopa ___ fría.|está~es','m|Pedro ___ de Bilbao.|es~está','m|___ las cinco de la tarde.|Son~Están','m|This soup is delicious.|Esta sopa está muy rica.~Esta sopa es muy rica.','m|I’m ready.|Estoy listo.~Soy listo.','m|He is clever.|Es listo.~Está listo.','g|Ahora mismo ___ trabajando. (estar, yo)|estoy','g|¿Qué ___ haciendo vosotros? (estar)|estáis','g|Estamos ___ la cena. (preparar)|preparando','g|Ella está ___ el periódico. (leer)|leyendo','g|Los niños están ___. (dormir)|durmiendo','o:serestar|The flat is very big but it is dirty.|El piso es muy grande pero está sucio','t|Translate: What are you doing? (tú)|¿Qué estás haciendo?/¿Qué haces?','t|Translate: I’m married and I have two children.|Estoy casado y tengo dos hijos/Estoy casada y tengo dos hijos/Estoy casado y tengo dos niños']},

{id:'a2-04',level:'A2',title:'Lo, la, le – pronombres de objeto',cat:'pron',vocab:['a2-casa-tareas'],
 topics:['Objeto directo: lo, la, los, las','Objeto indirecto: le, les','Dos pronombres: me lo, se lo','Posición: antes del verbo o unido al infinitivo'],
 source:'Libro Libre cap. 5 (Direct object pronouns) y cap. 7 (Indirect object pronouns) · Greenfield Lesson 11 (Personal pronouns – indirect and direct objects)',
 goals:['evitar repeticiones con pronombres','dar y pedir cosas: ¿me lo dejas?','colocar los pronombres en el lugar correcto'],
 grammar:`<h3>1. Direct object pronouns – what? / whom?</h3>
<table><tr><th></th><th>direct</th></tr>
<tr><td>me</td><td>me</td></tr><tr><td>you (tú)</td><td>te</td></tr><tr><td>him, it (m.), you (usted m.)</td><td><b>lo</b></td></tr><tr><td>her, it (f.), you (usted f.)</td><td><b>la</b></td></tr><tr><td>us</td><td>nos</td></tr><tr><td>you (vosotros)</td><td>os</td></tr><tr><td>them (m. / f.)</td><td><b>los / las</b></td></tr></table>
<div class="rule"><i>¿Tienes <u>el billete</u>? – Sí, <b>lo</b> tengo.</i> · <i>¿Compras <u>la fruta</u>? – Sí, <b>la</b> compro yo.</i> · <i>¿Ves <u>a tus padres</u>? – <b>Los</b> veo los domingos.</i></div>
<h3>2. Indirect object pronouns – to/for whom?</h3>
<p>me, te, <b>le</b> (to him/her/you), nos, os, <b>les</b> (to them/you all): <i><b>Le</b> doy el libro a Ana. <b>Les</b> escribo a mis padres.</i> Spanish often repeats the person: <i><b>Le</b> digo <b>a Juan</b> que…</i></p>
<h3>3. Position</h3>
<div class="rule">Before a conjugated verb: <i>Lo compro.</i> · No before: <i>No lo sé.</i><br>Attached to an <b>infinitive</b> or <b>gerund</b> – or before the whole group: <i>Voy a comprarlo = Lo voy a comprar. Estoy haciéndolo = Lo estoy haciendo.</i><br>Attached to a positive command: <i>¡Cómpralo!</i></div>
<h3>4. Two pronouns together</h3>
<p>Indirect first, then direct: <i>¿Me dejas el coche? – Sí, te <b>lo</b> dejo.</i> When <b>le/les</b> meets lo/la/los/las, it becomes <b>se</b>: <i>¿Le das el regalo a María? – Sí, <b>se lo</b> doy.</i> (never <s>le lo</s>).</p>
<p>Neuter <b>lo</b> replaces an idea: <i>¿Sabes dónde está? – No, no lo sé.</i></p>`,
 pitfalls:['<b>*Le lo doy</b> → Se lo doy.','<b>*Compro lo</b> → Lo compro.','<b>*No sé lo</b> → No lo sé.','<b>*Voy a lo comprar</b> → Voy a comprarlo / Lo voy a comprar.'],
 spain:'En el centro de España es muy frecuente el <b>leísmo</b>: usar «le» en lugar de «lo» para un hombre: <i>A Pedro le veo mañana.</i> Es correcto para personas masculinas (no para cosas). Usted oirá las dos formas.',
 examples:[['¿Tienes las llaves? – Sí, las tengo.','Have you got the keys? – Yes, I have them.'],['¿Dónde está el móvil? – No lo sé.','Where’s the mobile? – I don’t know.'],['Este jersey me gusta, me lo llevo.','I like this jumper, I’ll take it.'],['¿Me dejas tu bici? – Claro, te la dejo.','Can I borrow your bike? – Sure, I’ll lend it to you.'],['Le escribo un correo al casero.','I’m writing an email to the landlord.'],['¿Le das el regalo a Marta? – Sí, se lo doy mañana.','Are you giving the present to Marta? – Yes, I’m giving it to her tomorrow.'],['Voy a llamarte esta noche.','I’m going to call you tonight.'],['Lo estoy haciendo ahora mismo.','I’m doing it right now.'],['A mis abuelos los visito cada domingo.','I visit my grandparents every Sunday.'],['¿Nos esperáis? – Sí, os esperamos aquí.','Will you wait for us? – Yes, we’ll wait for you here.'],['¿Puedes repetirlo, por favor?','Can you repeat it, please?'],['Les mando las fotos por WhatsApp.','I’ll send them the photos on WhatsApp.']],
 ex:['g|¿Tienes el pasaporte? – Sí, ___ tengo.|lo','g|¿Compras la leche? – Sí, ___ compro.|la','g|¿Ves a tus amigos? – Sí, ___ veo hoy.|los','g|¿Dónde están las gafas? – No ___ encuentro.|las','g|___ doy un regalo a mi madre. (to her)|Le','g|___ escribo a mis padres. (to them)|Les','g|¿Me dejas el libro? – Sí, te ___ dejo.|lo','g|¿Le das las llaves a Luis? – Sí, ___ ___ doy.|se;las','m|I’m going to buy it (el coche).|Voy a comprarlo.~Voy a lo comprar.~Voy comprarlo.','m|I don’t know.|No lo sé.~No sé lo.~Lo no sé.','m|I’m giving it to him.|Se lo doy.~Le lo doy.~Lo le doy.','m|Call me! (tú)|¡Llámame!~¡Me llama!~¡Llama me!','o:pron|I don’t understand it.|No lo entiendo','o:pron|I’m going to call you tomorrow.|Voy a llamarte mañana','t|Replace the object with a pronoun: Compro el pan.|Lo compro','t|Replace both objects: Doy el libro a Ana.|Se lo doy','t|Translate: Can you repeat it, please? (usted)|¿Puede repetirlo, por favor?/¿Lo puede repetir, por favor?']},

{id:'a2-05',level:'A2',title:'Más, menos, tan – comparar',cat:'comp',vocab:['a2-ciudad-campo'],
 topics:['más / menos … que','tan … como, tanto … como','mejor, peor, mayor, menor','El superlativo: el más… de','-ísimo'],
 source:'Libro Libre cap. 7 (Comparisons of inequality, equality, Superlatives) · Greenfield Lesson 25 (Comparison of adjectives and adverbs)',
 goals:['comparar ciudades, pisos, productos','decir qué es lo mejor y lo peor','intensificar: carísimo, buenísimo'],
 grammar:`<h3>1. More / less … than</h3>
<div class="rule"><b>más</b> / <b>menos</b> + adjective / noun / adverb + <b>que</b>: <i>Madrid es más grande que Valencia. En Bilbao llueve más que en Sevilla. Tengo menos tiempo que tú.</i></div>
<p>With numbers: <b>más de</b>: <i>Cuesta más de cien euros.</i></p>
<h3>2. As … as</h3>
<p><b>tan</b> + adjective/adverb + <b>como</b>: <i>Granada es tan bonita como Córdoba.</i> · <b>tanto/a/os/as</b> + noun + <b>como</b>: <i>No tengo tantos amigos como tú. No hay tanta gente como ayer.</i> · verb + <b>tanto como</b>: <i>No trabajo tanto como antes.</i></p>
<h3>3. Irregular comparatives</h3>
<table><tr><th></th><th>comparative</th></tr><tr><td>bueno / bien</td><td><b>mejor</b> (better)</td></tr><tr><td>malo / mal</td><td><b>peor</b> (worse)</td></tr><tr><td>grande (age)</td><td><b>mayor</b> (older)</td></tr><tr><td>pequeño (age)</td><td><b>menor</b> (younger)</td></tr></table>
<p><i>Este bar es mejor que el otro. Mi hermana es mayor que yo.</i> (not <s>más bueno</s> / <s>más mayor</s> in careful speech).</p>
<h3>4. Superlative</h3>
<div class="rule"><b>el / la / los / las + (noun) + más / menos + adjective + de</b>: <i>Es el barrio más tranquilo <b>de</b> la ciudad. Es la mejor paella de Valencia.</i></div>
<p>Absolute superlative <b>-ísimo</b> (= very, very): <i>caro → carísimo, bueno → buenísimo, rico → riquísimo, largo → larguísimo, fácil → facilísimo</i>.</p>`,
 pitfalls:['<b>*más grande de Madrid</b> → más grande que Madrid (comparison); but superlative: el más grande de España.','<b>*más bueno</b> → mejor.','<b>*tan grande que</b> → tan grande como.','<b>*Tengo tan amigos como tú</b> → tantos amigos como tú.'],
 spain:'Las comparaciones entre ciudades son un deporte nacional: Madrid o Barcelona, el norte o el sur, la tortilla con cebolla o sin cebolla… Prepárese para dar su opinión.',
 examples:[['Madrid es más grande que Barcelona.','Madrid is bigger than Barcelona.'],['En el norte llueve más que en el sur.','It rains more in the north than in the south.'],['Este piso es menos caro que el otro.','This flat is less expensive than the other one.'],['Granada es tan bonita como Sevilla.','Granada is as pretty as Seville.'],['No tengo tanto tiempo como antes.','I don’t have as much time as before.'],['La tortilla de mi madre es mejor que la del bar.','My mother’s tortilla is better than the bar’s.'],['Mi hermano es mayor que yo.','My brother is older than me.'],['Es la ciudad más antigua de Europa occidental.','It is the oldest city in Western Europe.'],['Este es el mejor restaurante del barrio.','This is the best restaurant in the neighbourhood.'],['El jamón ibérico es carísimo.','Iberian ham is very, very expensive.'],['El examen fue facilísimo.','The exam was really easy.'],['Hay menos gente que el sábado pasado.','There are fewer people than last Saturday.']],
 ex:['g|Madrid es ___ grande que Toledo.|más','g|El tren es ___ rápido que el autobús.|más','g|Sevilla es tan bonita ___ Granada.|como','g|No tengo ___ dinero como tú.|tanto','g|No hay ___ gente como ayer.|tanta','g|Este café es ___ que el otro. (bueno)|mejor','g|Hoy me siento ___ que ayer. (mal)|peor','g|Mi hermana es ___ que yo. (older)|mayor','g|Es el barrio más bonito ___ la ciudad.|de','g|Este jamón está ___. (rico, -ísimo)|riquísimo','g|El piso es ___. (caro, -ísimo)|carísimo','m|This bar is better than the other one.|Este bar es mejor que el otro.~Este bar es más bueno de el otro.~Este bar es mejor como el otro.','m|It costs more than 100 euros.|Cuesta más de cien euros.~Cuesta más que cien euros.~Cuesta más cien euros.','m|She’s the tallest in the class.|Es la más alta de la clase.~Es la más alta en la clase que.~Es más alta de la clase.','o:comp|Bilbao is smaller than Madrid.|Bilbao es más pequeño que Madrid','o:comp|It is the best restaurant in the city.|Es el mejor restaurante de la ciudad','t|Translate: My flat is as big as yours.|Mi piso es tan grande como el tuyo','t|Translate: I work less than before.|Trabajo menos que antes']},

{id:'a2-06',level:'A2',title:'¿Qué has hecho hoy? – el pretérito perfecto',cat:'perf',vocab:['a2-experiencias'],
 topics:['haber + participio','Participios irregulares','Marcadores: hoy, esta semana, ya, todavía no, alguna vez, nunca','Experiencias de la vida'],
 source:'Libro Libre cap. 10 (The present perfect) · Greenfield Lesson 24 (Present perfect tense – participles)',
 goals:['contar lo que ha hecho hoy o esta semana','hablar de experiencias: ¿has estado alguna vez en…?','usar ya y todavía no'],
 grammar:`<h3>1. Form: haber + participle</h3>
<table><tr><th></th><th>haber</th><th>+ participle</th></tr>
<tr><td>yo</td><td><em>he</em></td><td rowspan="6">-ar → <b>-ado</b>: hablado, trabajado<br>-er / -ir → <b>-ido</b>: comido, vivido</td></tr>
<tr><td>tú</td><td><em>has</em></td></tr><tr><td>él / ella / usted</td><td><em>ha</em></td></tr><tr><td>nosotros</td><td><em>hemos</em></td></tr><tr><td>vosotros</td><td><em>habéis</em></td></tr><tr><td>ellos / ustedes</td><td><em>han</em></td></tr></table>
<p>Irregular participles: <i>hacer → <b>hecho</b>, decir → <b>dicho</b>, ver → <b>visto</b>, escribir → <b>escrito</b>, poner → <b>puesto</b>, volver → <b>vuelto</b>, abrir → <b>abierto</b>, romper → <b>roto</b>, morir → <b>muerto</b>, descubrir → <b>descubierto</b>, resolver → <b>resuelto</b></i>.</p>
<div class="rule">The participle never changes (<i>ella ha comido</i>) and nothing goes between haber and the participle: pronouns go before: <i><b>Lo</b> he visto. <b>Me</b> he levantado tarde. No he terminado.</i></div>
<h3>2. When? – in Spain</h3>
<p>Peninsular Spanish uses the perfect for actions in a time period that <b>includes now</b>:</p>
<p><i>hoy, esta mañana, esta tarde, esta semana, este mes, este año, últimamente</i> · <i>ya</i> (already) · <i>todavía no</i> (not yet) · <i>alguna vez</i> (ever) · <i>nunca</i> (never) · <i>muchas veces</i>.</p>
<div class="rule"><i>Hoy <b>he trabajado</b> mucho. ¿<b>Has estado</b> alguna vez en Galicia? – No, nunca he estado allí. ¿Ya <b>has comido</b>? – No, todavía no.</i></div>
<p>For finished periods (<i>ayer, el año pasado</i>) Spain uses the <i>indefinido</i> (next unit).</p>`,
 pitfalls:['<b>*He hacido</b> → He hecho; <b>*he escribido</b> → he escrito.','<b>*He lo visto</b> → Lo he visto.','<b>*Ella ha comida</b> → Ella ha comido.','<b>*Ayer he ido</b> → Ayer fui (finished period).'],
 spain:'Un rasgo típico del español de España: «¿Qué has hecho hoy?» – «He ido al mercado y he comido con mi madre». En Latinoamérica se diría «¿Qué hiciste hoy?». En España las dos se entienden, pero la primera suena más natural para hoy.',
 examples:[['Hoy he trabajado mucho.','I’ve worked a lot today.'],['¿Qué has hecho esta mañana?','What have you done this morning?'],['He ido al mercado y he comprado fruta.','I went to the market and bought fruit. (today)'],['¿Has estado alguna vez en Galicia?','Have you ever been to Galicia?'],['No, nunca he estado allí.','No, I’ve never been there.'],['¿Ya has comido? – No, todavía no.','Have you eaten yet? – No, not yet.'],['Esta semana hemos visto dos películas.','We’ve seen two films this week.'],['Me he levantado muy tarde.','I got up very late (today).'],['¿Habéis visto mis gafas? – No, no las hemos visto.','Have you seen my glasses? – No, we haven’t seen them.'],['Mis padres han vuelto de vacaciones.','My parents have come back from holiday.'],['He escrito un correo al casero.','I’ve written an email to the landlord.'],['Se me ha roto el móvil.','My mobile has broken.']],
 ex:['g|Hoy yo ___ trabajado mucho. (haber)|he','g|¿Tú ___ comido ya? (haber)|has','g|Nosotros ___ visto la película. (haber)|hemos','g|¿Vosotros ___ estado en Cádiz? (haber)|habéis','g|Ellos ___ llegado tarde. (haber)|han','g|He ___ en Madrid. (vivir)|vivido','g|¿Qué has ___? (hacer)|hecho','g|Ella ha ___ la verdad. (decir)|dicho','g|Hemos ___ una carta. (escribir)|escrito','g|¿Has ___ las llaves? (ver)|visto','g|Han ___ de vacaciones. (volver)|vuelto','g|¿Quién ha ___ la ventana? (abrir)|abierto','m|I have seen it.|Lo he visto.~He lo visto.~He visto lo.','m|Have you ever been to Mexico?|¿Has estado alguna vez en México?~¿Has sido alguna vez en México?~¿Estuviste nunca en México?','m|Not yet.|Todavía no.~Ya no.~Ya.','o:perf|Today I have got up very early.|Hoy me he levantado muy temprano','t|Translate: What have you done today? (tú)|¿Qué has hecho hoy?','t|Translate: I have never been to Ibiza.|Nunca he estado en Ibiza/No he estado nunca en Ibiza']}
]);

{id:'a2-07',level:'A2',title:'Ayer, el año pasado – el pretérito indefinido',cat:'pret',vocab:['a2-viajes'],
 topics:['Indefinido de los verbos regulares','Cambios ortográficos: llegué, empecé, busqué, leyó','Marcadores: ayer, anoche, el lunes pasado, hace dos años, en 2019','Perfecto o indefinido'],
 source:'Libro Libre cap. 9 (Vacation, Time expressions for the preterite, The preterite) · Greenfield Lesson 12 (Preterit tense)',
 goals:['contar lo que hizo ayer o en sus últimas vacaciones','usar los marcadores de tiempo del pasado','elegir entre «he ido» y «fui»'],
 grammar:`<h3>1. Regular preterite (pretérito indefinido)</h3>
<table><tr><th></th><th>-ar: viajar</th><th>-er: comer</th><th>-ir: salir</th></tr>
<tr><td>yo</td><td>viaj<em>é</em></td><td>com<em>í</em></td><td>sal<em>í</em></td></tr>
<tr><td>tú</td><td>viaj<em>aste</em></td><td>com<em>iste</em></td><td>sal<em>iste</em></td></tr>
<tr><td>él / ella / usted</td><td>viaj<em>ó</em></td><td>com<em>ió</em></td><td>sal<em>ió</em></td></tr>
<tr><td>nosotros</td><td>viaj<em>amos</em></td><td>com<em>imos</em></td><td>sal<em>imos</em></td></tr>
<tr><td>vosotros</td><td>viaj<em>asteis</em></td><td>com<em>isteis</em></td><td>sal<em>isteis</em></td></tr>
<tr><td>ellos / ustedes</td><td>viaj<em>aron</em></td><td>com<em>ieron</em></td><td>sal<em>ieron</em></td></tr></table>
<p>The accents matter: <i>hablo</i> (I speak) ≠ <i>habló</i> (he spoke). Nosotros of -ar and -ir looks like the present (<i>viajamos, salimos</i>) – context decides.</p>
<h3>2. Spelling changes in the yo form</h3>
<p>To keep the sound: <i>llegar → lle<b>gu</b>é, pagar → pa<b>gu</b>é, buscar → bus<b>qu</b>é, sacar → sa<b>qu</b>é, empezar → empe<b>c</b>é, cruzar → cru<b>c</b>é</i>. Between vowels i → y: <i>leer → le<b>y</b>ó, le<b>y</b>eron; oír → o<b>y</b>ó; construir → constru<b>y</b>ó</i>.</p>
<h3>3. Time markers</h3>
<p><i>ayer, anteayer, anoche</i> (last night), <i>el lunes pasado, la semana pasada, el mes / año pasado, en agosto, en 2019, hace dos días</i> (two days ago), <i>el otro día, aquel día</i>.</p>
<div class="rule"><b>Perfecto</b> (period not finished – today, this week, ever): <i>Esta semana <b>he ido</b> dos veces al gimnasio.</i><br><b>Indefinido</b> (finished period): <i>La semana pasada <b>fui</b> tres veces.</i> <i>Ayer <b>cenamos</b> en un restaurante japonés.</i></div>`,
 pitfalls:['<b>*Yo hablé</b> without accent: <i>hable</i> is a different form – write hablé.','<b>*llegé</b> → llegué; <b>*empezé</b> → empecé.','<b>*leió</b> → leyó.','<b>*Ayer he trabajado</b> → Ayer trabajé.'],
 spain:'Al contar unas vacaciones, los españoles mezclan con naturalidad: «Este verano <b>he estado</b> en Asturias» (este verano no ha terminado del todo) y «El verano pasado <b>estuve</b> en Asturias».',
 examples:[['Ayer trabajé hasta las ocho.','Yesterday I worked until eight.'],['¿Qué hiciste el fin de semana?','What did you do at the weekend?'],['El verano pasado viajamos por Andalucía.','Last summer we travelled around Andalusia.'],['Anoche cenamos en casa de unos amigos.','Last night we had dinner at some friends’ house.'],['Llegué a Madrid hace tres años.','I arrived in Madrid three years ago.'],['Mi hermano nació en 1990.','My brother was born in 1990.'],['¿A qué hora salisteis de la fiesta?','What time did you (all) leave the party?'],['Empecé a estudiar español en enero.','I started studying Spanish in January.'],['¿Leíste el libro? – Sí, lo leí en dos días.','Did you read the book? – Yes, I read it in two days.'],['Mis amigos me esperaron en la estación.','My friends waited for me at the station.'],['Esta mañana he desayunado fuera, pero ayer desayuné en casa.','This morning I had breakfast out, but yesterday I had it at home.'],['Pagué con tarjeta.','I paid by card.']],
 ex:['g|Ayer yo ___ mucho. (trabajar)|trabajé','g|¿Tú ___ con Marta anoche? (hablar)|hablaste','g|Ella ___ a las diez. (llegar)|llegó','g|Nosotros ___ paella el domingo. (comer)|comimos','g|¿Vosotros ___ el partido? (ver)|visteis','g|Ellos ___ en Mallorca. (vivir)|vivieron','g|Yo ___ a las nueve. (llegar)|llegué','g|Yo ___ la cuenta. (pagar)|pagué','g|Yo ___ a trabajar en mayo. (empezar)|empecé','g|Él ___ el periódico. (leer)|leyó','g|¿Cuándo ___ (tú) de casa? (salir)|saliste','m|Yesterday I bought a car.|Ayer compré un coche.~Ayer he comprado un coche.~Ayer compro un coche.','m|This week I have worked a lot.|Esta semana he trabajado mucho.~Esta semana trabajé mucho.~Esta semana trabajo mucho ayer.','m|“hace dos años” means…|two years ago~for two years~in two years','m|Él ___ (he spoke) con el jefe.|habló~hablo~hable','o:pret|Last year we travelled to Portugal.|El año pasado viajamos a Portugal','t|Translate: I arrived yesterday.|Llegué ayer/Ayer llegué','t|Translate: Did you eat at home? (tú, yesterday)|¿Comiste en casa?/¿Comiste en casa ayer?/¿Ayer comiste en casa?']},

{id:'a2-08',level:'A2',title:'Fui, tuve, hice – indefinidos irregulares',cat:'pret',vocab:['a2-vacaciones'],
 topics:['ser / ir: fui, fuiste, fue…','Raíces irregulares: tuv-, estuv-, hic-, pud-, pus-, quis-, vin-, sup-','dij-, traj-, -jeron','dar, ver; cambio e→i, o→u en -ir (pidió, durmió)'],
 source:'Libro Libre cap. 9 (Irregular preterite verbs, parts 1–4, Preterite synthesis) · Greenfield Lesson 13 (Preterit of some irregular verbs)',
 goals:['contar un viaje o un fin de semana con los verbos más frecuentes','dominar las formas irregulares'],
 grammar:`<h3>1. ser and ir – identical!</h3>
<p><b>fui, fuiste, fue, fuimos, fuisteis, fueron</b> – context tells you: <i>Fui a Roma</i> (I went) / <i>Fue increíble</i> (it was).</p>
<h3>2. Irregular stems + special endings (no accents!)</h3>
<p>Endings: <b>-e, -iste, -o, -imos, -isteis, -ieron</b></p>
<table><tr><th>infinitive</th><th>stem</th><th>yo / él</th></tr>
<tr><td>tener</td><td>tuv-</td><td>tuve / tuvo</td></tr><tr><td>estar</td><td>estuv-</td><td>estuve / estuvo</td></tr><tr><td>poder</td><td>pud-</td><td>pude / pudo</td></tr><tr><td>poner</td><td>pus-</td><td>puse / puso</td></tr><tr><td>saber</td><td>sup-</td><td>supe / supo</td></tr><tr><td>hacer</td><td>hic-</td><td>hice / <b>hizo</b></td></tr><tr><td>querer</td><td>quis-</td><td>quise / quiso</td></tr><tr><td>venir</td><td>vin-</td><td>vine / vino</td></tr><tr><td>haber</td><td>hub-</td><td>hubo (there was)</td></tr></table>
<div class="rule">j-stems drop the i in ellos: <b>decir</b> → dije, dijiste, dijo, dijimos, dijisteis, <b>dijeron</b> · <b>traer</b> → traje… <b>trajeron</b> · <b>conducir</b> → conduje… <b>condujeron</b>.</div>
<p><b>dar</b> → di, diste, dio, dimos, disteis, dieron · <b>ver</b> → vi, viste, vio, vimos, visteis, vieron.</p>
<h3>3. -ir stem changers (only él and ellos)</h3>
<p>e → i: <i>pedir → p<b>i</b>dió, p<b>i</b>dieron; sentir → s<b>i</b>ntió; repetir; preferir; divertirse → se div<b>i</b>rtió</i> · o → u: <i>dormir → d<b>u</b>rmió, d<b>u</b>rmieron; morir → m<b>u</b>rió</i>.</p>
<p>Very useful: <i>Hubo un problema</i> (there was a problem), <i>¿Qué tal te fue?</i> (how did it go?), <i>Lo pasamos genial</i> (we had a great time).</p>`,
 pitfalls:['<b>*tení, *estaba (for a finished action)</b> → tuve, estuve.','<b>*hició</b> → hizo.','<b>*dijieron</b> → dijeron.','<b>*Yo hací</b> → hice; <b>*pidó</b> → pidió.'],
 spain:'«¿Qué tal el finde?» es la pregunta de cada lunes en la oficina. Respuestas típicas: «Fui a la sierra», «Estuve en casa de mis padres», «Salimos de cañas», «No hice nada, ¡qué gusto!».',
 examples:[['El fin de semana fui a Segovia.','At the weekend I went to Segovia.'],['Fue un viaje increíble.','It was an incredible trip.'],['Estuvimos tres días en Asturias.','We were in Asturias for three days.'],['Tuve que trabajar el sábado.','I had to work on Saturday.'],['¿Qué hiciste ayer? – No hice nada especial.','What did you do yesterday? – Nothing special.'],['Mi madre vino a verme en Navidad.','My mother came to see me at Christmas.'],['No pude dormir por el calor.','I couldn’t sleep because of the heat.'],['¿Qué te dijo el médico?','What did the doctor tell you?'],['Hubo un problema con el vuelo.','There was a problem with the flight.'],['Pidió una ración de pulpo.','He ordered a portion of octopus.'],['Los niños durmieron toda la noche.','The children slept all night.'],['Lo pasamos genial en la fiesta.','We had a great time at the party.']],
 ex:['g|Ayer yo ___ a la playa. (ir)|fui','g|El concierto ___ fantástico. (ser)|fue','g|Yo ___ que trabajar. (tener)|tuve','g|¿Dónde ___ tú el sábado? (estar)|estuviste','g|¿Qué ___ tú anoche? (hacer)|hiciste','g|Ella ___ la cena. (hacer)|hizo','g|Nosotros no ___ venir. (poder)|pudimos','g|Ellos ___ la verdad. (decir)|dijeron','g|¿Quién ___ el vino? (traer)|trajo','g|Mis padres ___ en avión. (venir)|vinieron','g|Yo te ___ un regalo. (dar)|di','g|¿___ (vosotros) la película? (ver)|Visteis','g|El niño ___ diez horas. (dormir)|durmió','g|Ella ___ un café. (pedir)|pidió','g|___ un accidente en la autopista. (haber)|Hubo','m|We had a great time.|Lo pasamos genial.~Lo pasábamos genial ayer.~Tuvimos un tiempo genial.','o:pret|I couldn’t go to the party.|No pude ir a la fiesta','t|Translate: Where were you yesterday? (tú)|¿Dónde estuviste ayer?','t|Translate: What did you do at the weekend? (vosotros)|¿Qué hicisteis el fin de semana?']},

{id:'a2-09',level:'A2',title:'Cuando era pequeño – el imperfecto',cat:'imperf',vocab:['a2-infancia'],
 topics:['Imperfecto regular: -aba, -ía','Irregulares: ser, ir, ver','Costumbres del pasado: de niño, antes, siempre','Descripciones en el pasado','soler + infinitivo'],
 source:'Libro Libre cap. 8 (Childhood and adolescence, Time expressions for the imperfect, The imperfect) · Greenfield Lesson 14 (Imperfect tense)',
 goals:['hablar de su infancia y de cómo era la vida antes','describir personas y lugares en el pasado','comparar antes y ahora'],
 grammar:`<h3>1. Form</h3>
<table><tr><th></th><th>-ar: jugar</th><th>-er/-ir: vivir</th><th>ser</th><th>ir</th><th>ver</th></tr>
<tr><td>yo</td><td>jug<em>aba</em></td><td>viv<em>ía</em></td><td>era</td><td>iba</td><td>veía</td></tr>
<tr><td>tú</td><td>jug<em>abas</em></td><td>viv<em>ías</em></td><td>eras</td><td>ibas</td><td>veías</td></tr>
<tr><td>él / ella / usted</td><td>jug<em>aba</em></td><td>viv<em>ía</em></td><td>era</td><td>iba</td><td>veía</td></tr>
<tr><td>nosotros</td><td>jug<em>ábamos</em></td><td>viv<em>íamos</em></td><td>éramos</td><td>íbamos</td><td>veíamos</td></tr>
<tr><td>vosotros</td><td>jug<em>abais</em></td><td>viv<em>íais</em></td><td>erais</td><td>ibais</td><td>veíais</td></tr>
<tr><td>ellos / ustedes</td><td>jug<em>aban</em></td><td>viv<em>ían</em></td><td>eran</td><td>iban</td><td>veían</td></tr></table>
<p>Only <b>three</b> irregular verbs! No stem changes: <i>quería, podía, tenía, hacía</i>. <i>hay → había</i> (there was/were).</p>
<h3>2. Uses</h3>
<div class="rule"><b>Habits and repeated actions</b> in the past (= “used to / would”): <i>De niño <b>jugaba</b> en la calle. Los veranos <b>íbamos</b> al pueblo.</i><br><b>Descriptions</b> of people, places, situations: <i>Mi abuela <b>era</b> muy cariñosa. La casa <b>tenía</b> un patio. <b>Había</b> mucha gente.</i><br><b>Age, time, weather</b> in the past: <i><b>Tenía</b> diez años. <b>Eran</b> las ocho. <b>Hacía</b> frío.</i></div>
<p>Markers: <i>antes, de niño/a, de pequeño/a, cuando era joven, siempre, todos los días, a menudo, normalmente, en aquella época</i>. <b>soler</b> (o→ue) + infinitive = usually: <i>Solía levantarme temprano.</i></p>
<p>Antes / ahora: <i>Antes vivía en Londres, ahora vivo en Valencia.</i></p>`,
 pitfalls:['<b>*Cuando fui niño, jugué…</b> (for habits) → Cuando era niño, jugaba…','<b>*iba</b> without accent is right; <b>*íba</b> is wrong; but <b>íbamos</b> has one.','<b>*Teníamos</b> ✓ – <b>*tuvimos 10 años</b> → teníamos 10 años.','<b>*Había muchas personas</b> ✓ – never <b>*habían muchas personas</b>.'],
 spain:'Muchos españoles tienen «el pueblo»: el pueblo de sus abuelos, donde pasaban los veranos de niños. «En el pueblo jugábamos en la calle hasta las once de la noche» es casi un recuerdo colectivo.',
 examples:[['Cuando era pequeño, vivía en un pueblo.','When I was little, I lived in a village.'],['Todos los veranos íbamos a la playa.','Every summer we used to go to the beach.'],['Mi abuela era muy cariñosa y cocinaba muy bien.','My grandmother was very affectionate and cooked really well.'],['De niña quería ser veterinaria.','As a child I wanted to be a vet.'],['Antes trabajaba en Londres, ahora trabajo en Valencia.','I used to work in London, now I work in Valencia.'],['La casa tenía un patio con flores.','The house had a patio with flowers.'],['En el pueblo no había cines.','There were no cinemas in the village.'],['Tenía doce años cuando empecé a jugar al fútbol.','I was twelve when I started playing football.'],['Hacía mucho calor y no había nadie en la calle.','It was very hot and there was nobody in the street.'],['Mis padres solían salir los viernes.','My parents usually went out on Fridays.'],['¿Qué hacíais los domingos?','What did you (all) use to do on Sundays?'],['Antes no me gustaba el pescado, ahora me encanta.','I didn’t use to like fish, now I love it.']],
 ex:['g|De niño yo ___ al fútbol. (jugar)|jugaba','g|Antes tú ___ en Londres. (vivir)|vivías','g|Mi abuelo ___ muy alto. (ser)|era','g|Nosotros ___ al pueblo en verano. (ir)|íbamos','g|¿Vosotros ___ mucho la tele? (ver)|veíais','g|Ellos ___ en un banco. (trabajar)|trabajaban','g|Yo ___ diez años. (tener)|tenía','g|___ mucha gente en la plaza. (haber)|Había','g|___ mucho frío. (hacer)|Hacía','g|Yo ___ levantarme a las seis. (soler)|solía','m|As a child I used to read a lot.|De niño leía mucho.~De niño leí mucho.~De niño he leído mucho.','m|There were many people.|Había mucha gente.~Habían mucha gente.~Hubieron mucha gente.','m|My grandmother was very kind.|Mi abuela era muy amable.~Mi abuela fue muy amable siempre ayer.~Mi abuela estaba muy amable.','o:imperf|When I was young I lived in Bristol.|Cuando era joven vivía en Bristol','o:imperf|Every Sunday we ate at my grandparents’ house.|Todos los domingos comíamos en casa de mis abuelos','t|Translate: I used to work in a hotel.|Trabajaba en un hotel/Antes trabajaba en un hotel','t|Translate: It was hot. (weather)|Hacía calor']},

{id:'a2-10',level:'A2',title:'Contar una historia – indefinido o imperfecto',cat:'pretimp',vocab:['a2-sucesos'],
 topics:['Acciones (indefinido) y circunstancias (imperfecto)','mientras, cuando, de repente','Verbos que cambian: conocí/conocía, supe/sabía','Conectores para narrar'],
 source:'Libro Libre cap. 9 (Preterite versus imperfect) · Greenfield Lessons 12–14',
 goals:['contar una anécdota o un pequeño accidente','combinar los dos pasados correctamente','usar conectores narrativos'],
 grammar:`<h3>1. Two roles in a story</h3>
<table><tr><th>Imperfecto – the scene</th><th>Indefinido – the events</th></tr>
<tr><td>background, description, what was going on</td><td>what happened, completed actions, story moving forward</td></tr>
<tr><td><i>Era sábado. Hacía sol. Estábamos en la playa…</i></td><td><i>…de repente <b>empezó</b> a llover y <b>volvimos</b> a casa.</i></td></tr></table>
<div class="rule">Interrupted action: <b>imperfect</b> (ongoing) + <b>preterite</b> (interruption): <i>Mientras <b>cocinaba</b>, <b>sonó</b> el teléfono. <b>Iba</b> por la calle cuando <b>vi</b> a Laura.</i></div>
<p>A sequence of events = all preterite: <i>Me levanté, me duché y salí.</i> Simultaneous descriptions = all imperfect: <i>Llovía, hacía frío y no había nadie.</i></p>
<p>Duration with a clear limit → preterite: <i>Viví en Roma dos años</i> (finished block). Habit → imperfect: <i>Vivía en Roma y trabajaba en un bar.</i></p>
<h3>2. Meaning changes</h3>
<p><i>conocí</i> (I met) / <i>conocía</i> (I knew) · <i>supe</i> (I found out) / <i>sabía</i> (I knew) · <i>quise</i> (I tried) / <i>no quise</i> (I refused) / <i>quería</i> (I wanted) · <i>tuve que</i> (I had to – and did) / <i>tenía que</i> (I was supposed to).</p>
<h3>3. Story connectors</h3>
<p><i>Un día… · Al principio… · Entonces… · De repente… · Mientras… · Cuando… · Al final… · Por suerte / Por desgracia… · Total, que…</i> (colloquial: so, in the end).</p>`,
 pitfalls:['<b>*Mientras cociné, sonó el teléfono</b> → Mientras cocinaba, sonó…','<b>*Ayer hacía los deberes y luego salía</b> (sequence) → hice … salí.','<b>*Era cansado</b> → Estaba cansado (state, imperfect of estar).','<b>*Conocía a mi marido en 2015</b> → Conocí a mi marido en 2015.'],
 spain:'«Total, que…» es la manera más española de llegar al final de una anécdota: «Total, que perdimos el tren y llegamos a la boda a las tantas».',
 examples:[['Era domingo y hacía muy buen tiempo.','It was Sunday and the weather was lovely.'],['Mientras desayunábamos, llamó mi madre.','While we were having breakfast, my mother called.'],['Iba al trabajo cuando vi el accidente.','I was going to work when I saw the accident.'],['Conocí a mi pareja en una fiesta en Madrid.','I met my partner at a party in Madrid.'],['No sabía que estabas aquí.','I didn’t know you were here.'],['Estaba muy cansada, así que me acosté pronto.','I was very tired, so I went to bed early.'],['De repente se fue la luz.','Suddenly the power went off.'],['Llovía tanto que no pudimos salir.','It was raining so much that we couldn’t go out.'],['Viví dos años en Sevilla.','I lived in Seville for two years.'],['Al final llegamos a las tres de la mañana.','In the end we arrived at three in the morning.'],['Quise llamarte, pero no tenía batería.','I tried to call you, but I had no battery.'],['Total, que perdimos el último metro.','So, in the end, we missed the last metro.']],
 ex:['g|Mientras yo ___, sonó el teléfono. (ducharse – me …)|me duchaba','g|Ayer ___ (yo) a las siete, ___ y ___. (levantarse, ducharse, salir)|me levanté;me duché;salí','g|___ las once cuando llegamos. (ser)|Eran','g|Cuando era niño, ___ en Escocia. (vivir)|vivía','g|___ (yo) a mi mujer en 2010. (conocer)|Conocí','g|No ___ (yo) que tenías hermanos. (saber)|sabía','g|Estábamos en la playa cuando ___ a llover. (empezar)|empezó','g|___ mucho frío, así que me puse el abrigo. (hacer)|Hacía','m|I lived in Paris for three years (finished).|Viví tres años en París.~Vivía tres años en París.~He vivido tres años en París ayer.','m|I was walking home when I saw her.|Volvía a casa cuando la vi.~Volví a casa cuando la veía.~Volvía a casa cuando la veía.','m|Suddenly…|De repente~Mientras~Antes','m|I found out the truth yesterday.|Ayer supe la verdad.~Ayer sabía la verdad.~Ayer he sabido la verdad.','o:pretimp|It was raining when we left the restaurant.|Llovía cuando salimos del restaurante','o:pretimp|While I was working, the children were playing.|Mientras yo trabajaba, los niños jugaban','t|Translate: I was tired, so I stayed at home.|Estaba cansado, así que me quedé en casa/Estaba cansada, así que me quedé en casa','t|Translate: When I arrived, it was raining.|Cuando llegué, llovía/Cuando llegué, estaba lloviendo']},

{id:'a2-11',level:'A2',title:'Por y para, saber y conocer, el «se» impersonal',cat:'porpara',vocab:['a2-trabajo'],
 topics:['para: finalidad, destino, destinatario, plazo','por: causa, lugar de paso, precio, medio, tiempo','saber vs conocer','se impersonal: se habla, se puede, se alquila'],
 source:'Libro Libre cap. 7 (Saber versus conocer) y cap. 8 (The impersonal and passive se, Por versus para)',
 goals:['elegir entre por y para en frases frecuentes','distinguir saber y conocer','entender y usar anuncios y normas con «se»'],
 grammar:`<h3>1. para – towards a goal</h3>
<p><b>purpose</b> (para + inf.): <i>Estudio <b>para</b> hablar con mis vecinos.</i> · <b>destination</b>: <i>el tren <b>para</b> Bilbao</i> · <b>recipient</b>: <i>un regalo <b>para</b> ti</i> · <b>deadline</b>: <i><b>para</b> el viernes</i> · <b>opinion</b>: <i><b>Para</b> mí, es caro.</i> · <b>employer</b>: <i>Trabajo <b>para</b> una empresa alemana.</i></p>
<h3>2. por – cause, route, exchange</h3>
<p><b>cause</b>: <i>Gracias <b>por</b> la ayuda. Lo hago <b>por</b> ti.</i> · <b>through / around</b>: <i>Paseamos <b>por</b> el centro.</i> · <b>price / exchange</b>: <i>Lo compré <b>por</b> 20 €.</i> · <b>means</b>: <i><b>por</b> teléfono, <b>por</b> correo</i> · <b>part of the day</b>: <i><b>por</b> la mañana</i> · <b>approximate place/time</b>: <i>Vive <b>por</b> aquí.</i> · <b>per</b>: <i>dos veces <b>por</b> semana</i> · fixed: <i>por favor, por ejemplo, por fin, por eso, por supuesto</i>.</p>
<h3>3. saber vs conocer</h3>
<div class="rule"><b>saber</b> (sé) = know a fact, know <b>how to</b>: <i>¿Sabes dónde está? No sé nadar. Sé que es tarde.</i><br><b>conocer</b> (conozco) = know / be familiar with a person, a place, a thing; to meet: <i>¿Conoces a Marta? Conozco bien Sevilla.</i> (personal <b>a</b> before people)</div>
<h3>4. Impersonal se</h3>
<p><b>se</b> + 3rd person verb = “one / people / you (in general)”: <i>¿Cómo <b>se dice</b> “fork”? Aquí no <b>se puede</b> fumar. En España <b>se cena</b> tarde.</i> Signs: <i>Se alquila piso. Se venden coches. Se busca camarero.</i> With a plural noun the verb is plural: <i>se venden pisos</i>.</p>`,
 pitfalls:['<b>*Gracias para todo</b> → Gracias por todo.','<b>*Estudio por aprender</b> → Estudio para aprender.','<b>*Conozco nadar</b> → Sé nadar. <b>*Sé a María</b> → Conozco a María.','<b>*Se vende pisos</b> → Se venden pisos.'],
 spain:'Busque los carteles «<b>Se alquila</b>» en los balcones: todavía es una forma habitual de encontrar piso. «<b>Se busca</b> camarero/a con experiencia» es el clásico anuncio de trabajo en la puerta de un bar.',
 examples:[['Estudio español para trabajar en España.','I’m studying Spanish to work in Spain.'],['Este regalo es para ti.','This present is for you.'],['Necesito el informe para el lunes.','I need the report for Monday.'],['Gracias por todo.','Thanks for everything.'],['Paseamos por el Retiro.','We went for a walk in the Retiro park.'],['Lo compré por quince euros.','I bought it for fifteen euros.'],['Hablamos por teléfono dos veces por semana.','We talk on the phone twice a week.'],['¿Sabes dónde está la parada?','Do you know where the stop is?'],['No conozco a tu hermano.','I don’t know your brother.'],['¿Sabes conducir?','Can you drive?'],['¿Cómo se dice «spoon» en español?','How do you say “spoon” in Spanish?'],['Se alquila piso en el centro.','Flat to let in the centre.']],
 ex:['g|Gracias ___ tu ayuda.|por','g|Este regalo es ___ mi madre.|para','g|Estudio ___ aprender.|para','g|Paseamos ___ la playa.|por','g|Lo compré ___ diez euros.|por','g|El informe es ___ mañana.|para','g|Hablamos ___ teléfono.|por','g|Voy al gimnasio tres veces ___ semana.|por','g|___ mí, Granada es la ciudad más bonita.|Para','m|___ dónde vive Ana? (tú)|¿Sabes~¿Conoces','m|¿___ a Pedro? (tú)|Conoces~Sabes','m|I can swim.|Sé nadar.~Conozco nadar.~Puedo nadar a.','m|I know Madrid very well.|Conozco Madrid muy bien.~Sé Madrid muy bien.','g|Aquí no ___ puede aparcar.|se','g|Se ___ pisos. (vender)|venden','g|¿Cómo ___ dice «thank you»?|se','o:porpara|I’m learning Spanish to talk with my neighbours.|Aprendo español para hablar con mis vecinos','t|Translate: Thanks for everything.|Gracias por todo','t|Translate: Do you know my sister? (tú)|¿Conoces a mi hermana?']},

{id:'a2-12',level:'A2',title:'¡Gire a la derecha! – el imperativo',cat:'imper',vocab:['a2-cocina','a2-direcciones'],
 topics:['Imperativo afirmativo: tú, usted, vosotros, ustedes','Imperativos irregulares: di, haz, ve, pon, sal, sé, ten, ven','Pronombres con el imperativo: dímelo, siéntese','Dar instrucciones, recetas y direcciones'],
 source:'Libro Libre cap. 10 (The imperative) · Greenfield Lesson 19 (Commands)',
 goals:['dar instrucciones y direcciones','entender recetas e indicaciones','pedir cosas con el imperativo de forma natural'],
 grammar:`<h3>1. Affirmative commands</h3>
<table><tr><th></th><th>hablar</th><th>comer</th><th>escribir</th></tr>
<tr><td>tú</td><td>habl<em>a</em></td><td>com<em>e</em></td><td>escrib<em>e</em></td></tr>
<tr><td>usted</td><td>habl<em>e</em></td><td>com<em>a</em></td><td>escrib<em>a</em></td></tr>
<tr><td>vosotros</td><td>habl<em>ad</em></td><td>com<em>ed</em></td><td>escrib<em>id</em></td></tr>
<tr><td>ustedes</td><td>habl<em>en</em></td><td>com<em>an</em></td><td>escrib<em>an</em></td></tr></table>
<p><b>tú</b> = the él form of the present (<i>habla, come, cierra, vuelve</i>). <b>usted/ustedes</b> = “opposite vowel” from the yo form: <i>tengo → tenga, hago → haga, vengo → venga, digo → diga, pongo → ponga</i>; <i>ir → vaya, ser → sea</i>. <b>vosotros</b> = infinitive -r → <b>-d</b>.</p>
<div class="rule">Irregular tú: <b>di</b> (decir) · <b>haz</b> (hacer) · <b>ve</b> (ir) · <b>pon</b> (poner) · <b>sal</b> (salir) · <b>sé</b> (ser) · <b>ten</b> (tener) · <b>ven</b> (venir).</div>
<h3>2. Pronouns are attached</h3>
<p><i>¡Dímelo! ¡Siéntese! ¡Llámame! ¡Pásame la sal! ¡Ponlo aquí!</i> – an accent is often needed to keep the stress: <i>di + me + lo → dímelo, pasa + me → pásame</i>. Reflexive vosotros drops the -d: <i>sentad + os → <b>sentaos</b></i> (colloquially often <i>sentaros</i>).</p>
<h3>3. Typical uses</h3>
<p><b>Directions</b> (usted): <i>Siga recto. Gire a la derecha. Cruce la plaza. Tome la segunda calle a la izquierda.</i> · <b>Recipes</b>: <i>Pela las patatas, córtalas en rodajas, añade sal…</i> · <b>Requests / offers</b> (very normal in Spain): <i>Pasa, pasa. Mira, … Oye, … Perdona, … Toma</i> (here you are).</p>
<p>Negative commands use a different form (<i>no hables</i>) – see unit B1-9.</p>`,
 pitfalls:['<b>*Hace los deberes</b> (command) → Haz los deberes.','<b>*Me dice la verdad</b> (command) → Dime la verdad.','<b>*Sigue recto</b> to a stranger you call usted → Siga recto.','<b>*Siéntase</b> → Siéntese (usted).'],
 spain:'En España el imperativo no es grosero: «Pasa, siéntate», «Mira, te cuento», «Oye, ¿tienes hora?», «Toma, tu café». Lo que lo hace amable es el tono – y un «por favor» de vez en cuando.',
 examples:[['Perdone, ¿para ir a la catedral?','Excuse me, how do I get to the cathedral?'],['Siga todo recto y gire a la derecha.','Go straight on and turn right.'],['Tome la segunda calle a la izquierda.','Take the second street on the left.'],['Cruce la plaza y allí está.','Cross the square and it’s there.'],['Pasa, pasa, siéntate.','Come in, come in, sit down.'],['Dime la verdad.','Tell me the truth.'],['Ven aquí un momento, por favor.','Come here a moment, please.'],['Pela las patatas y córtalas en rodajas finas.','Peel the potatoes and cut them into thin slices.'],['Añade un poco de sal y aceite de oliva.','Add a little salt and olive oil.'],['Pásame el pan, por favor.','Pass me the bread, please.'],['Oye, ¿tienes un cargador?','Hey, have you got a charger?'],['Chicos, sentaos y abrid el libro.','Guys, sit down and open the book.']],
 ex:['g|(tú, hablar) ¡___ más despacio!|Habla','g|(tú, comer) ¡___ más fruta!|Come','g|(tú, venir) ¡___ aquí!|Ven','g|(tú, hacer) ___ los deberes.|Haz','g|(tú, poner) ___ la mesa, por favor.|Pon','g|(tú, decir) ___ la verdad.|Di','g|(tú, salir) ¡___ de ahí!|Sal','g|(tú, tener) ___ cuidado.|Ten','g|(usted, seguir) ___ recto.|Siga','g|(usted, girar) ___ a la izquierda.|Gire','g|(usted, cruzar) ___ la calle.|Cruce','g|(vosotros, abrir) ___ la ventana.|Abrid','g|(ustedes, pasar) ___, por favor.|Pasen','m|Tell me! (tú)|¡Dímelo!~¡Me lo di!~¡Dilome!','m|Sit down, please. (usted)|Siéntese, por favor.~Siéntase, por favor.~Se siente, por favor.','m|Here you are. (giving something, tú)|Toma.~Toma te.~Tomas.','o:imper|Take the first street on the right. (usted)|Tome la primera calle a la derecha','t|Translate: Pass me the salt, please. (tú)|Pásame la sal, por favor','t|Translate: Come with me. (tú)|Ven conmigo']}
]);
