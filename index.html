{id:'l-a2-07',label:'A2·7',title:'Las vacaciones de Carmen',titleEn:'Carmen’s holidays',unit:'a2-08',task:'Carmen cuenta sus vacaciones en el norte. ¿Adónde fue y qué hizo?',taskEn:'Carmen talks about her holiday in the north. Where did she go and what did she do?',v:{'Emma':'f','Carmen':'f2'},
d:`Emma: Carmen, ¿qué tal las vacaciones?
Carmen: ¡Estupendas! Fuimos al norte, a Asturias y a Cantabria.
Emma: ¿Cuántos días estuvisteis?
Carmen: Estuvimos diez días. Alquilamos una casa rural cerca de Cangas de Onís.
Emma: ¿Y qué hicisteis?
Carmen: Hicimos senderismo en los Picos de Europa, fuimos a los lagos de Covadonga y comimos fabada todos los días… bueno, casi todos.
Emma: ¿Hizo buen tiempo?
Carmen: Un día llovió muchísimo, pero el resto hizo sol y no hizo calor. ¡Perfecto para el verano!
Emma: ¿Y los niños?
Carmen: Se lo pasaron genial. Vieron vacas, se bañaron en el río y durmieron como angelitos.
Emma: ¡Qué envidia!`,
en:`Emma: Carmen, how were the holidays?
Carmen: Wonderful! We went north, to Asturias and Cantabria.
Emma: How many days were you there?
Carmen: We were there ten days. We rented a country house near Cangas de Onís.
Emma: And what did you do?
Carmen: We went hiking in the Picos de Europa, went to the Covadonga lakes and ate fabada every day… well, almost every day.
Emma: Was the weather good?
Carmen: One day it rained a lot, but the rest of the time it was sunny and not hot. Perfect for summer!
Emma: And the kids?
Carmen: They had a great time. They saw cows, swam in the river and slept like little angels.
Emma: I’m so jealous!`,
qs:['m|Carmen fue a…|Asturias y Cantabria~Galicia~Andalucía','g|Estuvieron ___ días.|diez/10','m|Se alojaron en…|una casa rural~un hotel~un camping','m|Comieron fabada…|casi todos los días~un día~nunca','m|Hizo mucho calor.|Falso~Verdadero','m|Los niños se bañaron en…|el río~el mar~la piscina']},
{id:'l-a2-08',label:'A2·8',title:'Ver un piso',titleEn:'Viewing a flat',unit:'b1-07',task:'Emma visita un piso. Anote: precio, habitaciones, ventajas e inconvenientes.',taskEn:'Emma views a flat. Note: price, rooms, pros and cons.',v:{'Agente':'m2','Emma':'f'},
d:`Agente: Buenas tardes. Usted es Emma, ¿verdad? Pase, pase.
Emma: Buenas tardes. ¡Qué luminoso!
Agente: Sí, es exterior y da a una plaza. Tiene dos habitaciones, un salón, cocina y un baño completo.
Emma: ¿Está amueblado?
Agente: Sí, tiene todos los muebles y los electrodomésticos: lavadora, nevera, horno…
Emma: ¿Cuánto es el alquiler?
Agente: Novecientos cincuenta euros al mes, con los gastos de comunidad incluidos.
Emma: ¿Y la fianza?
Agente: Dos meses de fianza. El contrato es de un año, renovable.
Emma: ¿Tiene ascensor? Es un cuarto piso.
Agente: No, no tiene ascensor. Es un edificio antiguo.
Emma: Vaya… ¿Y la calefacción?
Agente: Es eléctrica. En invierno no hace mucho frío en Madrid.
Emma: Bueno, me lo voy a pensar. ¿Le puedo llamar mañana?
Agente: Claro. Pero hay mucha gente interesada, no tarde mucho.`,
en:`Agent: Good afternoon. You’re Emma, right? Come in, come in.
Emma: Good afternoon. How bright!
Agent: Yes, it faces the street and overlooks a square. It has two bedrooms, a living room, kitchen and a full bathroom.
Emma: Is it furnished?
Agent: Yes, it has all the furniture and appliances: washing machine, fridge, oven…
Emma: How much is the rent?
Agent: Nine hundred and fifty euros a month, with service charges included.
Emma: And the deposit?
Agent: Two months’ deposit. The contract is for one year, renewable.
Emma: Does it have a lift? It’s a fourth floor.
Agent: No, it doesn’t have a lift. It’s an old building.
Emma: Oh dear… And the heating?
Agent: It’s electric. In winter it’s not very cold in Madrid.
Emma: Well, I’ll think about it. Can I call you tomorrow?
Agent: Of course. But there are lots of people interested, don’t take too long.`,

{id:'l-a2-09',label:'A2·9',title:'Cuando era pequeña',titleEn:'When I was little',unit:'a2-09',task:'Lucía habla de su infancia en el pueblo. ¿Cómo era su vida?',taskEn:'Lucía talks about her childhood in the village. What was her life like?',v:{'Lucía':'f2'},
d:`Lucía: Cuando era pequeña, vivía en un pueblo de Extremadura con mis padres y mis abuelos.
Lucía: La casa era grande y tenía un patio con una higuera. En verano comíamos allí, a la sombra.
Lucía: En el pueblo no había cine ni piscina, pero no nos aburríamos nunca.
Lucía: Jugábamos en la calle hasta la noche: al escondite, a la comba, al fútbol.
Lucía: Mi abuela hacía unas magdalenas buenísimas y nos las daba para merendar.
Lucía: En el colegio éramos solo doce niños, todos en la misma clase.
Lucía: Mi mejor amiga se llamaba Rocío. Era muy traviesa y siempre teníamos problemas con la maestra.
Lucía: Ahora vivo en Toledo, pero todos los veranos vuelvo al pueblo. Ya no es lo mismo, pero sigo teniendo esa sensación de libertad.`,
en:`Lucía: When I was little, I lived in a village in Extremadura with my parents and grandparents.
Lucía: The house was big and had a patio with a fig tree. In summer we ate there, in the shade.
Lucía: There was no cinema or swimming pool in the village, but we were never bored.
Lucía: We played in the street until night: hide-and-seek, skipping rope, football.
Lucía: My grandmother made really good muffins and gave them to us for an afternoon snack.
Lucía: At school there were only twelve children, all in the same class.
Lucía: My best friend was called Rocío. She was very naughty and we were always in trouble with the teacher.
Lucía: Now I live in Toledo, but every summer I go back to the village. It’s not the same any more, but I still have that feeling of freedom.`,
qs:['m|Lucía vivía en un pueblo de…|Extremadura~Galicia~Castilla','m|La casa tenía un patio con una higuera.|Verdadero~Falso','m|En el pueblo había piscina.|Falso~Verdadero','m|La abuela hacía…|magdalenas~churros~tortillas','g|En el colegio eran ___ niños.|doce/12','m|Rocío era…|muy traviesa~muy tímida~muy seria']},
{id:'l-a2-10',label:'A2·10',title:'¿Quedamos?',titleEn:'Shall we meet up?',unit:'a2-11',task:'Emma y Ainhoa organizan una salida. ¿Cuándo y dónde quedan?',taskEn:'Emma and Ainhoa organise an outing. When and where do they meet?',v:{'Ainhoa':'f2','Emma':'f'},
d:`Ainhoa: ¡Hola, Emma! Soy Ainhoa, la compañera de piso de Lucas.
Emma: ¡Hola, Ainhoa! ¿Qué tal?
Ainhoa: Bien. Oye, el viernes vamos unos amigos al Rastro y luego a tomar algo por La Latina. ¿Te apuntas?
Emma: El Rastro es el domingo, ¿no?
Ainhoa: ¡Ay, sí, perdona! El domingo por la mañana. El viernes salimos de cañas.
Emma: El viernes no puedo, tengo una cena de trabajo. Pero el domingo, sí.
Ainhoa: ¡Genial! ¿Quedamos a las once en la salida del metro de La Latina?
Emma: Vale. ¿No es muy pronto para un domingo?
Ainhoa: Si vamos más tarde, hay demasiada gente. Después comemos en un bar que me encanta.
Emma: Perfecto. Hasta el domingo, entonces.
Ainhoa: ¡Venga, hasta el domingo! Si hay algún cambio, te mando un mensaje.`,
en:`Ainhoa: Hi, Emma! It’s Ainhoa, Lucas’s flatmate.
Emma: Hi, Ainhoa! How are you?
Ainhoa: Fine. Listen, on Friday some friends and I are going to the Rastro and then for a drink around La Latina. Do you want to come?
Emma: The Rastro is on Sunday, isn’t it?
Ainhoa: Oh, yes, sorry! Sunday morning. On Friday we’re going out for beers.
Emma: I can’t on Friday, I have a work dinner. But Sunday, yes.
Ainhoa: Great! Shall we meet at eleven at the exit of La Latina metro?
Emma: OK. Isn’t it a bit early for a Sunday?
Ainhoa: If we go later, there are too many people. Afterwards we’ll have lunch at a bar I love.
Emma: Perfect. See you on Sunday, then.
Ainhoa: Right, see you Sunday! If anything changes, I’ll send you a message.`,

{id:'l-a2-11',label:'A2·11',title:'Una llamada: no hay agua',titleEn:'A phone call: there’s no water',unit:'a2-04',task:'Emma llama a la casera. ¿Cuál es el problema y qué solución hay?',taskEn:'Emma calls the landlady. What is the problem and what is the solution?',v:{'Casera':'f2','Emma':'f'},
d:`Casera: ¿Dígame?
Emma: Hola, buenos días. ¿Es la señora Gómez? Soy Emma, la inquilina del cuarto B.
Casera: Ah, hola, Emma. ¿Qué tal? ¿Pasa algo?
Emma: Pues sí, es que esta mañana no hay agua caliente. Creo que la caldera no funciona.
Casera: ¡Vaya! ¿Ha mirado si está encendida la luz roja?
Emma: Sí, la luz roja está encendida, pero no sale agua caliente.
Casera: Vale. Voy a llamar al técnico. Normalmente viene en uno o dos días.
Emma: ¿Uno o dos días? ¿No puede venir hoy?
Casera: Lo intento, pero no le prometo nada. ¿Le doy su número al técnico para que la llame?
Emma: Sí, por favor. Mi número es el seis, cincuenta, veintiuno, treinta y tres, cero ocho.
Casera: Apuntado. Y perdone las molestias, Emma.
Emma: No pasa nada. Gracias, señora Gómez.`,
en:`Landlady: Hello?
Emma: Hello, good morning. Is that Mrs Gómez? It’s Emma, the tenant in 4B.
Landlady: Oh, hi, Emma. How are you? Is something wrong?
Emma: Well, yes, the thing is there’s no hot water this morning. I think the boiler isn’t working.
Landlady: Oh dear! Have you checked if the red light is on?
Emma: Yes, the red light is on, but no hot water comes out.
Landlady: OK. I’m going to call the technician. He usually comes within one or two days.
Emma: One or two days? Can’t he come today?
Landlady: I’ll try, but I can’t promise anything. Shall I give the technician your number so he can call you?
Emma: Yes, please. My number is 650 21 33 08.
Landlady: Noted. And sorry for the inconvenience, Emma.
Emma: No problem. Thank you, Mrs Gómez.`,

{id:'l-a2-12',label:'A2·12',title:'¿Cómo llego al Prado?',titleEn:'How do I get to the Prado?',unit:'a2-12',task:'Siga las indicaciones en el mapa mental. ¿Qué tiene que hacer el turista?',taskEn:'Follow the directions in your head. What does the tourist have to do?',v:{'Turista':'m2','Emma':'f'},
d:`Turista: Perdone, ¿para ir al Museo del Prado?
Emma: Sí, mire, está muy cerca. Siga todo recto por esta calle hasta la plaza.
Turista: ¿Hasta la plaza de Santa Ana?
Emma: Exacto. En la plaza, gire a la izquierda y baje por la calle del Prado.
Turista: Vale, a la izquierda y todo recto.
Emma: Eso es. Al final de la calle, cruce el paseo del Prado en el semáforo. El museo está enfrente.
Turista: ¿Está lejos? ¿Puedo ir andando?
Emma: Sí, son unos diez minutos andando. Si no, puede coger el autobús número veintisiete.
Turista: Andando, mejor. Hace muy buen día.
Emma: Por cierto, de seis a ocho de la tarde la entrada es gratis.
Turista: ¡Qué bien! Muchísimas gracias.
Emma: De nada. ¡Que lo disfrute!`,
en:`Tourist: Excuse me, how do I get to the Prado Museum?
Emma: Yes, look, it’s very close. Go straight along this street to the square.
Tourist: To Plaza de Santa Ana?
Emma: Exactly. In the square, turn left and go down Calle del Prado.
Tourist: OK, left and straight on.
Emma: That’s it. At the end of the street, cross the Paseo del Prado at the traffic lights. The museum is opposite.
Tourist: Is it far? Can I walk?
Emma: Yes, it’s about ten minutes’ walk. Otherwise you can take the number twenty-seven bus.
Tourist: Walking is better. It’s a lovely day.
Emma: By the way, from six to eight in the evening entry is free.
Tourist: Great! Thank you so much.
Emma: You’re welcome. Enjoy it!`,
qs:['m|Primero el turista tiene que…|seguir recto hasta la plaza~girar a la derecha~coger el metro','m|En la plaza tiene que girar a la…|izquierda~derecha','m|Tiene que cruzar el paseo del Prado en el semáforo.|Verdadero~Falso','g|Está a unos ___ minutos andando.|diez/10','m|El autobús número…|veintisiete~diecisiete~siete','m|La entrada es gratis de…|seis a ocho de la tarde~diez a doce~cuatro a seis']}
]});

{id:'l-b1-01',label:'B1·1',title:'El año que viene',titleEn:'Next year',unit:'b1-01',task:'¿Qué planes tienen Emma y Javier para el año que viene? ¿Qué es seguro y qué es una predicción?',v:{'Javier':'m','Emma':'f'},
d:`Javier: Oye, Emma, ¿te vas a quedar en Madrid el año que viene o vuelves a Escocia?
Emma: Me quedo, seguro. La empresa me ha ofrecido un contrato indefinido y lo voy a firmar la semana que viene.
Javier: ¡Enhorabuena! ¿Y seguirás en el mismo piso?
Emma: No creo. Voy a buscar algo más grande, con ascensor. Mis padres vendrán a verme más a menudo y quiero tener una habitación para ellos.
Javier: Pues yo tengo una noticia: en septiembre empiezo un máster en Barcelona.
Emma: ¡No me digas! ¿Y el trabajo?
Javier: Pediré una excedencia de un año. Carmen dice que no habrá problema.
Emma: Te echaremos de menos en la oficina.
Javier: Bah, volveré antes de que te des cuenta. Además, Barcelona está a dos horas y media en AVE. Vendrás a verme, ¿no?
Emma: Claro que sí. Y dentro de un año hablaré catalán perfectamente, ya verás.
Javier: Eso no te lo crees ni tú.`,

{id:'l-b1-02',label:'B1·2',title:'Consejos para la entrevista',titleEn:'Advice for the interview',unit:'b1-02',task:'Ainhoa tiene una entrevista de trabajo. ¿Qué consejos le dan?',v:{'Ainhoa':'f2','Lucas':'m2'},
d:`Ainhoa: Lucas, mañana tengo la entrevista en la clínica y estoy de los nervios.
Lucas: Tranquila, lo harás muy bien. ¿Te has preparado las preguntas típicas?
Ainhoa: Más o menos. Lo que me preocupa es la parte de inglés.
Lucas: Yo que tú, practicaría esta noche con Emma. Seguro que te ayuda encantada.
Ainhoa: Buena idea. ¿Y qué me pongo? ¿Traje o algo más informal?
Lucas: Para una clínica, yo no iría con traje. Iría con algo sencillo pero arreglado.
Ainhoa: Vale. ¿Y si me preguntan por el sueldo?
Lucas: Deberías informarte antes de cuánto se cobra en otras clínicas. Así podrás negociar.
Ainhoa: ¿Tú crees que debería preguntar por el horario?
Lucas: Claro, es normal. Pero no lo preguntes al principio, mejor al final.
Ainhoa: Gracias, de verdad. Me gustaría tener tu tranquilidad.
Lucas: Y a mí tu currículum. Venga, ¡mucha suerte!`,
gloss:[['estar de los nervios','to be a bundle of nerves'],['arreglado','smart, well-presented'],['cobrar','to earn, to be paid'],['negociar','to negotiate']],
qs:['m|La entrevista de Ainhoa es en…|una clínica~un hospital~un colegio','m|A Ainhoa le preocupa sobre todo…|la parte de inglés~el viaje~el sueldo','m|Lucas le aconseja practicar con…|Emma~Javier~su madre','m|Lucas recomienda ir con traje.|Falso~Verdadero','m|Antes de la entrevista debería informarse sobre…|los sueldos de otras clínicas~la historia de la clínica~los compañeros','m|Sobre el horario, Lucas dice que…|es mejor preguntar al final~no hay que preguntar~hay que preguntar al principio']},
{id:'l-b1-03',label:'B1·3',title:'Quiero que me escuches',titleEn:'I want you to listen to me',unit:'b1-03',task:'Pablo y su madre hablan del verano. ¿Qué quiere cada uno?',v:{'Madre':'f2','Pablo':'m'},
d:`Madre: Pablo, este verano quiero que vengáis todos al pueblo, al menos una semana.
Pablo: Mamá, ya sabes que nos gustaría, pero los niños tienen campamento en julio.
Madre: Pues en agosto. Necesito que me ayudéis a pintar la casa, que yo ya no puedo subirme a la escalera.
Pablo: Vale, pero prefiero que contratemos a un pintor. No quiero que te canses.
Madre: ¡Qué pintor ni qué pintor! Eso es tirar el dinero. Lo hacemos entre todos y en dos días está.
Pablo: Mamá, por favor, te pido que me escuches. Lo pago yo.
Madre: Bueno, ya veremos. Lo importante es que vengáis. Ojalá venga también tu hermana con el novio.
Pablo: Ojalá. Hablaré con ella esta semana.
Madre: Y dile a Lucía que traiga la receta del pastel de queso, que me encantó.
Pablo: Se lo digo. Un beso, mamá.
Madre: Un beso, hijo. ¡Que descanses!`,
gloss:[['el campamento','summer camp'],['¡Qué pintor ni qué pintor!','painter, my foot! (rejecting the idea)'],['tirar el dinero','to waste money'],['entre todos','all together']],
qs:['m|La madre quiere que la familia vaya al pueblo…|al menos una semana~todo el verano~un fin de semana','m|En julio los niños tienen…|campamento~colegio~clases de inglés','m|La madre necesita ayuda para…|pintar la casa~cocinar~limpiar el jardín','m|Pablo prefiere que…|contraten a un pintor~pinte su hermana~no se pinte la casa','m|La madre piensa que contratar a un pintor es tirar el dinero.|Verdadero~Falso','m|Lucía tiene que traer…|la receta del pastel de queso~a sus hijos~una escalera']},
{id:'l-b1-04',label:'B1·4',title:'La tertulia: el turismo',titleEn:'Radio debate: tourism',unit:'b1-05',task:'Dos oyentes opinan sobre el turismo en su ciudad. ¿Quién está a favor y quién en contra? ¿Qué argumentos dan?',v:{'Presentadora':'f2','Andrés':'m','Rosa':'f'},
d:`Presentadora: Buenas tardes. Hoy hablamos del turismo en nuestras ciudades. Tenemos dos llamadas. Adelante, Andrés.
Andrés: Hola, buenas tardes. Yo vivo en el centro de Sevilla y, sinceramente, creo que el turismo ha cambiado el barrio para mal. Los pisos turísticos han subido los alquileres y muchos vecinos se han tenido que ir.
Presentadora: Gracias, Andrés. Rosa, ¿usted qué opina?
Rosa: Pues yo no estoy de acuerdo con Andrés. Tengo un pequeño restaurante y sin turistas tendría que cerrar. El turismo da trabajo a mucha gente.
Andrés: No digo que el turismo sea malo, Rosa. Digo que hace falta controlarlo.
Rosa: En eso tienes razón. No creo que haya que prohibir nada, pero sí poner límites a los pisos turísticos.
Presentadora: Entonces, ¿están los dos de acuerdo en algo?
Andrés: Sí, en que el centro tiene que seguir siendo para los vecinos.
Rosa: Y en que los turistas son bienvenidos, pero con respeto.`,
gloss:[['para mal','for the worse'],['el piso turístico','holiday flat (short-term rental)'],['hace falta','it is necessary'],['poner límites','to set limits']],
qs:['m|Andrés vive en…|Sevilla~Barcelona~Málaga','m|Según Andrés, los pisos turísticos…|han subido los alquileres~han bajado los precios~no existen en su barrio','m|Rosa tiene…|un restaurante~un hotel~una tienda','m|Rosa cree que hay que prohibir el turismo.|Falso~Verdadero','m|Al final, los dos están de acuerdo en que…|el centro tiene que seguir siendo para los vecinos~hay que cerrar los restaurantes~no hay ningún problema','m|Andrés dice que el turismo es malo.|Falso~Verdadero']},
{id:'l-b1-05',label:'B1·5',title:'Cuando llegues, avísame',titleEn:'Let me know when you arrive',unit:'b1-06',task:'Emma organiza el empadronamiento. ¿Qué tiene que llevar y en qué orden?',v:{'Funcionario':'m2','Emma':'f'},
d:`Funcionario: Ayuntamiento de Madrid, buenos días.
Emma: Buenos días. Quería información sobre el empadronamiento. Acabo de cambiarme de piso.
Funcionario: Muy bien. Primero tiene que pedir cita previa en la web o en el 010.
Emma: Vale. ¿Y qué documentos tengo que llevar?
Funcionario: Su pasaporte o la tarjeta de residencia, el contrato de alquiler y el formulario de inscripción rellenado y firmado.
Emma: ¿El formulario lo puedo descargar?
Funcionario: Sí, está en la web. Rellénelo antes de ir, para que no tenga que esperar más.
Emma: ¿Y cuándo me dan el certificado?
Funcionario: En cuanto la registren, se lo dan en el momento. Si lo necesita para otro trámite, pida un certificado de empadronamiento, no un volante.
Emma: Perfecto. Y si el contrato está a nombre de mi compañera de piso, ¿qué hago?
Funcionario: Entonces necesita una autorización firmada por ella y una fotocopia de su DNI.
Emma: Entendido. Muchas gracias.
Funcionario: A usted. Que tenga un buen día.`,
gloss:[['el empadronamiento','registration on the municipal register'],['el volante','simple registration note (less official than the certificate)'],['en el momento','on the spot'],['a nombre de','in the name of']],
qs:['m|Primero Emma tiene que…|pedir cita previa~ir directamente~mandar un correo','m|Uno de los documentos es…|el contrato de alquiler~el contrato de trabajo~el título universitario','m|El formulario se puede descargar de la web.|Verdadero~Falso','m|El certificado se lo dan…|en el momento~en un mes~por correo','m|Si el contrato está a nombre de otra persona, Emma necesita…|una autorización y una fotocopia de su DNI~un abogado~una carta del casero','g|El teléfono de información es el ___.|010/cero diez']},
{id:'l-b1-06',label:'B1·6',title:'¡Qué fuerte! Una anécdota',titleEn:'No way! An anecdote',unit:'b1-08',task:'Lucas cuenta lo que le pasó en el aeropuerto. Ordene los hechos.',v:{'Lucas':'m2','Emma':'f'},
d:`Lucas: No te vas a creer lo que me pasó el sábado.
Emma: A ver, cuenta.
Lucas: Iba a Lisboa para la boda de un amigo. Llegué al aeropuerto con mucho tiempo, pasé el control y me senté a tomar un café.
Emma: Hasta ahí, todo normal.
Lucas: Sí. Pero cuando fui a la puerta de embarque, me di cuenta de que había dejado la cartera en la cafetería.
Emma: ¡No me digas!
Lucas: Volví corriendo, pero la cartera ya no estaba. Alguien se la había llevado.
Emma: ¡Qué mala suerte! ¿Y el vuelo?
Lucas: Pues mientras yo buscaba la cartera, cerraron la puerta. Perdí el avión.
Emma: ¡Qué fuerte! ¿Y qué hiciste?
Lucas: Fui a la oficina de objetos perdidos y… ¡allí estaba! Un camarero la había encontrado. No faltaba nada.
Emma: ¡Menos mal! ¿Y llegaste a la boda?
Lucas: Cogí el vuelo siguiente y llegué justo para el banquete. Total, que me perdí la ceremonia, pero no la fiesta.`,
gloss:[['la puerta de embarque','boarding gate'],['la oficina de objetos perdidos','lost property office'],['faltar','to be missing'],['el banquete','wedding reception (meal)']],
qs:['m|Lucas iba a…|Lisboa~Londres~Lyon','m|Lucas había dejado la cartera en…|la cafetería~el control~el avión','m|Lucas perdió el avión.|Verdadero~Falso','m|¿Quién había encontrado la cartera?|un camarero~un policía~una pasajera','m|En la cartera faltaba dinero.|Falso~Verdadero','m|Lucas se perdió…|la ceremonia~el banquete~la fiesta']},
{id:'l-b1-07',label:'B1·7',title:'Normas de la comunidad',titleEn:'Building rules',unit:'b1-09',task:'Reunión de vecinos. ¿Qué normas nuevas hay?',v:{'Presidenta':'f2','Vecino':'m','Emma':'f'},
d:`Presidenta: Bueno, vecinos, empezamos la reunión. El primer punto es la basura. Por favor, no dejéis las bolsas en el portal; bajadlas al contenedor por la noche.
Vecino: Es que algunos vecinos las dejan en la escalera todo el día y huele fatal.
Presidenta: Por eso. Segundo punto: las bicis. No las dejéis en el descansillo. Hemos preparado un cuarto para bicicletas en el sótano.
Emma: ¿Hace falta una llave para ese cuarto?
Presidenta: Sí, pedídsela al portero. Tercer punto: el ruido. Por favor, no hagáis obras ni pongáis la lavadora después de las diez de la noche.
Vecino: ¿Y las fiestas? Los del tercero hacen fiestas casi todos los fines de semana.
Presidenta: No señalemos a nadie, Manolo. Pero sí: los fines de semana, música baja a partir de las doce.
Emma: Me parece justo.
Presidenta: Último punto: este año hay que pintar la fachada. Cada vecino pagará una cuota extra de doscientos euros.
Vecino: ¡Doscientos euros! No te preocupes, que ya protestaré en la próxima reunión.`,
gloss:[['el portal','entrance hall (building)'],['el descansillo','landing (on stairs)'],['el sótano','basement'],['la cuota','fee, contribution'],['señalar','to point at, to single out']],
qs:['m|Las bolsas de basura hay que bajarlas…|al contenedor por la noche~al portal~al sótano','m|Las bicis se pueden dejar en el descansillo.|Falso~Verdadero','m|La llave del cuarto de bicis la tiene…|el portero~la presidenta~Emma','m|No se puede poner la lavadora después de las…|diez de la noche~ocho de la tarde~doce de la noche','g|La cuota extra es de ___ euros.|doscientos/200','m|Manolo está contento con la cuota.|Falso~Verdadero']},
{id:'l-b1-08',label:'B1·8',title:'Me dijo que…',titleEn:'She told me that…',unit:'b1-10',task:'Emma le cuenta a Ainhoa una conversación con Carmen. ¿Qué dijo Carmen?',v:{'Ainhoa':'f2','Emma':'f'},
d:`Ainhoa: ¿Qué tal la reunión con tu jefa?
Emma: Bien, pero muy rara. Carmen me dijo que estaba muy contenta con mi trabajo.
Ainhoa: ¡Eso es genial!
Emma: Sí, pero luego me preguntó si me gustaría dirigir un proyecto nuevo en Valencia.
Ainhoa: ¿En Valencia? ¿Tendrías que mudarte?
Emma: No exactamente. Me explicó que tendría que ir dos días por semana y que la empresa pagaría el hotel y el tren.
Ainhoa: ¿Y qué le dijiste?
Emma: Le dije que me lo pensaría. Me pidió que le contestara antes del viernes.
Ainhoa: ¿Y te subirían el sueldo?
Emma: Me aseguró que sí, pero no me dijo cuánto.
Ainhoa: Pues yo que tú, le preguntaría eso antes de decidir nada.
Emma: Eso mismo pensaba yo.`,
gloss:[['dirigir','to manage, to lead'],['subir el sueldo','to raise the salary'],['asegurar','to assure'],['eso mismo','exactly that']],
qs:['m|Carmen dijo que estaba contenta con el trabajo de Emma.|Verdadero~Falso','m|El proyecto nuevo es en…|Valencia~Barcelona~Bilbao','m|Emma tendría que ir…|dos días por semana~todos los días~una vez al mes','m|La empresa pagaría…|el hotel y el tren~solo el tren~nada','m|Carmen le pidió que contestara antes del…|viernes~lunes~fin de mes','m|Carmen le dijo cuánto le subirían el sueldo.|Falso~Verdadero']}
]});

{id:'l-b2-01',label:'B2·1',title:'Si hubiera sabido…',titleEn:'If I had known…',unit:'b2-02',task:'Dos amigos hablan de decisiones del pasado. ¿Qué habrían hecho de otra manera?',v:{'Pablo':'m','Ainhoa':'f2'},
d:`Pablo: ¿Tú te arrepientes de algo, Ainhoa? Me refiero a decisiones importantes.
Ainhoa: Hombre, de algunas cosas sí. Si hubiera sabido lo que sé ahora, habría estudiado Fisioterapia antes, en vez de perder dos años en Derecho.
Pablo: Pero si no hubieras estudiado Derecho, no habrías conocido a tus mejores amigas.
Ainhoa: También es verdad. ¿Y tú?
Pablo: Yo… si pudiera volver atrás, no me habría comprado el piso en 2007. Lo pagué carísimo y justo después llegó la crisis.
Ainhoa: Uf, eso le pasó a mucha gente.
Pablo: Ya. Si hubiéramos esperado dos o tres años, ahora tendríamos la hipoteca pagada.
Ainhoa: Bueno, pero no tenías una bola de cristal. Además, si no hubieras vivido en ese barrio, no habrías conocido a tu mujer.
Pablo: Visto así… a lo mejor fue la mejor decisión de mi vida.
Ainhoa: ¿Lo ves? Todo pasa por algo.`,
gloss:[['arrepentirse de','to regret'],['volver atrás','to go back in time'],['la hipoteca','mortgage'],['la bola de cristal','crystal ball'],['todo pasa por algo','everything happens for a reason']],
qs:['m|Ainhoa estudió primero…|Derecho~Medicina~Fisioterapia','m|Ainhoa perdió dos años en una carrera que no le gustaba.|Verdadero~Falso','m|Pablo compró el piso en…|2007~2010~2017','m|Si Pablo hubiera esperado, ahora…|tendría la hipoteca pagada~viviría en otro país~no tendría piso','m|Pablo conoció a su mujer en el barrio del piso.|Verdadero~Falso','m|La conclusión de Ainhoa es que…|todo pasa por algo~Pablo se equivocó~hay que esperar siempre']},
{id:'l-b2-02',label:'B2·2',title:'Noticias de la mañana',titleEn:'Morning news',unit:'b2-04',task:'Boletín informativo: anote las tres noticias principales.',v:{'Locutora':'f2','Locutor':'m'},
d:`Locutora: Buenos días, son las ocho. Abrimos el informativo con la huelga de Renfe: más de doscientos trenes de Cercanías han sido cancelados esta mañana en Madrid y Barcelona. Según fuentes sindicales, el seguimiento ha sido del ochenta por ciento. Se recomienda a los viajeros que consulten la web antes de salir de casa.
Locutor: En economía, los precios del alquiler se han disparado en el último año. Según un informe publicado ayer, en las grandes ciudades el alquiler medio ha subido un doce por ciento. De ahí que cada vez más jóvenes retrasen su independencia hasta pasados los treinta.
Locutora: Y en cultura, el Museo del Prado inaugura hoy una exposición dedicada a Goya, con más de cien obras, algunas de las cuales nunca habían sido mostradas al público. La muestra podrá visitarse hasta el mes de marzo.
Locutor: El tiempo: cielos despejados en casi toda la península, con temperaturas en ascenso. Solo en Galicia se esperan lluvias débiles por la tarde.`,
gloss:[['la huelga','strike'],['el seguimiento','turnout (of a strike)'],['dispararse','to soar'],['retrasar','to delay'],['la muestra','exhibition'],['despejado','clear (sky)']],
qs:['m|Los trenes cancelados son de…|Cercanías~AVE~metro','g|El seguimiento de la huelga ha sido del ___ por ciento.|ochenta/80','m|El alquiler medio ha subido un…|doce por ciento~dos por ciento~veinte por ciento','m|Muchos jóvenes retrasan su independencia por los precios.|Verdadero~Falso','m|La exposición del Prado está dedicada a…|Goya~Velázquez~Picasso','m|Se esperan lluvias en…|Galicia~Andalucía~Madrid']},
{id:'l-b2-03',label:'B2·3',title:'¡Haberlo dicho antes!',titleEn:'You should have said so!',unit:'b2-03',task:'Una pareja discute por las vacaciones. ¿Qué se reprochan?',v:{'Marta':'f2','Dani':'m2'},
d:`Marta: Dani, ¿has reservado ya el hotel de Menorca?
Dani: Eh… no. Pensaba hacerlo hoy.
Marta: ¿Hoy? ¡Pero si te lo dije hace dos semanas! Ahora ya estará todo lleno o carísimo.
Dani: Bueno, tampoco es para tanto. Algo encontraremos.
Marta: Es que siempre te pasa lo mismo. Deberías haberlo reservado en cuanto decidimos las fechas.
Dani: Vale, vale, tienes razón. Pero tú también podrías haberlo hecho, ¿no?
Marta: Me dijiste que te encargabas tú.
Dani: Ya, ya… Mira, acabo de ver una casa rural cerca de Ciutadella, con piscina, y está libre.
Marta: ¿Cuánto cuesta?
Dani: Un poco más de lo que queríamos gastar, pero tiene muy buena pinta.
Marta: Pues resérvala ahora mismo, antes de que se la lleve otro.
Dani: Hecho. Por cierto, a mí nunca me ha gustado Menorca en agosto, hay demasiada gente.
Marta: ¡Pues haberlo dicho antes!`,
gloss:[['no es para tanto','it’s not that big a deal'],['encargarse de','to take care of'],['tener buena pinta','to look good'],['¡Haberlo dicho antes!','you should have said so earlier!']],
qs:['m|Van a ir de vacaciones a…|Menorca~Mallorca~Ibiza','m|Dani ya ha reservado el hotel.|Falso~Verdadero','m|Marta se lo dijo a Dani hace…|dos semanas~dos días~dos meses','m|Dani dice que Marta también podría haberlo reservado.|Verdadero~Falso','m|Al final encuentran…|una casa rural con piscina~un hotel barato~un apartamento en la playa','m|«¡Haberlo dicho antes!» es un…|reproche~elogio~saludo']},
{id:'l-b2-04',label:'B2·4',title:'Se me olvidó por completo',titleEn:'It completely slipped my mind',unit:'b2-08',task:'Un día de imprevistos. ¿Qué le pasó a Javier?',v:{'Javier':'m','Emma':'f'},
d:`Emma: ¡Javier! ¿Qué haces aquí? ¿No estabas en Barcelona?
Javier: Calla, calla, vaya semana llevo. Vine el jueves para el cumpleaños de mi madre.
Emma: ¡Qué bien! ¿Y qué tal la fiesta?
Javier: Un desastre. Primero, se me olvidó el regalo en el tren. Lo dejé en la rejilla y se me fue por completo.
Emma: ¡No! ¿Y lo recuperaste?
Javier: Todavía no. Luego, al llegar a casa de mi madre, se me cayó la tarta en el portal.
Emma: ¡Ay, pobre!
Javier: Y para rematar, se nos estropeó el horno a mitad de la cena, con el cordero dentro.
Emma: ¿Y qué hicisteis?
Javier: Pues pedimos pizzas. Mi madre, en vez de enfadarse, se partía de risa. Dice que ha sido el cumpleaños más divertido de su vida.
Emma: Tu madre es un sol.
Javier: Lo es. Pero esta tarde voy a objetos perdidos de Atocha, a ver si alguien ha entregado el regalo.`,
gloss:[['¡Calla, calla!','don’t even ask!'],['la rejilla','luggage rack'],['para rematar','to top it all'],['estropearse','to break down'],['partirse de risa','to crack up laughing'],['ser un sol','to be a sweetheart']],
qs:['m|Javier vino de Barcelona para…|el cumpleaños de su madre~una reunión~una boda','m|Javier olvidó el regalo en…|el tren~el taxi~el portal','m|La tarta se le cayó en…|el portal~la cocina~la calle','m|Se estropeó…|el horno~la nevera~el coche','m|Al final cenaron…|pizzas~cordero~tarta','m|La madre de Javier se enfadó mucho.|Falso~Verdadero']},
{id:'l-b2-05',label:'B2·5',title:'Debate: ¿teletrabajo sí o no?',titleEn:'Debate: remote working, yes or no?',unit:'b2-06',task:'Escuche los argumentos a favor y en contra del teletrabajo. ¿Qué concesiones hace cada uno?',v:{'Moderador':'m2','Elena':'f2','Raúl':'m'},
d:`Moderador: Elena, usted es partidaria del teletrabajo. ¿Por qué?
Elena: Porque mejora la calidad de vida. Por mucho que se hable de productividad, lo cierto es que la gente que teletrabaja ahorra hasta dos horas de transporte al día. Y eso se nota en la salud.
Moderador: Raúl, usted no está de acuerdo.
Raúl: No del todo. Aunque reconozco que tiene ventajas, creo que se pierde algo fundamental: el contacto humano. Las mejores ideas de mi empresa han surgido tomando un café, no en una videollamada.
Elena: Ya, pero eso no significa que haya que ir a la oficina cinco días a la semana.
Raúl: En eso le doy la razón. Un modelo mixto, de dos o tres días, me parece razonable.
Elena: Además, dado que muchas oficinas están en el centro, el teletrabajo ayudaría a reducir el tráfico y la contaminación.
Raúl: Siempre que la vivienda en las afueras sea asequible, claro. Si no, de ahí que la gente siga viviendo en el centro.
Moderador: Parece que, a pesar de las diferencias, coinciden en un modelo híbrido.
Elena: Con matices, pero sí.`,
gloss:[['ser partidario de','to be in favour of'],['surgir','to arise'],['dar la razón','to admit someone is right'],['las afueras','outskirts'],['asequible','affordable'],['coincidir en','to agree on']],
qs:['m|Elena está a favor del teletrabajo.|Verdadero~Falso','m|Según Elena, se ahorran hasta…|dos horas de transporte al día~dos días a la semana~doscientos euros','m|Para Raúl, se pierde…|el contacto humano~dinero~productividad','m|Raúl acepta un modelo mixto de…|dos o tres días~un día~cinco días','m|Elena dice que el teletrabajo reduciría…|el tráfico y la contaminación~los sueldos~el paro','m|Al final coinciden en…|un modelo híbrido~el teletrabajo total~la oficina todos los días']},
{id:'l-b2-06',label:'B2·6',title:'En plan, ¡qué fuerte!',titleEn:'Like, no way!',unit:'b2-10',task:'Dos jóvenes madrileños hablan muy rápido y en registro coloquial. ¿De qué hablan? Busque las expresiones coloquiales.',v:{'Sara':'f2','Álex':'m2'},
d:`Sara: Tío, ¿te has enterado de lo de Irene?
Álex: No, ¿qué ha pasado?
Sara: Que lo ha dejado con Mario. En plan, de un día para otro.
Álex: ¡Anda ya! Si estaban súper bien. Flipo.
Sara: Ya, pero parece que él no se ponía las pilas con nada, ni con el curro ni con el piso. Y ella estaba hasta las narices.
Álex: Hombre, normal. ¿Y ella qué tal está?
Sara: Pues mira, bastante bien. Dice que está como nueva. Se va un mes a Lisboa a currar desde allí.
Álex: ¡Qué guay! Me mola esa actitud.
Sara: Y lo mejor: dice que si alguien le echa una mano con la mudanza, invita a cañas.
Álex: Eso es pan comido. Cuenta conmigo.
Sara: Venga, pues el sábado a las diez en su casa. ¡No me falles!
Álex: Que no, que no. Allí estaré.`,

window.LISTEN.pron=[
{id:'p-vocales',title:'Las vocales',titleEn:'The vowels',focus:'las cinco vocales cortas y puras',focusEn:'the five short, pure vowels',
intro:'<p>El español tiene solo cinco vocales: <b>a, e, i, o, u</b>. Son cortas, claras y no cambian: no diga «nou» sino <b>no</b>. Todas se pronuncian, también en sílabas átonas.</p>',
introEn:'<p>Spanish has only five vowels: <b>a, e, i, o, u</b>. They are short, clear and do not glide: don’t say “noh-oo” but a short <b>no</b>. Every vowel is pronounced, even in unstressed syllables.</p>',
tracks:[{id:'pr-voc-1',title:'Vocales solas y en palabras',text:'a, e, i, o, u. Casa, mesa, sí, todo, tú. Mamá, bebé, dinero, solo, uno. Patata, tomate, chocolate, plátano.'},{id:'pr-voc-2',title:'Frases',text:'Ana toma té con leche. Pepe tiene diez euros. Lola y Paco son de Toledo. Susana usa una bufanda azul.'}],

{id:'p-r',title:'r y rr',titleEn:'r and rr',focus:'la diferencia entre pero y perro',focusEn:'the difference between pero and perro',
intro:'<p><b>r</b> entre vocales = un solo golpe de lengua (como la «tt» de «butter» en inglés americano): <i>pero, caro, hora</i>. <b>rr</b>, y la <b>r</b> al principio de palabra o después de n, l, s = vibración múltiple: <i>perro, Roma, Enrique, alrededor</i>.</p>',
introEn:'<p><b>r</b> between vowels = a single tap of the tongue (like the “tt” in American “butter”): <i>pero, caro, hora</i>. <b>rr</b>, and <b>r</b> at the start of a word or after n, l, s = a rolled trill: <i>perro, Roma, Enrique, alrededor</i>.</p>',
tracks:[{id:'pr-r-1',title:'Pares mínimos',text:'pero, perro. caro, carro. coro, corro. para, parra. cero, cerro.'},{id:'pr-r-2',title:'Trabalenguas',text:'Erre con erre, cigarro; erre con erre, barril. Rápido ruedan los carros cargados de azúcar del ferrocarril.'}],
words:['pero','perro','caro','carro','Roma','Enrique','arroz','hablar','ferrocarril','rápido']},
{id:'p-zc',title:'c, z, s',titleEn:'c, z, s',focus:'el sonido [θ] del centro y norte de España',focusEn:'the [θ] sound of central and northern Spain',
intro:'<p>En la mayor parte de España, <b>z</b> y <b>c</b> + e, i se pronuncian [θ], como la «th» inglesa de <i>think</i>: <i>cerveza, cine, Zaragoza</i>. La <b>s</b> es siempre [s]: <i>casa, sol</i>. Así se distinguen <i>casa</i> (house) y <i>caza</i> (hunting). En Andalucía y Canarias muchos usan [s] para todo (seseo): también es correcto.</p>',
introEn:'<p>In most of Spain, <b>z</b> and <b>c</b> + e, i are pronounced [θ], like English “th” in <i>think</i>: <i>cerveza, cine, Zaragoza</i>. <b>s</b> is always [s]: <i>casa, sol</i>. That distinguishes <i>casa</i> (house) from <i>caza</i> (hunting). In Andalusia and the Canaries many people use [s] for both (seseo): that’s correct too.</p>',
tracks:[{id:'pr-z-1',title:'Palabras',text:'cerveza, cine, gracias, cien, Zaragoza, zapato, azul, plaza. casa, caza. siento, ciento. sien, cien.'},{id:'pr-z-2',title:'Frases',text:'Cecilia cena cerca de la plaza. En Zaragoza hace mucho sol en septiembre. Una cerveza y un zumo, por favor. ¡Muchas gracias!'}],
words:['cerveza','gracias','Zaragoza','cine','plaza','casa','caza','azúcar','cien','zapato']},
{id:'p-jg',title:'j y g',titleEn:'j and g',focus:'la jota [x] y la g suave',focusEn:'the throaty jota [x] and the soft g',
intro:'<p><b>j</b>, y <b>g</b> + e, i = [x], un sonido fuerte en la garganta (como el escocés <i>loch</i>): <i>jamón, José, gente, Gijón</i>. <b>g</b> + a, o, u y <b>gu</b> + e, i = [g]: <i>gato, guerra, guitarra</i>. <b>gü</b> = se pronuncia la u: <i>pingüino, vergüenza</i>.</p>',
introEn:'<p><b>j</b>, and <b>g</b> + e, i = [x], a strong sound in the throat (like Scottish <i>loch</i>): <i>jamón, José, gente, Gijón</i>. <b>g</b> + a, o, u and <b>gu</b> + e, i = [g]: <i>gato, guerra, guitarra</i>. <b>gü</b> = the u is pronounced: <i>pingüino, vergüenza</i>.</p>',
tracks:[{id:'pr-j-1',title:'Palabras',text:'jamón, ajo, julio, José, jefe. gente, general, Gijón, girar. gato, gordo, guerra, guitarra, pingüino.'},{id:'pr-j-2',title:'Frases',text:'El jefe de Jorge juega al ajedrez en julio. La gente de Gijón es muy generosa. Me da vergüenza tocar la guitarra.'}],
words:['jamón','ajo','julio','gente','Gijón','guerra','guitarra','vergüenza','jefe','girar']},
{id:'p-llñ',title:'ll, y, ñ, ch',titleEn:'ll, y, ñ, ch',focus:'los sonidos palatales',focusEn:'the palatal sounds',
intro:'<p><b>ll</b> e <b>y</b> suenan casi igual, como la «y» de <i>yes</i> (en muchas zonas un poco más fuerte): <i>calle, llamar, yo, playa</i>. <b>ñ</b> = «ny» de <i>canyon</i>: <i>España, año, mañana</i>. <b>ch</b> = como en inglés <i>church</i>: <i>chico, churros</i>.</p>',
introEn:'<p><b>ll</b> and <b>y</b> sound almost the same, like the “y” in <i>yes</i> (a bit stronger in many areas): <i>calle, llamar, yo, playa</i>. <b>ñ</b> = “ny” in <i>canyon</i>: <i>España, año, mañana</i>. <b>ch</b> = like English <i>church</i>: <i>chico, churros</i>.</p>',
tracks:[{id:'pr-ll-1',title:'Palabras',text:'calle, llave, llamar, lluvia, yo, playa, ayer. España, año, mañana, niño, señora. chico, noche, churros, leche.'},{id:'pr-ll-2',title:'Frases',text:'Mañana por la mañana la niña va a la playa. Me llamo Yolanda y vivo en la calle Mayor. Churros con chocolate por la noche.'}],
words:['calle','llamar','yo','playa','España','año','mañana','señora','chico','churros']},
{id:'p-bvd',title:'b, v, d suaves',titleEn:'soft b, v, d',focus:'b = v y la d suave entre vocales',focusEn:'b = v and the soft d between vowels',
intro:'<p><b>b</b> y <b>v</b> suenan igual. Al principio de la frase o tras m/n son como la «b» inglesa (<i>vino, bien, enviar</i>); entre vocales los labios casi no se tocan (<i>la uva, el abuelo</i>). La <b>d</b> entre vocales es suave, como la «th» de <i>this</i>: <i>cansado, todo, Madrid</i>. En el habla relajada se oye «cansao».</p>',
introEn:'<p><b>b</b> and <b>v</b> sound the same. At the start of a phrase or after m/n they are like English “b” (<i>vino, bien, enviar</i>); between vowels the lips barely touch (<i>la uva, el abuelo</i>). <b>d</b> between vowels is soft, like “th” in <i>this</i>: <i>cansado, todo, Madrid</i>. In relaxed speech you hear «cansao».</p>',
tracks:[{id:'pr-bvd-1',title:'Palabras',text:'vino, bien, Valencia, Barcelona. la uva, el abuelo, la verdad, a ver. dedo, todo, nada, cansado, Madrid, verdad, usted.'},{id:'pr-bvd-2',title:'Frases',text:'Vivo en Valencia, pero voy a Barcelona. ¿De verdad? Estoy muy cansado, no he hecho nada en todo el día.'}],
words:['vino','Valencia','abuelo','verdad','cansado','todo','Madrid','usted','beber','vivir']},
{id:'p-acento',title:'El acento y la tilde',titleEn:'Stress & accent marks',focus:'la sílaba fuerte de cada palabra',focusEn:'the stressed syllable of each word',
intro:'<p>Una sílaba de cada palabra es más fuerte. Palabras terminadas en vocal, -n o -s: penúltima sílaba (<i>CA-sa, HA-blan</i>). En otra consonante: última (<i>ha-BLAR, ciu-DAD</i>). Si no, lleva <b>tilde</b> (<i>ca-FÉ, ár-bol, TE-lé-fo-no</i>). ¡El acento cambia el significado!: <i>hablo / habló, papa / papá, término / termino / terminó</i>.</p>',
introEn:'<p>One syllable in every word is stronger. Words ending in a vowel, -n or -s: second-to-last syllable (<i>CA-sa, HA-blan</i>). In another consonant: last (<i>ha-BLAR, ciu-DAD</i>). Otherwise it has a <b>tilde</b> (<i>ca-FÉ, ár-bol, TE-lé-fo-no</i>). Stress changes meaning!: <i>hablo / habló, papa / papá, término / termino / terminó</i>.</p>',
tracks:[{id:'pr-ac-1',title:'Pares que cambian de significado',text:'hablo, habló. papa, papá. esta, está. término, termino, terminó. práctico, practico, practicó.'},{id:'pr-ac-2',title:'Palabras con tilde',text:'café, sofá, inglés, canción, árbol, fácil, lápiz, teléfono, música, sábado, miércoles, rápido.'}],
words:['hablo','habló','papa','papá','esta','está','teléfono','sábado','canción','fácil']},
{id:'p-entonacion',title:'Entonación y enlace',titleEn:'Intonation & linking',focus:'la melodía de preguntas y la unión de palabras',focusEn:'the melody of questions and how words link',
intro:'<p>Las preguntas de sí/no suben al final: <i>¿Vienes?↗</i>. Las preguntas con palabra interrogativa bajan: <i>¿Dónde vives?↘</i>. En el habla, las palabras se unen: consonante + vocal (<i>los_amigos</i> → «lo-sa-mi-gos») y vocal + vocal (<i>¿Qué_es_esto?</i> → «qué-ses-to»). Por eso al principio parece que los españoles hablan muy rápido.</p>',
introEn:'<p>Yes/no questions rise at the end: <i>¿Vienes?↗</i>. Questions with a question word fall: <i>¿Dónde vives?↘</i>. In speech, words link up: consonant + vowel (<i>los_amigos</i> → “lo-sa-mi-gos”) and vowel + vowel (<i>¿Qué_es_esto?</i> → “qué-ses-to”). That’s why Spanish sounds so fast at first.</p>',
tracks:[{id:'pr-en-1',title:'Preguntas',text:'¿Vienes mañana? ¿Tienes hambre? ¿Hablas español? ¿Dónde vives? ¿Cómo te llamas? ¿Qué quieres tomar?'},{id:'pr-en-2',title:'Enlace de palabras',text:'Los amigos de Elena. ¿Qué es esto? Mis hermanos están en el hotel. Voy a ir a Alicante. ¿Dónde está el aeropuerto?'}],
words:['¿Vienes mañana?','¿Dónde vives?','¿Qué es esto?','los amigos','Voy a ir a Alicante','¿Cómo te llamas?']}
];

{id:'r-a1-1',level:'A1',title:'Un mensaje de Emma',titleEn:'A message from Emma',type:'Mensaje (informal)',typeEn:'Message (informal)',time:6,
text:`¡Hola, Mamá!

¿Qué tal? Yo estoy muy bien. Madrid es una ciudad grande, bonita y muy alegre. Hace sol todos los días.

Mi trabajo está en el centro. Mis compañeros son muy simpáticos. Javier es de Madrid y Lucas es de Sevilla. Carmen, la jefa, es de Valencia.

Ahora vivo en un hotel, pero busco un piso. Los pisos en Madrid son caros. Javier vive en Lavapiés, un barrio con muchos bares y un mercado.

Aquí la gente come a las dos y cena a las diez de la noche. ¡Es muy tarde para mí!

Un beso muy fuerte,
Emma`,
en:`Hi, Mum!

How are you? I’m very well. Madrid is a big, pretty and very lively city. It’s sunny every day.

My work is in the centre. My colleagues are very nice. Javier is from Madrid and Lucas is from Seville. Carmen, the boss, is from Valencia.

Now I live in a hotel, but I’m looking for a flat. Flats in Madrid are expensive. Javier lives in Lavapiés, a neighbourhood with lots of bars and a market.

Here people have lunch at two and dinner at ten at night. It’s very late for me!

Lots of love,
Emma`,

{id:'r-a1-4',level:'A1',title:'Información turística: Segovia',titleEn:'Tourist information: Segovia',type:'Folleto',typeEn:'Leaflet',time:7,
text:`SEGOVIA, A 30 MINUTOS DE MADRID

Segovia es una ciudad pequeña y muy bonita. Está a 90 kilómetros de Madrid. En AVE se tarda solo 30 minutos.

¿Qué ver?
– El Acueducto romano: tiene casi 2000 años y 167 arcos. Es el símbolo de la ciudad.
– La Catedral: es del siglo XVI y está en la Plaza Mayor.
– El Alcázar: es un castillo precioso, con vistas al campo.

¿Qué comer?
El cochinillo asado es el plato típico. También es famoso el ponche segoviano, un postre con mazapán.

Oficina de Turismo: Plaza del Azoguejo, 1. Abierta todos los días de 10:00 a 18:30.`,
en:`SEGOVIA, 30 MINUTES FROM MADRID

Segovia is a small and very pretty city. It is 90 kilometres from Madrid. By high-speed train it only takes 30 minutes.

What to see?
– The Roman aqueduct: it is almost 2,000 years old and has 167 arches. It is the symbol of the city.
– The Cathedral: it is from the 16th century and it is in the Plaza Mayor.
– The Alcázar: it is a beautiful castle, with views over the countryside.

What to eat?
Roast suckling pig is the typical dish. Also famous is ponche segoviano, a dessert with marzipan.

Tourist office: Plaza del Azoguejo, 1. Open every day from 10:00 to 18:30.`,
gloss:[['el arco','arch'],['el siglo','century'],['el castillo','castle'],['el mazapán','marzipan']],

{id:'r-a2-1',level:'A2',title:'Mi primer año en España',titleEn:'My first year in Spain',type:'Blog personal',typeEn:'Personal blog',time:8,
text:`Hace un año llegué a Valencia con dos maletas y muy poco español. Hoy quiero contaros cómo ha sido mi primer año.

Al principio todo fue difícil. No entendía a la gente, porque hablaban muy rápido, y no sabía hacer cosas tan simples como pedir cita en el médico. El primer mes viví en un piso compartido con tres estudiantes. Era un poco ruidoso, pero aprendí muchísimo con ellos.

En febrero encontré trabajo en una escuela de idiomas y me mudé a un piso pequeño cerca del mar. Desde entonces, todas las mañanas paseo por la playa antes de trabajar. ¡Es mi momento favorito del día!

Lo que más me ha costado es el horario. En mi país cenaba a las seis; aquí, a las nueve y media… y a veces más tarde. También me sorprendió el ruido: los españoles hablan alto y la calle siempre está llena de vida.

Lo que más me gusta es la gente: son abiertos, generosos y siempre te invitan a algo. Este año he hecho buenos amigos y he aprendido a cocinar paella (¡la de verdad, con pollo y conejo!).

¿Mi consejo? Habla con todo el mundo, aunque cometas errores. Nadie se ríe de ti; al contrario, te ayudan.`,
en:`A year ago I arrived in Valencia with two suitcases and very little Spanish. Today I want to tell you what my first year has been like.

At first everything was difficult. I didn’t understand people, because they spoke very fast, and I didn’t know how to do things as simple as booking a doctor’s appointment. The first month I lived in a shared flat with three students. It was a bit noisy, but I learnt a lot with them.

In February I found a job in a language school and moved to a small flat near the sea. Since then, every morning I walk along the beach before work. It’s my favourite moment of the day!

What I have found hardest is the timetable. In my country I had dinner at six; here, at half past nine… and sometimes later. I was also surprised by the noise: Spaniards speak loudly and the street is always full of life.

What I like most is the people: they are open, generous and always treat you to something. This year I’ve made good friends and learnt to cook paella (the real one, with chicken and rabbit!).

My advice? Talk to everyone, even if you make mistakes. Nobody laughs at you; on the contrary, they help you.`,
gloss:[['costar (algo a alguien)','to be hard (for someone)'],['ruidoso','noisy'],['mudarse','to move (house)'],['al contrario','on the contrary']],
qs:['m|El autor llegó a Valencia hace…|un año~dos años~seis meses','m|Al principio vivió…|en un piso compartido~en un hotel~con una familia','m|Encontró trabajo en…|una escuela de idiomas~un restaurante~un hospital','m|Lo que más le ha costado es…|el horario~la comida~el clima','m|La paella de verdad lleva pollo y conejo.|Verdadero~Falso','m|Su consejo es…|hablar con todo el mundo~no cometer errores~estudiar mucha gramática']},

{id:'r-a2-3',level:'A2',title:'Las fiestas de España',titleEn:'Spain’s festivals',type:'Artículo divulgativo',typeEn:'Informative article',time:9,
text:`En España hay fiestas durante todo el año, y cada pueblo tiene las suyas.

En enero, el día 6, se celebran los Reyes Magos. La noche anterior, los niños dejan sus zapatos en la ventana y los Reyes les traen regalos. Ese día se come el roscón de Reyes, un dulce redondo con una sorpresa dentro.

En marzo, Valencia celebra las Fallas: durante cinco días hay música, fuegos artificiales y enormes figuras de cartón que se queman la noche del 19.

En primavera llega la Semana Santa, con procesiones por las calles, sobre todo en Andalucía y Castilla. Poco después, Sevilla celebra la Feria de Abril: la gente baila sevillanas y se viste con trajes de flamenca.

En julio, Pamplona vive los Sanfermines, famosos en todo el mundo por los encierros de toros. Y en agosto, en Buñol, miles de personas se tiran tomates en la Tomatina.

Por último, en Nochevieja, el 31 de diciembre, los españoles toman doce uvas con las doce campanadas de medianoche. Dicen que trae buena suerte para el año nuevo.`,
en:`In Spain there are festivals all year round, and every village has its own.

In January, on the 6th, the Three Kings are celebrated. The night before, children leave their shoes by the window and the Kings bring them presents. That day people eat roscón de Reyes, a round sweet bread with a surprise inside.

In March, Valencia celebrates the Fallas: for five days there is music, fireworks and enormous cardboard figures that are burnt on the night of the 19th.

In spring comes Holy Week, with processions in the streets, especially in Andalusia and Castile. Shortly afterwards, Seville celebrates the April Fair: people dance sevillanas and wear flamenco dresses.

In July, Pamplona has the San Fermín festival, famous worldwide for the bull runs. And in August, in Buñol, thousands of people throw tomatoes at each other in the Tomatina.

Finally, on New Year’s Eve, 31 December, Spaniards eat twelve grapes with the twelve chimes of midnight. They say it brings good luck for the new year.`,

{id:'r-b1-2',level:'B1',title:'El Camino de Santiago',titleEn:'The Camino de Santiago',type:'Reportaje',typeEn:'Feature article',time:10,
text:`Cada año, más de 400.000 personas de todo el mundo recorren a pie, en bicicleta o incluso a caballo alguna de las rutas del Camino de Santiago, que terminan en la catedral de Santiago de Compostela, en Galicia.

Aunque el Camino nació en la Edad Media como peregrinación religiosa, hoy los motivos son muy variados. «Yo no soy creyente, pero necesitaba desconectar después de un año muy duro», explica Laura, una diseñadora de Barcelona de 34 años. «Lo que más me sorprendió fue la gente: el tercer día ya tenía amigos de cinco países».

La ruta más popular es el Camino Francés, que empieza en Saint-Jean-Pied-de-Port, en Francia, y tiene unos 800 kilómetros. Para conseguir la Compostela, el certificado oficial, hay que hacer al menos los últimos 100 kilómetros a pie o los últimos 200 en bicicleta.

Los peregrinos duermen en albergues, donde por entre 10 y 15 euros consiguen una cama, una ducha y, sobre todo, compañía. Los expertos recomiendan no llevar una mochila de más del diez por ciento del peso corporal y elegir bien el calzado: las ampollas son el enemigo número uno.

«Si tuviera que dar un consejo», dice Laura, «sería este: no tengas prisa. El Camino no es una carrera».`,

{id:'r-b1-3',level:'B1',title:'Foro: ¿vale la pena aprender catalán?',titleEn:'Forum: is it worth learning Catalan?',type:'Foro de internet',typeEn:'Internet forum',time:9,
text:`MarkInBCN: Hola a todos. Llevo seis meses viviendo en Barcelona y hablo español bastante bien. Mi pregunta es: ¿vale la pena aprender catalán o con el castellano es suficiente?

JaviMadrid: Yo viví cuatro años en Barcelona sin hablar catalán y no tuve ningún problema. Es verdad que en algunas reuniones se hablaba catalán, pero cuando veían que yo no lo entendía, cambiaban al castellano sin problema.

Sophie_lyon: Yo lo aprendí y no me arrepiento. Como sé francés, me resultó bastante fácil. Además, hay cursos gratuitos del Consorcio para la Normalización Lingüística. Lo que más me gustó es que ahora entiendo las conversaciones de mis vecinos… ¡y los chistes!

{id:'r-b1-4',level:'B1',title:'Reclamación a una compañía aérea',titleEn:'Complaint to an airline',type:'Correo formal',typeEn:'Formal email',time:8,
text:`Asunto: Reclamación – vuelo IB3166 Madrid–Edimburgo, 12 de agosto

Estimados señores:

Me dirijo a ustedes para presentar una reclamación por los problemas que tuve en el vuelo IB3166 del pasado 12 de agosto.

El vuelo tenía prevista la salida a las 10:15, pero despegó con más de cinco horas de retraso, sin que nadie nos diera una explicación clara. Durante la espera, el personal de tierra solo nos ofreció un vale de cinco euros para la cafetería, que no era suficiente ni para un bocadillo.

Además, al llegar a Edimburgo, mi maleta no apareció. Tardó cuatro días en llegar a mi domicilio y, cuando por fin me la entregaron, una de las ruedas estaba rota.

Según el Reglamento europeo 261/2004, en caso de un retraso superior a tres horas tengo derecho a una compensación. Por ello, les solicito que me abonen la cantidad correspondiente, así como los gastos de reparación de la maleta, cuya factura adjunto.

Quedo a la espera de su respuesta.

Atentamente,
Emma Campbell`,

{id:'r-b2-1',level:'B2',title:'La España vaciada',titleEn:'Emptied Spain',type:'Artículo de opinión',typeEn:'Opinion piece',time:12,
text:`Hay pueblos en Soria, Teruel o Cuenca donde ya no queda ni un solo niño. Se cierran las escuelas, después el consultorio médico, luego el último bar, y con él desaparece el lugar donde los vecinos se encontraban cada tarde. A este fenómeno se le ha llamado «la España vaciada»: más de la mitad de los municipios españoles corren el riesgo de desaparecer en las próximas décadas.

Las causas son conocidas. Durante los años sesenta y setenta, millones de personas emigraron del campo a las ciudades en busca de trabajo. Quienes se quedaron envejecieron, y sus hijos, una vez terminados los estudios, rara vez volvieron. A ello se suma la falta de servicios: si para ir al médico hay que recorrer cuarenta kilómetros y no hay transporte público, ¿quién va a querer instalarse allí?

Sin embargo, algo está cambiando. La expansión del teletrabajo ha llevado a algunos profesionales a mudarse a zonas rurales, atraídos por la tranquilidad, la naturaleza y unas viviendas muchísimo más baratas. Algunos ayuntamientos ofrecen casas por un alquiler simbólico a familias con hijos, con tal de que se comprometan a quedarse varios años.

Aun así, sería ingenuo pensar que el problema se resolverá solo. Por mucho que se hable de repoblar el campo, sin una buena conexión a internet, sin carreteras decentes y sin escuelas, cualquier iniciativa estará condenada al fracaso. La pregunta no es si el campo tiene futuro, sino si estamos dispuestos a invertir en él.`,

{id:'r-b2-2',level:'B2',title:'Elogio de la sobremesa',titleEn:'In praise of the sobremesa',type:'Columna',typeEn:'Newspaper column',time:10,
text:`Los extranjeros que visitan España suelen sorprenderse de dos cosas: de lo tarde que cenamos y de lo mucho que tardamos en levantarnos de la mesa. Esa costumbre tiene nombre propio, y no existe en casi ningún otro idioma: la sobremesa.

La sobremesa es ese tiempo, sin duración fija, que transcurre entre el café y el momento en que alguien dice, con poca convicción, «bueno, habrá que ir yéndose». Puede durar veinte minutos o cuatro horas. En ella se arregla el mundo, se recuerdan anécdotas que todos conocen de memoria y se discute de fútbol o de política con una pasión que asustaría a cualquier observador nórdico.

Hay quien la considera una pérdida de tiempo, un lujo incompatible con la productividad moderna. Yo creo exactamente lo contrario. Si hubiéramos dedicado menos horas a las pantallas y más a la sobremesa, quizá sabríamos escucharnos mejor. En la sobremesa nadie mira el reloj, y eso, hoy en día, es casi un acto de rebeldía.

Así que, la próxima vez que un amigo extranjero le pregunte por qué seguimos sentados cuando ya se ha acabado el postre, no le dé explicaciones: invítele a quedarse. Con un poco de suerte, entenderá que en España la comida no termina cuando se vacía el plato, sino cuando se acaba la conversación.`,

{id:'r-b2-3',level:'B2',title:'Un fragmento: el silencio del pueblo',titleEn:'An extract: the village silence',type:'Relato breve',typeEn:'Short story',time:10,
text:`Cuando el autobús me dejó en la plaza, eran las cuatro de la tarde y no había nadie. Ni un perro, ni una voz, ni el ruido de una televisión detrás de alguna ventana. Solo el sol, que caía a plomo sobre las piedras, y el reloj de la iglesia, que llevaba parado desde que yo era niña.

Hacía veinte años que no volvía. Mi abuela había muerto en invierno y me tocaba a mí decidir qué hacer con la casa. Mis primos la habrían vendido sin pensarlo; yo, en cambio, llevaba meses sin dormir bien, como si aquella casa me estuviera llamando.

La llave seguía en el mismo sitio: debajo de la maceta de geranios, ahora secos. Al abrir la puerta, me recibió un olor a madera, a membrillo y a algo que no supe nombrar, pero que me devolvió de golpe a los veranos de mi infancia. Todo estaba igual: el reloj de pared, el mantel de hule, la foto de mis abuelos el día de su boda.

Me senté en la cocina sin encender la luz. Pensé que, si me quedaba allí el tiempo suficiente, quizá oiría otra vez a mi abuela cantando mientras pelaba patatas. No la oí, claro. Pero por primera vez en mucho tiempo, el silencio no me pareció una ausencia, sino una forma de compañía.`,
