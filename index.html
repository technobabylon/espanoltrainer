{id:'b2-01',level:'B2',title:'Quería que vinieras – el imperfecto de subjuntivo',cat:'impsubj',vocab:['b2-recuerdos'],
 topics:['Formación desde la 3.ª persona plural del indefinido','-ra y -se','Correlación: quería que + imperfecto de subjuntivo','como si, ojalá + imperfecto de subjuntivo'],
 source:'Greenfield Lesson 31 (Past subjunctive)',
 goals:['usar el subjuntivo en contextos pasados','expresar deseos poco probables','hacer comparaciones irreales con «como si»'],
 grammar:`<h3>1. Formación</h3>
<p>3.ª persona plural del indefinido → quitar <b>-ron</b> → añadir <b>-ra, -ras, -ra, -ramos, -rais, -ran</b>:</p>
<table><tr><th>indefinido (ellos)</th><th>imperfecto de subjuntivo</th></tr>
<tr><td>hablaron</td><td>habla<em>ra</em>, habla<em>ras</em>, habla<em>ra</em>, hablá<em>ramos</em>, habla<em>rais</em>, habla<em>ran</em></td></tr>
<tr><td>comieron</td><td>comiera, comieras… comiéramos</td></tr>
<tr><td>tuvieron</td><td>tuviera · fueron → fuera · hicieron → hiciera · dijeron → dijera · pudieron → pudiera · estuvieron → estuviera · pidieron → pidiera · durmieron → durmiera · leyeron → leyera</td></tr></table>
<p>La forma en <b>-se</b> (hablase, tuviese) es equivalente; en España se oye bastante, sobre todo en el norte y en registro cuidado. Tilde en nosotros: <i>habláramos, tuviéramos</i>.</p>
<h3>2. Usos</h3>
<div class="rule"><b>Correlación de tiempos</b>: si el verbo principal está en pasado o condicional, el subjuntivo pasa a imperfecto: <i>Quiero que <b>vengas</b> → Quería que <b>vinieras</b>. Me pidió que la <b>llamara</b>. Me gustaría que <b>habláramos</b>.</i><br><b>Deseos poco probables o imposibles</b>: <i>¡Ojalá <b>tuviera</b> más tiempo!</i> (vs <i>Ojalá tenga</i> = posible)<br><b>Como si</b> + imperfecto de subjuntivo: <i>Habla <b>como si fuera</b> el jefe.</i></div>
<p>Cortesía: <i>Quisiera</i> (= querría) <i>hablar con el director.</i></p>`,
 pitfalls:['<b>*Quería que vienes</b> → Quería que vinieras.','<b>*tenieran</b> → tuvieran; <b>*hacieran</b> → hicieran.','<b>*como si es</b> → como si fuera.','<b>*hablaramos</b> sin tilde → habláramos.'],
 spain:'«Quisiera…» es la fórmula más formal para pedir algo (en un hotel, en una carta). En la conversación diaria se oye más «quería…» o «me gustaría…».',
 examples:[['Mi madre quería que estudiara Derecho.','My mother wanted me to study law.'],['Me pidió que la llamara al llegar.','She asked me to call her when I arrived.'],['Me gustaría que habláramos con calma.','I’d like us to talk calmly.'],['¡Ojalá tuviera más tiempo libre!','If only I had more free time!'],['Habla como si fuera el jefe.','He talks as if he were the boss.'],['Era necesario que todos firmaran el contrato.','It was necessary for everyone to sign the contract.'],['No creía que fuera tan difícil.','I didn’t think it would be so difficult.'],['Quisiera hablar con el responsable, por favor.','I would like to speak to the person in charge, please.'],['Le dije que no se preocupara.','I told him not to worry.'],['Me sorprendió que no vinieras.','I was surprised you didn’t come.'],['Buscábamos un piso que tuviera jardín.','We were looking for a flat that had a garden.'],['Te lo expliqué para que lo entendieras.','I explained it to you so that you would understand it.']],
 ex:['g|Quería que tú ___ a la fiesta. (venir)|vinieras/vinieses','g|Me pidió que lo ___ (yo). (llamar)|llamara/llamase','g|Era importante que ___ (nosotros) puntuales. (ser)|fuéramos/fuésemos','g|¡Ojalá ___ (yo) más dinero! (tener)|tuviera/tuviese','g|Habla como si lo ___ todo. (saber)|supiera/supiese','g|No creía que ___ tan tarde. (ser)|fuera/fuese','g|Me gustaría que ___ (vosotros) conmigo. (venir)|vinierais/vinieseis','g|Le dije que no lo ___. (hacer, él)|hiciera/hiciese','g|Buscaba un trabajo que ___ bien pagado. (estar)|estuviera/estuviese','g|Me sorprendió que no ___ (ellos) nada. (decir)|dijeran/dijesen','m|She wanted me to stay.|Quería que me quedara.~Quería que me quede ayer.~Quería que me quedo.','m|If only it were Friday!|¡Ojalá fuera viernes!~¡Ojalá es viernes!~¡Ojalá será viernes!','m|Forma correcta:|tuvieran~tenieran~tuvieron que','m|“as if he knew” →|como si supiera~como si sabe~como si sepa','o:impsubj|My parents wanted me to be a doctor.|Mis padres querían que fuera médico','t|Traduzca: I told you to come early. (tú)|Te dije que vinieras pronto/Te dije que vinieras temprano','t|Traduzca: If only I could travel more!|¡Ojalá pudiera viajar más!']},

{id:'b2-02',level:'B2',title:'Si tuviera tiempo… – oraciones condicionales',cat:'impsubj',vocab:['b2-hipotesis'],
 topics:['Condición real: si + presente → presente/futuro/imperativo','Condición improbable: si + imperfecto de subjuntivo → condicional','Condición imposible (pasado): si + pluscuamperfecto de subjuntivo → condicional compuesto','Otras: en caso de que, siempre que, a no ser que'],
 source:'Greenfield Lessons 32 y 35 (Simple conditions, Present unreal conditions, Past contrary-to-fact conditions)',
 goals:['hablar de condiciones reales, hipotéticas e imposibles','imaginar otras vidas','lamentarse de lo que no pasó'],
 grammar:`<h3>1. Tres tipos de condición</h3>
<table><tr><th>tipo</th><th>si + …</th><th>consecuencia</th><th>ejemplo</th></tr>
<tr><td>real / posible</td><td>presente de indicativo</td><td>presente, futuro, imperativo</td><td><i>Si <b>llueve</b>, <b>nos quedamos</b> en casa.</i></td></tr>
<tr><td>improbable / irreal en el presente</td><td>imperfecto de subjuntivo</td><td>condicional</td><td><i>Si <b>tuviera</b> tiempo, <b>aprendería</b> a bailar.</i></td></tr>
<tr><td>imposible (pasado)</td><td>pluscuamperfecto de subjuntivo</td><td>condicional compuesto</td><td><i>Si lo <b>hubiera sabido</b>, te <b>habría llamado</b>.</i></td></tr></table>
<div class="rule">¡Nunca futuro ni condicional después de <b>si</b> condicional! <s>Si tendré</s> / <s>Si tendría</s> → <i>Si tengo / Si tuviera</i>.</div>
<p>Mixto: <i>Si hubiera estudiado Medicina, ahora <b>sería</b> médico.</i> (pasado → presente)</p>
<h3>2. Otras conjunciones condicionales (+ subjuntivo)</h3>
<p><i><b>en caso de que</b> (in case), <b>siempre que / con tal de que</b> (provided that), <b>a no ser que / a menos que</b> (unless)</i>: <i>Te lo dejo siempre que me lo devuelvas. Iremos a la playa a no ser que llueva.</i></p>
<p><b>de + infinitivo</b> (más formal): <i>De haberlo sabido, no habría venido.</i></p>`,
 pitfalls:['<b>*Si tendría dinero…</b> → Si tuviera dinero…','<b>*Si llueve, nos quedaríamos</b> → Si llueve, nos quedamos / Si lloviera, nos quedaríamos.','<b>*Si lo habría sabido</b> → Si lo hubiera sabido.','<b>*a no ser que llueve</b> → a no ser que llueva.'],
 spain:'En la lengua hablada de España se oye a menudo «Si lo hubiera sabido, te <b>hubiera llamado</b>» (con -ra en las dos partes). Es aceptable; «habría llamado» es la forma más recomendada en la escritura.',
 examples:[['Si llueve, nos quedamos en casa.','If it rains, we’ll stay at home.'],['Si tienes tiempo, llámame.','If you have time, call me.'],['Si tuviera más tiempo, aprendería a tocar el piano.','If I had more time, I’d learn to play the piano.'],['Si viviera en Madrid, iría al Prado cada semana.','If I lived in Madrid, I’d go to the Prado every week.'],['¿Qué harías si te tocara la lotería?','What would you do if you won the lottery?'],['Si lo hubiera sabido, te habría llamado.','If I had known, I would have called you.'],['Si hubiéramos salido antes, no habríamos perdido el tren.','If we had left earlier, we wouldn’t have missed the train.'],['Si hubiera estudiado más, ahora tendría un trabajo mejor.','If I had studied more, I’d have a better job now.'],['Te dejo el coche siempre que me lo devuelvas mañana.','I’ll lend you the car provided you return it tomorrow.'],['Iremos a la sierra a no ser que haga mal tiempo.','We’ll go to the mountains unless the weather is bad.'],['En caso de que no puedas venir, avísame.','In case you can’t come, let me know.'],['Yo, si fuera tú, aceptaría la oferta.','If I were you, I’d accept the offer.']],
 ex:['g|Si ___ (tú) tiempo, ven a vernos. (tener)|tienes','g|Si mañana hace sol, ___ (nosotros) a la playa. (ir, futuro)|iremos','g|Si ___ (yo) rico, viajaría por todo el mundo. (ser)|fuera/fuese','g|Si tuviera tiempo, ___ (yo) más deporte. (hacer)|haría','g|¿Qué ___ (tú) si fueras presidente? (hacer)|harías','g|Si lo ___ sabido, te habría avisado. (haber)|hubiera/hubiese','g|Si hubieras venido, te ___ divertido. (haber)|habrías/hubieras','g|Si ___ (nosotros) salido antes, no habríamos llegado tarde. (haber)|hubiéramos/hubiésemos','g|Te ayudo siempre que me ___ (tú). (ayudar)|ayudes','g|Saldremos a no ser que ___. (llover)|llueva','m|If I had money, I would buy a house.|Si tuviera dinero, compraría una casa.~Si tendría dinero, compraría una casa.~Si tengo dinero, compraría una casa.','m|If I had known…|Si lo hubiera sabido…~Si lo habría sabido…~Si lo había sabido…','m|If you see Ana, say hello. (real)|Si ves a Ana, salúdala.~Si verás a Ana, salúdala.~Si vieras a Ana, salúdala ahora.','o:impsubj|If I were you, I would talk to him.|Si fuera tú, hablaría con él','t|Traduzca: What would you do if you lived in Spain? (tú)|¿Qué harías si vivieras en España?','t|Traduzca: If it rains, we won’t go.|Si llueve, no iremos/Si llueve, no vamos']},

{id:'b2-03',level:'B2',title:'Habría sido mejor… – tiempos compuestos del subjuntivo y del condicional',cat:'impsubj',vocab:['b2-arrepentimiento'],
 topics:['Pretérito perfecto de subjuntivo: haya hecho','Pluscuamperfecto de subjuntivo: hubiera hecho','Condicional compuesto: habría hecho','Reproches y arrepentimientos'],
 source:'Greenfield Lessons 29 y 34 (Perfect conditional, Past perfect subjunctive)',
 goals:['valorar hechos ya ocurridos','expresar arrepentimiento y reproches','hacer suposiciones sobre el pasado'],
 grammar:`<h3>1. Perfecto de subjuntivo: haya + participio</h3>
<p><i>haya, hayas, haya, hayamos, hayáis, hayan</i> + participio. Para valorar un hecho <b>pasado reciente</b> o terminado antes de un momento futuro:</p>
<div class="rule"><i>Me alegro de que <b>hayas venido</b>. No creo que <b>haya llegado</b> todavía. Espero que lo <b>hayáis pasado</b> bien. Cuando <b>hayas terminado</b>, avísame.</i></div>
<h3>2. Pluscuamperfecto de subjuntivo: hubiera + participio</h3>
<p><i>hubiera, hubieras, hubiera, hubiéramos, hubierais, hubieran</i> (o hubiese…) + participio: valoración de algo anterior a un momento pasado, y deseos imposibles:</p>
<div class="rule"><i>Me sorprendió que no <b>hubieras llamado</b>. ¡Ojalá no <b>hubiera dicho</b> eso! Me habría gustado que <b>hubieras estado</b> allí.</i></div>
<h3>3. Condicional compuesto: habría + participio</h3>
<p><i>habría, habrías, habría, habríamos, habríais, habrían</i> + participio:</p>
<p>• acción irreal en el pasado: <i>Yo no lo <b>habría hecho</b>.</i> · • reproche: <i><b>Habría sido</b> mejor avisar antes.</i> · • probabilidad en el pasado anterior: <i>Cuando llegué, ya se <b>habrían ido</b>.</i></p>
<p>Reproches muy frecuentes: <i>¡Haberlo dicho antes!</i> (= You should have said so earlier!) · <i>Deberías haber llamado. Tendrías que haberme avisado.</i></p>`,
 pitfalls:['<b>*Me alegro de que has venido</b> → de que hayas venido.','<b>*Ojalá no había dicho eso</b> → Ojalá no hubiera dicho eso.','<b>*Deberías haber llamaste</b> → Deberías haber llamado.','<b>*Yo no lo haría hecho</b> → Yo no lo habría hecho.'],
 spain:'«¡Haberlo dicho!» es una reacción muy típica en España cuando alguien se queja demasiado tarde: «Es que yo no quería ir a ese restaurante» – «¡Pues haberlo dicho!».',
 examples:[['Me alegro de que hayas venido.','I’m glad you’ve come.'],['No creo que hayan terminado todavía.','I don’t think they’ve finished yet.'],['Espero que lo hayáis pasado bien.','I hope you had a good time.'],['Cuando hayas terminado, avísame.','When you have finished, let me know.'],['Me sorprendió que no hubieras llamado.','I was surprised you hadn’t called.'],['¡Ojalá no hubiera dicho eso!','I wish I hadn’t said that!'],['Yo en tu lugar no lo habría hecho.','In your place I wouldn’t have done it.'],['Habría sido mejor reservar con antelación.','It would have been better to book in advance.'],['Deberías haberme avisado.','You should have told me.'],['¡Haberlo dicho antes!','You should have said so earlier!'],['Me habría gustado conocer a tus padres.','I would have liked to meet your parents.'],['Es una pena que no hayas podido venir.','It’s a pity you couldn’t come.']],
 ex:['g|Me alegro de que ___ venido. (haber, tú)|hayas','g|No creo que ___ llegado. (haber, ellos)|hayan','g|Espero que lo ___ pasado bien. (haber, vosotros)|hayáis','g|Cuando ___ terminado, llámame. (haber, tú)|hayas','g|¡Ojalá no lo ___ dicho! (haber, yo)|hubiera/hubiese','g|Me sorprendió que no ___ venido. (haber, ella)|hubiera/hubiese','g|Yo no lo ___ hecho. (haber, condicional)|habría/hubiera','g|___ sido mejor esperar. (haber, condicional)|Habría/Hubiera','g|Deberías haber ___ antes. (llamar)|llamado','g|Tendrías que haberme ___. (avisar)|avisado','m|I’m glad you came. (just now)|Me alegro de que hayas venido.~Me alegro de que has venido.~Me alegro de que vinieras mañana.','m|I wish I had studied more.|Ojalá hubiera estudiado más.~Ojalá había estudiado más.~Ojalá he estudiado más.','m|“¡Haberlo dicho!” means…|You should have said so!~Say it!~You have said it!','o:impsubj|I would have liked to see it.|Me habría gustado verlo','t|Traduzca: You should have called me. (tú)|Deberías haberme llamado/Tendrías que haberme llamado/Me deberías haber llamado','t|Traduzca: I hope you have had a good time. (tú)|Espero que lo hayas pasado bien']},

{id:'b2-04',level:'B2',title:'Se vende, fue construido – la pasiva y la impersonalidad',cat:'other',vocab:['b2-noticias'],
 topics:['Pasiva con ser: fue construido por…','Pasiva refleja: se venden pisos','Impersonal: se + 3.ª singular, 2.ª persona genérica, uno','Estar + participio (resultado)'],
 source:'Greenfield Lesson 36 (Passive voice) · Libro Libre cap. 8 (The impersonal and passive se)',
 goals:['entender noticias y textos formales','presentar información sin agente','elegir entre ser + participio y se'],
 grammar:`<h3>1. Pasiva con «ser»</h3>
<p><b>ser + participio</b> (concuerda con el sujeto) + <b>por</b> (agente): <i>La Alhambra <b>fue construida</b> por los nazaríes. Los ladrones <b>fueron detenidos</b> por la policía.</i></p>
<p>Es típica de la prensa, la historia y los textos formales. En la conversación es poco frecuente.</p>
<h3>2. Pasiva refleja – la más frecuente</h3>
<div class="rule"><b>se + verbo en 3.ª persona</b> (singular o plural según el sujeto), sin agente: <i><b>Se vende</b> piso. <b>Se venden</b> pisos. <b>Se construyó</b> en el siglo XIV. <b>Se han detectado</b> varios casos.</i></div>
<h3>3. Impersonal</h3>
<p><b>se + 3.ª singular</b> con personas o sin objeto: <i>En España <b>se vive</b> bien. <b>Se busca</b> a los responsables.</i> · <b>tú genérico</b> (muy coloquial): <i>Aquí <b>pagas</b> y te <b>sientas</b> donde quieras.</i> · <b>uno/una</b>: <i>Uno nunca sabe.</i> · <b>3.ª plural</b> (alguien): <i><b>Dicen</b> que va a subir el precio. Te <b>llaman</b> al teléfono.</i></p>
<h3>4. Estar + participio = resultado</h3>
<p><i>La tienda <b>está cerrada</b>. El problema <b>está resuelto</b>. La mesa <b>está reservada</b>.</i> (compare: <i>La tienda <b>fue cerrada</b> por la policía</i> – acción)</p>`,
 pitfalls:['<b>*Se vende pisos</b> → Se venden pisos.','<b>*La catedral fue construido</b> → fue construida.','<b>*Fue construido de los romanos</b> → por los romanos.','<b>*La puerta es abierta</b> (resultado) → está abierta.'],
 spain:'Los titulares de la prensa española usan mucho la pasiva refleja y el presente: «<b>Se disparan</b> los precios del alquiler», «<b>Detenidos</b> dos jóvenes por…» (participio sin verbo).',
 examples:[['La Alhambra fue construida en los siglos XIII y XIV.','The Alhambra was built in the 13th and 14th centuries.'],['El ladrón fue detenido por la policía.','The thief was arrested by the police.'],['Se vende piso con terraza.','Flat with terrace for sale.'],['Se alquilan habitaciones para estudiantes.','Rooms to let for students.'],['En este restaurante se come muy bien.','You eat very well in this restaurant.'],['Se han suspendido todos los vuelos.','All flights have been cancelled.'],['Dicen que mañana habrá huelga de metro.','They say there will be a metro strike tomorrow.'],['Aquí pagas en caja y luego pides en la barra.','Here you pay at the till and then order at the bar.'],['La tienda está cerrada por vacaciones.','The shop is closed for the holidays.'],['El problema ya está resuelto.','The problem is already solved.'],['La mesa está reservada a nombre de García.','The table is booked under the name García.'],['Uno nunca sabe lo que puede pasar.','You never know what can happen.']],
 ex:['g|La catedral fue ___ en el siglo XIII. (construir)|construida','g|Los cuadros fueron ___ por Goya. (pintar)|pintados','g|El libro fue ___ por Cervantes. (escribir)|escrito','g|Se ___ pisos. (vender)|venden','g|Se ___ camarero. (buscar)|busca','g|En España se ___ muy tarde. (cenar)|cena','g|Se ___ cancelado los trenes. (haber)|han','g|La ventana ___ abierta. (resultado)|está','g|El museo fue inaugurado ___ el rey.|por','m|Flats for sale.|Se venden pisos.~Se vende pisos.~Son vendidos pisos se.','m|The shop is closed. (result)|La tienda está cerrada.~La tienda es cerrada.~La tienda se cierra cerrada.','m|They say it’s going to rain. (people say)|Dicen que va a llover.~Se dicen que va a llover.~Está dicho que va a llover.','m|The bridge was built by the Romans.|El puente fue construido por los romanos.~El puente fue construida por los romanos.~El puente estaba construido de los romanos.','o:other|Spanish is spoken here.|Aquí se habla español','t|Traduzca: The problem is solved.|El problema está resuelto','t|Traduzca: Room to let. (sign)|Se alquila habitación']},

{id:'b2-05',level:'B2',title:'Para entonces habré terminado – futuro perfecto y probabilidad',cat:'fut',vocab:['b2-carrera'],
 topics:['Futuro perfecto: habré hecho','Acción terminada antes de un momento futuro','Probabilidad sobre el pasado reciente: habrá salido','Resumen: grados de probabilidad'],
 source:'Greenfield Lesson 29 (Future perfect indicative)',
 goals:['hablar de lo que habrá pasado en un momento futuro','hacer suposiciones sobre el pasado reciente','graduar la seguridad'],
 grammar:`<h3>1. Forma</h3>
<p>Futuro de <b>haber</b> + participio: <i>habré, habrás, habrá, habremos, habréis, habrán</i> + hablado / hecho…</p>
<h3>2. Antes de un momento futuro</h3>
<div class="rule"><i>Para junio <b>habré terminado</b> el máster. Cuando llegues, ya <b>habremos cenado</b>. Dentro de diez años <b>habrán construido</b> la nueva línea de metro.</i></div>
<h3>3. Suposición sobre el pasado reciente</h3>
<p>Igual que el futuro simple expresa probabilidad en el presente, el futuro perfecto la expresa sobre algo que <b>ha pasado</b>:</p>
<div class="rule"><i>No contesta… <b>Habrá salido</b>.</i> (= probablemente ha salido) · <i>¿Por qué no ha venido Luis? – Se le <b>habrá olvidado</b>.</i> · <i>Ya <b>habrán llegado</b>, ¿no?</i></div>
<h3>4. Grados de probabilidad</h3>
<table><tr><th>seguridad</th><th>presente</th><th>pasado reciente</th><th>pasado</th></tr>
<tr><td>seguro</td><td>Está en casa.</td><td>Ha salido.</td><td>Salió.</td></tr>
<tr><td>probable</td><td><b>Estará</b> en casa.</td><td><b>Habrá salido.</b></td><td><b>Saldría.</b></td></tr>
<tr><td>posible</td><td>Puede que esté / A lo mejor está.</td><td>Puede que haya salido.</td><td>Puede que saliera.</td></tr></table>`,
 pitfalls:['<b>*Para junio terminaré</b> (si se quiere decir «ya terminado») → habré terminado.','<b>*Habrá salió</b> → Habrá salido.','<b>*Puede que ha salido</b> → Puede que haya salido.','<b>*A lo mejor haya salido</b> → A lo mejor ha salido.'],
 spain:'Cuando alguien llega tarde, la explicación típica es: «Habrá pillado un atasco» o «Se habrá quedado dormido». «Pillar» es muy coloquial (= coger, encontrarse con).',
 examples:[['Para junio habré terminado el máster.','By June I will have finished the master’s.'],['Cuando llegues, ya habremos cenado.','When you arrive, we’ll already have had dinner.'],['Dentro de un año habré ahorrado lo suficiente.','In a year’s time I’ll have saved enough.'],['No contesta; habrá salido.','He’s not answering; he must have gone out.'],['Se le habrá olvidado.','He must have forgotten.'],['¿Dónde están las llaves? – Las habrás dejado en el coche.','Where are the keys? – You must have left them in the car.'],['Habrá pillado un atasco.','He must have got stuck in a traffic jam.'],['Ya habrán llegado a Sevilla, ¿no?','They must have arrived in Seville by now, right?'],['Puede que haya perdido el tren.','He may have missed the train.'],['A lo mejor se ha quedado dormido.','Maybe he’s overslept.'],['En 2030 habrán cambiado muchas cosas.','By 2030 many things will have changed.'],['¿Habrás terminado para las cinco?','Will you have finished by five?']],
 ex:['g|Para el lunes ___ terminado el informe. (haber, yo)|habré','g|Cuando llegues, ya ___ salido. (haber, nosotros)|habremos','g|Dentro de un año ___ aprendido mucho. (haber, tú)|habrás','g|No contesta; ___ salido. (haber, probabilidad)|habrá','g|Se le habrá ___. (olvidar)|olvidado','g|Ya habrán ___ a casa. (llegar)|llegado','g|Puede que ___ perdido el autobús. (haber)|haya','g|A lo mejor se ___ quedado dormido. (haber)|ha','m|By 2030 they will have built it.|Para 2030 lo habrán construido.~Para 2030 lo construirían.~Para 2030 lo han construido.','m|He must have gone out. (supposition)|Habrá salido.~Habría salido mañana.~Ha salido seguro.','m|He may have forgotten.|Puede que se le haya olvidado.~Puede que se le ha olvidado.~Puede que se le olvidará.','o:fut|By Friday I will have finished.|Para el viernes habré terminado','t|Traduzca: She must have missed the train.|Habrá perdido el tren','t|Traduzca: When you arrive, I will have left. (tú)|Cuando llegues, me habré ido/Cuando llegues, habré salido/Cuando llegues, ya me habré ido']},

{id:'b2-06',level:'B2',title:'Aunque llueva – concesión y causa',cat:'conn',vocab:['b2-debate'],
 topics:['aunque + indicativo (hecho) / + subjuntivo (hipótesis o hecho no relevante)','por mucho que, por más que, a pesar de que','Causa: como, ya que, puesto que, dado que, debido a','Consecuencia: de ahí que + subjuntivo, tan… que'],
 source:'Greenfield Lesson 30 (Survey of moods) · MFLE Reference Grammar (Conjunctions)',
 goals:['argumentar con matices','reconocer argumentos contrarios sin aceptarlos','explicar causas y consecuencias en un registro formal'],
 grammar:`<h3>1. aunque: indicativo o subjuntivo</h3>
<table><tr><th>aunque + indicativo</th><th>aunque + subjuntivo</th></tr>
<tr><td>hecho real, informativo:<br><i>Aunque <b>llueve</b>, vamos a salir.</i> (sé que llueve)</td><td>hipótesis o hecho que no importa:<br><i>Aunque <b>llueva</b>, vamos a salir.</i> (llueva o no) · <i>Aunque <b>tengas</b> razón, no me convences.</i></td></tr></table>
<p>Con imperfecto de subjuntivo = muy improbable: <i>Aunque me <b>pagaran</b> el doble, no trabajaría allí.</i></p>
<h3>2. Otras concesivas</h3>
<p><b>por mucho que / por más que</b> + subjuntivo (o indicativo si es un hecho): <i>Por mucho que lo intente, no lo consigo.</i> · <b>a pesar de que</b>: <i>A pesar de que es caro, lo compró.</i> · <b>a pesar de</b> + nombre/infinitivo · <b>aun así</b> (even so) · <b>si bien</b> (formal).</p>
<h3>3. Causa (registro formal)</h3>
<p><b>ya que / puesto que / dado que</b> + indicativo: <i>Dado que el plazo termina hoy, les rogamos que…</i> · <b>debido a</b> + nombre: <i>debido a la huelga</i> · <b>no porque… sino porque</b> + subj / indic: <i>No lo digo porque <b>sea</b> mi amigo, sino porque <b>es</b> verdad.</i></p>
<h3>4. Consecuencia</h3>
<p><b>tan</b> + adj + <b>que</b> / <b>tanto</b> + nombre + <b>que</b>: <i>Había tanta gente que no pudimos entrar.</i> · <b>de ahí que</b> + subjuntivo (formal): <i>El alquiler ha subido mucho; de ahí que muchos jóvenes <b>vivan</b> con sus padres.</i> · <b>por consiguiente / en consecuencia</b>.</p>`,
 pitfalls:['<b>*Aunque lloverá</b> → Aunque llueva / Aunque llueve.','<b>*Por mucho que lo intento</b> (hipótesis) → Por mucho que lo intente.','<b>*debido a que la huelga</b> → debido a la huelga.','<b>*de ahí que viven</b> → de ahí que vivan.'],
 spain:'En los debates de la tele y en las tertulias, «Ya, pero…», «Vale, aun así…» y «No es por nada, pero…» son las formas coloquiales de introducir una objeción.',
 examples:[['Aunque llueve, vamos a dar un paseo.','Although it’s raining, we’re going for a walk.'],['Aunque llueva mañana, iremos a la excursión.','Even if it rains tomorrow, we’ll go on the trip.'],['Aunque me pagaran el doble, no trabajaría allí.','Even if they paid me double, I wouldn’t work there.'],['Por mucho que lo intente, no consigo dormir.','However hard I try, I can’t sleep.'],['A pesar de que es caro, merece la pena.','Even though it’s expensive, it’s worth it.'],['Es muy caro; aun así, lo voy a comprar.','It’s very expensive; even so, I’m going to buy it.'],['Dado que el plazo termina hoy, les rogamos que envíen la documentación.','Given that the deadline ends today, please send the documents.'],['El vuelo se retrasó debido a la niebla.','The flight was delayed due to fog.'],['No lo digo porque sea mi amigo, sino porque es verdad.','I’m not saying it because he’s my friend, but because it’s true.'],['Había tanta gente que no pudimos entrar.','There were so many people that we couldn’t get in.'],['Los alquileres han subido; de ahí que muchos jóvenes vivan con sus padres.','Rents have gone up; that’s why many young people live with their parents.'],['Ya, pero no es tan sencillo.','Yes, but it’s not that simple.']],
 ex:['g|Aunque ___ cansado, fui a trabajar. (estar, hecho, yo)|estaba','g|Aunque ___ mañana, saldremos. (llover, hipótesis)|llueva','g|Aunque me lo ___ mil veces, no lo creería. (jurar, ellos, improbable)|juraran/jurasen','g|Por mucho que ___ (tú), no te van a escuchar. (gritar)|grites','g|A pesar ___ la lluvia, salimos.|de','g|No lo hago porque ___ obligatorio, sino porque me gusta. (ser)|sea','g|Había ___ ruido que no podía dormir.|tanto','g|Era ___ tarde que no había metro.|tan','g|Ha subido el precio; de ahí que la gente ___ menos. (comprar)|compre','m|Even if you don’t like it, you have to do it.|Aunque no te guste, tienes que hacerlo.~Aunque no te gustará, tienes que hacerlo.~Aunque no te gustaría, tienes que hacerlo.','m|due to the strike|debido a la huelga~debido que la huelga~por debido a la huelga','m|However much I study…|Por mucho que estudie…~Por mucho que estudiaré…~Por mucho estudio que…','o:conn|Although it is far, it is worth it.|Aunque está lejos, merece la pena','t|Traduzca: Even if it rains, I will go.|Aunque llueva, iré/Aunque llueva, voy a ir/Aunque llueva, voy','t|Traduzca: There were so many people that we left.|Había tanta gente que nos fuimos']},

{id:'b2-07',level:'B2',title:'Se puso nervioso – verbos de cambio y ser/estar avanzado',cat:'serestar',vocab:['b2-cambios'],
 topics:['ponerse + adjetivo (cambio rápido)','volverse, hacerse, quedarse, convertirse en, llegar a ser','ser/estar con adjetivos de valoración: es lógico, está bien','estar + adjetivo para impresión subjetiva: ¡qué guapa estás!'],
 source:'MFLE Reference Grammar (Ser and estar) · FSI Unit 7 (Review drill ser – estar)',
 goals:['describir cambios de estado y de personalidad','usar ser y estar con matices','evitar el calco de «become»'],
 grammar:`<h3>1. «To become» en español</h3>
<table><tr><th>verbo</th><th>tipo de cambio</th><th>ejemplos</th></tr>
<tr><td><b>ponerse</b> + adj.</td><td>rápido, temporal (emociones, aspecto)</td><td><i>Se puso rojo. Me pongo nervioso en los exámenes. Se puso enfermo.</i></td></tr>
<tr><td><b>quedarse</b> + adj.</td><td>resultado de algo, a menudo negativo o sorpresa</td><td><i>Se quedó sorprendido. Me quedé sin trabajo. Se quedó ciego.</i></td></tr>
<tr><td><b>volverse</b> + adj.</td><td>cambio profundo y duradero de carácter</td><td><i>Se volvió muy desconfiado. Se ha vuelto loco.</i></td></tr>
<tr><td><b>hacerse</b> + adj./nombre</td><td>voluntario o gradual (profesión, ideología, religión)</td><td><i>Se hizo médico. Se hizo vegetariano. Se está haciendo tarde.</i></td></tr>
<tr><td><b>convertirse en</b> + nombre</td><td>transformación total</td><td><i>El pueblo se convirtió en un destino turístico.</i></td></tr>
<tr><td><b>llegar a ser</b></td><td>tras esfuerzo, logro</td><td><i>Llegó a ser directora del hospital.</i></td></tr></table>
<h3>2. ser/estar con matices</h3>
<p><b>ser</b> + adjetivo de valoración + que/infinitivo: <i>Es lógico que estés enfadado. Es increíble.</i> · <b>estar bien / mal</b> (valoración de una acción): <i>Está bien que lo digas. Eso no está bien.</i></p>
<p><b>estar</b> + adjetivo = impresión subjetiva o cambio respecto a lo normal: <i>¡Qué guapa <b>estás</b> hoy! El niño <b>está</b> muy alto. La paella <b>está</b> salada.</i></p>
<p>Expresiones: <i>estar de acuerdo, estar de vacaciones, estar de pie, estar de mal humor, estar de moda, estar para + inf.</i> (be about to / in the mood), <i>ser de</i> + equipo/ciudad.</p>`,
 pitfalls:['<b>*Llegué nervioso</b> (became) → Me puse nervioso.','<b>*Se convirtió médico</b> → Se hizo médico / Se convirtió en médico.','<b>*Me quedé sin trabajo</b> ✓ – no <b>*Me hice sin trabajo</b>.','<b>*Eres muy guapa hoy</b> (impresión de hoy) → Estás muy guapa hoy.'],
 spain:'«Se está haciendo tarde» es la frase educada para empezar a despedirse en una cena española… aunque normalmente todavía queda una hora de sobremesa.',
 examples:[['Me pongo muy nervioso cuando hablo en público.','I get very nervous when I speak in public.'],['Cuando le dieron la noticia, se puso a llorar.','When they gave him the news, he started crying.'],['Se puso rojo como un tomate.','He went as red as a tomato.'],['Me quedé sin palabras.','I was left speechless.'],['Se ha vuelto muy desconfiado.','He’s become very distrustful.'],['Mi hermana se hizo vegetariana hace años.','My sister became a vegetarian years ago.'],['Se está haciendo tarde, deberíamos irnos.','It’s getting late, we should go.'],['El barrio se ha convertido en una zona de moda.','The neighbourhood has become a trendy area.'],['Llegó a ser alcaldesa de su ciudad.','She became mayor of her town.'],['¡Qué guapa estás con ese vestido!','You look so pretty in that dress!'],['Es lógico que estés enfadado.','It’s understandable that you’re angry.'],['Eso no está bien.','That’s not right.']],
 ex:['g|Cuando habla en público, se ___ nervioso. (cambio rápido)|pone','g|Se ___ sin dinero al final del mes. (resultado)|quedó','g|Con los años se ha ___ muy egoísta. (cambio de carácter)|vuelto','g|Mi primo se ___ abogado. (profesión, esfuerzo)|hizo','g|La fábrica se ___ en un museo.|convirtió','g|Llegó ___ ser ministra.|a','g|Se está ___ de noche. (getting dark)|haciendo','g|¡Qué delgado ___! (tú, impresión)|estás','g|___ lógico que quieras irte.|Es','g|Eso no ___ bien. (valoración)|está','m|She became sad when she heard it.|Se puso triste al oírlo.~Se hizo triste al oírlo.~Se convirtió triste al oírlo.','m|He became a Buddhist.|Se hizo budista.~Se puso budista.~Se quedó budista.','m|I was left alone.|Me quedé solo.~Me puse solo.~Me volví solo.','o:serestar|The village has become a tourist destination.|El pueblo se ha convertido en un destino turístico','t|Traduzca: I get nervous in exams.|Me pongo nervioso en los exámenes/Me pongo nerviosa en los exámenes','t|Traduzca: It is getting late.|Se está haciendo tarde/Se hace tarde']},

{id:'b2-08',level:'B2',title:'Se me ha olvidado – el «se» y los pronombres avanzados',cat:'pron',vocab:['b2-imprevistos'],
 topics:['Se accidental: se me olvidó, se me rompió, se le cayó','Valores de «se»: reflexivo, recíproco, impersonal, pasiva, aspectual (comerse, irse)','Duplicación de pronombres: A Juan le…, El libro lo…','Leísmo y laísmo en España'],
 source:'Libro Libre cap. 6 (Reflexive verbs) · Greenfield Lessons 11 y 22 · Reflexive Verbs in Spanish (CMCSD)',
 goals:['hablar de accidentes e imprevistos sin culparse','reconocer los distintos usos de «se»','entender el uso de los pronombres en la España real'],
 grammar:`<h3>1. «Se» accidental – no fue culpa mía</h3>
<p><b>se + pronombre indirecto + verbo</b> (concuerda con la cosa): presenta el hecho como involuntario.</p>
<div class="rule"><i><b>Se me ha olvidado</b> la cartera. <b>Se me olvidaron</b> las llaves. <b>Se le cayó</b> el vaso. <b>Se nos ha roto</b> la lavadora. <b>Se te ha perdido</b> algo. <b>Se me ocurre</b> una idea. <b>Se les acabó</b> el pan.</i></div>
<p>Compare: <i>Rompí el vaso</i> (lo hice yo) / <i>Se me rompió el vaso</i> (fue un accidente).</p>
<h3>2. Los usos de «se»</h3>
<table><tr><th>uso</th><th>ejemplo</th></tr>
<tr><td>reflexivo</td><td><i>Se ducha.</i></td></tr><tr><td>recíproco (each other)</td><td><i>Se quieren mucho. Nos vemos mañana.</i></td></tr>
<tr><td>sustituto de le/les</td><td><i>Se lo di.</i></td></tr><tr><td>impersonal / pasiva</td><td><i>Se vive bien. Se venden pisos.</i></td></tr>
<tr><td>aspectual / intensivo</td><td><i>Se comió toda la tarta. Me bebí dos litros. Me voy.</i> (completitud, énfasis)</td></tr>
<tr><td>accidental</td><td><i>Se me olvidó.</i></td></tr></table>
<h3>3. Duplicación</h3>
<p>Si el objeto va <b>antes</b> del verbo, se repite con pronombre: <i><b>El libro</b> <b>lo</b> compré ayer. <b>A María</b> <b>la</b> vi en el metro.</i> El objeto indirecto casi siempre se duplica: <i><b>Le</b> dije <b>a Juan</b> que…</i></p>
<h3>4. Leísmo y laísmo</h3>
<p><b>Leísmo</b> de persona masculina (aceptado): <i>A Pedro <b>le</b> vi ayer</i> (= lo vi). <b>Laísmo</b> (no aceptado en la norma, frecuente en Madrid y Castilla): <s><i>La dije que viniera</i></s> → <i><b>Le</b> dije que viniera</i>.</p>`,
 pitfalls:['<b>*Me olvidé las llaves</b> (posible, pero más natural) → Se me olvidaron las llaves.','<b>*Se me olvidó las llaves</b> → Se me olvidaron (plural).','<b>*El libro compré ayer</b> → El libro lo compré ayer.','<b>*La dije la verdad</b> (laísmo) → Le dije la verdad.'],
 spain:'«Se me ha ido la olla» (coloquial: I lost it / I forgot completely) y «se me ha ido el santo al cielo» (I completely forgot what I was going to say) son dos expresiones muy españolas con el «se» accidental.',
 examples:[['Se me ha olvidado la cartera en casa.','I’ve left my wallet at home.'],['Se me olvidaron las llaves.','I forgot the keys.'],['A mi hijo se le cayó el móvil al agua.','My son dropped his phone in the water.'],['Se nos ha roto la lavadora.','Our washing machine has broken.'],['Se me ocurre una idea.','I’ve got an idea.'],['Se les acabó la gasolina en plena autopista.','They ran out of petrol in the middle of the motorway.'],['Rompí el vaso sin querer. – Bueno, se te cayó, no pasa nada.','I broke the glass by accident. – Well, you dropped it, never mind.'],['Se comió toda la tarta él solo.','He ate the whole cake by himself.'],['Nos vemos mañana.','See you tomorrow.'],['El libro lo compré en una librería de viejo.','I bought the book in a second-hand bookshop.'],['A Pedro le vi ayer en el gimnasio.','I saw Pedro at the gym yesterday.'],['¡Uy, se me ha ido el santo al cielo!','Oops, I’ve completely forgotten what I was going to say!']],
 ex:['g|Se ___ ha olvidado el paraguas. (a mí)|me','g|Se ___ cayó el vaso. (a él)|le','g|Se ___ ha roto el coche. (a nosotros)|nos','g|¿Se ___ ha perdido algo? (a ti)|te','g|Se me ___ las llaves. (olvidar, indefinido)|olvidaron','g|Se le ___ el pan. (acabar, indefinido)|acabó','g|El coche ___ vendimos el año pasado.|lo','g|A tu hermana ___ vi ayer.|la','g|___ dije a Juan que viniera.|Le','m|I dropped my glasses. (accident)|Se me cayeron las gafas.~Me cayeron las gafas.~Se me cayó las gafas.','m|They love each other.|Se quieren.~Les quieren.~Se quiere.','m|He ate the whole pizza.|Se comió toda la pizza.~Comió se toda la pizza.~Le comió toda la pizza.','m|Correct (standard):|Le dije la verdad.~La dije la verdad.~Lo dije la verdad a ella.','o:pron|I forgot your birthday.|Se me olvidó tu cumpleaños','t|Traduzca: I’ve lost my keys. (accidental se, perfect)|Se me han perdido las llaves','t|Traduzca: We ran out of milk.|Se nos acabó la leche/Se nos ha acabado la leche']},

{id:'b2-09',level:'B2',title:'Me dijo que lo llamara – estilo indirecto avanzado',cat:'impsubj',vocab:['b2-comunicacion'],
 topics:['Órdenes y peticiones en pasado: me pidió que + imperfecto de subjuntivo','Verbos de comunicación precisos: aconsejar, sugerir, insistir en, negar','Transmitir con matices: que si…, que no sé qué…','Referencias temporales y espaciales'],
 source:'Greenfield Lessons 30–31 (Survey of moods and tenses, Past subjunctive)',
 goals:['resumir conversaciones con verbos precisos','transmitir órdenes, consejos y quejas en pasado','entender el estilo indirecto coloquial'],
 grammar:`<h3>1. Órdenes, peticiones y consejos</h3>
<table><tr><th>directo</th><th>indirecto (presente)</th><th>indirecto (pasado)</th></tr>
<tr><td>«Llámame.»</td><td>Me dice que lo <b>llame</b>.</td><td>Me dijo que lo <b>llamara</b>.</td></tr>
<tr><td>«No llegues tarde.»</td><td>Me pide que no <b>llegue</b> tarde.</td><td>Me pidió que no <b>llegara</b> tarde.</td></tr>
<tr><td>«Deberías descansar.»</td><td>Me aconseja que <b>descanse</b>.</td><td>Me aconsejó que <b>descansara</b>.</td></tr></table>
<h3>2. Verbos que resumen la intención</h3>
<p><i><b>pedir</b>, <b>rogar</b>, <b>exigir</b>, <b>aconsejar</b>, <b>recomendar</b>, <b>sugerir</b>, <b>proponer</b>, <b>insistir en</b>, <b>prohibir</b>, <b>permitir</b> + que + subjuntivo</i> · <i><b>afirmar</b>, <b>asegurar</b>, <b>reconocer</b>, <b>admitir</b>, <b>negar</b>, <b>quejarse de</b>, <b>advertir</b>, <b>prometer</b> + que + indicativo</i> (negar que → subjuntivo).</p>
<div class="rule">«No he sido yo.» → <i><b>Negó</b> haberlo hecho / <b>Negó</b> que lo hubiera hecho.</i> · «Vale, me equivoqué.» → <i><b>Reconoció</b> que se había equivocado.</i> · «Venid a cenar.» → <i>Nos <b>invitó</b> a cenar.</i></div>
<h3>3. El estilo indirecto coloquial</h3>
<p>En la conversación se usa mucho <b>que</b> al principio y <b>que si…</b>: <i>¿Qué te ha dicho? – <b>Que</b> no puede venir. · Y me empezó a contar <b>que si</b> el trabajo, <b>que si</b> la familia, <b>que si no sé qué</b>…</i> (and so on and so forth).</p>
<p>Cambios: <i>hoy → ese día; mañana → al día siguiente; ayer → el día anterior; aquí → allí; venir → ir; traer → llevar</i>.</p>`,
 pitfalls:['<b>*Me dijo que lo llamo</b> → que lo llamara.','<b>*Negó que lo había hecho</b> → Negó que lo hubiera hecho.','<b>*Me sugirió de ir</b> → Me sugirió ir / que fuera.','<b>*Me dijo que viene aquí mañana</b> (contado más tarde) → que iría allí al día siguiente.'],
 spain:'«Que si patatín, que si patatán» es la forma coloquial española de resumir un discurso largo y aburrido: «Y me contó que si patatín, que si patatán… ¡una hora!».',
 examples:[['Me dijo que lo llamara al día siguiente.','He told me to call him the next day.'],['El médico me aconsejó que descansara.','The doctor advised me to rest.'],['Nos pidieron que no hiciéramos ruido.','They asked us not to make any noise.'],['Insistió en que me quedara a cenar.','She insisted that I stay for dinner.'],['Me prohibieron que aparcara allí.','They forbade me to park there.'],['Negó que lo hubiera hecho él.','He denied having done it.'],['Reconoció que se había equivocado.','She admitted she had made a mistake.'],['Prometió que llegaría a tiempo.','He promised he would arrive on time.'],['¿Qué te ha dicho? – Que no puede venir.','What did she say? – That she can’t come.'],['Y empezó que si el trabajo, que si la familia…','And he started going on about work, his family…'],['Se quejó de que el piso estaba sucio.','He complained that the flat was dirty.'],['Nos invitó a cenar en su casa.','She invited us to dinner at her place.']],

{id:'b2-10',level:'B2',title:'¡Qué guay, tío! – registro y español coloquial de España',cat:'vocab',vocab:['b2-coloquial'],
 topics:['Registro formal e informal','Marcadores del discurso: pues, bueno, o sea, vamos, en plan','Coloquialismos de España: guay, molar, currar, flipar, vale, tío','Expresiones idiomáticas frecuentes'],
 source:'Cactus Spanish Language Kit · FSI conversation stimulus · Libro Libre (Lecturas culturales)',
 goals:['entender a los hablantes jóvenes y la conversación rápida','adaptar el registro a la situación','usar expresiones idiomáticas con naturalidad'],
 grammar:`<h3>1. Registro</h3>
<table><tr><th>formal</th><th>neutro</th><th>coloquial (España)</th></tr>
<tr><td>trabajar</td><td>trabajar</td><td><b>currar</b> (el curro)</td></tr>
<tr><td>dinero</td><td>dinero</td><td><b>pasta</b>, pelas</td></tr>
<tr><td>estupendo</td><td>muy bien</td><td><b>guay</b>, genial, de lujo</td></tr>
<tr><td>me agrada</td><td>me gusta</td><td><b>me mola</b></td></tr>
<tr><td>me sorprende mucho</td><td>me sorprende</td><td><b>flipo</b> / estoy flipando</td></tr>
<tr><td>de acuerdo</td><td>vale</td><td><b>vale</b>, venga, sí, sí</td></tr>
<tr><td>muy</td><td>muy</td><td><b>súper</b>, mogollón de (a lot of)</td></tr></table>
<p>Vocativos entre amigos: <i>tío/tía, chaval</i>; con desconocidos mayores: <i>señor/señora</i> o nada.</p>
<h3>2. Marcadores del discurso</h3>
<p><b>pues</b> (well / so – para empezar una respuesta) · <b>bueno</b> (well / OK) · <b>o sea</b> (I mean) · <b>vamos</b> (I mean / basically) · <b>en plan</b> (like – muy juvenil) · <b>la verdad es que</b> · <b>es que</b> · <b>¿sabes?</b> · <b>¿no?</b> · <b>total, que</b> · <b>a ver</b> (let’s see / well) · <b>hombre</b> (of course / come on) · <b>vaya</b> (oh dear / wow).</p>
<h3>3. Expresiones idiomáticas</h3>
<p><i>estar hasta las narices</i> (fed up) · <i>no tener ni idea</i> · <i>costar un ojo de la cara</i> · <i>ser pan comido</i> (a piece of cake) · <i>tomar el pelo</i> (pull someone’s leg) · <i>meter la pata</i> (put your foot in it) · <i>echar una mano</i> (give a hand) · <i>ponerse las pilas</i> (get one’s act together) · <i>estar como una cabra</i> (be crazy) · <i>no pasa nada</i> · <i>¡ni de coña!</i> (no way – vulgar-ish) · <i>quedarse frito</i> (fall asleep).</p>
<div class="ch">Use coloquial Spanish with friends; in emails, at work with strangers, at the town hall: neutral or formal (usted, «Estimado/a…», «Quería saber si…»).</div>`,
 pitfalls:['Using <b>tío/tía</b> or <b>guay</b> with officials or your landlord → neutral register.','<b>*Es pan comiendo</b> → Es pan comido.','<b>*Me molan las tapas</b> ✓ but not in a formal email.','<b>*Meter el pie</b> → meter la pata.'],
 spain:'Mucho vocabulario coloquial cambia por regiones: en Andalucía «quillo», en Valencia «nano», en el norte «majo» y «chaval». Pero «vale», «guay» y «tío» se entienden en toda España.',
 examples:[['¡Qué guay, tío! ¿Dónde lo has comprado?','How cool, mate! Where did you buy it?'],['Mañana no curro, ¿quedamos?','I’m not working tomorrow, shall we meet up?'],['Ese piso cuesta un ojo de la cara.','That flat costs an arm and a leg.'],['El examen fue pan comido.','The exam was a piece of cake.'],['Estoy hasta las narices del ruido de las obras.','I’m fed up with the noise of the building work.'],['Me mola mucho tu chaqueta.','I really like your jacket.'],['¡Estoy flipando con lo que me cuentas!','I can’t believe what you’re telling me!'],['Pues, la verdad es que no tengo ni idea.','Well, the truth is I have no idea.'],['O sea, que no vienes, ¿no?','So you’re not coming, right?'],['¿Me echas una mano con la mudanza?','Will you give me a hand with the move?'],['Metí la pata: le pregunté a su exnovia por él.','I put my foot in it: I asked his ex-girlfriend about him.'],['Venga, vale, nos vemos luego.','Right, OK, see you later.']],
 ex:['m|Coloquial: «trabajar» →|currar~molar~flipar','m|Coloquial: «me gusta mucho» →|me mola mucho~me flipa la pata~me echa una mano','m|«Costar un ojo de la cara» =|ser muy caro~doler mucho~ser muy feo','m|«Ser pan comido» =|ser muy fácil~tener hambre~ser barato','m|«Meter la pata» =|equivocarse, decir algo inoportuno~caminar mal~enfadarse','m|«Echar una mano» =|ayudar~saludar~pegar','m|«Estar hasta las narices» =|estar harto~estar resfriado~estar contento','m|«Tomar el pelo» =|bromear, engañar a alguien~cortarse el pelo~tener frío','m|Registro adecuado para un correo a la administración:|Estimados señores: Quería saber si…~¡Hola, tío! ¿Qué pasa?~Venga, vale, guay.','m|«¡Ni de coña!» significa…|¡De ninguna manera!~¡Qué bien!~¡Claro que sí!','g|Es ___ comido. (very easy)|pan','g|¿Me echas una ___?|mano','g|Hay que ponerse las ___. (get one’s act together)|pilas','g|No tengo ni ___.|idea','o:vocab|The flat costs an arm and a leg.|El piso cuesta un ojo de la cara','t|Diga de forma neutra: «Estoy flipando.»|Estoy muy sorprendido/Estoy muy sorprendida/Me sorprende mucho','t|Diga de forma coloquial: «No trabajo mañana.»|Mañana no curro/No curro mañana']}
]);

window.LISTEN.groups.push({level:'A1',title:'A1 · Primeros días en Madrid',titleEn:'A1 · First days in Madrid',note:'Emma, una ingeniera escocesa, llega a Madrid para trabajar. Diálogos cortos y claros, inspirados en las situaciones del FSI Basic Course (llegada, presentaciones, el primer día de trabajo, buscar piso, la comida) y de Libro Libre.',noteEn:'Emma, a Scottish engineer, arrives in Madrid to work. Short, clear dialogues, inspired by the situations in the FSI Basic Course (arrival, introductions, first day at work, flat hunting, lunch) and Libro Libre.',tracks:[
{id:'l-a1-01',label:'A1·1',title:'Encantada',titleEn:'Nice to meet you',unit:'a1-01',task:'Escuche: ¿cómo se llaman y de dónde son?',taskEn:'Listen: what are their names and where are they from?',v:{'Javier':'m','Emma':'f'},
d:`Javier: ¡Hola! Buenos días. ¿Eres Emma?
Emma: Sí, soy yo. Hola, buenos días.
Javier: Yo soy Javier, Javier Ruiz. Trabajo en la empresa, en el departamento de ingeniería.
Emma: Encantada, Javier.
Javier: Encantado. ¿Qué tal el viaje?
Emma: Muy bien, gracias. Un poco largo, pero bien.
Javier: ¿De dónde eres, Emma? ¿Eres inglesa?
Emma: No, no soy inglesa. Soy escocesa, de Edimburgo.
Javier: ¡Ah, de Escocia! Yo soy de Madrid, de aquí.
Emma: ¿Y cómo se dice tu apellido? ¿Ruiz?
Javier: Sí, Ruiz: erre, u, i, zeta.
Emma: Perfecto. Bueno, Javier, ¡hasta luego!
Javier: ¡Hasta luego, Emma! Hasta mañana en la oficina.`,
en:`Javier: Hi! Good morning. Are you Emma?
Emma: Yes, that’s me. Hello, good morning.
Javier: I’m Javier, Javier Ruiz. I work at the company, in the engineering department.
Emma: Nice to meet you, Javier.
Javier: Nice to meet you. How was the journey?
Emma: Very good, thanks. A bit long, but fine.
Javier: Where are you from, Emma? Are you English?
Emma: No, I’m not English. I’m Scottish, from Edinburgh.
Javier: Ah, from Scotland! I’m from Madrid, from here.
Emma: And how do you say your surname? Ruiz?
Javier: Yes, Ruiz: R, U, I, Z.
Emma: Perfect. Well, Javier, see you later!
Javier: See you later, Emma! See you tomorrow at the office.`,
qs:['m|Javier es de Barcelona.|Falso~Verdadero','m|Emma es…|escocesa~inglesa~irlandesa','m|¿De qué ciudad es Emma?|Edimburgo~Glasgow~Londres','m|Javier trabaja en el departamento de…|ingeniería~marketing~ventas','m|El viaje de Emma fue un poco largo.|Verdadero~Falso','g|El apellido de Javier es ___.|Ruiz']},
{id:'l-a1-02',label:'A1·2',title:'¿Tú o usted?',titleEn:'tú or usted?',unit:'a1-01',task:'Escuche: ¿con quién habla Emma de usted y con quién de tú?',taskEn:'Listen: whom does Emma address as usted and whom as tú?',v:{'Recepcionista':'f2','Emma':'f','Lucas':'m2'},
d:`Recepcionista: Buenos días. ¿Cómo se llama usted?
Emma: Me llamo Emma Campbell.
Recepcionista: ¿Cómo se escribe su apellido, por favor?
Emma: Ce, a, eme, pe, be, e, ele, ele.
Recepcionista: Muy bien, señora Campbell. ¿De dónde es usted?
Emma: Soy de Escocia.
Recepcionista: Gracias. Su tarjeta. ¡Bienvenida!
Lucas: ¡Hola! ¿Eres nueva? Yo soy Lucas.
Emma: Hola, Lucas. Sí, soy nueva. Me llamo Emma.
Lucas: ¿Qué tal, Emma? ¿De dónde eres?
Emma: Soy de Edimburgo. ¿Y tú?
Lucas: Yo soy de Sevilla, pero vivo en Madrid.`,
en:`Receptionist: Good morning. What is your name?
Emma: My name is Emma Campbell.
Receptionist: How do you spell your surname, please?
Emma: C, A, M, P, B, E, L, L.
Receptionist: Very good, Ms Campbell. Where are you from?
Emma: I’m from Scotland.
Receptionist: Thank you. Your card. Welcome!
Lucas: Hi! Are you new? I’m Lucas.
Emma: Hi, Lucas. Yes, I’m new. My name is Emma.
Lucas: How are things, Emma? Where are you from?
Emma: I’m from Edinburgh. And you?
Lucas: I’m from Seville, but I live in Madrid.`,
qs:['m|La recepcionista habla con Emma de…|usted~tú','m|Lucas habla con Emma de…|tú~usted','m|Lucas es de Sevilla.|Verdadero~Falso','m|Lucas vive en Sevilla.|Falso~Verdadero','g|El apellido de Emma es ___.|Campbell']},
{id:'l-a1-03',label:'A1·3',title:'El primer día en la oficina',titleEn:'The first day at the office',unit:'a1-04',task:'¿Cómo son los compañeros de Emma?',taskEn:'What are Emma’s colleagues like?',v:{'Javier':'m','Emma':'f'},
d:`Javier: Emma, esta es la oficina. Es grande, ¿verdad?
Emma: Sí, es muy grande y muy moderna.
Javier: Mira, ese es Lucas. Es informático. Es muy simpático y un poco tímido.
Emma: Sí, ya lo conozco. ¿Y la chica alta y morena?
Javier: Es Carmen, la jefa del departamento. Es muy inteligente y muy trabajadora.
Emma: ¿Es española?
Javier: Sí, es de Valencia. Y aquellos dos chicos son Marco y Pierre. Son estudiantes en prácticas. Marco es italiano y Pierre es francés.
Emma: ¡Qué internacional!
Javier: Sí. Somos un equipo muy internacional. ¿Y tus compañeros en Escocia cómo son?
Emma: Son simpáticos, pero el trabajo es más aburrido.`,
en:`Javier: Emma, this is the office. It’s big, isn’t it?
Emma: Yes, it’s very big and very modern.
Javier: Look, that’s Lucas. He’s an IT guy. He’s very nice and a bit shy.
Emma: Yes, I already know him. And the tall, dark-haired girl?
Javier: That’s Carmen, the head of the department. She’s very intelligent and very hard-working.
Emma: Is she Spanish?
Javier: Yes, she’s from Valencia. And those two guys over there are Marco and Pierre. They’re interns. Marco is Italian and Pierre is French.
Emma: How international!
Javier: Yes. We’re a very international team. And what are your colleagues in Scotland like?
Emma: They’re nice, but the work is more boring.`,
qs:['m|La oficina es pequeña.|Falso~Verdadero','m|Lucas es…|informático~jefe~estudiante','m|Carmen es…|la jefa del departamento~estudiante en prácticas~recepcionista','m|Carmen es de…|Valencia~Madrid~Sevilla','m|Pierre es…|francés~italiano~español','g|Lucas es muy simpático y un poco ___.|tímido']},
{id:'l-a1-04',label:'A1·4',title:'¿Hay un piso por aquí?',titleEn:'Is there a flat around here?',unit:'a1-06',task:'Emma busca piso. ¿Qué hay en el barrio?',taskEn:'Emma is looking for a flat. What is there in the neighbourhood?',v:{'Emma':'f','Javier':'m'},
d:`Emma: Javier, necesito un piso. ¿Dónde vives tú?
Javier: Vivo en Lavapiés. Es un barrio muy bonito y está cerca del centro.
Emma: ¿Hay pisos baratos en Lavapiés?
Javier: Baratos, baratos… no. Madrid es caro. Pero hay pisos pequeños a buen precio.
Emma: ¿Y qué hay en el barrio?
Javier: Hay muchos bares y restaurantes, hay un mercado y dos supermercados. El metro está al lado de mi casa.
Emma: ¿Hay un parque?
Javier: Sí, hay un parque pequeño, y el Retiro está a veinte minutos andando.
Emma: ¡Perfecto! ¿Y el barrio es tranquilo?
Javier: Bueno… por la noche hay mucha gente en la calle. Es un barrio con mucha vida.`,
en:`Emma: Javier, I need a flat. Where do you live?
Javier: I live in Lavapiés. It’s a very nice neighbourhood and it’s close to the centre.
Emma: Are there cheap flats in Lavapiés?
Javier: Cheap, cheap… no. Madrid is expensive. But there are small flats at a good price.
Emma: And what is there in the neighbourhood?
Javier: There are lots of bars and restaurants, there’s a market and two supermarkets. The metro is next to my house.
Emma: Is there a park?
Javier: Yes, there’s a small park, and the Retiro is twenty minutes’ walk away.
Emma: Perfect! And is the neighbourhood quiet?
Javier: Well… at night there are lots of people in the street. It’s a very lively neighbourhood.`,
qs:['m|Javier vive en…|Lavapiés~Salamanca~Chamberí','m|Según Javier, Madrid es barato.|Falso~Verdadero','m|En el barrio hay…|un mercado y dos supermercados~dos mercados y un supermercado~solo un supermercado','m|El metro está…|al lado de la casa de Javier~lejos de la casa de Javier~en el parque','m|El Retiro está a veinte minutos andando.|Verdadero~Falso','m|Por la noche el barrio es…|muy animado~muy tranquilo~peligroso']},
{id:'l-a1-05',label:'A1·5',title:'En el bar',titleEn:'At the bar',unit:'a1-10',task:'¿Qué piden Emma y Javier y cuánto pagan?',taskEn:'What do Emma and Javier order and how much do they pay?',v:{'Camarero':'m2','Javier':'m','Emma':'f'},
d:`Camarero: ¡Buenas! ¿Qué os pongo?
Javier: Para mí, una caña, por favor.
Emma: Yo quería un tinto de verano.
Camarero: Muy bien. ¿Algo para comer?
Javier: ¿Qué tapas tenéis?
Camarero: Hoy tenemos tortilla, croquetas de jamón, patatas bravas y calamares.
Emma: Me encantan las croquetas.
Javier: Pues una ración de croquetas y una de bravas para compartir.
Camarero: Marchando.
Emma: ¿Te gusta la tortilla con cebolla o sin cebolla?
Javier: ¡Con cebolla, claro! ¿Y a ti?
Emma: A mí también.
Javier: ¿Nos cobras, por favor?
Camarero: Sí, son catorce euros con cincuenta.
Emma: ¿Puedo pagar con tarjeta?
Camarero: Claro, sin problema.`,
en:`Waiter: Hi there! What can I get you?
Javier: For me, a small beer, please.
Emma: I’d like a tinto de verano.
Waiter: Very good. Anything to eat?
Javier: What tapas do you have?
Waiter: Today we have tortilla, ham croquettes, patatas bravas and squid.
Emma: I love croquettes.
Javier: Then a portion of croquettes and one of bravas to share.
Waiter: Coming right up.
Emma: Do you like tortilla with onion or without?
Javier: With onion, of course! And you?
Emma: Me too.
Javier: Can we pay, please?
Waiter: Yes, that’s fourteen euros fifty.
Emma: Can I pay by card?
Waiter: Of course, no problem.`,
qs:['m|Javier pide…|una caña~un tinto de verano~un café','m|Emma pide…|un tinto de verano~una caña~un agua','m|¿Qué piden para comer?|croquetas y patatas bravas~tortilla y calamares~calamares y croquetas','m|A Emma le gusta la tortilla con cebolla.|Verdadero~Falso','g|Pagan ___ euros con cincuenta.|catorce/14','m|Emma paga…|con tarjeta~en efectivo~no paga']},
{id:'l-a1-06',label:'A1·6',title:'Un día normal',titleEn:'A normal day',unit:'a1-08',task:'Escuche el día de Lucas: ¿a qué hora hace cada cosa?',taskEn:'Listen to Lucas’s day: what time does he do each thing?',v:{'Lucas':'m2'},
d:`Lucas: Me llamo Lucas y trabajo en una empresa de ingeniería en Madrid.
Lucas: Normalmente salgo de casa a las ocho menos cuarto y cojo el metro.
Lucas: Llego a la oficina a las ocho y media.
Lucas: A las once tomo un café con los compañeros en el bar de enfrente.
Lucas: Como a las dos, casi siempre el menú del día. Cuesta doce euros.
Lucas: Trabajo hasta las seis y luego voy al gimnasio o paseo por el Retiro.
Lucas: Ceno a las nueve y media, más o menos, y veo una serie.
Lucas: Los viernes no ceno en casa: salgo de tapas con mis amigos.
Lucas: Y los domingos como en casa de mis padres. ¡Mi madre cocina muy bien!`,
en:`Lucas: My name is Lucas and I work in an engineering company in Madrid.
Lucas: I usually leave home at quarter to eight and take the metro.
Lucas: I get to the office at half past eight.
Lucas: At eleven I have a coffee with my colleagues in the bar opposite.
Lucas: I have lunch at two, almost always the set menu. It costs twelve euros.
Lucas: I work until six and then I go to the gym or walk in the Retiro.
Lucas: I have dinner at about half past nine and watch a series.
Lucas: On Fridays I don’t have dinner at home: I go out for tapas with my friends.
Lucas: And on Sundays I have lunch at my parents’ house. My mother cooks really well!`,
qs:['m|Lucas sale de casa a las…|ocho menos cuarto~ocho y media~siete y cuarto','m|Va al trabajo en…|metro~autobús~coche','g|Llega a la oficina a las ocho y ___.|media','m|El menú del día cuesta…|doce euros~diez euros~quince euros','m|Lucas cena a las nueve y media, más o menos.|Verdadero~Falso','m|Los viernes Lucas…|sale de tapas~cena en casa~va al gimnasio','m|Los domingos come…|en casa de sus padres~en un restaurante~en la oficina']},
{id:'l-a1-07',label:'A1·7',title:'Por la ciudad',titleEn:'Around town',unit:'a1-06',task:'Emma busca tres lugares. ¿Dónde están?',taskEn:'Emma is looking for three places. Where are they?',v:{'Emma':'f','Señor':'m2','Señora':'f2'},
d:`Emma: Perdone, ¿hay una farmacia por aquí?
Señor: Sí, hay una en la calle Atocha, al lado del banco. Está muy cerca.
Emma: Muchas gracias.
Señor: De nada.
Emma: Perdone, señora, ¿dónde está la estación de metro de Tirso de Molina?
Señora: Está en la plaza, enfrente del mercado. A dos minutos.
Emma: Gracias. Y una pregunta más: ¿sabe si hay un cajero cerca?
Señora: Sí, hay uno dentro del supermercado, a la derecha.
Emma: ¡Qué amable! Muchas gracias.
Señora: Nada, hija. ¡Que vaya bien!`,
en:`Emma: Excuse me, is there a pharmacy around here?
Man: Yes, there’s one on Calle Atocha, next to the bank. It’s very close.
Emma: Thank you very much.
Man: You’re welcome.
Emma: Excuse me, madam, where is Tirso de Molina metro station?
Woman: It’s in the square, opposite the market. Two minutes away.
Emma: Thanks. And one more question: do you know if there’s a cash machine nearby?
Woman: Yes, there’s one inside the supermarket, on the right.
Emma: How kind! Thank you very much.
Woman: Not at all, dear. Have a good day!`,
qs:['m|La farmacia está al lado del…|banco~mercado~supermercado','m|La farmacia está lejos.|Falso~Verdadero','m|La estación de metro está enfrente del…|mercado~banco~parque','m|El cajero está…|dentro del supermercado~en la farmacia~en la estación','g|La farmacia está en la calle ___.|Atocha']},
{id:'l-a1-08',label:'A1·8',title:'La familia de Javier',titleEn:'Javier’s family',unit:'a1-07',task:'¿Cuántos hermanos tiene Javier? ¿Qué hacen?',taskEn:'How many siblings does Javier have? What do they do?',v:{'Emma':'f','Javier':'m'},
d:`Emma: ¿Quién es esta chica de la foto?
Javier: Es mi hermana Lucía. Tiene veintiocho años y es enfermera en un hospital de Toledo.
Emma: ¿Tienes más hermanos?
Javier: Sí, tengo un hermano mayor, Pablo. Tiene treinta y cinco años, está casado y tiene dos hijos.
Emma: ¡Entonces eres tío!
Javier: Sí, mis sobrinos se llaman Hugo y Martina. Hugo tiene seis años y Martina tres.
Emma: ¿Y tus padres viven en Madrid?
Javier: Mi madre sí. Mi padre murió hace unos años.
Emma: Lo siento.
Javier: Gracias. ¿Y tú, Emma? ¿Tienes hermanos?
Emma: No, soy hija única. Pero tengo muchos primos en Escocia.`,
en:`Emma: Who is this girl in the photo?
Javier: That’s my sister Lucía. She’s twenty-eight and she’s a nurse in a hospital in Toledo.
Emma: Do you have more brothers and sisters?
Javier: Yes, I have an older brother, Pablo. He’s thirty-five, he’s married and he has two children.
Emma: So you’re an uncle!
Javier: Yes, my nephew and niece are called Hugo and Martina. Hugo is six and Martina is three.
Emma: And do your parents live in Madrid?
Javier: My mother does. My father died a few years ago.
Emma: I’m sorry.
Javier: Thanks. And you, Emma? Do you have brothers or sisters?
Emma: No, I’m an only child. But I have lots of cousins in Scotland.`,
qs:['m|Lucía es…|enfermera~médica~profesora','m|Lucía trabaja en…|Toledo~Madrid~Sevilla','g|Pablo tiene ___ años.|treinta y cinco/35','m|Pablo tiene…|dos hijos~un hijo~tres hijos','m|Martina tiene seis años.|Falso~Verdadero','m|Emma tiene…|muchos primos~dos hermanos~un hermano']},
{id:'l-a1-09',label:'A1·9',title:'En la estación',titleEn:'At the station',unit:'a1-09',task:'Emma compra un billete a Segovia. Anote la hora y el precio.',taskEn:'Emma buys a ticket to Segovia. Note the time and the price.',v:{'Emma':'f','Taquillero':'m2','Megafonía':'f2'},
d:`Emma: Buenos días. Un billete para Segovia, por favor.
Taquillero: ¿Para hoy? ¿De ida o de ida y vuelta?
Emma: De ida y vuelta. Vuelvo el domingo por la tarde.
Taquillero: Hay un tren a las diez y cuarto y otro a las once y cinco.
Emma: El de las diez y cuarto, por favor. ¿Cuánto se tarda?
Taquillero: Unos treinta minutos. Es el AVE.
Emma: ¡Qué rápido! ¿Y cuánto es?
Taquillero: Son veintidós euros, ida y vuelta.
Emma: ¿De qué andén sale?
Taquillero: Del andén siete. Pero mire la pantalla, a veces cambia.
Megafonía: El tren con destino Segovia y Valladolid, con salida a las diez y quince, está estacionado en la vía siete.`,
en:`Emma: Good morning. A ticket to Segovia, please.
Clerk: For today? Single or return?
Emma: Return. I’m coming back on Sunday afternoon.
Clerk: There’s a train at quarter past ten and another at five past eleven.
Emma: The quarter past ten one, please. How long does it take?
Clerk: About thirty minutes. It’s the high-speed train.
Emma: How fast! And how much is it?
Clerk: That’s twenty-two euros, return.
Emma: Which platform does it leave from?
Clerk: Platform seven. But check the screen, it sometimes changes.
Announcement: The train to Segovia and Valladolid, departing at ten fifteen, is waiting on track seven.`,
qs:['m|Emma compra un billete de…|ida y vuelta~ida~vuelta','m|Emma vuelve…|el domingo por la tarde~el sábado por la mañana~mañana','m|Emma coge el tren de las…|diez y cuarto~once y cinco~diez menos cuarto','m|El viaje dura…|unos treinta minutos~una hora~dos horas','g|El billete cuesta ___ euros.|veintidós/22','g|El tren sale del andén ___.|siete/7']},
{id:'l-a1-10',label:'A1·10',title:'¿Qué haces el fin de semana?',titleEn:'What are you doing at the weekend?',unit:'a1-11',task:'¿Qué planes tienen Lucas y Emma?',taskEn:'What plans do Lucas and Emma have?',v:{'Lucas':'m2','Emma':'f'},
d:`Lucas: Emma, ¿qué vas a hacer el fin de semana?
Emma: El sábado voy a Segovia en tren. Quiero ver el acueducto.
Lucas: ¡Qué bien! Es precioso. Tienes que comer cochinillo allí.
Emma: ¿Cochinillo? ¿Qué es?
Lucas: Es cerdo pequeño, asado. Es el plato típico de Segovia.
Emma: Vale, lo voy a probar. ¿Y tú qué haces?
Lucas: El sábado por la mañana juego al pádel con unos amigos y por la tarde vamos al cine.
Emma: ¿Y el domingo?
Lucas: El domingo no hago nada. Duermo mucho y como con mis padres.
Emma: ¡Qué buen plan!
Lucas: Oye, ¿quieres venir al pádel el próximo sábado?
Emma: No sé jugar… pero puedo aprender.`,
en:`Lucas: Emma, what are you going to do at the weekend?
Emma: On Saturday I’m going to Segovia by train. I want to see the aqueduct.
Lucas: Great! It’s beautiful. You have to eat cochinillo there.
Emma: Cochinillo? What’s that?
Lucas: It’s roast suckling pig. It’s the typical dish of Segovia.
Emma: OK, I’ll try it. And what are you doing?
Lucas: On Saturday morning I’m playing padel with some friends and in the afternoon we’re going to the cinema.
Emma: And on Sunday?
Lucas: On Sunday I’m not doing anything. I sleep a lot and have lunch with my parents.
Emma: What a good plan!
Lucas: Hey, do you want to come to padel next Saturday?
Emma: I can’t play… but I can learn.`,
qs:['m|Emma va a Segovia el…|sábado~domingo~viernes','m|Emma quiere ver…|el acueducto~la catedral~el museo','m|El cochinillo es…|cerdo pequeño asado~un pescado~un postre','m|Lucas juega al pádel el sábado por la mañana.|Verdadero~Falso','m|El domingo Lucas…|no hace nada especial~trabaja~va a Segovia','m|Emma sabe jugar al pádel.|Falso~Verdadero']},
{id:'l-a1-11',label:'A1·11',title:'En el mercado',titleEn:'At the market',unit:'a1-12',task:'¿Qué compra Emma y cuánto cuesta?',taskEn:'What does Emma buy and how much does it cost?',v:{'Emma':'f','Señora':'f2','Frutero':'m'},
d:`Emma: Buenos días. ¿Quién es el último?
Señora: Yo, guapa. Después de mí, tú.
Frutero: ¡Siguiente! ¿Qué le pongo?
Emma: Un kilo de tomates, por favor.
Frutero: ¿Para ensalada o para salsa?
Emma: Para ensalada.
Frutero: Estos están muy buenos. ¿Algo más?
Emma: Sí, medio kilo de fresas y una lechuga.
Frutero: Las fresas están de oferta: el kilo a cuatro euros.
Emma: Entonces un kilo de fresas.
Frutero: Muy bien. ¿Algo más?
Emma: No, nada más. ¿Cuánto es?
Frutero: Son ocho euros con veinte.
Emma: Aquí tiene. Gracias.
Frutero: A ti, guapa. ¡Hasta luego!`,
en:`Emma: Good morning. Who’s last?
Woman: Me, love. After me, it’s you.
Greengrocer: Next! What can I get you?
Emma: A kilo of tomatoes, please.
Greengrocer: For salad or for sauce?
Emma: For salad.
Greengrocer: These ones are very good. Anything else?
Emma: Yes, half a kilo of strawberries and a lettuce.
Greengrocer: The strawberries are on offer: four euros a kilo.
Emma: Then a kilo of strawberries.
Greengrocer: Very good. Anything else?
Emma: No, nothing else. How much is it?
Greengrocer: That’s eight euros twenty.
Emma: Here you are. Thanks.
Greengrocer: Thank you, love. See you!`,
qs:['m|«¿Quién es el último?» sirve para…|saber el turno en la cola~pedir la cuenta~saludar','m|Emma compra los tomates para…|ensalada~salsa~sopa','m|Al final, Emma compra…|un kilo de fresas~medio kilo de fresas~dos kilos de fresas','m|Las fresas están de oferta.|Verdadero~Falso','g|Emma paga ocho euros con ___.|veinte/20']},
{id:'l-a1-12',label:'A1·12',title:'En una tienda de ropa',titleEn:'In a clothes shop',unit:'a1-12',task:'¿Qué busca Emma? ¿Lo compra?',taskEn:'What is Emma looking for? Does she buy it?',v:{'Dependienta':'f2','Emma':'f'},
d:`Dependienta: Hola, ¿te puedo ayudar?
Emma: Sí, busco una chaqueta para el otoño.
Dependienta: Tenemos estas de aquí. ¿Qué color te gusta?
Emma: Me gusta esa azul. ¿Cuánto cuesta?
Dependienta: Cuesta cuarenta y nueve euros, pero hoy tiene un veinte por ciento de descuento.
Emma: ¿La tienes en la talla M?
Dependienta: Sí, aquí está. ¿Te la quieres probar?
Emma: Sí, ¿dónde están los probadores?
Dependienta: Al fondo, a la izquierda.
Emma: Me queda un poco grande. ¿Tienes una S?
Dependienta: En azul no, solo en negro.
Emma: Vale, pues la negra. Me la llevo.`,
en:`Shop assistant: Hi, can I help you?
Emma: Yes, I’m looking for a jacket for the autumn.
Shop assistant: We have these ones here. What colour do you like?
Emma: I like that blue one. How much is it?
Shop assistant: It’s forty-nine euros, but today there’s a twenty per cent discount.
Emma: Do you have it in size M?
Shop assistant: Yes, here it is. Do you want to try it on?
Emma: Yes, where are the fitting rooms?
Shop assistant: At the back, on the left.
Emma: It’s a bit big on me. Do you have an S?
Shop assistant: Not in blue, only in black.
Emma: OK, the black one then. I’ll take it.`,

]});

{id:'l-a2-01',label:'A2·1',title:'Mis mañanas',titleEn:'My mornings',unit:'a2-01',task:'¿Qué hace Carmen por la mañana? Ordene sus acciones.',taskEn:'What does Carmen do in the morning? Put her actions in order.',v:{'Carmen':'f2'},
d:`Carmen: Entre semana me levanto a las seis y media, porque vivo lejos de la oficina.
Carmen: Primero me ducho, muy rápido, y luego me visto. No me maquillo mucho.
Carmen: Desayuno solo un café con leche en casa; a las diez y media bajo al bar y me tomo una tostada con tomate.
Carmen: Mis hijos se levantan a las siete y cuarto. Mi marido los lleva al colegio.
Carmen: Yo salgo de casa a las siete y cojo el tren de Cercanías.
Carmen: En el tren leo las noticias o, a veces, me duermo un poco.
Carmen: Los sábados es otra cosa: me despierto sin despertador, me quedo en la cama hasta las nueve y desayuno churros con mi familia.`,
en:`Carmen: On weekdays I get up at half past six, because I live far from the office.
Carmen: First I shower, very quickly, and then I get dressed. I don’t wear much make-up.
Carmen: I only have a white coffee at home for breakfast; at half past ten I go down to the bar and have toast with tomato.
Carmen: My children get up at quarter past seven. My husband takes them to school.
Carmen: I leave home at seven and take the commuter train.
Carmen: On the train I read the news or sometimes I nod off a bit.
Carmen: Saturdays are different: I wake up without an alarm, stay in bed until nine and have churros for breakfast with my family.`,
qs:['m|Carmen se levanta temprano porque…|vive lejos de la oficina~tiene un perro~va al gimnasio','m|En casa Carmen desayuna…|un café con leche~una tostada~churros','m|¿Quién lleva a los niños al colegio?|su marido~Carmen~la abuela','m|Carmen va a trabajar en…|tren~coche~metro','m|Los sábados Carmen usa el despertador.|Falso~Verdadero','g|Los sábados desayuna ___ con su familia.|churros']},
{id:'l-a2-02',label:'A2·2',title:'En el centro de salud',titleEn:'At the health centre',unit:'a2-02',task:'¿Qué le pasa a Emma y qué le recomienda la médica?',taskEn:'What is wrong with Emma and what does the doctor recommend?',v:{'Médica':'f2','Emma':'f'},
d:`Médica: Buenos días. Siéntese, por favor. ¿Qué le pasa?
Emma: Buenos días. Me duele mucho la garganta y tengo tos.
Médica: ¿Desde cuándo?
Emma: Desde el domingo. Y ayer por la noche tuve fiebre: treinta y ocho y medio.
Médica: ¿Le duele la cabeza?
Emma: Un poco, sí. Y estoy muy cansada.
Médica: Abra la boca, por favor… Sí, tiene la garganta muy roja. Es una faringitis.
Emma: ¿Es grave?
Médica: No, no se preocupe. Le voy a recetar un antiinflamatorio. Tómese una pastilla cada ocho horas, después de comer, durante cinco días.
Emma: ¿Y puedo ir a trabajar?
Médica: Mejor no. Debería descansar dos o tres días y beber mucha agua. Le hago un justificante para el trabajo.
Emma: Muchas gracias, doctora.
Médica: De nada. Si no mejora en cinco días, pida otra cita.`,
en:`Doctor: Good morning. Sit down, please. What’s the matter?
Emma: Good morning. My throat hurts a lot and I have a cough.
Doctor: Since when?
Emma: Since Sunday. And last night I had a temperature: thirty-eight and a half.
Doctor: Do you have a headache?
Emma: A little, yes. And I’m very tired.
Doctor: Open your mouth, please… Yes, your throat is very red. It’s pharyngitis.
Emma: Is it serious?
Doctor: No, don’t worry. I’m going to prescribe an anti-inflammatory. Take one tablet every eight hours, after meals, for five days.
Emma: And can I go to work?
Doctor: Better not. You should rest for two or three days and drink lots of water. I’ll give you a note for work.
Emma: Thank you very much, doctor.
Doctor: You’re welcome. If you don’t get better in five days, make another appointment.`,
qs:['m|A Emma le duele…|la garganta~el estómago~la espalda','m|Emma tiene tos desde el domingo.|Verdadero~Falso','g|Ayer tuvo fiebre: treinta y ___ y medio.|ocho/8','m|Debe tomar una pastilla cada…|ocho horas~cuatro horas~doce horas','m|La médica recomienda…|descansar y beber agua~ir a trabajar~hacer deporte','m|Si no mejora, Emma debe…|pedir otra cita~ir a urgencias~tomar más pastillas']},
{id:'l-a2-03',label:'A2·3',title:'¿Ser o estar?',titleEn:'ser or estar?',unit:'a2-03',task:'Lucas habla de su nueva compañera de piso. ¿Cómo es y cómo está hoy?',taskEn:'Lucas talks about his new flatmate. What is she like and how is she today?',v:{'Emma':'f','Lucas':'m2'},
d:`Emma: ¿Qué tal con tu nueva compañera de piso?
Lucas: Muy bien. Se llama Ainhoa, es de San Sebastián y es fisioterapeuta.
Emma: ¿Y cómo es?
Lucas: Es muy alegre y muy ordenada. Es un poco seria al principio, pero es majísima.
Emma: ¡Qué suerte! ¿Y dónde está ahora?
Lucas: Está en Bilbao, con su familia. Vuelve mañana.
Emma: ¿Y tú cómo estás? Pareces cansado.
Lucas: Estoy cansadísimo. Esta semana estoy trabajando muchísimo, tenemos un proyecto nuevo.
Emma: ¿Y la cena? ¿Qué estás preparando?
Lucas: Una crema de calabaza. Prueba… ¿está rica?
Emma: Está riquísima, pero está un poco fría.`,
en:`Emma: How’s it going with your new flatmate?
Lucas: Very well. Her name is Ainhoa, she’s from San Sebastián and she’s a physiotherapist.
Emma: And what’s she like?
Lucas: She’s very cheerful and very tidy. She’s a bit serious at first, but she’s really lovely.
Emma: Lucky you! And where is she now?
Lucas: She’s in Bilbao with her family. She’s back tomorrow.
Emma: And how are you? You look tired.
Lucas: I’m exhausted. This week I’m working a huge amount, we have a new project.
Emma: And dinner? What are you making?
Lucas: A pumpkin soup. Try it… is it good?
Emma: It’s delicious, but it’s a bit cold.`,

{id:'l-a2-04',label:'A2·4',title:'¿Me lo dejas?',titleEn:'Can I borrow it?',unit:'a2-04',task:'¿Qué necesita Emma y qué le deja Javier?',taskEn:'What does Emma need and what does Javier lend her?',v:{'Emma':'f','Javier':'m'},
d:`Emma: Javier, ¿tienes un taladro? Tengo que colgar unas estanterías.
Javier: Sí, lo tengo en casa. Te lo dejo mañana.
Emma: ¡Genial! ¿Y una escalera también?
Javier: La escalera no la tengo, lo siento. Pero mi vecino tiene una; se la pido.
Emma: Gracias. ¿Y sabes dónde puedo comprar tacos y tornillos?
Javier: En la ferretería de la esquina. Los venden por unidades.
Emma: Perfecto. Por cierto, ¿me devuelves el libro de cocina?
Javier: ¡Ay, sí! Lo tengo en la mochila. Toma.
Emma: ¿Te gustaron las recetas?
Javier: Me encantaron. Hice la tortilla de la página veinte y se la di a probar a mi madre. ¡Le gustó mucho!`,
en:`Emma: Javier, have you got a drill? I have to put up some shelves.
Javier: Yes, I’ve got one at home. I’ll lend it to you tomorrow.
Emma: Great! And a ladder too?
Javier: I haven’t got a ladder, sorry. But my neighbour has one; I’ll ask him for it.
Emma: Thanks. And do you know where I can buy wall plugs and screws?
Javier: At the hardware shop on the corner. They sell them individually.
Emma: Perfect. By the way, will you give me back the cookbook?
Javier: Oh, yes! I have it in my backpack. Here you are.
Emma: Did you like the recipes?
Javier: I loved them. I made the tortilla on page twenty and gave it to my mother to try. She really liked it!`,
qs:['m|Emma necesita un taladro para…|colgar unas estanterías~arreglar una mesa~montar una cama','m|Javier tiene una escalera.|Falso~Verdadero','m|¿Quién tiene una escalera?|el vecino de Javier~la madre de Javier~Emma','m|Los tornillos se compran en…|la ferretería~el supermercado~el mercado','m|Javier devuelve…|el libro de cocina~el taladro~la escalera','g|Javier hizo la tortilla de la página ___.|veinte/20']},
{id:'l-a2-05',label:'A2·5',title:'¿Ciudad o pueblo?',titleEn:'City or village?',unit:'a2-05',task:'Escuche la opinión de Pablo y de Lucía. ¿Quién prefiere qué?',taskEn:'Listen to Pablo’s and Lucía’s opinions. Who prefers what?',v:{'Pablo':'m','Lucía':'f2'},
d:`Pablo: Yo prefiero vivir en Madrid. En la ciudad hay más trabajo, más cultura y mejores transportes.
Lucía: Sí, pero en Madrid todo es más caro que en un pueblo. Y hay más ruido y más contaminación.
Pablo: Hombre, en el pueblo la vida es más tranquila, pero también más aburrida.
Lucía: No estoy de acuerdo. En mi pueblo hay tantas fiestas como en la ciudad, ¡o más!
Pablo: ¿Y los médicos? El hospital más cercano está a cuarenta kilómetros.
Lucía: Eso es verdad. Pero la gente es más amable y conoces a todo el mundo.
Pablo: Para mí, lo mejor de Madrid son los museos. El Prado es el mejor museo del mundo.
Lucía: Y para mí, lo mejor del pueblo es el silencio. Y el pan, que está buenísimo.`,
en:`Pablo: I prefer living in Madrid. In the city there’s more work, more culture and better transport.
Lucía: Yes, but in Madrid everything is more expensive than in a village. And there’s more noise and more pollution.
Pablo: Well, in the village life is calmer, but also more boring.
Lucía: I don’t agree. In my village there are as many festivals as in the city, or more!
Pablo: And doctors? The nearest hospital is forty kilometres away.
Lucía: That’s true. But people are kinder and you know everybody.
Pablo: For me, the best thing about Madrid is the museums. The Prado is the best museum in the world.
Lucía: And for me, the best thing about the village is the silence. And the bread, which is really good.`,
qs:['m|Pablo prefiere vivir en…|la ciudad~el pueblo~la costa','m|Según Lucía, en Madrid todo es más barato.|Falso~Verdadero','m|Lucía dice que en su pueblo hay ___ fiestas como en la ciudad.|tantas~menos~pocas','g|El hospital está a ___ kilómetros del pueblo.|cuarenta/40','m|Para Pablo, lo mejor de Madrid son…|los museos~los bares~los parques','m|Para Lucía, lo mejor del pueblo es…|el silencio~las tiendas~el trabajo']},
{id:'l-a2-06',label:'A2·6',title:'¿Qué has hecho hoy?',titleEn:'What have you done today?',unit:'a2-06',task:'Emma cuenta su día. ¿Qué ha hecho y qué no ha hecho todavía?',taskEn:'Emma talks about her day. What has she done and what hasn’t she done yet?',v:{'Javier':'m','Emma':'f'},
d:`Javier: ¡Hola, Emma! ¿Qué tal el día?
Emma: Agotador. Me he levantado a las seis porque he ido a la oficina de extranjería.
Javier: ¿Y ya tienes el NIE?
Emma: Todavía no. He entregado los papeles, pero me lo dan dentro de un mes.
Javier: Bueno, algo es algo. ¿Y has comido?
Emma: Sí, he comido un bocadillo en el tren. Luego he trabajado desde casa toda la tarde.
Javier: ¿Has visto el correo de Carmen?
Emma: No, todavía no lo he leído. ¿Es importante?
Javier: Dice que la reunión del viernes es a las nueve.
Emma: ¡Uf! Oye, ¿has estado alguna vez en Toledo? Quiero ir el sábado.
Javier: Sí, he estado muchas veces. Mi hermana vive allí. ¡Te encantará!`,
en:`Javier: Hi, Emma! How was your day?
Emma: Exhausting. I got up at six because I went to the foreigners’ office.
Javier: And have you got your NIE yet?
Emma: Not yet. I’ve handed in the papers, but they’ll give it to me in a month.
Javier: Well, it’s something. And have you eaten?
Emma: Yes, I had a sandwich on the train. Then I worked from home all afternoon.
Javier: Have you seen Carmen’s email?
Emma: No, I haven’t read it yet. Is it important?
Javier: She says Friday’s meeting is at nine.
Emma: Ugh! Hey, have you ever been to Toledo? I want to go on Saturday.
Javier: Yes, I’ve been many times. My sister lives there. You’ll love it!`,
